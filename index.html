/* add a block in two big, calm steps (easy to read with dyslexia):
   1. what: picture tiles, your goals first, or type it
   2. how long: your usual first, each with the time it ends
   the block is only added once both are picked, so no empty blocks. */

/* ---- brain dump ----
   things that come up during the day: type, tick, or plan it as a block.
   not-done items stay until ticked; done ones show until the day ends. */
let dumpOpenDone = false;
function renderDump() {
  const slot = document.getElementById('dump-slot');
  if (!slot) return;
  if (viewDay !== planKey()) { slot.innerHTML = ''; return; }
  const L = state.dump || (state.dump = []), t = todayKey();
  const open = L.filter(x => !x.done), doneToday = L.filter(x => x.done && key(new Date(x.doneAt || x.at)) === t);
  slot.innerHTML = '<section class="bd"><div class="bd-h"><b>Brain dump</b><small>' + (open.length ? open.length + ' to do' : 'things that come up') + '</small></div>' +
    '<div class="bd-add"><input type="text" maxlength="140" placeholder="Something came up?" aria-label="add to brain dump"><button type="button" aria-label="add">+</button></div>' +
    (open.length ? '<ul class="bd-list">' + open.map(x => '<li><button type="button" class="bd-tick" data-dt="' + x.id + '" aria-label="done"></button><span>' + esc(x.text) + '</span><button type="button" class="bd-plan" data-dp="' + x.id + '">Plan it</button></li>').join('') + '</ul>' : '') +
    (doneToday.length ? '<button type="button" class="bd-done">' + (dumpOpenDone ? 'Hide' : 'Show') + ' ' + doneToday.length + ' done</button>' +
      (dumpOpenDone ? '<ul class="bd-list done">' + doneToday.map(x => '<li><button type="button" class="bd-tick on" data-dt="' + x.id + '" aria-label="not done">\u2713</button><span>' + esc(x.text) + '</span></li>').join('') + '</ul>' : '') : '') +
    '</section>';
  const inp = slot.querySelector('.bd-add input');
  const add = () => { const v = inp.value.trim(); if (!v) { inp.focus(); return; } L.push({ id: Date.now().toString(36), text: v, done: false, at: Date.now() }); save(); renderDump(); const n = document.querySelector('#dump-slot .bd-add input'); if (n) n.focus(); };
  slot.querySelector('.bd-add button').addEventListener('click', add);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  slot.querySelectorAll('[data-dt]').forEach(b => b.addEventListener('click', () => { const x = L.find(y => y.id === b.dataset.dt); if (!x) return; x.done = !x.done; x.doneAt = Date.now(); save(); renderDump(); }));
  slot.querySelectorAll('[data-dp]').forEach(b => b.addEventListener('click', () => { const x = L.find(y => y.id === b.dataset.dp); if (!x) return; x.done = true; x.doneAt = Date.now(); x.planned = true; save(); renderDump(); addBlockSheet(x.text); }));
  const dd = slot.querySelector('.bd-done'); if (dd) dd.addEventListener('click', () => { dumpOpenDone = !dumpOpenDone; renderDump(); });
  // tidy: done items from before today drop off
  const keep = L.filter(x => !x.done || key(new Date(x.doneAt || x.at)) === t);
  if (keep.length !== L.length) { state.dump = keep; save(); }
}

function addBlockSheet(preset, insertAt) {
  const old = document.getElementById('addsheet'); if (old) old.remove();
  const el = document.createElement('div');
  el.id = 'addsheet'; el.className = 'w3';
  const day = dayFor(viewDay);
  const endOfDay = day.blocks.reduce((m, b) => m + (Number(b.mins) || 60), toMins(day.start));
  const h = new Date().getHours(), meal = h < 11 ? MEAL_SLOTS[0] : h < 16 ? MEAL_SLOTS[1] : MEAL_SLOTS[2];
  const seen = new Set();
  const goals = (typeof goalSteps === 'function' ? goalSteps() : []).filter(g => { const k = g.t.trim().toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 5);
  void meal;
  const common = [['\u{1F4BC}', 'Work', 60, 'work'], ['\u{1F9D8}', 'Rest', 30, 'rest'], ['\u{1F3CB}\uFE0F', 'Workout', 60, 'gym'], ['\u{1F465}', 'Meeting', 30],
                  ['\u{1F305}', 'Breakfast', 30], ['\u2600\uFE0F', 'Lunch', 45], ['\u{1F319}', 'Dinner', 45], ['\u{1F4DA}', 'Learn', 60]];
  // rest that genuinely restores you: body, mind, people and joy
  const REST = [['Body', [['\u{1F634}', 'Sleep', 480], ['\u{1F4A4}', 'Nap', 20], ['\u{1F6B6}', 'Walk', 30], ['\u{1F938}', 'Stretch', 15], ['\u{1F6BF}', 'Shower', 15], ['\u{1F6C1}', 'Bath', 30]]],
                ['Mind', [['\u{1F9D8}', 'Meditate', 10], ['\u{1F64F}', 'Pray', 15], ['\u{1F4D3}', 'Journal', 15], ['\u{1F4D6}', 'Read for fun', 30], ['\u{1F3A7}', 'Music', 30], ['\u{1F333}', 'Sit outside', 15], ['\u{1F343}', 'Do nothing', 15]]],
                ['People and joy', [['\u{1F4DE}', 'Call a friend', 30], ['\u{1F46A}', 'Family time', 60], ['\u{1F496}', 'Date night', 120], ['\u{1F373}', 'Cook a nice meal', 45], ['\u{1F3AC}', 'Movie time', 120], ['\u{1F3A8}', 'Hobby time', 45], ['\u2615', 'Tea break', 15]]]];
  const gymTypes = () => { const W = routine().workouts.map(w => ['\u{1F3CB}\uFE0F', w.title, 60, w.id]);
    return W.concat([['\u{1F3C3}', 'Cardio', 45], ['\u{1F9D8}', 'Yoga', 45], ['\u{1F3CA}', 'Swim', 45], ['\u{1F3BE}', 'Tennis', 60], ['\u{1F6B4}', 'Cycling', 45], ['\u{1F483}', 'Dance', 45]]); };
  let step = null;   // null, 'rest', 'gym' or 'work'
  // your most used blocks from the last 30 days, first
  const tally = {}, keepT = {};
  for (let i = 1; i <= 30; i++) for (const x of ((state.days[shiftKey(planKey(), -i)] || {}).blocks || [])) {
    const t = (x.label || '').trim(); if (!t) continue; const k = t.toLowerCase(); tally[k] = (tally[k] || 0) + 1; keepT[k] = keepT[k] || t; }
  const icon = t => { const l = t.toLowerCase(); const M = [[/walk/, '\u{1F6B6}'], [/shower|bath/, '\u{1F6BF}'], [/sleep|nap/, '\u{1F634}'], [/read/, '\u{1F4D6}'], [/pray/, '\u{1F64F}'], [/breakfast/, '\u{1F305}'], [/lunch/, '\u2600\uFE0F'], [/dinner/, '\u{1F319}'], [/gym|workout|glute|upper|leg/, '\u{1F3CB}\uFE0F'], [/plan/, '\u{1F4DD}'], [/movie|film/, '\u{1F3AC}'], [/break|tea|coffee/, '\u2615'], [/meet|call/, '\u{1F465}'], [/work|deep/, '\u{1F4BC}'], [/learn|study|course|go\b/, '\u{1F4DA}']];
    const f = M.find(([r]) => r.test(l)); return f ? f[1] : '\u21BB'; };
  const top = Object.keys(tally).filter(k => tally[k] >= 2).sort((a, b) => tally[b] - tally[a]).slice(0, 6).map(k => keepT[k]);
  const mine = usualLabels(2).filter(x => !common.some(c => c[1].toLowerCase() === x.t.toLowerCase()) && !goals.some(g => g.t.toLowerCase() === x.t.toLowerCase()));
  let pick = preset ? { label: preset } : null;
  const close = () => el.remove();
  const add = mins => {
    const b = { label: pick.label, mins, done: false };
    if (pick.step) b.step = pick.step;
    if (pick.workout) b.workout = pick.workout;
    if (pick.goals && pick.goals.length) b.goals = pick.goals.map(t => ({ text: t, done: false }));
    const ms = MEAL_SLOTS.find(x => x[1] === pick.label); if (ms) b.meal = ms[0];
    day.touched = true;
    if (Number.isInteger(insertAt) && insertAt >= 0 && insertAt <= day.blocks.length) day.blocks.splice(insertAt, 0, b); else day.blocks.push(b);
    save(); close(); renderDay(); renderHabits();
  };
  const tile = (e, t, data) => '<button type="button" class="ab-t" ' + data + '><span>' + e + '</span><b>' + esc(t) + '</b></button>';
  const draw = () => {
    let html = '<div class="w3-back"></div><div class="w3-sheet ab" role="dialog" aria-modal="true" aria-label="Add a block"><span class="w3-grab"></span>';
    if (!pick && step === 'rest') {
      html += '<div class="fp-head"><button type="button" class="fp-back" aria-label="back">\u2190</button><b>Rest</b></div><h2>What kind of rest?</h2>' +
        REST.map(([h, L], gi) => '<p class="ab-sub">' + h + '</p><div class="ab-grid">' + L.map((r, i) => tile(r[0], r[1], 'data-r="' + gi + ':' + i + '"')).join('') + '</div>').join('');
    } else if (!pick && step === 'gym') {
      html += '<div class="fp-head"><button type="button" class="fp-back" aria-label="back">\u2190</button><b>Workout</b></div><h2>What are you training?</h2>' +
        '<div class="ab-grid">' + gymTypes().map((g, i) => tile(g[0], g[1], 'data-w="' + i + '"')).join('') + '</div>';
    } else if (!pick && step === 'work') {
      html += '<div class="fp-head"><button type="button" class="fp-back" aria-label="back">\u2190</button><b>Work</b></div><h2>What will you get done?</h2><p class="ab-note">Up to 3 goals for this block.</p>' +
        [0, 1, 2].map(i => '<input type="text" class="ab-goal" maxlength="80" placeholder="' + ['Goal 1', 'Goal 2 (optional)', 'Goal 3 (optional)'][i] + '" aria-label="work goal ' + (i + 1) + '">').join('') +
        '<button type="button" class="wka-go ab-next">Next</button>';
    } else if (!pick) {
      html += '<h2>What is it?</h2>' +
        (top.length ? '<p class="ab-sub">Most used</p><div class="ab-grid">' + top.map((t, i) => tile(icon(t), t, 'data-top="' + i + '"')).join('') + '</div>' : '') +
        (goals.length ? '<p class="ab-sub">Your goals</p><div class="ab-grid one">' + goals.map((g, i) => tile(g.e, g.t, 'data-g="' + i + '"')).join('') + '</div><p class="ab-sub">Everyday</p>' : '') +
        '<div class="ab-grid">' + common.map((c, i) => tile(c[0], c[1], 'data-c="' + i + '"')).join('') + '</div>' +
        '<div class="gs-add ab-type"><input type="text" maxlength="60" placeholder="Or type it" aria-label="block name"><button type="button">Next</button></div>';
    } else {
      const usual = usualLength(pick.label) || pick.mins || null;
      let opts = [15, 30, 45, 60, 90, 120];
      if (usual && !opts.includes(usual)) opts = [usual, ...opts];
      opts.sort((a, b) => (b === usual) - (a === usual));
      html += '<div class="fp-head"><button type="button" class="fp-back" aria-label="back">\u2190</button><b>' + esc(pick.label) + '</b></div><h2>How long?</h2>' +
        '<div class="ab-dur"></div><p class="wk2-ends">Starts at <b>' + clock(endOfDay) + '</b> \u00b7 ends at <b class="ab-end">' + clock(endOfDay + (usual || 60)) + '</b></p>' +
        '<button type="button" class="wka-go ab-add">Add</button><p class="ab-sub">Or tap one</p>' +
        '<div class="ls-list">' + opts.map(m => '<button type="button" class="ls-row' + (m === usual ? ' on' : '') + '" data-m="' + m + '"><b>' + minsLabel(m) + '</b>' + (m === usual ? '<i>' + (usualLength(pick.label) ? 'your usual' : 'usual') + '</i>' : '') + (endOfDay + m < 1440 ? '<small>ends ' + clock(endOfDay + m) + '</small>' : '') + '</button>').join('') + '</div>';
    }
    html += '<button type="button" class="ls-cancel">Cancel</button></div>';
    el.innerHTML = html;
    el.querySelector('.w3-back').addEventListener('click', close);
    el.querySelector('.ls-cancel').addEventListener('click', close);
    el.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => { const g = goals[Number(b.dataset.g)]; pick = { label: g.t, step: g.id }; draw(); }));
    el.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => { const c = common[Number(b.dataset.c)];
      if (c[3]) { step = c[3]; draw(); return; }
      pick = { label: c[1], mins: c[2] }; draw(); }));
    el.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { const [gi, i] = b.dataset.r.split(':').map(Number), r = REST[gi][1][i]; pick = { label: r[1], mins: r[2] }; draw(); }));
    el.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => { const g = gymTypes()[Number(b.dataset.w)]; pick = { label: g[1], mins: g[2], workout: g[3] || null }; draw(); }));
    const nx = el.querySelector('.ab-next');
    if (nx) nx.addEventListener('click', () => { const gl = [...el.querySelectorAll('.ab-goal')].map(i => i.value.trim()).filter(Boolean).slice(0, 3); pick = { label: 'Work', mins: 60, goals: gl }; draw(); });
    el.querySelectorAll('[data-top]').forEach(b => b.addEventListener('click', () => { const t = top[Number(b.dataset.top)]; pick = { label: t, mins: usualLength(t) || 60 }; draw(); }));
    el.querySelectorAll('[data-u]').forEach(b => b.addEventListener('click', () => { pick = { label: mine[Number(b.dataset.u)].t }; draw(); }));
    el.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => add(Number(b.dataset.m))));
    const abd = el.querySelector('.ab-dur');
    if (abd) { let cur = usualLength(pick.label) || pick.mins || 60;
      durField(abd, cur, m => { cur = m; el.querySelector('.ab-end').textContent = clock(endOfDay + m); });
      el.querySelector('.ab-add').addEventListener('click', () => add(cur)); }
    const bk = el.querySelector('.fp-back'); if (bk) bk.addEventListener('click', () => { if (pick) pick = null; else step = null; draw(); });
    const inp = el.querySelector('.ab-type input');
    if (inp) { const go = () => { const t = inp.value.trim(); if (!t) { inp.focus(); return; } pick = { label: t }; draw(); };
      el.querySelector('.ab-type button').addEventListener('click', go); inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); }
  };
  draw();
  document.body.appendChild(el);
}

   first one of 8 families, then the exact word. each word maps to one of
   the mood types above, so stats and history keep working. */

  { k: 'Calm',    e: '\u{1F343}', c: '#93bf7f', w: [['calm', 'calm'], ['content', 'calm'], ['relaxed', 'calm'], ['focused', 'focused'], ['safe', 'calm']] },
  { k: 'Love',    e: '\u{1F497}', c: '#e38fa8', w: [['loved', 'good'], ['close', 'good'], ['tender', 'calm'], ['caring', 'good']] },
  { k: 'Okay',    e: '\u2601\uFE0F', c: '#86b9d9', w: [['okay', 'okay'], ['neutral', 'okay'], ['meh', 'okay'], ['unfocused', 'unfocused']] },
  { k: 'Sad',     e: '\u{1F327}', c: '#a99bd4', w: [['sad', 'low'], ['lonely', 'low'], ['hurt', 'low'], ['disappointed', 'low'], ['empty', 'low']] },
  { k: 'Worried', e: '\u{1F300}', c: '#e3a27a', w: [['anxious', 'anxious'], ['stressed', 'stressed'], ['overwhelmed', 'stressed'], ['nervous', 'anxious'], ['insecure', 'anxious']] },
  { k: 'Angry',   e: '\u{1F525}', c: '#d9718e', w: [['angry', 'stressed'], ['frustrated', 'stressed'], ['annoyed', 'stressed'], ['jealous', 'stressed'], ['resentful', 'stressed']] },
  { k: 'Tired',   e: '\u{1F319}', c: '#8a7768', w: [['tired', 'tired'], ['drained', 'tired'], ['bored', 'bored'], ['unmotivated', 'unmotivated'], ['restless', 'unfocused']] }
];
// draws the picker into box; onPick(moodKey, word) when a word is chosen
function feelPicker(box, onPick) {
  const draw = fam => {
    const F = FEELINGS.find(x => x.k === fam);
    box.innerHTML = F
      ? '<div class="fp-head"><button type="button" class="fp-back" aria-label="back">\u2190</button><span>' + F.e + '</span><b>' + F.k + '</b></div>' +
        '<div class="fp-words">' + F.w.map(([w, m]) => '<button type="button" data-w="' + w + '" data-m="' + m + '" style="--c:' + F.c + '">' + w + '</button>').join('') + '</div>'
      : '<div class="fp-fams">' + FEELINGS.map(f => '<button type="button" data-f="' + f.k + '" style="--c:' + f.c + '"><span>' + f.e + '</span>' + f.k + '</button>').join('') + '</div>';
    box.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => draw(b.dataset.f)));
    const bk = box.querySelector('.fp-back'); if (bk) bk.addEventListener('click', () => draw(null));
    box.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => { b.classList.add('on'); onPick(b.dataset.m, b.dataset.w); }));
  };
  draw(null);
}

/* ---- a meal block, ticked ----
   asks if you had what your meals timetable says. yes logs it to Fuel.
   something else logs that, and can update the timetable too. */
const mealSlotOf = b => b.meal || ({ breakfast: 'b', lunch: 'l', dinner: 'd' })[String(b.label || '').trim().toLowerCase()] || null;
function askMealAfter(b) {
  const slot = mealSlotOf(b);
  if (!slot) return false;
  const day = fromKey(viewDay).getDay(), plan = mealsFor(day)[slot];
  const name = MEAL_SLOTS.find(x => x[0] === slot)[1];
  const mealKey = { b: 'breakfast', l: 'lunch', d: 'dinner' }[slot];
  let el = document.getElementById('mood-after'); if (el) el.remove();
  el = document.createElement('div');
  el.id = 'mood-after'; el.className = 'ma';
  const draw = other => {
    el.innerHTML = '<div class="ma-top"><b>' + (plan && !other ? 'Did you have ' + esc(plan) + '?' : 'What did you have for ' + name.toLowerCase() + '?') + '</b><button type="button" class="ma-x" aria-label="not now">✕</button></div>' +
      (plan && !other
        ? '<small>from your meals for ' + cap(FULL[day]) + '</small><div class="mf-btns"><button type="button" class="lf-btn main" data-a="yes">Yes, log it</button><button type="button" class="lf-btn" data-a="other">Something else</button></div>'
        : '<input type="text" class="mf-in" maxlength="120" placeholder="e.g. jollof rice and chicken">' +
          '<div class="mf-btns"><button type="button" class="lf-btn main" data-a="log">Log it</button><button type="button" class="lf-btn" data-a="logset">Log and update my meals</button></div>');
    el.querySelector('.ma-x').addEventListener('click', close);
    const yes = el.querySelector('[data-a=yes]'); if (yes) yes.addEventListener('click', () => log(plan, false));
    const oth = el.querySelector('[data-a=other]'); if (oth) oth.addEventListener('click', () => draw(true));
    const inp = el.querySelector('.mf-in');
    if (inp) {
      setTimeout(() => inp.focus(), 50);
      el.querySelector('[data-a=log]').addEventListener('click', () => { if (inp.value.trim()) log(inp.value.trim(), false); });
      el.querySelector('[data-a=logset]').addEventListener('click', () => { if (inp.value.trim()) log(inp.value.trim(), true); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.value.trim()) log(inp.value.trim(), false); });
    }
  };
  const close = () => { el.classList.remove('in'); setTimeout(() => el.remove(), 300); };
  const log = (what, update) => {
    const at = new Date(); const fd = fromKey(viewDay);
    at.setFullYear(fd.getFullYear(), fd.getMonth(), fd.getDate());
    state.food.unshift({ id: Date.now() + '', at: at.getTime(), what, meal: mealKey });
    state.food.sort((x, y) => y.at - x.at);
    if (update) mealsFor(day)[slot] = tidyMeal(what);
    save();
    el.innerHTML = '<p class="ma-ok">\u2713 Logged' + (update ? ', and your meals are updated' : '') + '</p>';
    setTimeout(close, 1100);
  };
  draw(false);
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  return true;
}

/* ---- how do you feel, after a block ----
   when you tick a block on today's plan, a row of faces pops up. one tap
   saves it with what you just finished. at most once an hour, so it never nags. */
function askMoodAfter(b) {
  if (viewDay !== planKey()) return;
  const last = state.moods.slice().sort((a, c) => c.at - a.at)[0];
  if (last && Date.now() - last.at < MOOD_EVERY) return;
  let el = document.getElementById('mood-after');
  if (el) el.remove();
  el = document.createElement('div');
  el.id = 'mood-after';
  el.className = 'ma';
  el.innerHTML = '<div class="ma-top"><b>How do you feel?</b><button type="button" class="ma-x" aria-label="not now">✕</button></div>' +
    '<small>after ' + esc(b.label || 'that') + '</small>' +
    '<div class="ma-grid">' + MOODS.map(m => '<button type="button" data-m="' + m.k + '" style="--c:' + m.c + '"><span>' + m.e + '</span>' + m.k + '</button>').join('') + '</div>';
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  const close = () => { el.classList.remove('in'); setTimeout(() => el.remove(), 300); };
  const auto = setTimeout(close, 25000);
  el.querySelector('.ma-x').addEventListener('click', () => { clearTimeout(auto); close(); });
  el.querySelectorAll('[data-m]').forEach(btn => btn.addEventListener('click', () => {
    clearTimeout(auto);
    state.moods.push({ at: Date.now(), mood: btn.dataset.m, part: partOfDay(new Date().getHours()), note: '', after: b.label || '' });
    save();
    el.querySelector('.ma-grid').innerHTML = '<p class="ma-ok">' + MOODS.find(m => m.k === btn.dataset.m).e + ' saved</p>';
    setTimeout(close, 900);
    if (!document.getElementById('view-home').hidden) renderHome();
  }));
}

function partOfDay(h) {
  if (h < 12) return 'morning';
  if (h < 17) return 'afternoon';
  if (h < 21) return 'evening';
  return 'night';
}

let justLogged = null;   // mood key tapped a moment ago, so its chip can pop

function renderMood() {
  const now = new Date();
  const part = partOfDay(now.getHours());
  const t = todayKey();
  const today = state.moods.filter(x => key(new Date(x.at)) === t);

  document.getElementById('greet').textContent =
    part === 'night' ? 'Still up? How are you feeling?' : 'How are you this ' + part + '?';
  document.getElementById('mood-sub').textContent =
    today.length ? today.length + ' today' : clock(now.getHours() * 60 + now.getMinutes());

  const slot = document.getElementById('mood-slot');
  slot.innerHTML = '';

  const tally = {};
  for (const x of today) tally[x.mood] = (tally[x.mood] || 0) + 1;

  const grid = document.createElement('div');
  grid.className = 'md-grid';
  for (const m of MOODS) {
    const b = document.createElement('button');
    b.className = 'md-chip' + (justLogged === m.k ? ' pop' : '');
    b.type = 'button';
    b.style.setProperty('--c', m.c);
    b.innerHTML = '<span class="md-e">' + m.e + '</span><span class="md-l">' + m.k + '</span>' +
                  (tally[m.k] ? '<span class="md-n">' + tally[m.k] + '</span>' : '');
    b.setAttribute('aria-label', 'log ' + m.k + (tally[m.k] ? ', ' + tally[m.k] + ' today' : ''));
    b.addEventListener('click', () => {
      const at = Date.now();
      state.moods.push({ at, mood: m.k, part, note: '' });
      justLogged = m.k; noteFor = at;
      save(); renderMood();
    });
    grid.appendChild(b);
  }
  slot.appendChild(grid);
  justLogged = null;

  const pick = document.getElementById('mood-range');
  pick.innerHTML = '';
  for (const r of [[1, 'Today'], [7, '7 days'], [30, '30 days']]) {
    const b = document.createElement('button');
    b.className = 'md-seg-b' + (moodRange === r[0] ? ' on' : '');
    b.type = 'button';
    b.textContent = r[1];
    b.addEventListener('click', () => { moodRange = r[0]; renderMood(); });
    pick.appendChild(b);
  }

  // the note box opens under the chips when you tap an entry
  const entry = noteFor ? state.moods.find(x => x.at === noteFor) : null;
  if (entry) {
    const found = MOODS.find(x => x.k === entry.mood);
    const nb = document.createElement('div');
    nb.className = 'md-note';
    // quick reasons: your journey day, what you ate, and a few common ones
    const why = [];
    const jx = journeyAt(entry.at);
    if (jx) why.push(['jr-chip', jx.j.name + ', day ' + jx.day]);
    const fw = foodMoodAt(state.food.filter(f => entry.at - f.at < 4 * 3600000), entry.at);
    if (fw) why.push(['', fw.why]);
    for (const w of ['slept badly', 'hungry', 'work', 'people', 'did not move']) why.push(['', w]);
    nb.innerHTML = '<label for="note-input">Why do you feel <b>' + (found ? found.e + ' ' : '') + entry.mood + '</b>?</label>' +
      '<input id="note-input" type="text" maxlength="200" placeholder="e.g. slept badly">' +
      '<div class="md-why">' + why.map(w => '<button type="button" class="' + w[0] + '">' + esc(w[1]) + '</button>').join('') + '</div>' +
      '<div class="md-note-b"><button type="button" class="lf-btn main" data-a="save">Save</button>' +
      '<button type="button" class="lf-btn" data-a="skip">' + (entry.note ? 'Done' : 'Skip') + '</button></div>';
    const inp = nb.querySelector('input');
    inp.value = entry.note || '';
    nb.querySelectorAll('.md-why button').forEach(b => b.addEventListener('click', () => {
      inp.value = inp.value.trim() ? inp.value.trim() + ', ' + b.textContent : b.textContent; inp.focus();
    }));
    nb.querySelector('[data-a=save]').addEventListener('click', () => { entry.note = inp.value.trim(); noteFor = null; save(); renderMood(); });
    nb.querySelector('[data-a=skip]').addEventListener('click', () => { noteFor = null; renderMood(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') nb.querySelector('[data-a=save]').click(); });
    slot.appendChild(nb);
    setTimeout(() => inp.focus(), 30);
  }

  renderMoodSum();
  renderMoodLog();
}

// the summary for the chosen range: the mood you felt most, and a strip of all of them
function renderMoodSum() {
  const box = document.getElementById('mood-sum');
  const keys = new Set();
  for (let i = 0; i < moodRange; i++) keys.add(shiftKey(todayKey(), -i));
  const list = state.moods.filter(m => keys.has(key(new Date(m.at))));
  if (!list.length) { box.innerHTML = ''; return; }

  const tally = {};
  for (const m of list) tally[m.mood] = (tally[m.mood] || 0) + 1;
  const used = MOODS.filter(m => tally[m.k]).sort((a, b) => tally[b.k] - tally[a.k]);
  const top = used[0];
  const good = ['good', 'calm', 'focused'].reduce((n, k) => n + (tally[k] || 0), 0);

  box.innerHTML = '<div class="md-sum">' +
    '<div class="md-sum-top"><span class="md-sum-e">' + top.e + '</span><div><b>Mostly ' + top.k + '</b>' +
    '<span>' + list.length + ' check-in' + (list.length > 1 ? 's' : '') + ' · ' + Math.round(good / list.length * 100) + '% good, calm or focused</span></div></div>' +
    '<div class="md-strip">' + used.map(m => '<i style="--c:' + m.c + ';flex:' + tally[m.k] + '" title="' + m.k + ' ' + tally[m.k] + '"></i>').join('') + '</div>' +
    '<div class="md-keys">' + used.slice(0, 5).map(m => '<span style="--c:' + m.c + '">' + m.k + ' ' + tally[m.k] + '</span>').join('') + '</div>' +
  '</div>';
}

function renderMoodLog() {
  const log = document.getElementById('mood-log');
  log.innerHTML = '';

  const keys = [];
  for (let i = 0; i < moodRange; i++) keys.push(shiftKey(todayKey(), -i));

  const byDay = {};
  for (const m of state.moods) {
    const k = key(new Date(m.at));
    if (keys.indexOf(k) === -1) continue;
    (byDay[k] = byDay[k] || []).push(m);
  }
  const filled = keys.filter(k => byDay[k] && byDay[k].length);

  if (!filled.length) {
    log.innerHTML = '<p class="md-empty">' +
      (moodRange === 1 ? 'Nothing yet today. Tap how you feel above.' : 'Nothing in the last ' + moodRange + ' days.') + '</p>';
    return;
  }

  for (const k of filled) {
    if (moodRange > 1) {
      const d = fromKey(k);
      const head = document.createElement('div');
      head.className = 'md-day';
      head.textContent = (k === todayKey()) ? 'Today'
                       : (k === shiftKey(todayKey(), -1)) ? 'Yesterday'
                       : cap(FULL[d.getDay()]) + ' ' + d.getDate() + ' ' + cap(MONTHS[d.getMonth()]);
      log.appendChild(head);
    }

    const card = document.createElement('div');
    card.className = 'md-list';
    for (const m of byDay[k].slice().sort((x, y) => y.at - x.at)) {
      const d = new Date(m.at);
      const found = MOODS.find(x => x.k === m.mood);

      const row = document.createElement('div');
      row.className = 'md-row';
      row.style.setProperty('--c', found ? found.c : '#d9718e');
      row.innerHTML = '<span class="md-t">' + clock(d.getHours() * 60 + d.getMinutes()) + '</span>' +
        '<span class="md-what"><b>' + (found ? found.e + ' ' : '') + esc(m.mood) + '</b>' +
        '<small' + (m.note ? ' class="priv"' : '') + '>' + (m.note ? esc(m.note) : 'add why') + '</small>' +
        (journeyTag(m.at) ? '<span class="md-jr">' + esc(journeyTag(m.at)) + '</span>' : '') + '</span>';
      if (!m.note) row.querySelector('small').classList.add('ghost');
      row.addEventListener('click', () => { noteFor = m.at; renderMood(); window.scrollTo({ top: 0, behavior: 'smooth' }); });

      const del = document.createElement('button');
      del.className = 'md-del';
      del.type = 'button';
      del.textContent = '×';
      del.setAttribute('aria-label', 'delete this check in');
      del.addEventListener('click', e => {
        e.stopPropagation();
        const at = state.moods.findIndex(x => x.at === m.at);
        const gone = state.moods[at];
        state.moods.splice(at, 1);
        if (noteFor === m.at) noteFor = null;
        save(); renderMood();
        offerUndo(gone.mood + ' check in', () => { state.moods.splice(at, 0, gone); save(); renderMood(); });
      });
      row.appendChild(del);
      card.appendChild(row);
    }
    log.appendChild(card);
  }
}

/* =========== journeys ===========

let journeyForm = false;   // the start a journey form is open
let journeyAsk = null;     // the 3 use questions are open: your answers so far

/* quitting something: 3 optional questions. how long, how often and how much
   shape how hard it is (daily, heavy, long use means stronger, longer
   withdrawal), so the answers fit the timeline to you. */
const QUIT_RE = /\b(quit|quitting|no more|give up|giving up|cut out|cut down on)\b|\bstop (taking|using|eating|drinking|smoking|vaping|having)\b/i;
const isQuit = j => j.kind === 'cannabis' || QUIT_RE.test(j.name);
function useQuestions(j) {
  return [
    { k: 'long', q: 'How long have you been doing it?', a: ['Under a month', '1 to 6 months', '6 to 12 months', 'Over a year'] },
    { k: 'often', q: 'How often?', a: ['A few times a week or less', 'Most days', 'Every day', 'Many times a day'] },
    { k: 'much', q: 'How much each time?', a: j.kind === 'cannabis' ? ['Under 10 mg', '10 to 25 mg', '25 to 50 mg', 'Over 50 mg', 'Not sure'] : ['A little', 'Some', 'A lot', 'Not sure'] }
  ];
}
// light, regular or heavy, from your answers. not sure or skipped counts as middle
function useLevel(u) {
  if (!u) return null;
  const n = v => (typeof v === 'number') ? v : null;   // 'x' is not sure
  const o = n(u.often), l = n(u.long), m = n(u.much);
  if (o === null && l === null && m === null) return null;
  const O = o === null ? 1 : o, L = l === null ? 1 : l, M = m === null ? 1 : m;
  if (O >= 2 && (L >= 2 || M >= 2)) return 'heavy';
  if (O === 0 || (L === 0 && M <= 1)) return 'light';
  return 'regular';
}
const USE_FIT = {
  heavy: 'Fitted to you: frequent use for a while. Expect it to be stronger and to last a bit longer.',
  regular: 'Fitted to you: regular use.',
  light: 'Fitted to you: lighter use. It may be mild.'
};
// a line for each cannabis stage, and extra tips, by how heavy your use was
const USE_STAGE = {
  heavy: { say: ['You used often for a while, so this part can feel stronger.', 'For frequent users the peak can last until about day 10.', 'Sleep may still be off. That is normal after heavy use.', 'After heavy use, sleep can take 4 to 6 weeks to settle.', ''],
           tips: [['If stopping all at once is too much, cutting down over 1 to 2 weeks is also a good way'], [], [], ['If sleep is still very bad after a month, talk to a doctor'], []] },
  light: { say: ['With lighter use, you may feel only some of this, or none.', 'This may be mild for you, or already passing.', 'You may already feel back to normal.', '', ''],
           tips: [[], [], [], [], []] }
};
let journeyStageOpen = null;   // the stage tapped open, null means today's
let journeyAll = false;        // the whole timeline is showing, not just today's stage
let journeyOpen = false;       // the journey card shows what to expect and tips

function activeJourney() { return (state.journeys || []).find(j => !j.end) || null; }
function journeyPlan(j) {
  if (j.kind === 'cannabis' && /edible|gumm|infused/i.test(j.name || '')) return JOURNEY_PLANS.edibles;   // edibles have their own guide
  return JOURNEY_PLANS[j.kind] || JOURNEY_PLANS.habit;
}
// days clean: since the last slip (or day 1), and the best run so far
function cleanDays(j) {
  const slips = (j.slips || []).map(x => key(new Date(x.at))).sort();
  const today = todayKey(), dd = (a, b) => Math.round((fromKey(b) - fromKey(a)) / 86400000);
  const last = slips.length ? slips[slips.length - 1] : null;
  const now = last ? dd(last, today) : dd(j.start, today) + 1;
  let best = now, prev = j.start, first = true;
  for (const k of slips) { best = Math.max(best, dd(prev, k) + (first ? 0 : 0)); prev = k; first = false; }
  return { now: Math.max(0, now), best: Math.max(best, now), slips: slips.length };
}
function journeyDay(j, at) { return Math.round((fromKey(key(new Date(at))) - fromKey(j.start)) / 86400000) + 1; }
function journeyStage(j, day) {
  const st = journeyPlan(j).stages;
  return st.find(s => day >= s.from && (s.to === null || day <= s.to)) || st[0];
}
// the journey a check in happened in, and its day
function journeyAt(at) {
  for (const j of state.journeys || []) {
    if (key(new Date(at)) >= j.start && (!j.end || at <= j.end)) return { j, day: journeyDay(j, at) };
  }
  return null;
}
function journeyTag(at) { const x = journeyAt(at); return x ? 'Day ' + x.day + ' · ' + x.j.name : ''; }

function journeyHtml() {
  const j = activeJourney();
  if (!j) {
    if (!journeyForm) return '<div class="jr"><button type="button" class="jr-add lf-addlink" data-jr="new">+ Start a journey' +
      '<small>Quitting or starting something? See what to expect, day by day.</small></button></div>';
    return '<div class="jr"><b>Start a journey</b><div class="jr-form">' +
      '<label for="jr-name">What are you doing?</label><input id="jr-name" type="text" maxlength="60" placeholder="e.g. Quit edibles">' +
      '<label for="jr-start">Day 1 was</label><input id="jr-start" type="date" value="' + todayKey() + '" max="' + todayKey() + '">' +
      '</div><div class="jr-acts"><button type="button" class="lf-btn main" data-jr="start">Start</button>' +
      '<button type="button" class="lf-btn" data-jr="cancel">Cancel</button></div></div>';
  }
  if (journeyAsk) {
    return '<div class="jr" style="--c:#7daf86"><div class="jr-head"><div><span>' + esc(j.name) + '</span><b>Make the tips fit you</b></div></div>' +
      '<div class="jr-form jr-q"><label for="jr-day1">When was day 1?</label><input id="jr-day1" type="date" value="' + j.start + '" max="' + todayKey() + '"></div>' +
      '<p class="jr-fit">The rest is optional.</p>' +
      useQuestions(j).map(q => '<div class="jr-q"><p>' + q.q + '</p><div class="md-why">' +
        q.a.map((t, i) => { const v = t === 'Not sure' ? 'x' : i; return '<button type="button" class="' + (journeyAsk[q.k] === v ? 'on' : '') + '" data-jq="' + q.k + ':' + v + '">' + t + '</button>'; }).join('') +
        '</div></div>').join('') +
      '<div class="jr-acts"><button type="button" class="lf-btn main" data-jr="asksave">Done</button>' +
      '<button type="button" class="lf-btn" data-jr="askskip">Skip</button></div></div>';
  }
  const day = journeyDay(j, Date.now()), now = journeyStage(j, day);
  const open = journeyStageOpen === null ? journeyPlan(j).stages.indexOf(now) : journeyStageOpen;
  const lvl = isQuit(j) ? useLevel(j.use) : null;
  const per = j.kind === 'cannabis' && USE_STAGE[lvl];
  const cd = isQuit(j) ? cleanDays(j) : null, cr = (j.cravings || []).filter(x => x.rode).length;
  let html = '<div class="jr" style="--c:#7daf86"><div class="jr-head"><div><span>Journey</span><b>' + esc(j.name) + '</b></div><em>Day ' + day + '</em></div>' +
    (cd ? '<div class="jr-clean"><span><b>' + cd.now + '</b><small>days clean</small></span><span><b>' + cd.best + '</b><small>best run</small></span><span><b>' + cr + '</b><small>cravings ridden out</small></span></div>' +
      '<div class="jr-sos"><button type="button" class="jr-crave" data-jr="crave">Craving now</button><button type="button" class="jr-slip" data-jr="slip">I slipped</button></div>' : '') +
    (!journeyOpen || !isQuit(j) ? '' : lvl ? '<p class="jr-fit">' + USE_FIT[lvl] + ' <button type="button" data-jr="ask">Change</button></p>'
                             : '<button type="button" class="jr-fitask" data-jr="ask">Make tips fit you \u00b7 3 questions</button>') +
    (() => {   // where you are: one bar, a segment per stage
      const st = journeyPlan(j).stages, ni = st.indexOf(now);
      return '<div class="jr-prog">' + st.map((s, n) => '<i class="' + (n < ni ? 'past' : n === ni ? 'now' : '') + '"></i>').join('') + '</div>' +
        '<p class="jr-stage-line">Stage ' + (ni + 1) + ' of ' + st.length + ' \u00b7 <b>' + now.name + '</b></p>';
    })();
  if (!journeyOpen) return html + '<button type="button" class="jr-all" data-jr="open">What to expect and tips</button></div>';
  html += '<ol class="jr-line' + (journeyAll ? '' : ' only-now') + '">';
  journeyPlan(j).stages.forEach((s, n) => {
    const when = s.to === null ? 'Day ' + s.from + ' on' : 'Days ' + s.from + ' to ' + s.to;
    const cls = s === now ? 'now' : s.from > day ? 'next' : 'past';
    html += '<li class="' + cls + '" data-jr-stage="' + n + '"><i></i><small>' + when + '</small><b>' + s.name + '</b>' +
      (s === now ? '<span class="jr-here">You are here</span>' : '') +
      (n === open ? '<div class="jr-more">' + (per && per.say[n] ? '<p class="jr-you">For you: ' + per.say[n] + '</p>' : '') +
                    '<p>What to expect</p><ul>' + s.feel.map(f => '<li>' + f + '</li>').join('') + '</ul>' +
                    '<p>Tips</p><ul>' + s.tips.concat(per ? per.tips[n] || [] : []).map(f => '<li>' + f + '</li>').join('') + '</ul></div>' : '') +
      '</li>';
  });
  html += '</ol><button type="button" class="jr-all" data-jr="all">' + (journeyAll ? 'Show less' : 'See the whole timeline') + '</button>';
  // how you felt each day, the mood you logged most, last 14 days
  const days = [];
  for (let d = Math.max(1, day - 13); d <= day; d++) {
    const k = shiftKey(j.start, d - 1);
    const tally = {};
    for (const m of state.moods) if (key(new Date(m.at)) === k) tally[m.mood] = (tally[m.mood] || 0) + 1;
    const top = MOODS.filter(m => tally[m.k]).sort((a, b) => tally[b.k] - tally[a.k])[0];
    days.push('<span title="day ' + d + '">' + (top ? top.e : '·') + '<small>' + d + '</small></span>');
  }
  html += (days.some(x => !x.includes('>\u00b7<') && !x.includes('>·<')) ? '<p class="jr-felt">How you felt each day</p><div class="jr-days">' + days.join('') + '</div>' : '') +
    '<p class="jr-note">General guidance, not medical advice. If you feel very low or unsafe, talk to a doctor.</p>' +
    '<div class="jr-acts"><button type="button" class="lf-btn" data-jr="open">Close</button><button type="button" class="lf-btn" data-jr="end">End journey</button></div></div>';
  return html;
}

function wireJourney(box, redraw) {
  box.querySelectorAll('[data-jr]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.jr;
    if (a === 'new') { journeyForm = true; redraw(); setTimeout(() => { const i = document.getElementById('jr-name'); if (i) i.focus(); }, 30); return; }
    if (a === 'cancel') { journeyForm = false; redraw(); return; }
    if (a === 'start') {
      const name = document.getElementById('jr-name').value.trim();
      const start = document.getElementById('jr-start').value || todayKey();
      if (!name) { document.getElementById('jr-name').focus(); return; }
      const kind = JOURNEY_PLANS.cannabis.match.test(name) ? 'cannabis' : 'habit';
      state.journeys = state.journeys || [];
      const j = { id: Date.now(), name, start: start > todayKey() ? todayKey() : start, kind, end: null };
      state.journeys.push(j);
      journeyForm = false; journeyStageOpen = null;
      journeyAsk = isQuit(j) ? {} : null;     // quitting: ask how long, how often, how much (optional)
      save(); redraw(); return;
    }
    if (a === 'open') { journeyOpen = !journeyOpen; journeyAll = false; redraw(); return; }
    if (a === 'crave') { cravingSheet(activeJourney(), redraw); return; }
    if (a === 'slip') { slipSheet(activeJourney(), redraw); return; }
    if (a === 'all') { journeyAll = !journeyAll; journeyStageOpen = null; redraw(); return; }
    if (a === 'ask') { const j = activeJourney(); journeyAsk = { ...((j && j.use) || {}) }; redraw(); return; }
    if (a === 'askskip' || a === 'asksave') {
      const j = activeJourney(), d1 = document.getElementById('jr-day1');
      if (j && d1 && d1.value) j.start = d1.value > todayKey() ? todayKey() : d1.value;   // the day 1 date counts even on skip
      if (j && a === 'asksave' && Object.keys(journeyAsk).length) j.use = journeyAsk;
      journeyAsk = null; journeyStageOpen = null; save(); redraw(); return;
    }
    if (a === 'end') {
      const j = activeJourney();
      if (!j) return;
      j.end = Date.now(); save(); redraw();
      offerUndo(j.name + ' journey', () => { j.end = null; save(); redraw(); });
    }
  }));
  box.querySelectorAll('[data-jq]').forEach(b => b.addEventListener('click', () => {
    const [k, i] = b.dataset.jq.split(':'), v = i === 'x' ? 'x' : Number(i);
    journeyAsk[k] = journeyAsk[k] === v ? undefined : v;   // tap again to clear
    if (journeyAsk[k] === undefined) delete journeyAsk[k];
    b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b && journeyAsk[k] !== undefined));
  }));
  box.querySelectorAll('[data-jr-stage]').forEach(li => li.addEventListener('click', e => {
    if (e.target.closest('.jr-more')) return;
    const n = Number(li.dataset.jrStage);
    journeyStageOpen = n; redraw();
  }));
}

const RANGES = [

let range = '30d';

function rangeDays() {
  const r = RANGES.find(x => x.k === range) || RANGES[1];

}

/* ---- backup ----
   save: your whole data as one .json file (share sheet on iPhone, so it can
   go to Files, iCloud or AirDrop). restore: pick that file, check it, confirm. */
function backupName() {
  const d = new Date();
  return 'brick-backup-' + key(d) + '.json';
}

async function saveBackup() {
  const body = JSON.stringify({ app: 'paper', version: 2, saved: new Date().toISOString(), data: state }, null, 1);
  const file = new File([body], backupName(), { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Backup' });
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file);
      a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }
    try { localStorage.setItem(KEY + '.backup', String(Date.now())); } catch {}
    showLastBackup();
  } catch (e) {
    if (e && e.name === 'AbortError') return;   // you closed the share sheet
    document.getElementById('bk-last').textContent = 'Could not save the backup. Try again.';
  }
}

function showLastBackup() {
  let t = null;
  try { t = Number(localStorage.getItem(KEY + '.backup')) || null; } catch {}
  const el = document.getElementById('bk-last');
  if (!el) return;
  if (!t) { el.textContent = 'No backup saved yet.'; return; }
  const days = Math.floor((Date.now() - t) / 86400000);
  el.textContent = 'Last backup: ' + (days === 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago') + '.';
}

function restoreFrom(file) {
  const box = document.getElementById('bk-confirm');
  const reader = new FileReader();
  reader.onload = () => {
    let d;
    try {
      const j = JSON.parse(reader.result);
      d = j && j.data ? j.data : j;
      if (!d || typeof d !== 'object' || !('days' in d) || !('food' in d)) throw new Error('not ours');
    } catch {
      box.innerHTML = '<p class="bk-err">That file is not a backup from this app.</p>';
      return;
    }
    const n = Object.keys(d.days || {}).length, f = (d.food || []).length, m = (d.moods || []).length;
    box.innerHTML = '<div class="bk-ask"><p>Replace what is on this phone with this backup?</p>' +
      '<small>' + n + ' planned days · ' + f + ' food entries · ' + m + ' moods</small>' +
      '<div class="bk-btns"><button type="button" class="lf-btn main" data-a="yes">Replace</button>' +
      '<button type="button" class="lf-btn" data-a="no">Cancel</button></div></div>';
    box.querySelector('[data-a=no]').addEventListener('click', () => { box.innerHTML = ''; });
    box.querySelector('[data-a=yes]').addEventListener('click', () => {
      try {
        localStorage.setItem(KEY + '.before-restore', JSON.stringify(state));   // one step back, just in case
        localStorage.setItem(KEY, JSON.stringify(d));
      } catch {}
      location.reload();
    });
  };
  reader.readAsText(file);
}

document.getElementById('bk-save').addEventListener('click', saveBackup);
document.getElementById('bk-file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) restoreFrom(f);
  e.target.value = '';
});

  const body = document.getElementById('stats-body');

  const keys = rangeDays();
  const since = rangeStart();
  const label = (RANGES.find(x => x.k === range) || RANGES[1]).label;
  const n = keys.length;

  // one card: a name, a big number, a plain sentence saying what it means
  const card = (c, name, big, unit, explain, extra) => {

  const bars = rows => {
    const ul = document.createElement('ul');
    ul.className = 'st-bars';
    const top = Math.max(1, ...rows.map(r => r.v));
    for (const r of rows) {
      const li = document.createElement('li');
      li.style.setProperty('--c', r.c);
      li.innerHTML = '<div><span>' + esc(r.name) + '</span><b>' + r.show + '</b></div><i><u style="width:' + Math.round(r.v / (r.max || top) * 100) + '%"></u></i>';
      ul.appendChild(li);
    }
    return ul;
  };

  // day plan
  let planned = 0, done = 0, daysPlanned = 0;
  for (const k of keys) {
    const d = state.days[k];
    if (!d || !d.blocks.length) continue;
    daysPlanned++; planned += d.blocks.length; done += d.blocks.filter(b => b.done).length;
  }
  card('#e38fa8', 'Day plan', planned ? Math.round(done / planned * 100) : 0, '%',
    planned ? 'You finished <b>' + done + ' of the ' + planned + '</b> blocks you planned. You planned <b>' + daysPlanned + ' of ' + n + '</b> days.'
            : 'Nothing planned in ' + label + ' yet. Plan a day and this shows how much of it you finish.');

  // gym
  let sessions = 0, lifts = 0;
  for (const k of keys) { const l = (state.gym && state.gym[k]) || []; if (l.length) { sessions++; lifts += l.length; } }
  card('#7daf86', 'Gym', sessions, sessions === 1 ? ' session' : ' sessions',
    sessions ? 'Days you ticked at least one exercise. <b>' + lifts + '</b> exercises in total, about <b>' + (sessions / (n / 7)).toFixed(1) + '</b> sessions a week.'
             : 'No exercises ticked in ' + label + '. Each day you tick one counts as a session.');

  // habits
  if (state.habits.length) {
    const set = new Set(keys);
    const rows = state.habits.map(h => { const hit = h.marks.filter(m => set.has(m)).length;
      return { name: h.name, v: hit, max: n, show: hit + ' / ' + n, c: h.color || '#d9718e' }; });
    const best = [...rows].sort((x, y) => y.v - x.v)[0];
    card('#8fb7d8', 'Habits', null, '',
      'How many of the last <b>' + n + '</b> days you did each one. Best: <b>' + esc(best.name) + '</b>, ' + Math.round(best.v / n * 100) + '% of days.', bars(rows));
  } else {
    card('#8fb7d8', 'Habits', null, '', 'Nothing tracked yet. Plan something on the day page and it can become a habit.');
  }

  // mood
  const tally = {};
  for (const m of state.moods) if (m.at >= since) tally[m.mood] = (tally[m.mood] || 0) + 1;
  const used = MOODS.filter(m => tally[m.k]).sort((a, b) => tally[b.k] - tally[a.k]);
  const checks = used.reduce((x, m) => x + tally[m.k], 0);
  if (used.length) {
    const good = ['good', 'calm', 'focused'].reduce((x, k) => x + (tally[k] || 0), 0);
    card('#86b9d9', 'Mood', checks, ' check-ins',
      'Most often you felt <b>' + used[0].k + '</b> (' + tally[used[0].k] + ' times). <b>' + Math.round(good / checks * 100) + '%</b> of check-ins were good, calm or focused.',
      bars(used.map(m => ({ name: m.e + ' ' + m.k, v: tally[m.k], show: String(tally[m.k]), c: m.c }))));
  } else {
    card('#86b9d9', 'Mood', 0, ' check-ins', 'No moods logged in ' + label + '. Tap a mood on the mood page to start.');
  }

  // food
  const bites = state.food.filter(f => f.at >= since);
  const byMeal = {};
  for (const f of bites) byMeal[f.meal] = (byMeal[f.meal] || 0) + 1;
  card('#e3a27a', 'Food', bites.length, bites.length === 1 ? ' entry' : ' entries',
    bites.length ? 'Things you logged eating or drinking, about <b>' + (bites.length / n).toFixed(1) + '</b> a day. The food page has patterns and how food links to mood.'
                 : 'Nothing logged in ' + label + '.',
    bites.length ? bars(MEALS.filter(m => byMeal[m.k]).map(m => ({ name: m.k, v: byMeal[m.k], show: String(byMeal[m.k]), c: m.c }))) : null);

  // tweets
  const caught = state.ideas.filter(i => i.at >= since);
  const acted = caught.filter(i => i.done).length;
  card('#6fa3c8', 'Tweets', caught.length, caught.length === 1 ? ' tweet' : ' tweets',
    caught.length ? 'Thoughts you posted to yourself. You acted on <b>' + acted + ' of ' + caught.length + '</b>, by tapping "acted on".'
                  : 'No tweets in ' + label + '.');
}

/* =========== money ===========
   your money from your bank's alerts, no typing numbers. paste an alert (or,
   later, the Shortcut sends texts in by itself) and brick reads the amount,
   whether it went out or came in, what it was for, the date, and your
   balance. it sorts spending into kinds and does the sums. */

// "Amt:NGN6,200.00 DR  Desc:...  Bal:NGN632,615.55  Date:2026-11-14 5:26PM" and similar
function parseAlert(text) {
  const t = String(text || '').replace(/\r/g, '');
  const num = s => Number(String(s).replace(/[^\d.]/g, ''));
  const amt = t.match(/(?:amt|amount)\s*[:=]?\s*(?:NGN|N|₦)?\s*([\d,]+(?:\.\d{1,2})?)\s*(DR|CR|debit|credit)?/i)
           || t.match(/(?:NGN|₦)\s*([\d,]+(?:\.\d{1,2})?)\s*(DR|CR)?/i);
  if (!amt) return null;
  let dir = (amt[2] || '').toUpperCase();
  if (!dir) dir = /\b(credit|cr|received|inflow)\b/i.test(t) ? 'CR' : /\b(debit|dr|spent|withdraw|purchase|pos)\b/i.test(t) ? 'DR' : 'DR';
  if (dir.startsWith('C')) dir = 'CR'; else dir = 'DR';
  const desc = (t.match(/(?:desc|description|narration|details?)\s*[:=]\s*([^\n]+)/i) || [])[1] || '';
  const bal = (t.match(/(?:bal|balance|avail(?:able)?\s*bal)\s*[:=]?\s*(?:NGN|N|₦)?\s*(-?[\d,]+(?:\.\d{1,2})?)/i) || [])[1];
  const acct = (t.match(/(?:acct|account|a\/c)\s*[:=]?\s*\**\s*(\d{3,4})\b/i) || [])[1] || '';
  const dm = t.match(/(\d{4}-\d{2}-\d{2})(?:\s+(\d{1,2}):(\d{2})\s*(AM|PM)?)?/i) || t.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})(?:\s+(\d{1,2}):(\d{2})\s*(AM|PM)?)?/i);
  let at = Date.now();
  if (dm && dm[1] && dm[1].includes('-')) {
    const [y, mo, d] = dm[1].split('-').map(Number);
    let h = Number(dm[2] || 12), mi = Number(dm[3] || 0);
    if (dm[4]) { const pm = /pm/i.test(dm[4]); if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
    at = new Date(y, mo - 1, d, h, mi).getTime();
  }
  return { amt: num(amt[1]), dir, desc: desc.trim(), bal: bal !== undefined ? num(bal) * (String(bal).startsWith('-') ? -1 : 1) : null, acct, at };
}

// the kind of spending, from what the alert says it was for
const MONEY_KINDS = [
  ['Food', /pepper|onion|juice|food|rice|meat|fish|egg|bread|market|grocer|shoprite|spar|restaurant|kitchen|chicken|suya|cafe|coffee|eat|chops|drinks|bukka/i, '#e3a27a'],
  ['Transport', /uber|bolt|taxi|fuel|petrol|filling|ride|transport|bus|okada|keke|parking|toll/i, '#86b9d9'],
  ['Bills', /airtime|data|mtn|glo|airtel|9mobile|dstv|gotv|electric|nepa|ikedc|ekedc|phcn|water bill|internet|spectranet|smile|starlink/i, '#a99bd4'],
  ['Subscriptions', /netflix|spotify|apple|icloud|youtube|prime|showmax|chatgpt|claude|anthropic|notion|google|subscription/i, '#d9718e'],
  ['Health', /pharm|hospital|clinic|gym|fitness|drug|medic/i, '#7daf86'],
  ['Shopping', /jumia|konga|mall|store|shop|cloth|fashion|amazon|temu|shein/i, '#c9965a'],
  ['Transfers', /transfer|trf|to \w+|nip|ussd/i, '#9aa6b8']
];
function moneyKind(tx) {
  if (tx.dir === 'CR') return 'Money in';
  if (tx.kind) return tx.kind;
  const k = MONEY_KINDS.find(([, re]) => re.test(tx.desc));
  return k ? k[0] : 'Other';
}
const kindColor = k => (MONEY_KINDS.find(x => x[0] === k) || [0, 0, '#b3a08f'])[2];
const mnNaira = n => '₦' + Math.round(n).toLocaleString();

function addAlert(text, src) {
  const tx = parseAlert(text);
  if (!tx) return null;
  if (!state.money) state.money = [];
  // the same alert twice (pasted again, or sent twice) is kept once
  const dup = state.money.find(x => x.amt === tx.amt && x.dir === tx.dir && Math.abs(x.at - tx.at) < 60000 && x.desc === tx.desc);
  if (dup) return dup;
  const it = { id: Date.now() + '' + Math.random().toString(36).slice(2, 5), ...tx, src: src || 'paste' };
  state.money.push(it);
  state.money.sort((a, b) => b.at - a.at);
  save();
  return it;
}

/* ---- the inbox: bank texts that log themselves ----
   an iPhone Shortcut posts each bank text as an issue in a private GitHub
   repo. brick reads the open ones, adds them, and closes them. the access
   key lives only on this phone (not in backups, not in the code). */
const INBOX_REPO = 'SerikiAyodele/brick-inbox';
const INBOX_KEY = KEY + '.inboxkey';
let inboxBusy = false, inboxNote = '';
const inboxToken = () => { try { return localStorage.getItem(INBOX_KEY) || ''; } catch { return ''; } };

async function syncInbox(quiet) {
  const tok = inboxToken();
  if (!tok || inboxBusy) return 0;
  inboxBusy = true;
  const h = { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json' };
  let n = 0;
  try {
    const r = await fetch('https://api.github.com/repos/' + INBOX_REPO + '/issues?state=open&per_page=50', { headers: h, cache: 'no-store' });
    if (r.status === 401 || r.status === 403 || r.status === 404) { inboxNote = 'The access key did not work. Check it, then paste it again.'; return 0; }
    if (!r.ok) { inboxNote = 'Could not reach the inbox. It will try again.'; return 0; }
    const issues = await r.json();
    for (const it of issues.filter(x => !x.pull_request)) {
      let added = null;
      if ((it.title || '').trim() === 'brick-import') { try { added = importMoney(JSON.parse(it.body || '{}')) ? {} : null; } catch { added = null; } }
      else if ((it.title || '').trim() === 'brick-health') { try { added = importHealth(JSON.parse(it.body || '{}')) ? {} : null; } catch { added = null; } }
      else added = addAlert(it.body || it.title || '', 'sms');
      // done with it either way: an unreadable one stays closed so it is not read again
      await fetch('https://api.github.com/repos/' + INBOX_REPO + '/issues/' + it.number, {
        method: 'PATCH', headers: { ...h, 'Content-Type': 'application/json' },
        body: JSON.stringify({ state: 'closed', state_reason: added ? 'completed' : 'not_planned' })
      });
      if (added) n++;
    }
    inboxNote = n ? n + ' new from your bank texts' : '';
  } catch { inboxNote = 'No signal. It will try again.'; }
  finally { inboxBusy = false; }
  if (n || !quiet) { if (!document.getElementById('view-money').hidden) renderMoney(); }
  return n;
}
// check when the app opens, when it comes back to the front, and every few minutes
setTimeout(() => syncInbox(true), 1500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncInbox(true); });
setInterval(() => syncInbox(true), 5 * 60000);

/* ---- budget, income, subscriptions, investments ----
   brought over from Notion once (through the inbox), then kept here.
   spending against each budget line comes from your bank alerts: a line
   is matched from the alert's words, or you pick it by tapping the alert. */
function moneyPlan() {
  if (!state.moneyPlan) state.moneyPlan = { budget: [], income: [], subs: [], invest: [] };
  return state.moneyPlan;
}
const AREA_OF_LIFE = { health: 'Health', wealth: 'Wealth', relationships: 'Love', love: 'Love', self: 'Self', assets: 'Wealth' };

// each month has its own budget. a new month starts as a copy of the month
// before: same lines and amounts, but not the unplanned ones.
const ymOf = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
function linesFor(ym) {
  const P = moneyPlan(), cur = ymOf(Date.now());
  if (!P.months) { P.months = {}; if (P.budget.length) P.months[cur] = { lines: P.budget.map(b => ({ ...b })) }; }
  if (P.months[ym]) return P.months[ym].lines;
  if (ym !== cur) return [];   // a past month with no plan
  const prev = Object.keys(P.months).filter(k => k < ym).sort().pop();
  P.months[ym] = { lines: prev ? P.months[prev].lines.filter(b => !b.unplanned).map(b => ({ ...b })) : [],
                   income: (prev && P.months[prev].income ? P.months[prev].income : P.income).map(x => ({ ...x })) };
  save();
  return P.months[ym].lines;
}
// a month's income. this month starts from what you had; an old month without any shows none
function incomeFor(ym, make) {
  const P = moneyPlan(); linesFor(ym);
  const M = P.months[ym] || (make ? (P.months[ym] = { lines: [] }) : null);
  if (!M) return make ? [] : null;
  if (!M.income) { if (ym === ymOf(Date.now())) M.income = P.income.map(x => ({ ...x })); else if (make) M.income = []; else return null; }
  return M.income;
}
// the same item across months: "00 Grocery", "groceries" and "food" are one thing
const LINE_SYN = { food: 'grocery', grocerie: 'grocery', 'mobile data': 'data', electricity: 'light', subscriptions: 'subscription', 'gym sub': 'gym', 'house money': 'house' };
function lineKey(n) {
  let k = String(n || '').toLowerCase().replace(/[’']s\b/g, '').replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim().replace(/^my /, '');
  k = LINE_SYN[k] || k.replace(/s$/, '');
  return LINE_SYN[k] || k;
}
// what you gave this item in earlier months, newest first
function pastAmounts(name, before) {
  const P = moneyPlan(), k = lineKey(name);
  if (!k || !P.months) return [];
  return Object.keys(P.months).filter(m => m < before).sort().reverse()
    .map(m => { const b = P.months[m].lines.find(x => lineKey(x.name) === k && x.amount > 0); return b ? [m, b.amount] : null; })
    .filter(Boolean).slice(0, 4);
}

// Health from Notion: the meal week, past grocery spending (by week) and the current shopping list.
// each import has an id, so the same one is never added twice
function importHealth(data) {
  if (!data || data.kind !== 'brick-health' || !data.id) return false;
  if (!state.imported) state.imported = [];
  if (state.imported.includes(data.id)) return true;
  if (data.meals && typeof data.meals === 'object') {
    if (!state.meals) state.meals = {};
    for (const d of Object.keys(data.meals)) {
      const m = data.meals[d] || {};
      state.meals[d] = { b: tidyMeal(m.b), l: tidyMeal(m.l), d: tidyMeal(m.d) };
    }
  }
  if (Array.isArray(data.log)) {
    if (!state.groceryLog) state.groceryLog = [];
    for (const x of data.log) if (x && x.text && x.at) state.groceryLog.push({ text: String(x.text), at: Number(x.at), price: Number(x.price) || 0, from: 'notion' });
  }
  if (data.prices && typeof data.prices === 'object') {
    if (!state.prices) state.prices = {};
    for (const [k, v] of Object.entries(data.prices)) if (!state.prices[priceKey(k)] && v > 0) state.prices[priceKey(k)] = { per: Number(v), unit: '', at: Date.now() };
  }
  if (Array.isArray(data.list)) {
    for (const x of data.list) {
      if (!x || !x.text) continue;
      addGrocery(cap(String(x.text)));
      const it = (state.grocery || []).find(g => !g.done && g.text.toLowerCase() === cap(String(x.text)).toLowerCase());
      if (it && x.price > 0) it.price = Number(x.price);
    }
  }
  state.imported.push(data.id);
  save();
  return true;
}

function importMoney(data) {
  if (!data || data.kind !== 'brick-import') return false;
  const P = moneyPlan();
  if (Array.isArray(data.budget)) P.budget = data.budget.map((b, i) => ({ id: 'b' + i + Date.now(), name: String(b.name).trim(), amount: Number(b.amount) || 0,
    next: Number(b.next) || 0, area: AREA_OF_LIFE[String(b.area || '').toLowerCase()] || '', note: b.note || '' })).filter(b => b.name);
  if (Array.isArray(data.income)) P.income = data.income.map(x => ({ name: String(x.name).trim(), amount: Number(x.amount) || 0 })).filter(x => x.name);
  if (Array.isArray(data.subs)) P.subs = data.subs.map(x => ({ name: String(x.name).trim(), cost: Number(x.cost) || 0, day: x.day || '' })).filter(x => x.name);
  if (Array.isArray(data.invest)) P.invest = data.invest.slice();
  if (Array.isArray(data.budget)) { linesFor(ymOf(Date.now())); P.months[ymOf(Date.now())] = { lines: P.budget.map(b => ({ ...b })), income: P.income.map(x => ({ ...x })) }; }
  // earlier months' plans: added, never over a month you already have
  if (data.history && typeof data.history === 'object') {
    linesFor(ymOf(Date.now()));
    for (const [ym, rows] of Object.entries(data.history)) {
      if (!/^\d{4}-\d{2}$/.test(ym) || P.months[ym] || !Array.isArray(rows)) continue;
      P.months[ym] = { lines: rows.filter(r => r && r.name).map((r, i) => ({ id: 'h' + ym.replace('-', '') + i, name: String(r.name).trim(), amount: Number(r.amount) || 0, area: AREA_OF_LIFE[String(r.area || '').toLowerCase()] || '' })) };
    }
  }
  // what was already spent on each line before the bank alerts started (Notion's Debit column)
  if (Array.isArray(data.spent) && !(state.imported || []).includes(data.id)) {
    if (!state.money) state.money = [];
    for (const x of data.spent) {
      if (!x || !(Number(x.amount) > 0) || !/^\d{4}-\d{2}$/.test(x.ym)) continue;
      const L = linesFor(x.ym).find(b => lineKey(b.name) === lineKey(x.name));
      const [y, m] = x.ym.split('-').map(Number);
      state.money.push({ id: 'n' + x.ym + lineKey(x.name).replace(/ /g, ''), amt: Number(x.amount), dir: 'DR', desc: x.name + ', from Notion', bal: null, acct: '',
                         at: new Date(y, m - 1, 1, 9, 0).getTime(), src: 'notion', ...(L ? { line: L.id } : {}) });
    }
    state.money.sort((a, b) => b.at - a.at);
    if (data.id) { if (!state.imported) state.imported = []; state.imported.push(data.id); }
  }
  P.importedAt = Date.now();
  save();
  return true;
}

// which budget line a transaction belongs to: your pick, else words that match a line, else its kind
const KIND_LINE = { Food: /grocer|food/i, Transport: /fuel|transport/i, Subscriptions: /subscri/i, Bills: /light|data|bill/i, Health: /gym|health/i };
function txLine(tx) {
  const B = linesFor(ymOf(tx.at));
  if (tx.line) return B.find(b => b.id === tx.line) || null;
  if (tx.dir !== 'DR' || !B.length) return null;
  const d = (tx.desc || '').toLowerCase();
  const byName = B.find(b => b.name.length > 2 && new RegExp('\\b' + b.name.toLowerCase().replace(/[^a-z ]/g, '').trim().split(' ')[0] + 's?\\b').test(d));
  if (byName) return byName;
  const re = KIND_LINE[moneyKind(tx)];
  return re ? B.find(b => re.test(b.name)) || null : null;
}

function moneyPlanCards(box, inMonth) {

  const lines = P.budget.filter(b => b.amount > 0 || spent[b.id]);

      P.income.map(x => '<li><span></span><b>' + mnNaira(x.amount) + '</b></li>').join('') + '</ul></div>';
  }
  if (P.subs.length) {

    html += '<div class="mn-card"><div class="mn-bh"><b class="mn-h">Investments</b><span>' + esc(last.date || '') + '</span></div><ul class="mn-simple">' +
      Object.entries(last.items || {}).map(([k, v]) => '<li><span>' + esc(k) + '</span><b>' + esc(String(v)) + '</b></li>').join('') + '</ul>' +
      (P.invest.length > 1 ? '<p class="mn-small">' + P.invest.length + ' snapshots since ' + esc(first.date || '') + '.</p>' : '') + '</div>';
  }
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  // names go in as text, never as html
  wrap.querySelectorAll('.mn-bud li').forEach(li => { li.querySelector('span').textContent = P.budget.find(b => b.id === li.dataset.b).name; });
  const inc = wrap.querySelectorAll('.mn-simple'); let ii = 0;
  if (P.income.length) { inc[ii].querySelectorAll('li span').forEach((s, i) => { s.textContent = P.income[i].name; }); ii++; }
  if (P.subs.length) { inc[ii].querySelectorAll('li span').forEach((s, i) => { s.textContent = P.subs[i].name; }); ii++; }
  // tap a budget line to change its amount

    const inp = f.querySelector('input'); inp.value = b.amount || '';
    f.querySelector('button').addEventListener('click', e => { e.stopPropagation(); b.amount = Number(inp.value) || 0; save(); renderMoney(); });

}

const NOTION_BILLS = ['Cleaning and Laundry', 'Offering', 'Gym sub', 'Subscriptions', 'Light', 'Estate', 'Salary', 'Assets', 'Fuel', 'Tokyo', 'Data',
  'Grocery', 'Violin', 'Tobi’s wedding', 'Movies', 'October', 'Toffee', 'Passport', 'Parents', 'Debt', 'Birthday dinner', 'Car Repairs', 'Neyo', 'Make up',
  'Visa', 'Zart', 'Tennis', 'Swimming', 'White board', 'Unplanned Outing'];
let moneyMonth = null;   // "YYYY-MM" being looked at
let moneyOpen = null;    // transaction id open for picking its line
let moneyTab = 'budget'; // budget, spending, income
let moneyGear = false;   // the small settings panel
let moneyEdit = null;    // budget line id, 'new', 'inc:<i>' or 'inc:new' being edited

/* you type in two things: income and budget. everything else is worked
   out: spent and left per line from your bank alerts, and whether income
   and budget balance (every naira given a job, like in Notion). */
function renderMoney() {
  const box = document.getElementById('money-body');
  if (!state.money) state.money = [];
  const P = moneyPlan();
  const now = new Date();
  const ym = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  if (!moneyMonth) moneyMonth = ym(now);
  const [Y, M] = moneyMonth.split('-').map(Number);
  const isNow = moneyMonth === ym(now);
  const inMonth = state.money.filter(x => ym(new Date(x.at)) === moneyMonth);
  const latest = state.money.find(x => x.bal !== null && x.bal !== undefined);

  // once: the rows from my Notion "Bills" table, so the table starts the same
  if (!P.billsSeeded) {
    const cur = linesFor(ymOf(Date.now())), have = new Set(cur.map(b => lineKey(b.name)));
    NOTION_BILLS.forEach((name, i) => { if (!have.has(lineKey(name))) { cur.push({ id: 'nb' + Date.now() + i, name, amount: 0, area: guessArea(name) }); have.add(lineKey(name)); } });
    P.billsSeeded = true; save();
  }

  // the sums
  const INC = incomeFor(moneyMonth) || [];
  const income = INC.reduce((a, x) => a + x.amount, 0);
  const B = linesFor(moneyMonth);
  const budget = B.reduce((a, b) => a + b.amount, 0);
  const spentBy = {}; let loose = 0;
  for (const x of inMonth) if (x.dir === 'DR') { const L = txLine(x); if (L) spentBy[L.id] = (spentBy[L.id] || 0) + x.amt; else loose += x.amt; }
  const spent = inMonth.filter(x => x.dir === 'DR').reduce((a, x) => a + x.amt, 0);
  const left = budget - spent;
  const daysLeft = isNow ? new Date(Y, M, 0).getDate() - now.getDate() + 1 : 0;
  const gap = income - budget;
  const bal = !INC.length && !isNow ? null : gap === 0 ? ['ok', 'Balanced. Every naira has a job.'] : gap > 0 ? ['give', mnNaira(gap) + ' of income has no job yet'] : ['over', 'Budget is ' + mnNaira(-gap) + ' more than income'];

  let html = '<header class="pghead"><h1>Wallet</h1><span class="mn-mon"><button type="button" data-m="-1" aria-label="previous month">‹</button>' +

    '<button type="button" class="mn-gear" aria-label="settings">⚙</button></span></header>';

  if (moneyGear) html += '<div class="mn-gearbox"></div>';

  html += '<div class="mn-top">' +
    '<div class="mn-big"><span>Left to spend</span><b class="' + (left < 0 ? 'neg' : '') + '">' + mnNaira(left) + '</b>' +
      (isNow && daysLeft > 0 && left > 0 ? '<small>about ' + mnNaira(left / daysLeft) + ' a day for ' + daysLeft + ' days</small>' : '<small>of ' + mnNaira(budget) + ' budgeted</small>') + '</div>' +
    '<div class="mn-bal"><span>Balance</span><b>' + (latest ? mnNaira(latest.bal) : '–') + '</b></div></div>' +
    '<div class="mn-sum"><div><span>Income</span><b>' + mnNaira(income) + '</b></div><div><span>Budget</span><b>' + mnNaira(budget) + '</b></div><div><span>Spent</span><b>' + mnNaira(spent) + '</b></div></div>' +
    (bal ? '<p class="mn-check ' + bal[0] + '">' + (bal[0] === 'ok' ? '✓ ' : '') + bal[1] + '</p>' : '');

  html += '<div class="md-seg mn-tabs">' + [['budget', 'Budget'], ['spend', 'Spending'], ['income', 'Income']].map(([k, t]) =>
    '<button type="button" class="md-seg-b' + (moneyTab === k ? ' on' : '') + '" data-t="' + k + '">' + t + '</button>').join('') + '</div>';

  if (moneyTab === 'budget') {
    const az = L => L.slice().sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
    const lines = az(B.filter(b => !b.unplanned)), unp = az(B.filter(b => b.unplanned));
    const planOnly = !isNow && !inMonth.some(x => x.dir === 'DR');   // an old month from Notion: just the plan
    // where the budget goes, by area of life, as one coloured bar
    const byArea = {};
    for (const b of B) { const a = b.area || guessArea(b.name); byArea[a] = (byArea[a] || 0) + b.amount; }
    const areas = MN_AREAS.filter(a => byArea[a] > 0);
    if (budget > 0 && areas.length) html += '<div class="mn-split">' + areas.map(a => '<u style="flex:' + byArea[a] + ';--c:' + MN_AREA_C[a] + '"></u>').join('') + '</div>' +
      '<div class="mn-legend">' + areas.map(a => '<span style="--c:' + MN_AREA_C[a] + '"><i></i>' + a + ' ' + Math.round(byArea[a] / budget * 100) + '%</span>').join('') + '</div>';
    const row = b => {
      const sp = spentBy[b.id] || 0, lf = b.amount - sp, pc = b.amount ? Math.min(1, sp / b.amount) : (sp ? 1 : 0);
      if (moneyEdit === b.id) return '<li class="ed" data-b="' + b.id + '">' + lineEditor(b) + '</li>';
      return '<li data-b="' + b.id + '" class="' + (lf < 0 ? 'over' : '') + '" style="--c:' + MN_AREA_C[b.area || guessArea(b.name)] + '">' +
        '<span class="dot"></span><div class="mid"><span class="nm"></span>' + (planOnly ? '' : '<i><u style="width:' + Math.round(pc * 100) + '%"></u></i>') + '</div>' +
        '<div class="rt"><b>' + mnNaira(planOnly ? b.amount : Math.abs(lf)) + '</b><small>' + (planOnly ? 'planned' : lf < 0 ? 'over' : 'left of ' + mnNaira(b.amount)) + '</small></div></li>';
    };
    // one table, like the Bills database in Notion: Name, Budget, Debit, Credit
    const crBy = {};
    for (const x of inMonth) if (x.dir === 'CR' && x.line) crBy[x.line] = (crBy[x.line] || 0) + x.amt;
    const all = lines.concat(unp);
    const cell = n => '<span class="nt-num">' + (n ? mnNaira(n) : '') + '</span>';
    const trow = b => {
      if (moneyEdit === b.id) return '<li class="ed" data-b="' + b.id + '">' + lineEditor(b) + '</li>';
      const sp = spentBy[b.id] || 0;
      return '<li data-b="' + b.id + '" class="nt-r' + (b.amount && sp > b.amount ? ' over' : '') + '"><span class="nt-n"><span class="nm"></span>' +
        (b.unplanned ? '<em>unplanned</em>' : '') + '</span>' + cell(b.amount) + cell(sp) + cell(crBy[b.id] || 0) + '</li>';
    };
    const sumDr = all.reduce((a, b) => a + (spentBy[b.id] || 0), 0), sumCr = all.reduce((a, b) => a + (crBy[b.id] || 0), 0);
    html += '<div class="nt"><div class="nt-title"><span class="nt-ic" aria-hidden="true">▦</span>Bills<small>' + all.length + '</small></div>' +
      '<div class="nt-scroll"><ul class="mn-lines2 nt-t">' +
      '<li class="nt-h"><span>Aa Name</span><span># Budget</span><span># Debit</span><span># Credit</span></li>' +
      all.map(trow).join('') +
      (moneyEdit === 'new' || moneyEdit === 'newu' ? '<li class="ed">' + lineEditor(null) + '</li>' : '<li class="nt-new" data-a="newline" role="button" tabindex="0">+ New</li>') +
      '<li class="nt-f"><span>Sum</span>' + cell(budget) + cell(sumDr) + cell(sumCr) + '</li>' +
      '</ul></div></div>';
    if (moneyEdit !== 'newu' && moneyEdit !== 'new') html += '<button type="button" class="mn-add" data-a="newunp">+ Add unplanned, this month only</button>';
    if (loose) html += '<p class="mn-note">' + mnNaira(loose) + ' spent outside your lines. Open Spending to give it a line.</p>';
  }

  if (moneyTab === 'spend') {
    html += '<div class="mn-list">' + (inMonth.length ? inMonth.map(x => {
      const d = new Date(x.at), L = txLine(x), open = moneyOpen === x.id;
      return '<div class="mn-tx' + (x.dir === 'CR' ? ' in' : '') + '" data-id="' + x.id + '"><button type="button" class="mn-txb">' +
        '<span class="mn-d"><b></b><small>' + (x.dir === 'CR' ? 'Money in' : L ? '' : '<em class="nol">no line</em>') + (L ? '<em class="ln"></em>' : '') + ' · ' + d.getDate() + ' ' + cap(MONTHS[d.getMonth()].slice(0, 3)) + '</small></span>' +
        '<em class="amt">' + (x.dir === 'CR' ? '+' : '−') + mnNaira(x.amt) + '</em></button>' +
        (open && x.dir === 'DR' ? '<div class="mn-pick">' + linesFor(ymOf(x.at)).map(b => '<button type="button" data-l="' + b.id + '" class="' + (L && L.id === b.id ? 'on' : '') + '"></button>').join('') +
          '<button type="button" class="mn-del">Remove</button></div>' : '') +
        (open && x.dir === 'CR' ? '<div class="mn-pick"><button type="button" class="mn-del">Remove</button></div>' : '') + '</div>';
    }).join('') : '<p class="mn-empty">No alerts this month yet.</p>') + '</div>';
  }

  if (moneyTab === 'income') {
    const got = inMonth.filter(x => x.dir === 'CR').reduce((a, x) => a + x.amt, 0);
    html += '<p class="mn-note">' + mnNaira(got) + ' received this month, of ' + mnNaira(income) + ' expected.</p><ul class="mn-lines2">' +
      INC.map((x, i) => moneyEdit === 'inc:' + i ? '<li class="ed">' + incEditor(x, i) + '</li>'
        : '<li data-i="' + i + '"><div><span class="nm"></span><b>' + mnNaira(x.amount) + '</b></div></li>').join('') +
      (moneyEdit === 'inc:new' ? '<li class="ed">' + incEditor(null, 'new') + '</li>' : '') + '</ul>' +
      (moneyEdit === 'inc:new' ? '' : '<button type="button" class="mn-add" data-a="newinc">+ Add income</button>');
  }

  box.innerHTML = html;

  // names in as text
  box.querySelectorAll('.mn-lines2 li[data-b]:not(.ed) .nm').forEach(el => { el.textContent = B.find(b => b.id === el.closest('li').dataset.b).name; });
  box.querySelectorAll('.mn-lines2 li[data-i] .nm').forEach(el => { el.textContent = INC[Number(el.closest('li').dataset.i)].name; });
  box.querySelectorAll('.mn-tx').forEach(el => {
    const x = state.money.find(t => t.id === el.dataset.id), L = txLine(x);
    el.querySelector('.mn-d b').textContent = (x.desc || (x.dir === 'CR' ? 'Money in' : 'Spent')).toLowerCase();
    const ln = el.querySelector('.ln'); if (ln) ln.textContent = L.name;
    el.querySelectorAll('[data-l]').forEach(b => { b.textContent = linesFor(ymOf(x.at)).find(z => z.id === b.dataset.l).name; });
  });

  const on = (sel, fn) => box.querySelectorAll(sel).forEach(el => el.addEventListener('click', e => fn(el, e)));
  on('[data-m]', el => { const d = new Date(Y, M - 1 + Number(el.dataset.m), 1); moneyMonth = ym(d); renderMoney(); });
  on('[data-t]', el => { moneyTab = el.dataset.t; moneyEdit = null; moneyOpen = null; renderMoney(); });

  on('[data-a=newline]', () => { moneyEdit = 'new'; renderMoney(); focusEd(); });
  on('[data-a=newunp]', () => { moneyEdit = 'newu'; renderMoney(); focusEd(); });
  on('[data-a=newinc]', () => { moneyEdit = 'inc:new'; renderMoney(); focusEd(); });
  on('.mn-lines2 li[data-b]:not(.ed)', el => { moneyEdit = el.dataset.b; renderMoney(); focusEd(); });
  on('.mn-lines2 li[data-i]', el => { moneyEdit = 'inc:' + el.dataset.i; renderMoney(); focusEd(); });
  on('.mn-txb', el => { const id = el.parentElement.dataset.id; moneyOpen = moneyOpen === id ? null : id; renderMoney(); });

  on('.mn-del', el => {
    const i = state.money.findIndex(t => t.id === el.closest('.mn-tx').dataset.id), gone = state.money[i];
    state.money.splice(i, 1); moneyOpen = null; save(); renderMoney();
    offerUndo('transaction', () => { state.money.splice(i, 0, gone); save(); renderMoney(); });
  });
  // editors
  const ed = box.querySelector('li.ed');
  if (ed) {
    const g = n => ed.querySelector('[name=' + n + ']');
    on('li.ed [data-a=cancel]', () => { moneyEdit = null; renderMoney(); });
    on('li.ed [data-a=save]', () => {
      const name = g('name').value.trim(), amount = Number(String(g('amt').value).replace(/[^\d.]/g, '')) || 0;
      if (!name) { g('name').focus(); return; }
      if (String(moneyEdit).startsWith('inc:')) {
        const k = moneyEdit.slice(4);
        const I = incomeFor(moneyMonth, true);
        if (k === 'new') I.push({ name, amount }); else Object.assign(I[Number(k)], { name, amount });
      } else if (moneyEdit === 'new' || moneyEdit === 'newu') {
        B.push({ id: 'b' + Date.now(), name, amount, area: g('area').value, ...(moneyEdit === 'newu' ? { unplanned: true } : {}) });
      } else {
        Object.assign(B.find(b => b.id === moneyEdit), { name, amount, area: g('area').value });
      }
      moneyEdit = null; save(); renderMoney();
    });
    on('li.ed [data-a=remove]', () => {
      if (String(moneyEdit).startsWith('inc:')) incomeFor(moneyMonth, true).splice(Number(moneyEdit.slice(4)), 1);
      else { B.splice(B.findIndex(b => b.id === moneyEdit), 1); state.money.forEach(x => { if (x.line === moneyEdit && ymOf(x.at) === moneyMonth) delete x.line; }); }
      moneyEdit = null; save(); renderMoney();
    });
    ed.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') ed.querySelector('[data-a=save]').click(); }));
    // area: tap to choose; until you do, it follows a guess from the name
    let picked = !ed.querySelector('.sug');
    const setArea = a => { g('area').value = a; ed.querySelectorAll('[data-ar]').forEach(c => c.classList.toggle('on', c.dataset.ar === a)); };
    ed.querySelectorAll('[data-ar]').forEach(c => c.addEventListener('click', () => { picked = true; setArea(c.dataset.ar); const sg = ed.querySelector('.sug'); if (sg) sg.remove(); }));
    if (g('area')) g('name').addEventListener('input', () => { if (!picked) setArea(guessArea(g('name').value)); });
    // what this item had in earlier months; tap one to use it
    const pastBox = ed.querySelector('.mn-past');
    const fillPast = () => {
      const ps = pastAmounts(g('name').value, moneyMonth), yr = String(new Date().getFullYear());
      pastBox.innerHTML = ps.length ? '<span>Past months</span><div>' + ps.map(([m, a]) => '<button type="button" data-v="' + a + '">' +
        cap(MONTHS[Number(m.slice(5)) - 1].slice(0, 3)) + (m.slice(0, 4) !== yr ? ' ’' + m.slice(2, 4) : '') + ' <b>' + mnNaira(a) + '</b></button>').join('') + '</div>' : '';
      pastBox.querySelectorAll('[data-v]').forEach(c => c.addEventListener('click', () => { g('amt').value = c.dataset.v; }));
    };
    if (pastBox) { fillPast(); g('name').addEventListener('input', fillPast); }
  }
  // settings: paste an alert, bank texts
  const gb = box.querySelector('.mn-gearbox');
  if (gb) {
    gb.innerHTML = '<div class="mn-card"><b class="mn-h">Add from an alert</b><textarea class="mn-paste" rows="3" placeholder="paste your bank alert here"></textarea>' +
      '<div class="mn-row"><button type="button" class="lf-btn main" data-a="paste">Add</button><span class="mn-msg"></span></div></div>';

      if (!n) { msg.textContent = 'No amount found in that.'; return; }

    });
  }
}
