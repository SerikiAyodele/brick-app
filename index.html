      '<li>Then add <b>Create Alarm</b> at <b>Dates</b>. Turn off <b>Show When Run</b>.</li>' +
      '<li>Done. Next time, the button sets them all.</li></ol></details></div>';
  el.querySelectorAll('.al-list span').forEach((sp, i) => { sp.textContent = ups[i].label; });

/* when a work or focus block is on, a round bubble floats up and offers the
   Focus room. one tap goes in, the small x puts it away for that block. */
const focusSkipped = new Set();
function focusNudge(day) {
  const host = document.getElementById('view-day');
  const old = document.getElementById('focusnudge');
  const k = planKey();
  let cur = null;
  if (viewDay === k && !sortingDay && !focus && day.blocks.length) {
    const nm = planMin(k);
    let at = toMins(day.start);
    day.blocks.forEach((b, i) => {
      const len = Number(b.mins) || 60;
      if (!cur && !b.done && nm >= at && nm < at + len && (isWorkBlock(b.label) || isFocusBlock(b.label))) cur = { b, i, at, len };
      at += len;
    });
  }
  const id = cur ? k + ':' + cur.i + ':' + cur.b.label : null;
  if (!cur || focusSkipped.has(id)) { if (old) old.remove(); return; }
  if (old && old.dataset.id === id) return;           // already showing for this block
  if (old) old.remove();
  const el = document.createElement('div');
  el.id = 'focusnudge';
  el.dataset.id = id;
  el.innerHTML = '<button type="button" class="fn-go" aria-label="go to the Focus room for ' + esc(cur.b.label) + '">' +
                 '<span class="fn-ico">\u{1F331}</span><span class="fn-t">Focus</span></button>' +
                 '<button type="button" class="fn-x" aria-label="not now">\u00d7</button>';
  el.querySelector('.fn-go').addEventListener('click', () => { focusSkipped.add(id); el.remove(); openFocus(cur.b, cur.at, cur.len); });
  el.querySelector('.fn-x').addEventListener('click', () => { focusSkipped.add(id); el.classList.add('out'); setTimeout(() => el.remove(), 250); });
  host.appendChild(el);
}

let justTicked = null;          // index of the block ticked a moment ago
let focusNew = null;            // index of a block just inserted, to type its name

/* ---- quick picks for an empty block ----
   the common ones, then your own most used. rest asks which kind,
   meeting asks who with. each sets a sensible length you can change. */
const REST_KINDS = [['Break', 15], ['Walk', 30], ['Nap', 20], ['Shower', 15], ['Movie time', 120], ['Music', 30], ['Pray', 15], ['Do nothing', 15]];
let pickStep = null;   // { b, step: 'rest' | 'meet' }

function usualLabels(n) {
  const tally = {}, keep = {};
  const skip = /^(work|workout|meeting|break|walk|nap|shower|movie time|music|pray|do nothing)$/i;
  for (let i = 1; i <= 30; i++) {
    for (const b of ((state.days[shiftKey(planKey(), -i)] || {}).blocks || [])) {
      const t = (b.label || '').trim(); if (!t || skip.test(t)) continue;
      const k = t.toLowerCase(); tally[k] = (tally[k] || 0) + 1; keep[k] = keep[k] || { t, mins: b.mins };
    }
  }
  return Object.keys(tally).filter(k => tally[k] >= 2).sort((a, b) => tally[b] - tally[a]).slice(0, n).map(k => keep[k]);
}

// workouts to pick from: your gym plan first, then common kinds
const NS_GYM = () => { let W = []; try { W = routine().workouts.map(w => ['\u{1F3CB}\uFE0F', w.title, 60, w.id]); } catch {}
  return W.concat([['\u{1F3C3}', 'Cardio', 45], ['\u{1F9D8}', 'Yoga', 45], ['\u{1F3CA}', 'Swim', 45], ['\u{1F6B6}', 'Walk', 30], ['\u{1F6B4}', 'Cycling', 45], ['\u{1F3BE}', 'Tennis', 60], ['\u{1F483}', 'Dance', 45], ['\u{1F938}', 'Stretch', 15]]); };
function openNameSheet(b) {
  const old = document.getElementById('namesheet'); if (old) old.remove();
  const el = document.createElement('div');
  el.id = 'namesheet'; el.className = 'w3';
  document.body.appendChild(el);

    if (!mins && wasEmpty) mins = usualLength(label);          // your usual length for this name
    b.label = label; if (mins && wasEmpty) b.mins = mins;     // a length only for a new block
    save(); el.remove(); renderDay(); renderHabits();
  };
  const close = () => { el.remove(); renderDay(); };
  const row = (icon, text, sub, fn, more) => '<button type="button" class="ns-row" data-k="' + esc(text) + '"><span class="ns-i">' + icon + '</span><b>' + esc(text) + '</b>' +
    (sub ? '<small>' + esc(sub) + '</small>' : '') + (more ? '<i>›</i>' : '') + '</button>';
  const draw = step => {
    let html = '<div class="w3-back"></div><div class="w3-sheet ns-sheet" role="dialog" aria-modal="true"><span class="w3-grab"></span><button type="button" class="ns-x" aria-label="close">\u00d7</button>';
    if (step === 'rest') {

        REST_KINDS.map(([t, m]) => row({ 'Break': '☕', 'Walk': '\u{1F6B6}', 'Nap': '\u{1F634}', 'Shower': '\u{1F6BF}', 'Movie time': '\u{1F3AC}', 'Music': '\u{1F3A7}', 'Pray': '\u{1F64F}', 'Do nothing': '\u{1F343}' }[t] || '•', t, minsLabel(m))).join('') + '</div>';
    } else if (step === 'gym') {
      html += '<div class="ns-head"><button type="button" class="ns-back">←</button><h2>What are you training?</h2></div><div class="ns-list">' +
        NS_GYM().map(g => row(g[0], g[1], g[3] ? 'from your gym plan' : minsLabel(g[2]))).join('') + '</div>';
    } else if (step === 'meet') {
      html += '<div class="ns-head"><button type="button" class="ns-back">←</button><h2>What\u2019s the topic?</h2></div>' +
        '<div class="ns-type"><input type="text" class="ns-in" placeholder="e.g. Q4 roadmap, or leave empty" maxlength="80"><button type="button" class="ns-ok">Done</button></div>';
    } else {
      const mine = usualLabels(5);
      html += '<h2 class="ns-h">What’s this block?</h2>' +
        '<div class="ns-type"><input type="text" class="ns-in" placeholder="Type a name" maxlength="200"><button type="button" class="ns-ok">Save</button></div>' +
        '<div class="ns-list">' +
          (() => { const S = goalSteps(); return S.length ? '<p class="ns-sub ns-first">Your goals this week</p>' + S.map(x =>
            '<div class="ns-grow">' + row(x.e, x.t, x.goal) + '<button type="button" class="ns-gedit" data-ge="' + x.a + ':' + x.gi + '" aria-label="edit goal ' + esc(x.t) + '">Edit</button></div>').join('') + '<p class="ns-sub">Everything else</p>' : ''; })() +
          row('\u{1F4BC}', 'Work', 'needs an outcome') + row('\u{1F9D8}', 'Rest', 'break, walk, nap…', null, true) +
          row('\u{1F465}', 'Meeting', 'topic and agenda', null, true) + row('\u{1F3CB}️', 'Workout', 'gym, cardio, yoga…', null, true) +
          MEAL_SLOTS.map(([k, name, e]) => { const plan = mealsFor(fromKey(viewDay).getDay())[k]; return row(e, name, plan ? 'planned: ' + plan : 'no meal planned'); }).join('') +
          (mine.length ? '<p class="ns-sub">Your usual</p>' + mine.map(x => row('↻', x.t, minsLabel(Number(x.mins) || 60))).join('') : '') +
        '</div>';
    }
    el.innerHTML = html + '<button type="button" class="ls-cancel ns-cancel">Cancel</button></div>';
    el.querySelector('.w3-back').addEventListener('click', close);
    el.querySelector('.ns-x').addEventListener('click', close);
    el.querySelector('.ns-cancel').addEventListener('click', close);
    const back = el.querySelector('.ns-back'); if (back) back.addEventListener('click', () => draw(null));
    const inp = el.querySelector('.ns-in');
    if (step === 'meet') {
      const go = () => { const t = inp.value.trim(); b.meeting = true; if (t) b.topic = t; set(t || 'Meeting', 30); };   // the topic lives in the agenda, not on the day page
      el.querySelector('.ns-ok').addEventListener('click', go);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      setTimeout(() => inp.focus(), 50);
      return;
    }
    if (step !== 'rest' && step !== 'gym') {
      inp.value = b.label || '';
      const go = () => { const v = inp.value.trim(); if (v) set(v); else close(); };
      el.querySelector('.ns-ok').addEventListener('click', go);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    }
    // edit a goal right here: its words change everywhere
    el.querySelectorAll('[data-ge]').forEach(x => x.addEventListener('click', () => {
      const [ak, gi] = x.dataset.ge.split(':'), g = areaGoals(ak)[Number(gi)];
      if (!g) return;
      const wrap = x.parentElement;
      wrap.innerHTML = '<div class="ns-type ns-gtype"><input type="text" class="ns-gin" maxlength="100" aria-label="goal"><button type="button" class="ns-ok">Save</button></div>';
      const gin = wrap.querySelector('.ns-gin'); gin.value = g.text; gin.focus();
      const ok = () => { const t = gin.value.trim(); if (t) { g.text = t; g.own = true; save(); } draw(null); };
      wrap.querySelector('.ns-ok').addEventListener('click', ok);
      gin.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
    }));
    el.querySelectorAll('.ns-row').forEach(r => r.addEventListener('click', () => {
      const k = r.dataset.k;
      if (step === 'rest') { const m = REST_KINDS.find(x => x[0] === k); set(k, m && m[1]); return; }
      if (k === 'Rest') return draw('rest');
      if (k === 'Meeting') return draw('meet');
      if (k === 'Work') return set('Work', 60);
      if (step === 'gym') { const g = NS_GYM().find(x => x[1] === k); if (g && g[3]) b.workout = g[3]; set(k, g && g[2]); return; }
      if (k === 'Workout') return draw('gym');
      const ms = MEAL_SLOTS.find(x => x[1] === k);
      if (ms) { b.meal = ms[0]; return set(k, ms[0] === 'b' ? 30 : 45); }
      const gst = goalSteps().find(x => x.t === k);
      if (gst) { b.step = gst.id; return set(k, 60); }
      const u = usualLabels(5).find(x => x.t === k); set(k, u && Number(u.mins));
    }));
  };
  draw(null);
}

function quickPicks(b) {
  const wrap = document.createElement('div');
  wrap.className = 'qp';
  const set = (label, mins) => { b.label = label; if (mins) b.mins = mins; pickStep = null; save(); renderDay(); renderHabits(); };
  const chip = (txt, fn, cls) => { const c = document.createElement('button'); c.type = 'button'; c.className = 'qp-c' + (cls ? ' ' + cls : ''); c.textContent = txt; c.addEventListener('click', fn); wrap.appendChild(c); };
  const step = pickStep && pickStep.b === b ? pickStep.step : null;

  if (step === 'rest') {
    REST_KINDS.forEach(([t, m]) => chip(t, () => set(t, m)));
    chip('←', () => { pickStep = null; renderDay(); }, 'back');
    return wrap;
  }
  if (step === 'meet') {
    const inp = document.createElement('input');
    inp.type = 'text'; inp.className = 'qp-in'; inp.placeholder = 'with who? (optional)'; inp.maxLength = 60;
    const go = () => { const t = inp.value.trim(); b.meeting = true; if (t) b.topic = t; set(t || 'Meeting', 30); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    wrap.appendChild(inp);
    chip('Done', go, 'go');
    setTimeout(() => inp.focus(), 30);
    return wrap;
  }
  chip('Work', () => set('Work', 60));
  chip('Rest ›', () => { pickStep = { b, step: 'rest' }; renderDay(); });
  chip('Meeting ›', () => { pickStep = { b, step: 'meet' }; renderDay(); });
  chip('Workout', () => set('Workout', 60));
  goalSteps().slice(0, 6).forEach(x => chip(x.e + ' ' + x.t, () => { b.step = x.id; set(x.t, 60); }, 'goal'));
  usualLabels(4).forEach(x => chip(x.t, () => set(x.t, Number(x.mins) || null), 'mine'));
  return wrap;
}

/* press and hold a block to add a new one straight after it.
   done blocks stay at the top, so holding one of those adds below them all. */
function holdToAdd(row, day, i, firstOpen) {
  let timer = null, x0 = 0, y0 = 0, held = false;
  const cancel = () => { clearTimeout(timer); timer = null; row.classList.remove('holding'); };

  row.addEventListener('pointerdown', e => {
    if (e.target.closest('input, textarea, select')) return;   // leave typing alone
    held = false; x0 = e.clientX; y0 = e.clientY;
    row.classList.add('holding');
    timer = setTimeout(() => {
      timer = null; held = true;
      row.classList.remove('holding');
      try { navigator.vibrate && navigator.vibrate(12); } catch {}
      const at = Math.max(i + 1, firstOpen);
      customFor = null;
      addBlockSheet(null, at);   // the calm add sheet; the new block goes right here
    }, 550);
  });
  row.addEventListener('pointermove', e => {
    if (timer && Math.hypot(e.clientX - x0, e.clientY - y0) > 8) cancel();   // it's a scroll
  });
  row.addEventListener('pointerup', cancel);
  row.addEventListener('pointercancel', cancel);
  row.addEventListener('pointerleave', cancel);
  row.addEventListener('contextmenu', e => e.preventDefault());
  // a hold must not also count as a tap on whatever was under the finger
  row.addEventListener('click', e => { if (held) { held = false; e.stopPropagation(); e.preventDefault(); } }, true);
}

/* ---- the "now" card ----
   what you should be doing right now: time in, time left, on a ring
   that fills as the block runs. it ticks every second by itself. */
let nowTimer = null;

function fmtLeft(ms) {
  const t = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, sec = t % 60;
  return h ? h + 'h ' + String(m).padStart(2, '0') + 'm' : m + ':' + String(sec).padStart(2, '0');
}

function fmtIn(ms) {
  const m = Math.max(0, Math.floor(ms / 60000));
  return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
}

function nowCard(day) {
  const base = fromKey(viewDay).getTime();
  let at = toMins(day.start);
  const wins = day.blocks.map((b, i) => {
    const len = Number(b.mins) || 60;
    const w = { b, i, from: at, a: base + at * 60000, z: base + (at + len) * 60000 };
    at += len;
    return w;
  });

  const R = 44, C = 2 * Math.PI * R;
  const card = document.createElement('div');
  card.className = 'nowcard';
  card.innerHTML =
    '<div class="nc-ring">' +
      '<svg viewBox="0 0 104 104" aria-hidden="true">' +
        '<defs><linearGradient id="ncg" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0" stop-color="var(--pink)"/><stop offset="1" stop-color="#f0b48c"/>' +
        '</linearGradient></defs>' +
        '<circle class="nc-track" cx="52" cy="52" r="' + R + '"/>' +
        '<circle class="nc-arc" cx="52" cy="52" r="' + R + '" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '"/>' +
      '</svg>' +
      '<div class="nc-mid"><b class="nc-left"></b><span class="nc-unit"></span></div>' +
    '</div>' +
    '<div class="nc-info">' +
      '<span class="nc-tag"><i></i><span class="nc-tagtext"></span></span>' +
      '<b class="nc-name"></b>' +
      '<span class="nc-in"></span>' +
      '<div class="nc-big"><b class="nc-left2"></b><span class="nc-unit2"></span></div>' +
      '<i class="nc-bar"><u></u></i>' +
      '<span class="nc-next"></span>' +
    '</div>';

  // when a focus block or meeting is on (or up first), its buttons sit here
  {
    const now = Date.now();
    let w = wins.find(x => now >= x.a && now < x.z) || (now < wins[0].a ? wins[0] : null);
    // the clock can be off from real life (you started late or ran over).
    // if the block you are actually on, the first one not ticked, is a focus block, use that
    const open = wins.find(x => !x.b.done);
    if (open && isFocusBlock(open.b.label) && (!w || w.b.done || !isFocusBlock(w.b.label) && !isAgendaBlock(w.b.label))) w = open;
    if (w && !w.b.done && w.b.workout && workoutById(w.b.workout)) {
      const acts = document.createElement('div'); acts.className = 'nc-acts';
      const gb = document.createElement('button'); gb.type = 'button'; gb.className = 'nc-act grow'; gb.textContent = 'Open ' + workoutById(w.b.workout).title;
      gb.addEventListener('click', () => openWorkout(w.b.workout));
      acts.appendChild(gb); card.appendChild(acts);
    }
    if (w && !w.b.done && !w.b.workout) {
      const f = w.b.meeting ? 'agenda' : outcomeField(w.b.label);
      if (f) {
        const acts = document.createElement('div');
        acts.className = 'nc-acts';
        const L = w.b[f] || [];
        const lb = document.createElement('button');
        lb.type = 'button';
        lb.className = 'nc-act';
        lb.textContent = L.length ? (f === 'agenda' ? 'Agenda ' : 'Tasks ') + L.filter(x => x.done).length + '/' + L.length
                                  : (f === 'agenda' ? '+ Add agenda' : '+ Add task');
        lb.addEventListener('click', () => openListSheet(w.b, f, w.from));
        acts.appendChild(lb);
        if (f === 'goals' && (now >= w.a || w === open)) {
          const go = document.createElement('button');
          go.type = 'button';
          go.className = 'nc-act grow';
          go.textContent = 'Focus';
          go.addEventListener('click', () => openFocus(w.b, w.from, Number(w.b.mins) || 60));
          acts.appendChild(go);
        }
        card.appendChild(acts);
      }
    }
  }

  const $ = c => card.querySelector(c);
  let shown = null;   // which state was drawn, so a change can redraw the page

  const paint = () => {
    const now = Date.now();
    const cur = wins.find(w => now >= w.a && now < w.z);
    const first = wins[0], last = wins[wins.length - 1];
    let key, frac;

    if (cur) {
      key = 'b' + cur.i;
      frac = (now - cur.a) / (cur.z - cur.a);
      card.className = 'nowcard live';
      $('.nc-tagtext').textContent = 'Now';
      $('.nc-name').textContent = cur.b.label || 'unnamed block';
      $('.nc-left').textContent = fmtLeft(cur.z - now);
      $('.nc-unit').textContent = 'left';
      $('.nc-in').textContent = clock(cur.from) + ' to ' + clock(cur.from + (Number(cur.b.mins) || 60));
      const nx = wins[cur.i + 1];
      $('.nc-next').innerHTML = nx ? 'Then <b>' + esc(nx.b.label || 'unnamed block') + '</b> at ' + clock(nx.from) : 'Last one today';
    } else if (now < first.a) {
      key = 'before';
      frac = 0;
      card.className = 'nowcard waiting';
      $('.nc-tagtext').textContent = 'Starts soon';
      $('.nc-name').textContent = first.b.label || 'unnamed block';
      $('.nc-left').textContent = fmtLeft(first.a - now);
      $('.nc-unit').textContent = 'to go';
      $('.nc-in').textContent = 'starts at ' + clock(first.from);
      $('.nc-next').textContent = '';
    } else {
      key = 'after';
      frac = 1;
      const done = day.blocks.filter(b => b.done).length;
      card.className = 'nowcard over';
      $('.nc-tagtext').textContent = 'Plan finished';
      $('.nc-name').textContent = done === day.blocks.length ? 'Everything done' : done + ' of ' + day.blocks.length + ' done';
      $('.nc-left').textContent = '✓';
      $('.nc-unit').textContent = '';
      $('.nc-in').textContent = 'ended at ' + clock(last.from + (Number(last.b.mins) || 60));
      $('.nc-next').textContent = '';
    }

    $('.nc-arc').style.strokeDashoffset = C * (1 - Math.min(1, Math.max(0, frac)));
    $('.nc-left2').textContent = $('.nc-left').textContent;
    $('.nc-unit2').textContent = $('.nc-unit').textContent;
    $('.nc-bar u').style.width = Math.round(Math.min(1, Math.max(0, frac)) * 100) + '%';
    if (shown !== null && shown !== key) { renderDay(); return; }   // moved to the next block
    shown = key;
  };

  paint();
  nowTimer = setInterval(() => {
    if (!card.isConnected) { clearInterval(nowTimer); return; }
    paint();
  }, 1000);
  return card;
}

// an earlier day with blocks still to tick: what is left, and two ways to settle it
function pastCard(day) {
  const total = day.blocks.length, done = day.blocks.filter(b => b.done).length, left = total - done;
  const d = fromKey(viewDay);
  const name = viewDay === shiftKey(planKey(), -1) ? 'Yesterday' : cap(FULL[d.getDay()]);
  const card = document.createElement('div');
  card.className = 'nowcard past';
  card.innerHTML =
    '<div class="nc-row1"><span class="nc-tag"><i></i><span class="nc-tagtext">' + name + '</span></span><span class="nc-in">' + done + ' of ' + total + ' done</span></div>' +
    '<b class="nc-name">' + left + ' block' + (left > 1 ? 's' : '') + ' left to tick</b>' +
    '<i class="nc-bar"><u class="nc-fill" style="width:' + Math.round(done / total * 100) + '%"></u></i>' +
    '<div class="nc-dots">' + day.blocks.map(b => '<span class="' + (b.done ? 'd' : 'm') + '"></span>').join('') + '</div>' +
    '<div class="nc-acts"><button type="button" class="nc-act" data-a="all">Tick the rest</button>' +
    '<button type="button" class="nc-act" data-a="move">Move to today</button></div>';
  card.querySelector('[data-a=all]').addEventListener('click', () => {
    for (const b of day.blocks) {
      if (b.done) continue;
      b.done = true;
      const h = habitNamed(b.label);
      if (h && !h.marks.includes(viewDay)) h.marks.push(viewDay);
    }
    save(); renderDay(); renderHabits();
  });
  card.querySelector('[data-a=move]').addEventListener('click', () => {
    const moving = day.blocks.filter(b => !b.done);
    day.blocks = day.blocks.filter(b => b.done);
    const t = dayFor(planKey());
    t.blocks.push(...moving.map(b => ({ ...b, done: false })));
    t.touched = true;
    save(); viewDay = planKey(); renderDay(); renderHabits(); window.scrollTo(0, 0);
  });
  return card;
}

// shading shared by every drawing: gradients for petals, leaves, stem, pot
function flowerDefs(p) {
  const [lt, dk] = p.petal;
  return '<defs>' +
    '<linearGradient id="flP" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="' + dk + '"/><stop offset=".75" stop-color="' + lt + '"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>' +
    '<linearGradient id="flPd" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="' + dk + '"/><stop offset="1" stop-color="' + dk + '" stop-opacity=".75"/></linearGradient>' +
    '<radialGradient id="flM" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".35" stop-color="' + p.mid + '"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>' +
    '<linearGradient id="flL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9f2c6"/><stop offset=".35" stop-color="' + p.leaf + '"/><stop offset="1" stop-color="#1f4a24"/></linearGradient>' +
    '<linearGradient id="flS" gradientUnits="userSpaceOnUse" x1="19.2" y1="0" x2="20.8" y2="0"><stop offset="0" stop-color="#3d6e33"/><stop offset=".5" stop-color="#8cc46f"/><stop offset="1" stop-color="#3d6e33"/></linearGradient>' +
    '<linearGradient id="flPot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".35" stop-color="#fff" stop-opacity=".28"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient>' +
    '<radialGradient id="flSoil" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#6b4a32"/><stop offset="1" stop-color="#2e1d12"/></radialGradient>' +
    '<filter id="flSh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy=".8" stdDeviation=".7" flood-color="#000" flood-opacity=".45"/></filter>' +
    '</defs>';
}

// one petal pointing up from (cx, cy), then turned by angle a
function petal(cx, cy, r, a, shape, fill, sx) {
  const w = shape === 'point' ? r * .42 : r * .62;
  const d = shape === 'point'
    ? 'M' + cx + ' ' + cy + ' C' + (cx - w) + ' ' + (cy - r * .45) + ' ' + (cx - w * .5) + ' ' + (cy - r * .9) + ' ' + cx + ' ' + (cy - r) +
      ' C' + (cx + w * .5) + ' ' + (cy - r * .9) + ' ' + (cx + w) + ' ' + (cy - r * .45) + ' ' + cx + ' ' + cy + 'Z'
    : 'M' + cx + ' ' + cy + ' C' + (cx - w * 1.2) + ' ' + (cy - r * .4) + ' ' + (cx - w) + ' ' + (cy - r * 1.05) + ' ' + cx + ' ' + (cy - r) +
      ' C' + (cx + w) + ' ' + (cy - r * 1.05) + ' ' + (cx + w * 1.2) + ' ' + (cy - r * .4) + ' ' + cx + ' ' + cy + 'Z';
  return '<path d="' + d + '" fill="url(#' + fill + ')" stroke="#000" stroke-opacity=".08" stroke-width=".2" transform="rotate(' + a + ' ' + cx + ' ' + cy + ')"/>';
}

// a full flower head, tilted a little toward you so it looks round
function flowerHead(cx, cy, r, p) {
  if (p.tulip) {
    return '<g filter="url(#flSh)">' +
      '<path d="M' + (cx - r * .8) + ' ' + (cy - r * .2) + ' Q' + (cx - r * .9) + ' ' + (cy - r * 1.3) + ' ' + (cx - r * .3) + ' ' + (cy - r * 1.4) + ' Q' + cx + ' ' + (cy - r * .6) + ' ' + cx + ' ' + (cy + r * .5) + ' Z" fill="url(#flPd)"/>' +
      '<path d="M' + (cx + r * .8) + ' ' + (cy - r * .2) + ' Q' + (cx + r * .9) + ' ' + (cy - r * 1.3) + ' ' + (cx + r * .3) + ' ' + (cy - r * 1.4) + ' Q' + cx + ' ' + (cy - r * .6) + ' ' + cx + ' ' + (cy + r * .5) + ' Z" fill="url(#flPd)"/>' +
      '<path d="M' + (cx - r * .75) + ' ' + (cy - r * .5) + ' Q' + (cx - r * .5) + ' ' + (cy + r * .7) + ' ' + cx + ' ' + (cy + r * .6) + ' Q' + (cx + r * .5) + ' ' + (cy + r * .7) + ' ' + (cx + r * .75) + ' ' + (cy - r * .5) +
        ' Q' + (cx + r * .3) + ' ' + (cy - r * 1.6) + ' ' + cx + ' ' + (cy - r * 1.2) + ' Q' + (cx - r * .3) + ' ' + (cy - r * 1.6) + ' ' + (cx - r * .75) + ' ' + (cy - r * .5) + 'Z" fill="url(#flP)"/>' +
      '<path d="M' + (cx - r * .25) + ' ' + (cy - r * .9) + ' Q' + (cx - r * .4) + ' ' + cy + ' ' + (cx - r * .1) + ' ' + (cy + r * .4) + '" stroke="#fff" stroke-opacity=".35" stroke-width=".5" fill="none"/></g>';
  }
  let out = '';
  for (let L = 0; L < p.rings; L++) {
    const rr = r * (1 - L * (p.rings > 2 ? .2 : .28));
    const off = L * (180 / p.n) + (L % 2 ? 9 : 0);
    const fill = L === 0 && p.rings > 1 ? 'flPd' : 'flP';
    for (let i = 0; i < p.n; i++) out += petal(cx, cy, rr, off + i * 360 / p.n, p.shape, fill);
  }
  const midR = p.disc ? r * .42 : r * .2;
  out += '<circle cx="' + cx + '" cy="' + cy + '" r="' + midR + '" fill="url(#flM)"/>';
  if (p.disc) for (let i = 0; i < 14; i++) {
    const a = i * 2.4, d = Math.sqrt(i + .5) * midR * .24;
    out += '<circle cx="' + (cx + Math.cos(a) * d).toFixed(2) + '" cy="' + (cy + Math.sin(a) * d).toFixed(2) + '" r="' + (midR * .08).toFixed(2) + '" fill="#2a160a" opacity=".6"/>';
  }
  if (p.k === 'lily' || p.k === 'lotus') for (let i = 0; i < 5; i++) {
    const a = (-90 + (i - 2) * 22) * Math.PI / 180;
    out += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + Math.cos(a) * r * .55).toFixed(2) + '" y2="' + (cy + Math.sin(a) * r * .55).toFixed(2) + '" stroke="#7a9a3a" stroke-width=".25"/>' +
           '<circle cx="' + (cx + Math.cos(a) * r * .55).toFixed(2) + '" cy="' + (cy + Math.sin(a) * r * .55).toFixed(2) + '" r=".55" fill="' + p.mid + '"/>';
  }
  return '<g filter="url(#flSh)" transform="translate(' + cx + ' ' + cy + ') scale(1 .82) translate(' + (-cx) + ' ' + (-cy) + ')">' + out + '</g>';
}

// the top: a closed bud at stage 4, the open flower at stage 5
function plantTop(p, stage) {
  if (stage < 4) return '';
  if (stage === 4) {
    return '<g filter="url(#flSh)"><path d="M20 13 C17 11 17.5 7 20 5 C22.5 7 23 11 20 13Z" fill="url(#flP)"/>' +
           '<path d="M20 13.5 C18 12.5 17.6 10.5 18.2 9.6 L20 11 L21.8 9.6 C22.4 10.5 22 12.5 20 13.5Z" fill="url(#flL)"/></g>';
  }
  if (p.many) return [[13, 14, 3.4], [27, 13, 3.6], [20, 8, 4.2], [16, 6, 2.8], [24.5, 6.5, 2.8]].map(([x, y, r]) => flowerHead(x, y, r, p)).join('');
  return flowerHead(20, 10, p.tulip ? 5.4 : p.k === 'sunflower' ? 8 : 7, p);
}

function potSVG(pot) {
  return '<g filter="url(#flSh)"><path d="M10 38 H30 L27.8 48.5 Q20 49.6 12.2 48.5 Z" fill="' + pot.body + '"/>' +
         '<path d="M10 38 H30 L27.8 48.5 Q20 49.6 12.2 48.5 Z" fill="url(#flPot)"/>' +
         '<ellipse cx="20" cy="49" rx="9" ry="1" fill="#000" opacity=".25"/>' +
         '<rect x="8.5" y="35.6" width="23" height="4" rx="1.6" fill="' + pot.rim + '"/>' +
         '<rect x="8.5" y="35.6" width="23" height="4" rx="1.6" fill="url(#flPot)"/>' +
         '<ellipse cx="20" cy="36.2" rx="10.4" ry="1.1" fill="url(#flSoil)"/></g>';
}

const leafPath = (x, y, dx, dy) => {
  // a leaf from (x, y) out to (x+dx, y+dy), curved, with a vein down the middle
  const mx = x + dx / 2, my = y + dy / 2, nx = -dy * .35, ny = dx * .35;
  return '<path d="M' + x + ' ' + y + ' Q' + (mx + nx) + ' ' + (my + ny) + ' ' + (x + dx) + ' ' + (y + dy) + ' Q' + (mx - nx) + ' ' + (my - ny) + ' ' + x + ' ' + y + 'Z" fill="url(#flL)"/>' +
         '<path d="M' + x + ' ' + y + ' Q' + (mx + nx * .2) + ' ' + (my + ny * .2) + ' ' + (x + dx * .9) + ' ' + (y + dy * .9) + '" stroke="#d9f2c6" stroke-opacity=".5" stroke-width=".3" fill="none"/>';
};

// 0 seed · 1 sprout · 2 leaves · 3 more leaves · 4 bud · 5 in bloom
function plantSVG(stage, was, plant, pot) {
  plant = plant || ROOM_PLANTS[0]; pot = pot || ROOM_POTS[0];
  const g = n => (n > was ? ' class="grow"' : '');
  const stem = (y1, y2) => '<path d="M20 ' + y1 + ' V' + y2 + '" stroke="url(#flS)" stroke-width="1.6" stroke-linecap="round"/>';
  const p = [];
  if (stage === 0) p.push('<ellipse cx="20" cy="35.6" rx="1.8" ry="1.2" fill="#a0784f"/><ellipse cx="19.6" cy="35.2" rx=".6" ry=".35" fill="#fff" opacity=".4"/>');
  if (stage >= 1) p.push('<g' + g(1) + '>' + stem(36, 30) + leafPath(20, 31.5, -5, -3.5) + leafPath(20, 31.5, 5, -3.5) + '</g>');
  if (stage >= 2) p.push('<g' + g(2) + '>' + stem(30.2, 23) + leafPath(20, 26.5, -8.5, -5) + '</g>');
  if (stage >= 3) p.push('<g' + g(3) + '>' + stem(23.2, 16.5) + leafPath(20, 20.5, 8, -5) + '</g>');
  if (stage >= 4) p.push('<g' + g(4) + '>' + stem(16.7, 11.5) + '</g>');
  if (stage >= 4) p.push('<g' + (stage > was ? ' class="' + (stage === 5 ? 'bloom' : 'grow') + '"' : '') + '>' +
    (plant.crop ? '<text x="20" y="' + (stage === 5 ? 15 : 13) + '" font-size="' + (stage === 5 ? 12 : 7) + '" text-anchor="middle" dominant-baseline="middle">' + plant.crop + '</text>' : plantTop(plant, stage)) + '</g>');
  // each drawing gets its own shading names, so two on one page do not mix colours
  const uid = 'fl' + (++plantSVG.n || (plantSVG.n = 1)) + '_';
  return ('<svg viewBox="0 0 40 50" aria-hidden="true">' + flowerDefs(plant) + '<g class="sway">' + p.join('') + '</g>' + potSVG(pot) + '</svg>')
    .replace(/(url\(#|id=")fl/g, '$1' + uid);
}

function startRoom(b, end) {
  const plant = Math.random() < .5 ? pick(ROOM_CROPS) : pick(ROOM_PLANTS);
  // the pot changes at one or two random points on the way
  const changes = new Set([1, 2, 3, 4].sort(() => Math.random() - .5).slice(0, 1 + Math.floor(Math.random() * 2)));

// how do you feel: pops up by itself when a check-in is due (an hour after the last)
function roomMood(open) {
  const sh = document.querySelector('#focus .fx-moodsheet');
  if (!sh.hidden && !open) return;
  // first a small quiet button, so the plant keeps its room. the grid opens on tap.
  const room = document.getElementById('focus');
  if (!open) {
    sh.innerHTML = '<button type="button" class="fxm-ask">How do you feel? <span>\u203a</span></button>';
    sh.classList.add('small'); sh.hidden = false; room.classList.add('asking');
    sh.querySelector('.fxm-ask').addEventListener('click', () => roomMood(true));
    return;
  }
  sh.classList.remove('small');
  sh.innerHTML = '<div class="fxm-top"><b>How do you feel?</b><button type="button" class="fxm-x" aria-label="not now">\u2715</button></div><div class="fp"></div>';
  const done = () => { sh.hidden = true; room.classList.remove('asking'); };
  sh.querySelector('.fxm-x').addEventListener('click', () => { done(); if (focus) focus.moodSnooze = Date.now(); });
  feelPicker(sh.querySelector('.fp'), (mood, feel) => {
    state.moods.push({ at: Date.now(), mood, feel, part: partOfDay(new Date().getHours()), note: '', after: focus && focus.b ? focus.b.label || '' : '' });
    save();
    sh.innerHTML = '<p class="fxm-thanks">Noted: ' + esc(feel) + '</p>';
    setTimeout(done, 1300);
  });
  return;
  sh.innerHTML = '<div class="fxm-top"><b>How do you feel?</b><button type="button" class="fxm-x" aria-label="not now">✕</button></div><div class="fxm-grid">' + MOODS.map(m =>
    '<button type="button" data-m="' + m.k + '" style="--c:' + m.c + '"><span>' + m.e + '</span>' + m.k + '</button>').join('') + '</div>';
  sh.hidden = false;
  sh.querySelector('.fxm-x').addEventListener('click', () => { sh.hidden = true; if (focus) focus.moodSnooze = Date.now(); });
  sh.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => {
    state.moods.push({ at: Date.now(), mood: b.dataset.m, part: partOfDay(new Date().getHours()), note: '', after: focus && focus.b ? focus.b.label || '' : '' });
    save();
    sh.innerHTML = '<b>Logged ' + b.dataset.m + ' ✓</b>';
    setTimeout(() => { sh.hidden = true; }, 1100);
  }));
}

function tickFocus() {
  if (!focus) return;
  const now = Date.now();
  const f = (now - focus.start) / Math.max(1, focus.end - focus.start);
  const stage = stageAt(f);
  const el = document.getElementById('focus');

  if (stage !== focus.stage) {
    if (focus.stage >= 0 && focus.changes.has(stage)) {
      focus.pot = pick(ROOM_POTS.filter(p => p !== focus.pot));    // a new pot along the way
    }
    el.querySelector('.fx-plant').innerHTML = plantSVG(stage, focus.stage < 0 ? stage : focus.stage, focus.plant, focus.pot);
    if (focus.plant.steps && stage < 5) el.querySelector('.fx-growing').textContent = focus.plant.name + ' \u00b7 ' + focus.plant.steps[stage];
    focus.stage = stage;
  }

  // the black warms, slowly, as the session goes on
  const k = Math.min(1, Math.max(0, f));
  const mix = (a, b2) => Math.round(a + (b2 - a) * k);
  el.style.backgroundColor = 'rgb(' + mix(13, 34) + ',' + mix(12, 23) + ',' + mix(13, 16) + ')';

  if (now - focus.textAt >= 3 * 60000) roomText();
  // a check-in is due: ask here, unless you said not now in the last 15 minutes
  const lastMood = state.moods.reduce((m, x) => Math.max(m, x.at), 0);
  if (stage < 5 && now - lastMood >= MOOD_EVERY && now - (focus.moodSnooze || 0) >= 15 * 60000 && now - focus.start >= 60000) roomMood();

  const left = Math.max(0, focus.end - now);
  const m = Math.floor(left / 60000), sec = Math.floor(left / 1000) % 60;
  el.querySelector('.fx-left').textContent = stage === 5 ? 'Fully grown'
    : (m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') + ':' + String(sec).padStart(2, '0')
               : m + ':' + String(sec).padStart(2, '0'));
  if (stage < 5) {
    const gone = Math.floor((now - focus.start) / 60000);
    el.querySelector('.fx-ends').textContent = 'ends ' + clockOf(focus.end);   // one thing to read
    void gone;
  }
  el.querySelector('.fx-arc').style.strokeDashoffset = 879.6 * (1 - k);
  el.querySelector('.fx-plant').classList.toggle('done', stage === 5);

  if (stage === 5) {
    clearInterval(focus.timer);
    el.classList.add('grown');
    const n = focus.leaves || 0;
    el.querySelector('.fx-ends').textContent = n === 0 ? 'you stayed with it the whole way'
      : 'you left the room ' + (n === 1 ? 'once' : n === 2 ? 'twice' : n + ' times');
    el.querySelector('.fx-note').textContent = '';
    el.querySelector('.fx-growing').textContent = focus.plant.steps ? focus.plant.steps[5] : focus.plant.name + ' is fully grown';
    el.querySelector('.fx-done').hidden = false;
  }
}

// leaving the app does not stop the plant, but each time is counted for the end
document.addEventListener('visibilitychange', () => {
  if (!focus || focus.stage === 5) return;
  if (document.hidden) { focus.leaves = (focus.leaves || 0) + 1; return; }
  tickFocus();
});

// from the home page: the focus block you are on, or a free session
function openRoomFromHome() {
  viewDay = planKey();
  const day = state.days[viewDay];
  if (day && day.blocks.length) {
    let at = toMins(day.start); const nm = planMin(viewDay);
    for (const b of day.blocks) {
      const len = Number(b.mins) || 60;
      if (!b.done && isFocusBlock(b.label) && nm < at + len + 120) { openFocus(b, at, len); return; }
      at += len;
    }
  }
  // the block you are on now (any kind), so you can focus until it ends
  let cur = null;
  if (day && day.blocks.length) {
    let at = toMins(day.start); const nm = planMin(viewDay);
    for (const b of day.blocks) { const len = Number(b.mins) || 60; if (!cur && !b.done && nm >= at && nm < at + len) cur = { b, at, len, left: at + len - nm }; at += len; }
  }
  const old = document.getElementById('roomsheet'); if (old) old.remove();
  const el = document.createElement('div');

          '<button type="button" class="wka-go" data-m="' + other + '">Start ' + minsLabel(other) + '</button><button type="button" class="ls-back">Back</button>'
        : (cur && cur.left >= 5 ? '<button type="button" class="ls-row on" data-cur="1"><b>' + esc(cur.b.label || 'This block') + '</b><i>until it ends</i><small>' + minsLabel(cur.left) + ' \u00b7 ' + endAt(cur.left) + '</small></button>' : '') +
          '<div class="ls-list">' + [15, 25, 45, 60, 90, 120].map(m => '<button type="button" class="ls-row" data-m="' + m + '"><b>' + minsLabel(m) + '</b><small>ends ' + endAt(m) + '</small></button>').join('') +
          '<button type="button" class="ls-row ls-other" data-other="1"><b>Other</b></button></div>') +

    el.querySelector('.w3-back').addEventListener('click', () => el.remove());

    el.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => { el.remove(); openFocusFree(Number(b.dataset.m)); }));
    const c = el.querySelector('[data-cur]'); if (c) c.addEventListener('click', () => { el.remove(); openFocus(cur.b, cur.at, cur.len); });
    const o = el.querySelector('[data-other]'); if (o) o.addEventListener('click', () => draw(true));
    el.querySelectorAll('[data-o]').forEach(b => b.addEventListener('click', () => { other = Math.max(5, Math.min(240, other + Number(b.dataset.o))); draw(true); }));
    const bk = el.querySelector('.ls-back'); if (bk) bk.addEventListener('click', () => draw(false));
  };
  draw(false);
  document.body.appendChild(el);
}

/* ---- undo for the day page ----
   every save compares the viewed day with how it looked last time.
   if it changed, the old version goes on a stack. fast edits (typing)
   within a second collapse into one step. */
const UNDO_MAX = 50;
let dayHist = [];          // [{ k, day, habits }] oldest first
let daySnap = null;        // how the viewed day looked at the last save
let lastPush = 0;
let undoing = false;

function snapNow() {
  return { k: viewDay,
           day: JSON.stringify(state.days[viewDay] || null),
           habits: JSON.stringify(state.habits) };
}

function recordDay() {
  if (undoing) return;
  const cur = snapNow();
  if (!daySnap || daySnap.k !== cur.k) { daySnap = cur; return; }
  if (daySnap.day === cur.day && daySnap.habits === cur.habits) return;
  const t = Date.now();
  if (t - lastPush > 1000) {
    dayHist.push(daySnap);
    if (dayHist.length > UNDO_MAX) dayHist.shift();
    lastPush = t;
  }
  daySnap = cur;
  updateUndo();
}

function updateUndo() {
  const btn = document.getElementById('day-undo');
  if (btn) btn.disabled = !dayHist.some(h => h.k === viewDay);
}

function undoDay() {
  let i = dayHist.length - 1;
  while (i >= 0 && dayHist[i].k !== viewDay) i--;
  if (i < 0) return;
  const prev = dayHist.splice(i, 1)[0];
  const d = JSON.parse(prev.day);
  if (d) state.days[prev.k] = d; else delete state.days[prev.k];
  state.habits = JSON.parse(prev.habits);
  customFor = null;
  undoing = true;
  save();
  undoing = false;
  daySnap = snapNow();
  lastPush = 0;
  renderDay(); renderHabits();
}

const QUICK_LENGTHS = [15, 30, 45, 60, 90, 120];

// how long you usually give a block with this name, from past days
function usualLength(label) {
  const name = String(label || '').trim().toLowerCase();
  if (!name) return null;
  const count = {};
  for (const k in state.days) {
    if (k === viewDay) continue;
    for (const x of (state.days[k].blocks || [])) {
      if (String(x.label || '').trim().toLowerCase() === name) count[x.mins] = (count[x.mins] || 0) + 1;
    }
  }
  const best = Object.entries(count).sort((a, b) => b[1] - a[1])[0];
  return best && best[1] >= 2 ? Number(best[0]) : null;
}

/* change a block's length. it stays open while you adjust, so you can tap
   +5 a few times. three ways: add or take time, a quick length, or pick
   when it ends on the time wheel. the wheel only saves when you tap Done
   (iPhone reports every spin as a change, so saving on each one closed it). */
function lengthPicker(b, from, len) {
  // a big sheet: your usual first, a few common lengths, each with its end time. one tap sets it.
  const spot = document.createElement('div');
  if (document.getElementById('lensheet')) return spot;
  const el = document.createElement('div');
  el.id = 'lensheet'; el.className = 'w3';
  const usual = usualLength(b.label);
  const name = (b.label || '').trim();
  let opts = [30, 60, 90, 120];
  if (usual && !opts.includes(usual)) opts = [usual, ...opts.filter(m => m !== 90)];
  const close = () => { el.remove(); customFor = null; renderDay(); };
  const keep = m => { b.mins = Math.max(5, Math.min(1440, m)); save(); close(); };
  let other = len;
  const draw = more => {
    el.innerHTML = '<div class="w3-back"></div><div class="w3-sheet ls" role="dialog" aria-modal="true" aria-label="How long"><span class="w3-grab"></span>' +
      '<h2>How long' + (name ? ' is ' + esc(name) : '') + '?</h2>' +
      (more ? '' : '<div class="ls-df"></div><p class="ls-from ls-end">' + clock(from) + ' to ' + clock(from + len) + '</p><button type="button" class="wka-go ls-save">Save</button>') +
      (more ? '' : '<p class="ab-sub">Add time</p><div class="ls-add">' + [5, 10, 15, 30, 60].map(d => '<button type="button" data-add="' + d + '">+' + (d === 60 ? '1h' : d) + '</button>').join('') + '</div><p class="ab-sub">Or set it</p>') +
      (more
        ? '<div class="ls-step"><button type="button" data-o="-15" aria-label="15 minutes less">\u2212</button><div><b>' + minsLabel(other) + '</b><small>ends ' + clock(from + other) + '</small></div><button type="button" data-o="15" aria-label="15 minutes more">+</button></div>' +
          '<button type="button" class="wka-go ls-set">Set ' + minsLabel(other) + '</button><button type="button" class="ls-back">Back</button>'
        : '<div class="ls-list">' + opts.map(m => '<button type="button" class="ls-row' + (m === len ? ' on' : '') + '" data-m="' + m + '"><b>' + minsLabel(m) + '</b>' +
            (m === usual ? '<i>your usual</i>' : '') + '<small>ends ' + clock(from + m) + '</small></button>').join('') +
          '<button type="button" class="ls-row ls-other" data-other="1"><b>Other</b><small>' + (opts.includes(len) ? '' : 'now ' + minsLabel(len)) + '</small></button></div>' +
          '<button type="button" class="ls-rm">Remove this block</button>') +
      '<button type="button" class="ls-cancel">Cancel</button></div>';
    el.querySelector('.w3-back').addEventListener('click', close);
    el.querySelector('.ls-cancel').addEventListener('click', close);
    el.querySelectorAll('[data-m]').forEach(x => x.addEventListener('click', () => keep(Number(x.dataset.m))));
    el.querySelectorAll('[data-add]').forEach(x => x.addEventListener('click', () => keep(len + Number(x.dataset.add))));   // add time to the task
    // the length itself, typed
    const dfBox = el.querySelector('.ls-df');
    if (dfBox) { let typed = len; const endP = el.querySelector('.ls-end');
      durField(dfBox, len, m => { typed = m; endP.textContent = clock(from) + ' to ' + clock(from + m); });
      el.querySelector('.ls-save').addEventListener('click', () => keep(typed)); }
    const o = el.querySelector('[data-other]'); if (o) o.addEventListener('click', () => draw(true));
    el.querySelectorAll('[data-o]').forEach(x => x.addEventListener('click', () => { other = Math.max(15, Math.min(720, other + Number(x.dataset.o))); draw(true); }));
    const st = el.querySelector('.ls-set'); if (st) st.addEventListener('click', () => keep(other));
    const bk = el.querySelector('.ls-back'); if (bk) bk.addEventListener('click', () => draw(false));
    const rm = el.querySelector('.ls-rm');
    if (rm) rm.addEventListener('click', () => {
      if (rm.dataset.sure !== '1') { rm.dataset.sure = '1'; rm.textContent = 'Tap again to remove ' + (name || 'it'); return; }
      const bl = dayFor(viewDay).blocks, at = bl.indexOf(b);
      if (at >= 0) bl.splice(at, 1);
      save(); el.remove(); customFor = null; renderDay(); renderHabits();
    });
  };
  draw(false);
  document.body.appendChild(el);
  return spot;
}

const HB_STOP = new Set(['the', 'a', 'an', 'to', 'my', 'and', 'of', 'for', 'in', 'on', 'at', 'with', 'do', 'go', 'get', 'have', 'take', 'min', 'mins', 'minutes', 'hour', 'hours', 'page', 'pages', 'every', 'day', 'daily', 'morning', 'night', 'evening']);
const hbWords = t => String(t || '').toLowerCase().replace(/[^a-z ]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !HB_STOP.has(w))
  .map(w => w.replace(/(ing|ings)$/, '').replace(/(es|s)$/, '').replace(/(.)\1$/, '$1'));
function habitNamed(label) {
  const l = (label || '').trim().toLowerCase();
  if (!l) return null;
  const exact = state.habits.find(h => h.name.trim().toLowerCase() === l);
  if (exact) return exact;
  const bw = new Set(hbWords(l));
  const close = (w, k) => w === k || (k.length >= 4 && w.length >= 4 && (w.startsWith(k) || k.startsWith(w)));   // pray / prayer
  return state.habits.find(h => { const k = hbWords(h.name)[0]; return k && [...bw].some(w => close(w, k)); }) || null;
}
// the plan block a habit is tied to, from today or the last 2 weeks
function habitBlock(h) {
  for (let i = 0; i < 14; i++) {
    const d = state.days[shiftKey(todayKey(), -i)];
    const b = d && (d.blocks || []).find(x => habitNamed(x.label) === h);
    if (b) return b.label.trim();
  }
  return null;
}

function lastPlanned(from) {
  for (let i = 1; i <= 7; i++) {
    const k = shiftKey(from, -i);
    const d = state.days[k];
    if (d && d.blocks.some(b => (b.label || '').trim())) return { k, day: d };
  }
  return null;
}

function renderCarry() {
  const slot = document.getElementById('carry-slot');
  slot.innerHTML = '';

  const day = dayFor(viewDay);
  if (day.noCarry) return;
  // shows on an empty day, and stays open while you are bringing things over
  if (day.blocks.length && !day.carryOpen) return;

  const prev = lastPlanned(viewDay);
  if (!prev) return;

  const items = prev.day.blocks.filter(b => (b.label || '').trim());
  if (!items.length) return;
  const when = (prev.k === shiftKey(viewDay, -1)) ? 'Yesterday' : 'On ' + cap(FULL[fromKey(prev.k).getDay()]);
  if (!day.carried || day.carried.from !== prev.k) day.carried = { from: prev.k, i: [] };
  const got = day.carried.i;

  const copy = b => ({ label: b.label, mins: b.mins, ...(b.step ? { step: b.step } : {}),
    ...(Array.isArray(b.goals) && b.goals.length ? { goals: b.goals.map(g => ({ text: g.text, done: false })) } : {}) });
  const bring = list => {
    for (const n of list) if (!got.includes(n)) { day.blocks.push(copy(items[n])); got.push(n); }
    day.carryOpen = got.length < items.length; if (!day.carryOpen) day.noCarry = true;
    save(); renderDay(); renderHabits();
  };

  const box = document.createElement('div');
  box.className = 'suggest studs cy';
  box.innerHTML = '<p class="cy-h">' + when + ' you planned these.</p><p class="cy-sub">Tap one to bring it over, then pick the days.</p>' +
    '<div class="cy-list">' + items.map((b, n) => { const d = DURATIONS.find(x => x.mins === b.mins);
      return '<button type="button" class="cy-row' + (got.includes(n) ? ' got' : '') + '" data-n="' + n + '"' + (got.includes(n) ? ' disabled' : '') + '>' +
        '<span class="cy-plus">' + (got.includes(n) ? '\u2713' : '+') + '</span><b>' + esc(b.label) + '</b><small>' + (got.includes(n) ? 'added' : (d ? d.label : b.mins + 'm')) + '</small></button>'; }).join('') + '</div>' +
    '<div class="cy-btns">' + (got.length < items.length ? '<button type="button" class="cy-all">Bring all</button>' : '') +
    '<button type="button" class="cy-done">' + (got.length ? 'Done' : 'Start fresh') + '</button></div>';
  // tap one: same name and length, and pick which days this week it goes on (today is picked)
  box.querySelectorAll('.cy-row:not(.got)').forEach(r => r.addEventListener('click', () => {
    const n = Number(r.dataset.n), b = items[n];
    weekAddSheet(viewDay, [0, 1, 2, 3, 4, 5, 6].map(x => shiftKey(viewDay, x)), { label: b.label, mins: b.mins, step: b.step }, picks => {
      if (picks.includes(viewDay)) { got.push(n); day.carryOpen = got.length < items.length; if (!day.carryOpen) day.noCarry = true; }
      save(); renderDay(); renderHabits();
    });
  }));
  const all = box.querySelector('.cy-all'); if (all) all.addEventListener('click', () => bring(items.map((_, n) => n)));
  box.querySelector('.cy-done').addEventListener('click', () => { day.carryOpen = false; day.noCarry = true; save(); renderDay(); });
  slot.appendChild(box);
}

// finish planning: keep a copy of the plan (the first one), so the end of the
// day can show what changed
function finishPlan(day) {
  if (!day.planSnap) day.planSnap = { at: Date.now(), start: day.start, blocks: day.blocks.map(b => ({ label: b.label || '', mins: Number(b.mins) || 60 })) };
  sortingDay = false; customFor = null;
  save(); renderDay(); window.scrollTo({ top: 0, behavior: 'smooth' });
}

function moveBlockTo(from, to) {
  const blocks = dayFor(viewDay).blocks;
  if (from === to || to < 0 || to >= blocks.length) { renderDay(); return; }
  blocks.splice(to, 0, blocks.splice(from, 1)[0]);
  save();
  renderDay();
}

// drag to reorder, pointer events so it works with a finger
function attachDrag(sheet) {
  const rows = Array.from(sheet.children).filter(r => r.classList.contains('line'));
  if (rows.length < 2) return;

  let held = null, startY = 0, rowH = 0, from = 0, to = 0, wait = null, downY = 0;

  const lift = (row, i, y) => {
    held = row; from = to = i; startY = y;
    rowH = row.getBoundingClientRect().height;
    try { navigator.vibrate && navigator.vibrate(12); } catch {}
    row.classList.add('dragging');
    rows.forEach(r => { if (r !== row) r.classList.add('shifting'); });
  };
  const move = y => {
    const row = held, dy = y - startY;
    row.style.transform = 'translateY(' + dy + 'px) scale(1.02)';
    let next = from + Math.round(dy / rowH);
    next = Math.max(0, Math.min(rows.length - 1, next));
    if (next === to) return;
    to = next;
    try { navigator.vibrate && navigator.vibrate(6); } catch {}
    rows.forEach((r, j) => {
      if (r === row) return;
      let shift = 0;
      if (from < to && j > from && j <= to) shift = -rowH;
      if (from > to && j >= to && j < from) shift = rowH;
      r.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
    });
  };
  const drop = () => {
    clearTimeout(wait); wait = null;
    if (!held) return;
    const row = held;
    held = null;
    row.classList.remove('dragging');
    rows.forEach(r => { r.classList.remove('shifting'); r.style.transform = ''; });
    // the lift was not a tap: swallow the click that follows
    const stop = ev => { ev.stopPropagation(); ev.preventDefault(); };
    window.addEventListener('click', stop, { capture: true, once: true });
    setTimeout(() => window.removeEventListener('click', stop, { capture: true }), 400);
    moveBlockTo(from, to);
  };

  rows.forEach((row, i) => {
    // fingers: hold still for a moment to pick it up, then drag. moving first is a scroll
    row.addEventListener('touchstart', e => {
      if (e.target.closest('input') || e.touches.length > 1) return;
      downY = e.touches[0].clientY;
      clearTimeout(wait);
      wait = setTimeout(() => { wait = null; lift(row, i, downY); }, 300);
    }, { passive: true });
    row.addEventListener('touchmove', e => {
      const y = e.touches[0].clientY;
      if (wait && Math.abs(y - downY) > 8) { clearTimeout(wait); wait = null; return; }
      if (held !== row) return;
      e.preventDefault();             // keep the page still while you drag
      move(y);
    }, { passive: false });
    row.addEventListener('touchend', drop);
    row.addEventListener('touchcancel', drop);
    row.addEventListener('contextmenu', e => e.preventDefault());

    // a mouse: press and drag
    row.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse' || e.target.closest('input')) return;
      downY = e.clientY;
      const pid = e.pointerId;
      clearTimeout(wait);
      wait = setTimeout(() => { wait = null; lift(row, i, downY); try { row.setPointerCapture(pid); } catch {} }, 200);
    });
    row.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse') return;
      if (wait && Math.abs(e.clientY - downY) > 6) { clearTimeout(wait); wait = null; }
      if (held === row) move(e.clientY);
    });
    row.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') drop(); });
  });
}

function moveBlock(i, by) {
  const blocks = dayFor(viewDay).blocks;
  const j = i + by;
  if (j < 0 || j >= blocks.length) return;
  blocks.splice(j, 0, blocks.splice(i, 1)[0]);
  save();
  renderDay();
}

function grow(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

// one goal for the day: asked once each new day, then shown at the top
let dayGoalEditing = false;
function renderDayGoal() {
  const box = document.getElementById('day-goal');
  const day = dayFor(viewDay);
  const isToday = viewDay === planKey();
  box.innerHTML = '';
  if (day.goal && !dayGoalEditing) {
    box.innerHTML = '<div class="dg-card' + (day.goalDone ? ' done' : '') + '"><button type="button" class="dg-tick" aria-label="' + (day.goalDone ? 'not done yet' : 'done') + '">\u2713</button>' +
      '<div><span>' + (isToday ? 'Today\u2019s one goal' : viewDay === shiftKey(planKey(), 1) ? 'Tomorrow\u2019s one goal' : 'One goal') + '</span><b></b></div><button type="button" class="dg-edit">Edit</button></div>';
    box.querySelector('b').textContent = day.goal;
    box.querySelector('.dg-tick').addEventListener('click', () => { day.goalDone = !day.goalDone; save(); renderDayGoal(); });
    box.querySelector('.dg-edit').addEventListener('click', () => { dayGoalEditing = true; renderDayGoal(); });
    return;
  }
  // ask on today and on days ahead, so you can set tomorrow's goal while you plan it
  if (viewDay < planKey() && !dayGoalEditing) return;
  if (day.goalSkip && !dayGoalEditing) return;
  const ahead = viewDay > planKey();
  const dayName = viewDay === shiftKey(planKey(), 1) ? 'tomorrow' : cap(FULL[fromKey(viewDay).getDay()]);

  // ideas: this week's big goal actions not done yet, and yesterday's goal if it was missed
  const ideas = [];
  for (const k of ['health', 'wealth', 'love', 'self']) {
    for (const b of (typeof bigsOf === 'function' ? bigsOf(k) : [])) { const A = weekAction(b); if (A && !A.done) ideas.push(A.text); }
  }
  const yd = state.days[shiftKey(viewDay, -1)];
  if (yd && yd.goal && !yd.goalDone) ideas.unshift(yd.goal);
  const uniq = [...new Set(ideas)].slice(0, 3);

  box.innerHTML = '<div class="dg-ask"><b>' + (dayGoalEditing ? 'Change this day\u2019s goal' : ahead ? 'One goal for ' + dayName + '?' : 'New day. What\u2019s your one goal today?') + '</b>' +
    '<div class="dg-in"><input type="text" maxlength="100" placeholder="what makes today a win?"><button type="button" class="lf-btn main">Set</button></div>' +
    (uniq.length ? '<div class="dg-ideas">' + uniq.map(t => '<button type="button" data-t="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div>' : '') +
    '<button type="button" class="dg-skip">' + (dayGoalEditing ? 'Cancel' : ahead ? 'Later' : 'Not today') + '</button></div>';
  const inp = box.querySelector('input');
  inp.value = dayGoalEditing ? (day.goal || '') : '';
  const set = t => { t = (t || '').trim(); if (!t) { inp.focus(); return; } day.goal = t; day.goalDone = false; day.goalSkip = false; dayGoalEditing = false; save(); renderDayGoal(); };
  box.querySelector('.lf-btn').addEventListener('click', () => set(inp.value));
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') set(inp.value); });
  box.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => set(b.dataset.t)));
  box.querySelector('.dg-skip').addEventListener('click', () => { if (dayGoalEditing) dayGoalEditing = false; else day.goalSkip = true; save(); renderDayGoal(); });
}

function renderDay() {
  renderDayGoal();
  renderDump();
  renderCarry();
  const day = dayFor(viewDay);
  const d = fromKey(viewDay);
  const isToday = viewDay === planKey();
  if (sortingDay && sortingKey !== viewDay) sortingDay = false;   // planning is for the day you started it on

  document.getElementById('day-title').innerHTML =
    (isToday ? 'today' : FULL[d.getDay()]) +
    '<small>' + FULL[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + '</small>';

  // follow the clock only until you plan something or set it yourself
  if (!day.blocks.length && !day.touched && isToday) {
    day.start = nowHHMM();
    undoing = true; save(); undoing = false;   // the clock moving is not an edit
    daySnap = null;
  }

  startInput.value = hhmm(toMins(day.start));
  const dv = document.getElementById('view-day');
  dv.classList.toggle('sorting', !!sortingDay);
  dv.classList.toggle('calm', day.blocks.length > 0 && !sortingDay);
  if (!daySnap || daySnap.k !== viewDay) { try { daySnap = snapNow(); } catch {} }
  updateUndo();
  blockList.innerHTML = '';

  if (!day.blocks.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'nothing planned';
    blockList.appendChild(e);
    document.getElementById('total').textContent = '';
    document.getElementById('block-add').hidden = false;
    sortingDay = !day.planSnap && viewDay >= planKey();   // a new day opens straight into planning
    sortingKey = viewDay;
    return;
  }

  // you work down the list in order, so done blocks are always the top of it
  let firstOpen = day.blocks.findIndex(b => !b.done);
  if (firstOpen === -1) firstOpen = day.blocks.length;

  let at = toMins(day.start);

  const growing = [];

  const sheet = document.createElement('div');
  sheet.className = 'sheet' + (compactDay && !sortingDay ? ' compact' : '');

  day.blocks.forEach((b, i) => {
    const len  = Number(b.mins) || 60;   // guard against anything odd in saved data
    const from = at;
    at = at + len;

    // finished blocks fold into one line, so the page shows what is left
    if (!sortingDay && b.done && i < firstOpen && firstOpen > 0) {
      if (i === 0) {
        const f = document.createElement('button');
        f.type = 'button'; f.className = 'donefold' + (dayShowDone ? ' open' : '');
        f.innerHTML = '<i>\u2713</i><b>' + firstOpen + ' done</b><span>' + (dayShowDone ? 'hide' : 'show') + '</span>';
        f.addEventListener('click', () => { dayShowDone = !dayShowDone; renderDay(); });
        sheet.appendChild(f);
      }
      if (!dayShowDone) return;
    }

    const h = habitNamed(b.label);

    const row = document.createElement('div');
    row.className = 'line' + (b.done ? ' ticked' : '');
    row.dataset.i = i;

    const when = document.createElement('div');
    when.className = 'at';
    when.innerHTML = clock(from) + '<small class="endat">' + clock(at) + '</small>';
    when.title = 'tap to change how long this runs';
    when.classList.add('tapme');
    when.addEventListener('click', () => { customFor = customFor === i ? null : i; renderDay(); });

    const locked = !b.done && i !== firstOpen;
    if (locked) row.classList.add('locked');

    // a block cannot be ticked until its time is up.
    // future days are all too early; past days are fine (catching up).
    const tk = planKey();
    const nowMin = planMin(viewDay);
    const early = !b.done && (viewDay > tk || (viewDay === tk && nowMin < from + len));
    if (early && !locked) row.classList.add('early');

    if (!sortingDay) {
      if (i === justTicked) row.classList.add('justdone');
      if (i === firstOpen && !early) row.classList.add('next');
      if (i === firstOpen && viewDay === tk && nowMin >= from && nowMin < from + len) row.classList.add('cur');
      if (justTicked !== null && i === justTicked + 1) row.classList.add('arrive');
    }

    const tick = document.createElement('button');
    tick.className = 'tick' + (b.done ? ' on' : '');
    tick.type = 'button';
    tick.textContent = '\u2713';
    tick.disabled = locked;
    tick.setAttribute('aria-label',
      locked ? 'finish the block above first'
             : early ? 'ends at ' + clock(from + len) + ', you can tick it then'
             : (b.done ? 'mark as not done' : 'mark as done'));

    // done early: hold the circle of a block you have started. it ends now,
    // so everything after it moves up. deliberate, so a stray tap can't do it.
    if (early && !locked && viewDay === tk && nowMin >= from) {
      let hold = null;
      const stop = () => { clearTimeout(hold); hold = null; tick.classList.remove('holding'); };
      tick.addEventListener('pointerdown', () => {
        tick.classList.add('holding');
        hold = setTimeout(() => {
          hold = null; tick.classList.remove('holding'); tick._held = true;
          try { navigator.vibrate && navigator.vibrate(15); } catch {}
          b.mins = Math.max(5, nowMin - from);
          b.done = true; b.early = true;
          if (h && !h.marks.includes(viewDay)) h.marks.push(viewDay);
          justTicked = i;
          save(); renderDay(); renderHabits();
          if (askMealAfter(b)) {}
          else if (day.blocks.every(x => x.done)) setTimeout(() => daySummary(viewDay), 450);
          else setTimeout(() => askMoodAfter(b), 500);
        }, 650);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => tick.addEventListener(ev, stop));
      tick.addEventListener('contextmenu', e => e.preventDefault());
    }

    tick.addEventListener('click', () => {
      if (locked) return;
      if (tick._held) { tick._held = false; return; }
      if (early) {
        // say why, briefly, without redrawing the page
        row.classList.remove('nope'); void row.offsetWidth; row.classList.add('nope');
        let msg = mid.querySelector('.toosoon');
        if (!msg) { msg = document.createElement('span'); msg.className = 'toosoon'; mid.appendChild(msg); }
        const started = viewDay === tk && nowMin >= from;
        msg.textContent = viewDay !== tk ? 'you can tick this on the day'
                        : started ? 'done early? hold the circle' : 'you can tick this at ' + clock(from + len);
        clearTimeout(msg._t);
        msg._t = setTimeout(() => msg.remove(), 2600);
        return;
      }

      if (b.done) {
        // stepping back also clears everything after it
        for (let j = i; j < day.blocks.length; j++) {
          const bl = day.blocks[j];
          if (!bl.done) continue;
          bl.done = false;
          const hj = habitNamed(bl.label);
          if (hj) {
            const at2 = hj.marks.indexOf(viewDay);
            if (at2 > -1) hj.marks.splice(at2, 1);
          }
        }
      } else {
        b.done = true;
        if (h && !h.marks.includes(viewDay)) h.marks.push(viewDay);
        justTicked = i;               // so the render can animate it
      }

      save(); renderDay(); renderHabits();
      if (!b.done) return;
      if (askMealAfter(b)) return;   // a meal block asks about the meal first
      if (day.blocks.every(x => x.done)) setTimeout(() => daySummary(viewDay), 450);   // that was the last one
      else setTimeout(() => askMoodAfter(b), 500);
    });

    if (sortingDay) {
      row.className = 'line plan-row';

      // the number: tap it and type where this block should go
      const num = document.createElement('button');
      num.type = 'button'; num.className = 'pl-num'; num.textContent = i + 1;
      num.setAttribute('aria-label', 'block ' + (i + 1) + ', tap to move it');
      num.addEventListener('click', () => {
        const inp = document.createElement('input');
        inp.type = 'number'; inp.inputMode = 'numeric'; inp.min = 1; inp.max = day.blocks.length;
        inp.className = 'pl-numin'; inp.value = i + 1; inp.setAttribute('aria-label', 'move to position');
        num.replaceWith(inp); inp.focus(); inp.select();
        let doneIt = false;
        const go = () => { if (doneIt) return; doneIt = true; const n = Math.round(Number(inp.value)); moveBlockTo(i, Math.max(1, Math.min(day.blocks.length, n || i + 1)) - 1); };
        inp.addEventListener('change', go); inp.addEventListener('blur', go);
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
      });

      const name = document.createElement('button');
      name.type = 'button';
      name.className = 'what what-btn pl-name' + ((b.label || '').trim() ? '' : ' empty');
      name.textContent = (b.label || '').trim() || 'What\u2019s this?';
      name.addEventListener('click', () => openNameSheet(b));

      const lenB = document.createElement('button');
      lenB.type = 'button'; lenB.className = 'pl-len'; lenB.textContent = dur(len);
      lenB.setAttribute('aria-label', 'how long, ' + dur(len) + ', tap to change');
      lenB.addEventListener('click', () => { customFor = customFor === i ? null : i; renderDay(); });

      row.append(when, num, name, lenB);
      sheet.appendChild(row);
      if (focusNew === i) { focusNew = null; setTimeout(() => openNameSheet(b), 60); }
      if (customFor === i) sheet.appendChild(lengthPicker(b, from, len));
      return;
    }

    const mid = document.createElement('div');
    mid.className = 'mid';

    // the name is a button: tap it to open the naming panel (type, or pick)
    const what = document.createElement('button');
    what.type = 'button';
    what.className = 'what what-btn' + ((b.label || '').trim() ? '' : ' empty');
    what.textContent = (b.label || '').trim() || 'What\u2019s this?';
    what.setAttribute('aria-label', 'name this block, now ' + ((b.label || '').trim() || 'empty'));
    what.addEventListener('click', () => openNameSheet(b));
    if (focusNew === i) { focusNew = null; setTimeout(() => openNameSheet(b), 60); }    // a new block asks straight away
    mid.appendChild(what);

    if (h) {
      const isa = document.createElement('span');
      isa.className = 'isa';
      isa.style.setProperty('--c', h.color || PALETTE[0]);
      isa.innerHTML = '<i></i>habit';
      mid.appendChild(isa);
    } else if (false) {
      const track = document.createElement('button');
      track.className = 'track';
      track.type = 'button';
      track.textContent = 'track this as a habit';
      track.addEventListener('click', () => {
        const name = b.label.trim();
        addHabit(name.charAt(0).toUpperCase() + name.slice(1), b.done ? [viewDay] : []);
      });
      mid.appendChild(track);
    }

    // goals and agendas live in a panel, opened from a small chip on the row
    // (and from the Now card when it is their time)
    const extra = document.createElement('div');
    extra.className = 'line-extra';
    let chip = null;
    const field = b.meeting ? 'agenda' : outcomeField(b.label);
    if (field) {
      const L = b[field] || [];
      chip = document.createElement('button');
      chip.type = 'button';
      // work with no outcome is unclear work: flag it until it says what it will finish
      const unclear = field === 'goals' && !L.length && !b.done;
      chip.className = 'addlist' + (L.length ? ' has' : '') + (unclear ? ' flag' : '');
      chip.textContent = L.length ? L.filter(x => x.done).length + '/' + L.length : unclear ? '?' : '+';
      if (unclear) chip.setAttribute('aria-label', 'no outcome yet, tap to add what you will finish');
      chip.setAttribute('aria-label', (field === 'agenda' ? 'agenda' : 'goals') + (L.length ? ', ' + L.length + ' points' : ', add some'));
      chip.addEventListener('click', () => openListSheet(b, field, from));
    }

    // tap the length to open a picker under the row
    const how = document.createElement('button');
    how.type = 'button';
    how.className = 'how' + (customFor === i ? ' open' : '');
    how.textContent = minsLabel(len);
    how.setAttribute('aria-label', 'how long: ' + minsLabel(len) + '. tap to change');
    how.setAttribute('aria-expanded', customFor === i);
    how.addEventListener('click', () => { customFor = (customFor === i) ? null : i; renderDay(); });
    {
      const nm = planMin(viewDay);
      const endMs = fromKey(viewDay).getTime() + (from + len) * 60000;
      if (!b.done && viewDay === planKey() && i === firstOpen && nm >= from && nm < from + len) {
        how.classList.add('live');
        how.dataset.end = endMs;
        how.textContent = fmtLeft(endMs - Date.now());
      } else if (!b.done && viewDay === planKey() && i === firstOpen && nm >= from + len) {
        // the block you are actually on has run past its planned end: count up how far over
        how.classList.add('live', 'over');
        how.dataset.end = endMs;
        how.textContent = '+' + fmtIn(Date.now() - endMs);
      }
    }

    const bin = document.createElement('button');
    bin.className = 'bin';
    bin.type = 'button';
    bin.textContent = '\u00d7';
    bin.setAttribute('aria-label', 'remove this block');
    bin.addEventListener('click', () => {
      const gone = day.blocks[i];
      const where = viewDay;
      day.blocks.splice(i, 1);
      save(); renderDay(); renderHabits();
      offerUndo('"' + (gone.label || 'a block') + '"', () => {
        dayFor(where).blocks.splice(i, 0, gone);
        save(); renderDay(); renderHabits();
      });
    });

    row.append(when, tick, mid);
    // every row keeps the same slot, so ?, + and 1/3 all line up in one column
    const slot = document.createElement('span');
    slot.className = 'chipslot';
    if (chip) slot.appendChild(chip);
    row.appendChild(slot);
    row.append(how, bin);
    if (extra.childNodes.length) row.appendChild(extra);
    sheet.appendChild(row);
    holdToAdd(row, day, i, firstOpen);
    if (customFor === i) sheet.appendChild(lengthPicker(b, from, len));

  });

  clearInterval(nowTimer);
  focusNudge(day);
  if (!sortingDay && !day.planSnap && viewDay >= planKey() && day.blocks.some(b => !b.done)) {
    const go = document.createElement('button');
    go.type = 'button'; go.className = 'pl-start';
    go.innerHTML = '<b>Plan my day</b><span>order, lengths, then finish \u203a</span>';
    go.addEventListener('click', () => { sortingDay = true; sortingKey = viewDay; renderDay(); window.scrollTo(0, 0); });
    blockList.appendChild(go);
  }
  if (!sortingDay && viewDay === planKey()) {
    const y = shiftKey(viewDay, -1), yd = state.days[y];
    const yLeft = yd ? yd.blocks.filter(b => !b.done).length : 0;
    if (yLeft) {
      const strip = document.createElement('button');
      strip.type = 'button';
      strip.className = 'nc-ystrip';
      strip.innerHTML = '<span>Yesterday</span><b>' + yLeft + ' not ticked \u203a</b>';
      strip.addEventListener('click', () => { viewDay = y; renderDay(); window.scrollTo(0, 0); });
      blockList.appendChild(strip);
    }
    if (day.blocks.length) blockList.appendChild(nowCard(day));
  } else if (!sortingDay && viewDay < planKey() && day.blocks.some(b => !b.done)) {
    blockList.appendChild(pastCard(day));
  }
  blockList.appendChild(sheet);
  justTicked = null;
  if (listSheet) paintListSheet();

  // size them once they are on the page and have a real scrollHeight
  for (const el of growing) grow(el);
  // sizes change once the font arrives, so measure again then
  if (document.fonts) document.fonts.ready.then(() => { for (const el of growing) if (el.isConnected) grow(el); });

  if (sortingDay) attachDrag(sheet);

  if (!sortingDay && day.blocks.length && day.blocks.every(b => b.done)) {
    const card = document.createElement('div');
    card.className = 'allclear studs';
    card.style.setProperty('--accent', 'var(--pink)');

    const p2 = document.createElement('p');
    p2.textContent = 'that is the whole day done. plan the next one?';

    const go = document.createElement('button');
    go.className = 'brick';
    go.type = 'button';
    go.style.width = '100%';
    go.style.padding = '12px';
    go.textContent = 'plan tomorrow';
    go.addEventListener('click', () => {
      viewDay = shiftKey(viewDay, 1);
      sortingDay = false;
      renderDay();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    const sum = document.createElement('button');
    sum.className = 'brick flat';
    sum.type = 'button';
    sum.style.cssText = 'width:100%;padding:12px;margin-top:8px';
    sum.textContent = 'see how today went';
    sum.addEventListener('click', () => daySummary(viewDay));
    card.append(p2, go, sum);
    blockList.appendChild(card);
  }
  blockList.style.paddingBottom = sortingDay ? '72px' : '';

  const arr = document.createElement('button');
  arr.className = 'arrange' + (sortingDay ? ' on' : '');
  arr.type = 'button';
  arr.textContent = sortingDay ? 'Finish plan' : 'plan my day';
  if (sortingDay) {
    arr.className = 'lf-btn main pl-finish';
    const tip = document.createElement('p');
    tip.className = 'hint pl-tip';
    tip.textContent = 'Hold a block and drag it. Or tap its number and type where it goes.';
    blockList.appendChild(tip);
  }
  arr.addEventListener('click', () => {
    if (sortingDay) finishPlan(day);
    else { sortingDay = true; sortingKey = viewDay; customFor = null; renderDay(); }
  });

  if (sortingDay) {
    blockList.appendChild(arr);
  } else {
    const tools = document.createElement('div');
    tools.className = 'viewtools';

    const squash = document.createElement('button');
    squash.className = 'arrange';
    squash.type = 'button';
    squash.textContent = compactDay ? 'roomy' : 'compact';
    squash.setAttribute('aria-label', compactDay ? 'show the full rows' : 'fit more on screen');
    squash.addEventListener('click', () => {
      compactDay = !compactDay;
      state.compact = compactDay;
      save(); renderDay();
    });

    arr.textContent = 'Reorder';      // always a way in: reorder, then Finish plan
    tools.append(arr, squash);
    // alarms: a web app can't set iPhone alarms, so hand the times to a Shortcut that can
    const ups = upcomingStarts(day);
    if (viewDay === planKey() && ups.length) {
      const al = document.createElement('button');
      al.className = 'arrange';
      al.type = 'button';
      al.textContent = 'alarms';
      al.setAttribute('aria-label', 'set iPhone alarms for the blocks still to come');
      al.addEventListener('click', () => alarmSheet(ups));
      tools.append(al);
    }
    blockList.appendChild(tools);
  }

  document.getElementById('block-add').hidden = false;

  const mins = at - toMins(day.start);
  const total = document.getElementById('total');
  total.textContent = dur(mins) + ' planned · ends ' + clock(at);

  // where you are inside the plan, right now
  const old = document.getElementById('clockline');
  if (old) old.remove();

  if (viewDay === planKey()) {
    const line = document.createElement('div');
    line.className = 'clockline';
    line.id = 'clockline';

    const startM = toMins(day.start);
    const endM = at;
    const nowM = planMin(viewDay);

    if (nowM < startM)     line.innerHTML = 'starts in <b>' + dur(startM - nowM) + '</b>';
    else if (nowM >= endM) line.innerHTML = 'the plan ended <b>' + dur(nowM - endM) + '</b> ago';
    else                   line.innerHTML = '<b>' + dur(nowM - startM) + '</b> gone · <b>' +
                                            dur(endM - nowM) + '</b> left';

    total.parentNode.insertBefore(line, total.nextSibling);
  }
}

function setStart(mins) {
  const day = dayFor(viewDay);
  day.start = hhmm(mins);
  day.touched = true;          // stop the clock overwriting your choice
  save(); renderDay();
}

// the phone's own time wheel; value is always "HH:MM"
function commitStart() {
  const v = startInput.value;
  if (!/^\d{2}:\d{2}/.test(v)) { renderDay(); return; }   // cleared, put it back
  if (v.slice(0, 5) === dayFor(viewDay).start) return;
  setStart(toMins(v.slice(0, 5)));
}

startInput.addEventListener('change', () => { if (document.activeElement !== startInput) commitStart(); });   // while typing, wait for blur
document.getElementById('day-undo').addEventListener('click', undoDay);
