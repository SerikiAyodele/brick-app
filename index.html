// drag to reorder, pointer events so it works with a finger
function attachDrag(sheet) {
  const rows = Array.from(sheet.children);
  if (rows.length < 2) return;

  let held = null, startY = 0, rowH = 0, from = 0, to = 0;

  rows.forEach((row, i) => {
    row.addEventListener('pointerdown', e => {
      if (!e.target.closest('.grip')) return;      // only the handle starts a drag
      held = row;
      from = to = i;
      startY = e.clientY;
      rowH = row.getBoundingClientRect().height;
      row.setPointerCapture(e.pointerId);
      row.classList.add('dragging');
      rows.forEach(r => { if (r !== row) r.classList.add('shifting'); });
      e.preventDefault();
    });

    row.addEventListener('pointermove', e => {
      if (held !== row) return;
      const dy = e.clientY - startY;
      row.style.transform = 'translateY(' + dy + 'px)';

      let next = from + Math.round(dy / rowH);
      next = Math.max(0, Math.min(rows.length - 1, next));
      if (next === to) return;
      to = next;

      rows.forEach((r, j) => {
        if (r === row) return;
        let shift = 0;
        if (from < to && j > from && j <= to) shift = -rowH;
        if (from > to && j >= to && j < from) shift = rowH;
        r.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
      });
    });

    const drop = () => {
      if (held !== row) return;
      held = null;
      row.classList.remove('dragging');
      rows.forEach(r => { r.classList.remove('shifting'); r.style.transform = ''; });
      moveBlockTo(from, to);
    };

    row.addEventListener('pointerup', drop);
    row.addEventListener('pointercancel', drop);
  });
}

function moveBlock(i, by) {
  const blocks = dayFor(viewDay).blocks;
  const j = i + by;
  if (j < 0 || j >= blocks.length) return;
  blocks.splice(j, 0, blocks.splice(i, 1)[0]);
  save();
  renderDay();
}

// one goal for the day: asked once each new day, then shown at the top
let dayGoalEditing = false;
function renderDayGoal() {
  const box = document.getElementById('day-goal');
  const day = dayFor(viewDay);
  const isToday = viewDay === planKey();
  box.innerHTML = '';
  if (day.goal && !dayGoalEditing) {
    box.innerHTML = '<div class="dg-card' + (day.goalDone ? ' done' : '') + '"><button type="button" class="dg-tick" aria-label="' + (day.goalDone ? 'not done yet' : 'done') + '">\u2713</button>' +
      '<div><span>' + (isToday ? 'Today\u2019s one goal' : viewDay === shiftKey(planKey(), 1) ? 'Tomorrow\u2019s one goal' : 'One goal') + '</span><b></b></div><button type="button" class="dg-edit">Edit</button></div>';
    box.querySelector('b').textContent = day.goal;
    box.querySelector('.dg-tick').addEventListener('click', () => { day.goalDone = !day.goalDone; save(); renderDayGoal(); });
    box.querySelector('.dg-edit').addEventListener('click', () => { dayGoalEditing = true; renderDayGoal(); });
    return;
  }
  // ask on today and on days ahead, so you can set tomorrow's goal while you plan it
  if (viewDay < planKey() && !dayGoalEditing) return;
  if (day.goalSkip && !dayGoalEditing) return;
  const ahead = viewDay > planKey();
  const dayName = viewDay === shiftKey(planKey(), 1) ? 'tomorrow' : cap(FULL[fromKey(viewDay).getDay()]);

  // ideas: this week's big goal actions not done yet, and yesterday's goal if it was missed
  const ideas = [];
  for (const k of ['health', 'wealth', 'love', 'self']) {
    for (const b of (typeof bigsOf === 'function' ? bigsOf(k) : [])) { const A = weekAction(b); if (A && !A.done) ideas.push(A.text); }
  }
  const yd = state.days[shiftKey(viewDay, -1)];
  if (yd && yd.goal && !yd.goalDone) ideas.unshift(yd.goal);
  const uniq = [...new Set(ideas)].slice(0, 3);

  box.innerHTML = '<div class="dg-ask"><b>' + (dayGoalEditing ? 'Change this day\u2019s goal' : ahead ? 'One goal for ' + dayName + '?' : 'New day. What\u2019s your one goal today?') + '</b>' +
    '<div class="dg-in"><input type="text" maxlength="100" placeholder="what makes today a win?"><button type="button" class="lf-btn main">Set</button></div>' +
    (uniq.length ? '<div class="dg-ideas">' + uniq.map(t => '<button type="button" data-t="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div>' : '') +
    '<button type="button" class="dg-skip">' + (dayGoalEditing ? 'Cancel' : ahead ? 'Later' : 'Not today') + '</button></div>';
  const inp = box.querySelector('input');
  inp.value = dayGoalEditing ? (day.goal || '') : '';
  const set = t => { t = (t || '').trim(); if (!t) { inp.focus(); return; } day.goal = t; day.goalDone = false; day.goalSkip = false; dayGoalEditing = false; save(); renderDayGoal(); };
  box.querySelector('.lf-btn').addEventListener('click', () => set(inp.value));
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') set(inp.value); });
  box.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => set(b.dataset.t)));
  box.querySelector('.dg-skip').addEventListener('click', () => { if (dayGoalEditing) dayGoalEditing = false; else day.goalSkip = true; save(); renderDayGoal(); });
}

function renderDay() {
  renderDayGoal();
  renderCarry();
  const day = dayFor(viewDay);
  const d = fromKey(viewDay);
  const isToday = viewDay === planKey();

  document.getElementById('day-title').innerHTML =
    (isToday ? 'today' : FULL[d.getDay()]) +
    '<small>' + FULL[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + '</small>';

  // follow the clock only until you plan something or set it yourself
  if (!day.blocks.length && !day.touched && isToday) {
    day.start = nowHHMM();
    undoing = true; save(); undoing = false;   // the clock moving is not an edit
    daySnap = null;
  }

  startInput.value = hhmm(toMins(day.start));
  if (!daySnap || daySnap.k !== viewDay) { try { daySnap = snapNow(); } catch {} }
  updateUndo();
  blockList.innerHTML = '';

  if (!day.blocks.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'nothing planned';
    blockList.appendChild(e);
    document.getElementById('total').textContent = '';
    document.getElementById('block-add').hidden = false;
    sortingDay = false;
    return;
  }

  // you work down the list in order, so done blocks are always the top of it
  let firstOpen = day.blocks.findIndex(b => !b.done);
  if (firstOpen === -1) firstOpen = day.blocks.length;

  let at = toMins(day.start);

  const growing = [];

  const sheet = document.createElement('div');
  sheet.className = 'sheet' + (compactDay && !sortingDay ? ' compact' : '');

  day.blocks.forEach((b, i) => {
    const len  = Number(b.mins) || 60;   // guard against anything odd in saved data
    const from = at;
    at = at + len;

    const h = habitNamed(b.label);

    const row = document.createElement('div');
    row.className = 'line' + (b.done ? ' ticked' : '');
    row.dataset.i = i;

    const when = document.createElement('div');
    when.className = 'at';
    when.innerHTML = clock(from) + '<small class="endat">' + clock(at) + '</small>';
    when.title = 'tap to change how long this runs';
    when.classList.add('tapme');
    when.addEventListener('click', () => { customFor = customFor === i ? null : i; renderDay(); });

    const locked = !b.done && i !== firstOpen;
    if (locked) row.classList.add('locked');

    // a block cannot be ticked until its time is up.
    // future days are all too early; past days are fine (catching up).
    const tk = planKey();
    const nowMin = planMin(viewDay);
    const early = !b.done && (viewDay > tk || (viewDay === tk && nowMin < from + len));
    if (early && !locked) row.classList.add('early');

    if (!sortingDay) {
      if (i === justTicked) row.classList.add('justdone');
      if (i === firstOpen && !early) row.classList.add('next');
      if (justTicked !== null && i === justTicked + 1) row.classList.add('arrive');
    }

    const tick = document.createElement('button');
    tick.className = 'tick' + (b.done ? ' on' : '');
    tick.type = 'button';
    tick.textContent = '\u2713';
    tick.disabled = locked;
    tick.setAttribute('aria-label',
      locked ? 'finish the block above first'
             : early ? 'ends at ' + clock(from + len) + ', you can tick it then'
             : (b.done ? 'mark as not done' : 'mark as done'));

    // done early: hold the circle of a block you have started. it ends now,
    // so everything after it moves up. deliberate, so a stray tap can't do it.
    if (early && !locked && viewDay === tk && nowMin >= from) {
      let hold = null;
      const stop = () => { clearTimeout(hold); hold = null; tick.classList.remove('holding'); };
      tick.addEventListener('pointerdown', () => {
        tick.classList.add('holding');
        hold = setTimeout(() => {
          hold = null; tick.classList.remove('holding'); tick._held = true;
          try { navigator.vibrate && navigator.vibrate(15); } catch {}
          b.mins = Math.max(5, nowMin - from);
          b.done = true; b.early = true;
          if (h && !h.marks.includes(viewDay)) h.marks.push(viewDay);
          justTicked = i;
          save(); renderDay(); renderHabits();
          if (day.blocks.every(x => x.done)) setTimeout(() => daySummary(viewDay), 450);
          else setTimeout(() => askMoodAfter(b), 500);
        }, 650);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => tick.addEventListener(ev, stop));
      tick.addEventListener('contextmenu', e => e.preventDefault());
    }

    tick.addEventListener('click', () => {
      if (locked) return;
      if (tick._held) { tick._held = false; return; }
      if (early) {
        // say why, briefly, without redrawing the page
        row.classList.remove('nope'); void row.offsetWidth; row.classList.add('nope');
        let msg = mid.querySelector('.toosoon');
        if (!msg) { msg = document.createElement('span'); msg.className = 'toosoon'; mid.appendChild(msg); }
        const started = viewDay === tk && nowMin >= from;
        msg.textContent = viewDay !== tk ? 'you can tick this on the day'
                        : started ? 'done early? hold the circle' : 'you can tick this at ' + clock(from + len);
        clearTimeout(msg._t);
        msg._t = setTimeout(() => msg.remove(), 2600);
        return;
      }

      if (b.done) {
        // stepping back also clears everything after it
        for (let j = i; j < day.blocks.length; j++) {
          const bl = day.blocks[j];
          if (!bl.done) continue;
          bl.done = false;
          const hj = habitNamed(bl.label);
          if (hj) {
            const at2 = hj.marks.indexOf(viewDay);
            if (at2 > -1) hj.marks.splice(at2, 1);
          }
        }
      } else {
        b.done = true;
        if (h && !h.marks.includes(viewDay)) h.marks.push(viewDay);
        justTicked = i;               // so the render can animate it
      }

      save(); renderDay(); renderHabits();
      if (!b.done) return;
      if (day.blocks.every(x => x.done)) setTimeout(() => daySummary(viewDay), 450);   // that was the last one
      else setTimeout(() => askMoodAfter(b), 500);
    });

    if (sortingDay) {
      row.className = 'line sorting';

      const grip = document.createElement('span');
      grip.className = 'grip';
      grip.textContent = '\u2261';

      const name = document.createElement('div');
      name.className = 'fixed';
      name.textContent = b.label || 'unnamed block';

      const moves = document.createElement('span');
      moves.className = 'moves';

      const up = document.createElement('button');
      up.className = 'move'; up.type = 'button'; up.textContent = '\u2191';
      up.setAttribute('aria-label', 'move up');
      up.disabled = i === 0;
      up.addEventListener('click', () => moveBlock(i, -1));

      const dn = document.createElement('button');
      dn.className = 'move'; dn.type = 'button'; dn.textContent = '\u2193';
      dn.setAttribute('aria-label', 'move down');
      dn.disabled = i === day.blocks.length - 1;
      dn.addEventListener('click', () => moveBlock(i, 1));

      moves.append(up, dn);
      row.append(when, grip, name, moves);
      sheet.appendChild(row);
      return;
    }

    const mid = document.createElement('div');
    mid.className = 'mid';

    // the name is a button: tap it to open the naming panel (type, or pick)
    const what = document.createElement('button');
    what.type = 'button';
    what.className = 'what what-btn' + ((b.label || '').trim() ? '' : ' empty');
    what.textContent = (b.label || '').trim() || 'What\u2019s this?';
    what.setAttribute('aria-label', 'name this block, now ' + ((b.label || '').trim() || 'empty'));
    what.addEventListener('click', () => openNameSheet(b));
    if (focusNew === i) { focusNew = null; setTimeout(() => openNameSheet(b), 60); }    // a new block asks straight away
    mid.appendChild(what);

    if (h) {
      const isa = document.createElement('span');
      isa.className = 'isa';
      isa.style.setProperty('--c', h.color || PALETTE[0]);
      isa.innerHTML = '<i></i>habit';
      mid.appendChild(isa);
    } else if ((b.label || '').trim().length > 1) {
      const track = document.createElement('button');
      track.className = 'track';
      track.type = 'button';
      track.textContent = 'track this as a habit';
      track.addEventListener('click', () => {
        const name = b.label.trim();
        addHabit(name.charAt(0).toUpperCase() + name.slice(1), b.done ? [viewDay] : []);
      });
      mid.appendChild(track);
    }

    // goals and agendas live in a panel, opened from a small chip on the row
    // (and from the Now card when it is their time)
    const extra = document.createElement('div');
    extra.className = 'line-extra';
    let chip = null;
    const field = b.meeting ? 'agenda' : outcomeField(b.label);
    if (field) {
      const L = b[field] || [];
      chip = document.createElement('button');
      chip.type = 'button';
      // work with no outcome is unclear work: flag it until it says what it will finish
      const unclear = field === 'goals' && !L.length && !b.done;
      chip.className = 'addlist' + (L.length ? ' has' : '') + (unclear ? ' flag' : '');
      chip.textContent = L.length ? L.filter(x => x.done).length + '/' + L.length : unclear ? '?' : '+';
      if (unclear) chip.setAttribute('aria-label', 'no outcome yet, tap to add what you will finish');
      chip.setAttribute('aria-label', (field === 'agenda' ? 'agenda' : 'goals') + (L.length ? ', ' + L.length + ' points' : ', add some'));
      chip.addEventListener('click', () => openListSheet(b, field, from));
    }

    // tap the length to open a picker under the row
    const how = document.createElement('button');
    how.type = 'button';
    how.className = 'how' + (customFor === i ? ' open' : '');
    how.textContent = minsLabel(len);
    how.setAttribute('aria-label', 'how long: ' + minsLabel(len) + '. tap to change');
    how.setAttribute('aria-expanded', customFor === i);
    how.addEventListener('click', () => { customFor = (customFor === i) ? null : i; renderDay(); });
    {
      const nm = planMin(viewDay);
      const endMs = fromKey(viewDay).getTime() + (from + len) * 60000;
      if (!b.done && viewDay === planKey() && i === firstOpen && nm >= from && nm < from + len) {
        how.classList.add('live');
        how.dataset.end = endMs;
        how.textContent = fmtLeft(endMs - Date.now());
      } else if (!b.done && viewDay === planKey() && i === firstOpen && nm >= from + len) {
        // the block you are actually on has run past its planned end: count up how far over
        how.classList.add('live', 'over');
        how.dataset.end = endMs;
        how.textContent = '+' + fmtIn(Date.now() - endMs);
      }
    }

    const bin = document.createElement('button');
    bin.className = 'bin';
    bin.type = 'button';
    bin.textContent = '\u00d7';
    bin.setAttribute('aria-label', 'remove this block');
    bin.addEventListener('click', () => {
      const gone = day.blocks[i];
      const where = viewDay;
      day.blocks.splice(i, 1);
      save(); renderDay(); renderHabits();
      offerUndo('"' + (gone.label || 'a block') + '"', () => {
        dayFor(where).blocks.splice(i, 0, gone);
        save(); renderDay(); renderHabits();
      });
    });

    row.append(when, tick, mid);
    // every row keeps the same slot, so ?, + and 1/3 all line up in one column
    const slot = document.createElement('span');
    slot.className = 'chipslot';
    if (chip) slot.appendChild(chip);
    row.appendChild(slot);
    row.append(how, bin);
    if (extra.childNodes.length) row.appendChild(extra);
    sheet.appendChild(row);
    holdToAdd(row, day, i, firstOpen);
    if (customFor === i) sheet.appendChild(lengthPicker(b, from, len));

  });

  clearInterval(nowTimer);
  focusNudge(day);
  if (!sortingDay && viewDay === planKey()) {
    const y = shiftKey(viewDay, -1), yd = state.days[y];
    const yLeft = yd ? yd.blocks.filter(b => !b.done).length : 0;
    if (yLeft) {
      const strip = document.createElement('button');
      strip.type = 'button';
      strip.className = 'nc-ystrip';
      strip.innerHTML = '<span>Yesterday</span><b>' + yLeft + ' not ticked \u203a</b>';
      strip.addEventListener('click', () => { viewDay = y; renderDay(); window.scrollTo(0, 0); });
      blockList.appendChild(strip);
    }
    if (day.blocks.length) blockList.appendChild(nowCard(day));
  } else if (!sortingDay && viewDay < planKey() && day.blocks.some(b => !b.done)) {
    blockList.appendChild(pastCard(day));
  }
  blockList.appendChild(sheet);
  justTicked = null;
  if (listSheet) paintListSheet();

  // size them once they are on the page and have a real scrollHeight
  for (const el of growing) grow(el);
  // sizes change once the font arrives, so measure again then
  if (document.fonts) document.fonts.ready.then(() => { for (const el of growing) if (el.isConnected) grow(el); });

  if (sortingDay) attachDrag(sheet);

  if (!sortingDay && day.blocks.length && day.blocks.every(b => b.done)) {
    const card = document.createElement('div');
    card.className = 'allclear studs';
    card.style.setProperty('--accent', 'var(--pink)');

    const p2 = document.createElement('p');
    p2.textContent = 'that is the whole day done. plan the next one?';

    const go = document.createElement('button');
    go.className = 'brick';
    go.type = 'button';
    go.style.width = '100%';
    go.style.padding = '12px';
    go.textContent = 'plan tomorrow';
    go.addEventListener('click', () => {
      viewDay = shiftKey(viewDay, 1);
      sortingDay = false;
      renderDay();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    const sum = document.createElement('button');
    sum.className = 'brick flat';
    sum.type = 'button';
    sum.style.cssText = 'width:100%;padding:12px;margin-top:8px';
    sum.textContent = 'see how today went';
    sum.addEventListener('click', () => daySummary(viewDay));
    card.append(p2, go, sum);
    blockList.appendChild(card);
  }
  blockList.style.paddingBottom = sortingDay ? '72px' : '';

  const arr = document.createElement('button');
  arr.className = 'arrange' + (sortingDay ? ' on' : '');
  arr.type = 'button';
  arr.textContent = sortingDay ? '\u2713 done' : 'arrange';
  if (sortingDay) {
    const tip = document.createElement('p');
    tip.className = 'hint';
    tip.style.margin = '12px 0 0';
    tip.textContent = 'drag the \u2261 handle, or use the arrows.';
    blockList.appendChild(tip);
  }
  arr.addEventListener('click', () => { sortingDay = !sortingDay; renderDay(); });

  if (sortingDay) {
    blockList.appendChild(arr);
  } else {
    const tools = document.createElement('div');
    tools.className = 'viewtools';

    const squash = document.createElement('button');
    squash.className = 'arrange';
    squash.type = 'button';
    squash.textContent = compactDay ? 'roomy' : 'compact';
    squash.setAttribute('aria-label', compactDay ? 'show the full rows' : 'fit more on screen');
    squash.addEventListener('click', () => {
      compactDay = !compactDay;
      state.compact = compactDay;
      save(); renderDay();
    });

    tools.append(arr, squash);
    // alarms: a web app can't set iPhone alarms, so hand the times to a Shortcut that can
    const ups = upcomingStarts(day);
    if (viewDay === planKey() && ups.length) {
      const al = document.createElement('button');
      al.className = 'arrange';
      al.type = 'button';
      al.textContent = 'alarms';
      al.setAttribute('aria-label', 'set iPhone alarms for the blocks still to come');
      al.addEventListener('click', () => alarmSheet(ups));
      tools.append(al);
    }
    blockList.appendChild(tools);
  }

  document.getElementById('block-add').hidden = sortingDay;

  const mins = at - toMins(day.start);
  const total = document.getElementById('total');
  total.textContent = dur(mins) + ' planned · ends ' + clock(at);

  // where you are inside the plan, right now
  const old = document.getElementById('clockline');
  if (old) old.remove();

  if (viewDay === planKey()) {
    const line = document.createElement('div');
    line.className = 'clockline';
    line.id = 'clockline';

    const startM = toMins(day.start);
    const endM = at;
    const nowM = planMin(viewDay);

    if (nowM < startM)     line.innerHTML = 'starts in <b>' + dur(startM - nowM) + '</b>';
    else if (nowM >= endM) line.innerHTML = 'the plan ended <b>' + dur(nowM - endM) + '</b> ago';
    else                   line.innerHTML = '<b>' + dur(nowM - startM) + '</b> gone · <b>' +
                                            dur(endM - nowM) + '</b> left';

    total.parentNode.insertBefore(line, total.nextSibling);
  }
}

function setStart(mins) {
  const day = dayFor(viewDay);
  day.start = hhmm(mins);
  day.touched = true;          // stop the clock overwriting your choice
  save(); renderDay();
}

// the phone's own time wheel; value is always "HH:MM"
function commitStart() {
  const v = startInput.value;
  if (!/^\d{2}:\d{2}/.test(v)) { renderDay(); return; }   // cleared, put it back
  if (v.slice(0, 5) === dayFor(viewDay).start) return;
  setStart(toMins(v.slice(0, 5)));
}

startInput.addEventListener('change', commitStart);
document.getElementById('day-undo').addEventListener('click', undoDay);
document.getElementById('show-toggle').addEventListener('click', () => { if (showOn()) exitShow(); else startShow(); });
document.getElementById('show-exit').addEventListener('click', exitShow);
document.getElementById('focus-close').addEventListener('click', closeFocus);
document.getElementById('focus-mood').addEventListener('click', roomMood);
document.getElementById('focus-done').addEventListener('click', closeFocus);
startInput.addEventListener('blur', commitStart);

/* =========== check in =========== */

const MOODS = [
  { k: 'good',        e: '\u{1F642}', c: '#93bf7f' },
  { k: 'okay',        e: '\u{1F610}', c: '#86b9d9' },
  { k: 'focused',     e: '\u{1F3AF}', c: '#d9718e' },
  { k: 'unfocused',   e: '\u{1F635}\u200D\u{1F4AB}', c: '#9aa6b8' },
  { k: 'calm',        e: '\u{1F343}', c: '#93bf7f' },
  { k: 'tired',       e: '\u{1F634}', c: '#a99bd4' },
  { k: 'bored',       e: '\u{1F644}', c: '#e8c46a' },
  { k: 'unmotivated', e: '\u{1F4A4}', c: '#8a7768' },
  { k: 'stressed',    e: '\u{1F300}', c: '#e3a27a' },
  { k: 'anxious',     e: '\u{1F32A}', c: '#e3a27a' },
  { k: 'low',         e: '\u{1F327}', c: '#a99bd4' }
];

/* ---- how do you feel, after a block ----
   when you tick a block on today's plan, a row of faces pops up. one tap
   saves it with what you just finished. at most once an hour, so it never nags. */
function askMoodAfter(b) {
  if (viewDay !== planKey()) return;
  const last = state.moods.slice().sort((a, c) => c.at - a.at)[0];
  if (last && Date.now() - last.at < MOOD_EVERY) return;
  let el = document.getElementById('mood-after');
  if (el) el.remove();
  el = document.createElement('div');
  el.id = 'mood-after';
  el.className = 'ma';
  el.innerHTML = '<div class="ma-top"><b>How do you feel?</b><button type="button" class="ma-x" aria-label="not now">✕</button></div>' +
    '<small>after ' + esc(b.label || 'that') + '</small>' +
    '<div class="ma-grid">' + MOODS.map(m => '<button type="button" data-m="' + m.k + '" style="--c:' + m.c + '"><span>' + m.e + '</span>' + m.k + '</button>').join('') + '</div>';
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  const close = () => { el.classList.remove('in'); setTimeout(() => el.remove(), 300); };
  const auto = setTimeout(close, 25000);
  el.querySelector('.ma-x').addEventListener('click', () => { clearTimeout(auto); close(); });
  el.querySelectorAll('[data-m]').forEach(btn => btn.addEventListener('click', () => {
    clearTimeout(auto);
    state.moods.push({ at: Date.now(), mood: btn.dataset.m, part: partOfDay(new Date().getHours()), note: '', after: b.label || '' });
    save();
    el.querySelector('.ma-grid').innerHTML = '<p class="ma-ok">' + MOODS.find(m => m.k === btn.dataset.m).e + ' saved</p>';
    setTimeout(close, 900);
    if (!document.getElementById('view-home').hidden) renderHome();
  }));
}

function partOfDay(h) {
  if (h < 12) return 'morning';
  if (h < 17) return 'afternoon';
  if (h < 21) return 'evening';
  return 'night';
}

let justLogged = null;   // mood key tapped a moment ago, so its chip can pop

function renderMood() {
  const now = new Date();
  const part = partOfDay(now.getHours());
  const t = todayKey();
  const today = state.moods.filter(x => key(new Date(x.at)) === t);

  document.getElementById('greet').textContent =
    part === 'night' ? 'Still up? How are you feeling?' : 'How are you this ' + part + '?';
  document.getElementById('mood-sub').textContent =
    today.length ? today.length + ' today' : clock(now.getHours() * 60 + now.getMinutes());

  const slot = document.getElementById('mood-slot');
  slot.innerHTML = '';

  const tally = {};
  for (const x of today) tally[x.mood] = (tally[x.mood] || 0) + 1;

  const grid = document.createElement('div');
  grid.className = 'md-grid';
  for (const m of MOODS) {
    const b = document.createElement('button');
    b.className = 'md-chip' + (justLogged === m.k ? ' pop' : '');
    b.type = 'button';
    b.style.setProperty('--c', m.c);
    b.innerHTML = '<span class="md-e">' + m.e + '</span><span class="md-l">' + m.k + '</span>' +
                  (tally[m.k] ? '<span class="md-n">' + tally[m.k] + '</span>' : '');
    b.setAttribute('aria-label', 'log ' + m.k + (tally[m.k] ? ', ' + tally[m.k] + ' today' : ''));
    b.addEventListener('click', () => {
      state.moods.push({ at: Date.now(), mood: m.k, part, note: '' });
      justLogged = m.k;
      save(); renderMood();
    });
    grid.appendChild(b);
  }
  slot.appendChild(grid);
  justLogged = null;

  const pick = document.getElementById('mood-range');
  pick.innerHTML = '';
  for (const r of [[1, 'Today'], [7, '7 days'], [30, '30 days']]) {
    const b = document.createElement('button');
    b.className = 'md-seg-b' + (moodRange === r[0] ? ' on' : '');
    b.type = 'button';
    b.textContent = r[1];
    b.addEventListener('click', () => { moodRange = r[0]; renderMood(); });
    pick.appendChild(b);
  }

  // the note box opens under the chips when you tap an entry
  const entry = noteFor ? state.moods.find(x => x.at === noteFor) : null;
  if (entry) {
    const found = MOODS.find(x => x.k === entry.mood);
    const nb = document.createElement('div');
    nb.className = 'md-note';
    nb.innerHTML = '<label for="note-input">Note on <b>' + (found ? found.e + ' ' : '') + entry.mood + '</b></label>' +
      '<input id="note-input" type="text" maxlength="200" placeholder="what is going on? (optional)">' +
      '<div class="md-note-b"><button type="button" class="lf-btn main" data-a="save">Save</button>' +
      '<button type="button" class="lf-btn" data-a="skip">' + (entry.note ? 'Done' : 'Skip') + '</button></div>';
    const inp = nb.querySelector('input');
    inp.value = entry.note || '';
    nb.querySelector('[data-a=save]').addEventListener('click', () => { entry.note = inp.value.trim(); noteFor = null; save(); renderMood(); });
    nb.querySelector('[data-a=skip]').addEventListener('click', () => { noteFor = null; renderMood(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') nb.querySelector('[data-a=save]').click(); });
    slot.appendChild(nb);
    setTimeout(() => inp.focus(), 30);
  }

  renderMoodSum();
  renderMoodLog();
}

// the summary for the chosen range: the mood you felt most, and a strip of all of them
function renderMoodSum() {
  const box = document.getElementById('mood-sum');
  const keys = new Set();
  for (let i = 0; i < moodRange; i++) keys.add(shiftKey(todayKey(), -i));
  const list = state.moods.filter(m => keys.has(key(new Date(m.at))));
  if (!list.length) { box.innerHTML = ''; return; }

  const tally = {};
  for (const m of list) tally[m.mood] = (tally[m.mood] || 0) + 1;
  const used = MOODS.filter(m => tally[m.k]).sort((a, b) => tally[b.k] - tally[a.k]);
  const top = used[0];
  const good = ['good', 'calm', 'focused'].reduce((n, k) => n + (tally[k] || 0), 0);

  box.innerHTML = '<div class="md-sum">' +
    '<div class="md-sum-top"><span class="md-sum-e">' + top.e + '</span><div><b>Mostly ' + top.k + '</b>' +
    '<span>' + list.length + ' check-in' + (list.length > 1 ? 's' : '') + ' · ' + Math.round(good / list.length * 100) + '% good, calm or focused</span></div></div>' +
    '<div class="md-strip">' + used.map(m => '<i style="--c:' + m.c + ';flex:' + tally[m.k] + '" title="' + m.k + ' ' + tally[m.k] + '"></i>').join('') + '</div>' +
    '<div class="md-keys">' + used.slice(0, 5).map(m => '<span style="--c:' + m.c + '">' + m.k + ' ' + tally[m.k] + '</span>').join('') + '</div>' +
  '</div>';
}

function renderMoodLog() {
  const log = document.getElementById('mood-log');
  log.innerHTML = '';

  const keys = [];
  for (let i = 0; i < moodRange; i++) keys.push(shiftKey(todayKey(), -i));

  const byDay = {};
  for (const m of state.moods) {
    const k = key(new Date(m.at));
    if (keys.indexOf(k) === -1) continue;
    (byDay[k] = byDay[k] || []).push(m);
  }
  const filled = keys.filter(k => byDay[k] && byDay[k].length);

  if (!filled.length) {
    log.innerHTML = '<p class="md-empty">' +
      (moodRange === 1 ? 'Nothing yet today. Tap how you feel above.' : 'Nothing in the last ' + moodRange + ' days.') + '</p>';
    return;
  }

  for (const k of filled) {
    if (moodRange > 1) {
      const d = fromKey(k);
      const head = document.createElement('div');
      head.className = 'md-day';
      head.textContent = (k === todayKey()) ? 'Today'
                       : (k === shiftKey(todayKey(), -1)) ? 'Yesterday'
                       : cap(FULL[d.getDay()]) + ' ' + d.getDate() + ' ' + cap(MONTHS[d.getMonth()]);
      log.appendChild(head);
    }

    const card = document.createElement('div');
    card.className = 'md-list';
    for (const m of byDay[k].slice().sort((x, y) => y.at - x.at)) {
      const d = new Date(m.at);
      const found = MOODS.find(x => x.k === m.mood);

      const row = document.createElement('div');
      row.className = 'md-row';
      row.style.setProperty('--c', found ? found.c : '#d9718e');
      row.innerHTML = '<span class="md-t">' + clock(d.getHours() * 60 + d.getMinutes()) + '</span>' +
        '<span class="md-what"><b>' + (found ? found.e + ' ' : '') + esc(m.mood) + '</b>' +
        '<small' + (m.note ? ' class="priv"' : '') + '>' + (m.note ? esc(m.note) : 'add a note') + '</small></span>';
      if (!m.note) row.querySelector('small').classList.add('ghost');
      row.addEventListener('click', () => { noteFor = m.at; renderMood(); window.scrollTo({ top: 0, behavior: 'smooth' }); });

      const del = document.createElement('button');
      del.className = 'md-del';
      del.type = 'button';
      del.textContent = '×';
      del.setAttribute('aria-label', 'delete this check in');
      del.addEventListener('click', e => {
        e.stopPropagation();
        const at = state.moods.findIndex(x => x.at === m.at);
        const gone = state.moods[at];
        state.moods.splice(at, 1);
        if (noteFor === m.at) noteFor = null;
        save(); renderMood();
        offerUndo(gone.mood + ' check in', () => { state.moods.splice(at, 0, gone); save(); renderMood(); });
      });
      row.appendChild(del);
      card.appendChild(row);
    }
    log.appendChild(card);
  }
}

/* ---- backup ----
   save: your whole data as one .json file (share sheet on iPhone, so it can
   go to Files, iCloud or AirDrop). restore: pick that file, check it, confirm. */
function backupName() {
  const d = new Date();
  return 'brick-backup-' + key(d) + '.json';
}

async function saveBackup() {
  const body = JSON.stringify({ app: 'paper', version: 2, saved: new Date().toISOString(), data: state }, null, 1);
  const file = new File([body], backupName(), { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Backup' });
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file);
      a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }
    try { localStorage.setItem(KEY + '.backup', String(Date.now())); } catch {}
    showLastBackup();
  } catch (e) {
    if (e && e.name === 'AbortError') return;   // you closed the share sheet
    document.getElementById('bk-last').textContent = 'Could not save the backup. Try again.';
  }
}

function showLastBackup() {
  let t = null;
  try { t = Number(localStorage.getItem(KEY + '.backup')) || null; } catch {}
  const el = document.getElementById('bk-last');
  if (!el) return;
  if (!t) { el.textContent = 'No backup saved yet.'; return; }
  const days = Math.floor((Date.now() - t) / 86400000);
  el.textContent = 'Last backup: ' + (days === 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago') + '.';
}

function restoreFrom(file) {
  const box = document.getElementById('bk-confirm');
  const reader = new FileReader();
  reader.onload = () => {
    let d;
    try {
      const j = JSON.parse(reader.result);
      d = j && j.data ? j.data : j;
      if (!d || typeof d !== 'object' || !('days' in d) || !('food' in d)) throw new Error('not ours');
    } catch {
      box.innerHTML = '<p class="bk-err">That file is not a backup from this app.</p>';
      return;
    }
    const n = Object.keys(d.days || {}).length, f = (d.food || []).length, m = (d.moods || []).length;
    box.innerHTML = '<div class="bk-ask"><p>Replace what is on this phone with this backup?</p>' +
      '<small>' + n + ' planned days · ' + f + ' food entries · ' + m + ' moods</small>' +
      '<div class="bk-btns"><button type="button" class="lf-btn main" data-a="yes">Replace</button>' +
      '<button type="button" class="lf-btn" data-a="no">Cancel</button></div></div>';
    box.querySelector('[data-a=no]').addEventListener('click', () => { box.innerHTML = ''; });
    box.querySelector('[data-a=yes]').addEventListener('click', () => {
      try {
        localStorage.setItem(KEY + '.before-restore', JSON.stringify(state));   // one step back, just in case
        localStorage.setItem(KEY, JSON.stringify(d));
      } catch {}
      location.reload();
    });
  };
  reader.readAsText(file);
}

document.getElementById('bk-save').addEventListener('click', saveBackup);
document.getElementById('bk-file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) restoreFrom(f);
  e.target.value = '';
});

  body.innerHTML = '';

  const keys = rangeDays();
  const since = rangeStart();
  const label = (RANGES.find(x => x.k === range) || RANGES[1]).label;
  const n = keys.length;

  // one card: a name, a big number, a plain sentence saying what it means
  const card = (c, name, big, unit, explain, extra) => {
    const el = document.createElement('div');
    el.className = 'st-card';
    el.style.setProperty('--c', c);
    el.innerHTML = '<span class="st-name">' + name + '</span>' +
      (big !== null ? '<span class="st-big">' + big + (unit ? '<i>' + unit + '</i>' : '') + '</span>' : '') +
      '<p class="st-explain">' + explain + '</p>';
    if (extra) el.appendChild(extra);
    body.appendChild(el);
  };
  const bars = rows => {
    const ul = document.createElement('ul');
    ul.className = 'st-bars';
    const top = Math.max(1, ...rows.map(r => r.v));
    for (const r of rows) {
      const li = document.createElement('li');
      li.style.setProperty('--c', r.c);
      li.innerHTML = '<div><span>' + esc(r.name) + '</span><b>' + r.show + '</b></div><i><u style="width:' + Math.round(r.v / (r.max || top) * 100) + '%"></u></i>';
      ul.appendChild(li);
    }
    return ul;
  };

  // day plan
  let planned = 0, done = 0, daysPlanned = 0;
  for (const k of keys) {
    const d = state.days[k];
    if (!d || !d.blocks.length) continue;
    daysPlanned++; planned += d.blocks.length; done += d.blocks.filter(b => b.done).length;
  }
  card('#e38fa8', 'Day plan', planned ? Math.round(done / planned * 100) : 0, '%',
    planned ? 'You finished <b>' + done + ' of the ' + planned + '</b> blocks you planned. You planned <b>' + daysPlanned + ' of ' + n + '</b> days.'
            : 'Nothing planned in ' + label + ' yet. Plan a day and this shows how much of it you finish.');

  // gym
  let sessions = 0, lifts = 0;
  for (const k of keys) { const l = (state.gym && state.gym[k]) || []; if (l.length) { sessions++; lifts += l.length; } }
  card('#7daf86', 'Gym', sessions, sessions === 1 ? ' session' : ' sessions',
    sessions ? 'Days you ticked at least one exercise. <b>' + lifts + '</b> exercises in total, about <b>' + (sessions / (n / 7)).toFixed(1) + '</b> sessions a week.'
             : 'No exercises ticked in ' + label + '. Each day you tick one counts as a session.');

  // habits
  if (state.habits.length) {
    const set = new Set(keys);
    const rows = state.habits.map(h => { const hit = h.marks.filter(m => set.has(m)).length;
      return { name: h.name, v: hit, max: n, show: hit + ' / ' + n, c: h.color || '#d9718e' }; });
    const best = [...rows].sort((x, y) => y.v - x.v)[0];
    card('#8fb7d8', 'Habits', null, '',
      'How many of the last <b>' + n + '</b> days you did each one. Best: <b>' + esc(best.name) + '</b>, ' + Math.round(best.v / n * 100) + '% of days.', bars(rows));
  } else {
    card('#8fb7d8', 'Habits', null, '', 'Nothing tracked yet. Plan something on the day page and it can become a habit.');
  }

  // mood
  const tally = {};
  for (const m of state.moods) if (m.at >= since) tally[m.mood] = (tally[m.mood] || 0) + 1;
  const used = MOODS.filter(m => tally[m.k]).sort((a, b) => tally[b.k] - tally[a.k]);
  const checks = used.reduce((x, m) => x + tally[m.k], 0);
  if (used.length) {
    const good = ['good', 'calm', 'focused'].reduce((x, k) => x + (tally[k] || 0), 0);
    card('#86b9d9', 'Mood', checks, ' check-ins',
      'Most often you felt <b>' + used[0].k + '</b> (' + tally[used[0].k] + ' times). <b>' + Math.round(good / checks * 100) + '%</b> of check-ins were good, calm or focused.',
      bars(used.map(m => ({ name: m.e + ' ' + m.k, v: tally[m.k], show: String(tally[m.k]), c: m.c }))));
  } else {
    card('#86b9d9', 'Mood', 0, ' check-ins', 'No moods logged in ' + label + '. Tap a mood on the mood page to start.');
  }

  // food
  const bites = state.food.filter(f => f.at >= since);
  const byMeal = {};
  for (const f of bites) byMeal[f.meal] = (byMeal[f.meal] || 0) + 1;
  card('#e3a27a', 'Food', bites.length, bites.length === 1 ? ' entry' : ' entries',
    bites.length ? 'Things you logged eating or drinking, about <b>' + (bites.length / n).toFixed(1) + '</b> a day. The food page has patterns and how food links to mood.'
                 : 'Nothing logged in ' + label + '.',
    bites.length ? bars(MEALS.filter(m => byMeal[m.k]).map(m => ({ name: m.k, v: byMeal[m.k], show: String(byMeal[m.k]), c: m.c }))) : null);

  // tweets
  const caught = state.ideas.filter(i => i.at >= since);
  const acted = caught.filter(i => i.done).length;
  card('#6fa3c8', 'Tweets', caught.length, caught.length === 1 ? ' tweet' : ' tweets',
    caught.length ? 'Thoughts you posted to yourself. You acted on <b>' + acted + ' of ' + caught.length + '</b>, by tapping "acted on".'
                  : 'No tweets in ' + label + '.');
}

// an entry's kinds: from its words, plus cannabis if you said it was infused
function entryKinds(f) {
  const ks = foodKinds(f.what);
  if (f.infused === true && !ks.includes('cannabis')) ks.push('cannabis');
  if (f.infused === false) { const i = ks.indexOf('cannabis'); if (i > -1) ks.splice(i, 1); }
  return ks;
}

// words that might be an edible, so it is worth asking
const EDIBLE_RE = /\b(edibles?|gumm(y|ies)|brownies?|space ?cakes?|cookies?|chocolates?)\b/i;
const askInfused = f => f.infused === undefined && EDIBLE_RE.test(f.what) &&
                        /\bedibles?\b|gumm|brownie/i.test(f.what) && !foodKinds(f.what).includes('cannabis');

function foodKinds(text) {
  const t = String(text || '').toLowerCase();
  const out = [];
  for (const k in KINDS) if (KIND_RE[k].some(re => re.test(t))) out.push(k);
  // herbal tea and decaf have no caffeine
  if (/\b(decaf|herbal|chamomile|peppermint|rooibos|ginger tea|lemon tea)\b/.test(t)) {
    const i = out.indexOf('caffeine');
    if (i > -1) out.splice(i, 1);
  }
  return out;
}

const isDrink = f => f.meal === 'drink';
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function agoText(ms) {
  const m = Math.round(ms / 60000);
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '');
}

// returns goal keys found in the text, strongest first (most hits, then earliest)
function readGoal(text) {
  const t = ' ' + String(text).toLowerCase().replace(/[^a-z\s'-]/g, ' ').replace(/\s+/g, ' ') + ' ';
  const found = [];
  for (const k in GOAL_WORDS) {
    let hits = 0, first = Infinity;
    for (const w of GOAL_WORDS[k]) {
      const re = new RegExp('\\b' + w.replace(/ /g, '\\s+') + '\\b', 'g');
      let m;
      while ((m = re.exec(t))) { hits++; first = Math.min(first, m.index); }
    }
    if (hits) found.push({ k, hits, first });
  }
  found.sort((a, b) => b.hits - a.hits || a.first - b.first);
  return found.slice(0, 2).map(x => x.k);
}

function sayGoal(ks) {
  const parts = ks.map(k => GOAL_SAY[k]);
  return 'You want to ' + parts.join(', and ') + '.';
}

/* ---- how you felt, feel, and will feel ----
   each food step maps to a mood. a logged mood near the moment wins. */
const STEP_MOOD = [
  [/alert|strongest/, 'focused'], [/quick lift/, 'good'], [/dip|peckish/, 'tired'], [/slow or sleepy|heavy/, 'tired'],
  [/passing|worn off/, 'okay'], [/steady|full|digesting slowly/, 'calm'], [/hungry/, 'okay'], [/water helps/, 'focused'],
  [/relaxed/, 'calm'], [/tired or flat/, 'low'], [/kicking in/, 'calm'], [/wearing off/, 'tired']
];
function foodMoodAt(recent, t) {
  let best = null;
  for (const f of recent) {
    if (f.at > t) continue;
    for (const k of entryKinds(f)) {
      let step = null;
      for (const [m, text] of KINDS[k].steps) { const at = f.at + m * 60000; if (at <= t) step = { at, text }; }
      if (!step && t - f.at < 15 * 60000) step = { at: f.at, text: 'kicking in' };
      if (!step || t - step.at > 3 * 3600000) continue;
      if (!best || step.at > best.at) best = { ...step, f, k };
    }
  }
  if (!best) return null;
  const hit = STEP_MOOD.find(([re]) => re.test(best.text));
  return { mood: hit ? hit[1] : 'okay', why: best.text + ', from ' + best.f.what };
}
function moodMoments(recent, now) {
  const at = [now - 60 * 60000, now, now + 60 * 60000];
  const names = ['1h ago', 'Now', 'In 1h'];
  const rs = at.map((t, i) => {
    const logged = i < 2 ? state.moods.filter(m => Math.abs(m.at - t) <= (i === 0 ? 30 : 20) * 60000 && m.at <= now).sort((a, b) => Math.abs(a.at - t) - Math.abs(b.at - t))[0] : null;
    return logged ? { mood: logged.mood, why: 'you logged it' } : foodMoodAt(recent, t) || { mood: null, why: '' };
  });
  const cols = rs.map((r, i) => { const md = r.mood && MOODS.find(m => m.k === r.mood);
    return '<div class="mj' + (i === 1 ? ' now' : '') + '" style="--c:' + (md ? md.c : 'var(--muted)') + '"><span>' + (md ? md.e : '\u2022') + '</span>' +
           '<b>' + (r.mood || '\u2013') + '</b><small>' + names[i] + '</small></div>'; }).join('<i class="mj-line"></i>');
  // one line: why the next 15 minutes look the way they do
  const nx = rs[2], why = nx.why ? 'In 1h: ' + nx.why : '';
  return '<div class="mjs">' + cols + '</div>';
}

/* ---- eat next ----
   what to eat to feel a certain way, and roughly when you will feel it.
   it looks at the time, your goal and what you just had, and suggests
   foods you already eat when it can. */
function usualFoods(kind, n) {
  const tally = {};
  for (const f of state.food) {
    const ks = entryKinds(f);
    if (!ks.includes(kind) || ks.includes('carbs') || ks.includes('fried') || ks.includes('sugar')) continue;   // light things only
    const k = f.what.trim().toLowerCase(); tally[k] = (tally[k] || 0) + 1;
  }
  return Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, n).map(x => x[0]);
}
function foodsFor(kind, fallback) {
  const mine = usualFoods(kind, 2);
  const more = fallback.filter(x => !mine.includes(x));
  return mine.concat(more).slice(0, 2).join(' or ');
}

function eatNext(goal, recent, now) {
  const h = new Date(now).getHours();
  const within = (k, mins) => recent.some(f => entryKinds(f).includes(k) && now - f.at < mins * 60000);
  const lastMeal = state.food.filter(f => !isDrink(f) && f.at <= now).sort((a, b) => b.at - a.at)[0];
  const gap = lastMeal ? (now - lastMeal.at) / 3600000 : 99;
  const P = foodsFor('protein', ['eggs', 'beans', 'groundnuts', 'greek yogurt']);
  const F = foodsFor('fibre', ['a banana', 'oats', 'an apple', 'vegetables']);

  if (h >= 20) return { feel: 'sleep well', when: 'tonight', eat: 'nothing heavy now. If hungry, ' + foodsFor('fibre', ['a banana', 'yogurt']),
                        why: 'Big meals and caffeine late keep your body busy when it should be resting.' };
  if (within('sugar', 90)) return { feel: 'skip the sugar dip', when: 'in the next hour', eat: P,
                        why: 'Protein now slows the sugar crash that usually comes 60 to 90 minutes after something sweet.' };
  if (within('carbs', 90) || within('fried', 90)) return { feel: 'sharp again', when: 'in about an hour', eat: 'water and a 10 minute walk, then ' + F + ' later',
                        why: 'A heavy meal pulls energy into digestion. Water and a short walk help you come back sooner.' };
  if (gap >= 3.5 && h >= 7) return { feel: 'steady energy', when: 'in about 30 minutes', eat: P + ', with ' + F,
                        why: 'It has been ' + Math.floor(gap) + ' hours. Protein with fibre lifts you without a crash.' };
  const byGoal = {
    muscle: { feel: 'stronger after training', when: 'over the next few hours', eat: P, why: 'Protein spread across the day helps muscle repair.' },
    energy: { feel: 'steady energy', when: 'for the next 3 hours', eat: P + ' with ' + F, why: 'Protein and fibre release energy slowly.' },
    focus:  { feel: 'clear headed', when: 'within 30 minutes', eat: 'a glass of water, then ' + foodsFor('protein', ['groundnuts', 'eggs']), why: 'Even mild thirst blunts focus. A light protein snack keeps you level.' },
    sleep:  { feel: 'sleepy on time tonight', when: 'tonight', eat: h >= 12 ? 'no caffeine from now. ' + F + ' if hungry' : P + ' for breakfast', why: 'Caffeine lasts about 5 hours in your body.' },
    lighter:{ feel: 'light, not heavy', when: 'after your next meal', eat: 'vegetables with ' + P, why: 'Fibre and protein fill you up without the heavy feeling.' },
    sugar:  { feel: 'no cravings', when: 'this afternoon', eat: F + ' when a craving hits', why: 'Fruit gives sweetness with fibre, so no crash.' },
    gut:    { feel: 'easy digestion', when: 'over the day', eat: F + ' and a glass of water', why: 'Fibre and water keep your gut moving.' }
  };
  return byGoal[goal.k] || byGoal.energy;
}

function bodyStep(k, mins) {
  const st = BODY_STEPS[k];
  if (!st) return null;
  const hit = st.find(([m]) => mins < m);
  return hit ? hit[1] : null;
}
function eatNextHTML(goal, recent, now) {
  // what is happening inside you right now, from what you had, newest first, at most two
  const seen = new Set(), lines = [];
  for (const f of recent.slice().sort((a, b) => b.at - a.at)) {
    const mins = Math.floor((now - f.at) / 60000);
    for (const k of entryKinds(f)) {
      if (seen.has(k) || lines.length >= 2) continue;
      const t = bodyStep(k, mins);
      if (!t) continue;
      seen.add(k); lines.push([KINDS[k].e, t, f.what, mins]);
    }
  }
  const ago = m => m < 60 ? m + ' min ago' : Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '') + ' ago';
  const sci = lines.length ? '<p class="fh-sec">Inside you now</p>' + lines.map(([e, t, what, m]) =>

  // one nutrient for your goal; if you already had the first today, the second
  const today = foodIn([todayKey()]);

function renderMonth() {
  const box = document.getElementById('food-month');
  if (foodDay !== todayKey()) { box.innerHTML = ''; return; }

  const recent = state.food.filter(f => f.at >= since);
  const days = new Set(recent.map(f => key(new Date(f.at)))).size;
  if (days < 4) { box.innerHTML = ''; return; }
  const wk = n => n / days * 7;                       // per week
  const top = kind => {
    const t = {};
    for (const f of recent) if (entryKinds(f).includes(kind)) t[f.what.trim().toLowerCase()] = (t[f.what.trim().toLowerCase()] || 0) + 1;
    return Object.entries(t).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n, c]) => n + ' (' + c + '×)').join(', ');
  };
  const cnt = kind => recent.filter(f => entryKinds(f).includes(kind)).length;
  const meals = recent.filter(f => !isDrink(f));
  const proShare = meals.filter(f => entryKinds(f).includes('protein')).length / Math.max(1, meals.length);
  const noPro = (() => { const t = {}; for (const f of meals) if (!entryKinds(f).includes('protein')) t[f.what.trim().toLowerCase()] = (t[f.what.trim().toLowerCase()] || 0) + 1;
    return Object.entries(t).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n, c]) => n + ' (' + c + '×)').join(', '); })();
  const fibreDays = new Set(recent.filter(f => entryKinds(f).includes('fibre')).map(f => key(new Date(f.at)))).size;
  const lateCaf = recent.filter(f => entryKinds(f).includes('caffeine') && new Date(f.at).getHours() >= 15);
  const lateTop = (() => { const t = {}; for (const f of lateCaf) t[f.what.trim().toLowerCase()] = (t[f.what.trim().toLowerCase()] || 0) + 1;
    return Object.entries(t).sort((a, b) => b[1] - a[1]).map(([n, c]) => n + ' (' + c + '×)').join(', '); })();

  const rows = [];
  if (wk(cnt('sugar')) >= 5) rows.push(['bad', '⚡', 'More energy crashes and stronger sugar cravings', top('sugar')]);
  if (wk(cnt('fried')) >= 4) rows.push(['bad', '\u{1F9F1}', 'Heavier, slower digestion, and your weight may creep up', top('fried')]);
  if (wk(lateCaf.length) >= 3) rows.push(['bad', '\u{1F319}', 'Lighter sleep and more tired mornings', lateTop]);
  if (wk(cnt('alcohol')) >= 3) rows.push(['bad', '\u{1F327}', 'Flatter mood and poorer sleep', top('alcohol')]);
  if (meals.length >= 5 && proShare < 0.4) rows.push(['bad', '\u{1F4AA}', 'Slow progress at the gym, and hungry again sooner', 'meals without protein: ' + noPro]);
  if (fibreDays / days < 0.4) rows.push(['bad', '\u{1F33F}', 'Your gut may feel bloated or blocked', 'veg or fruit on only ' + fibreDays + ' of ' + days + ' days']);
  if (cnt('water') / days < 3) rows.push(['bad', '\u{1F4A7}', 'More tiredness and headaches', 'about ' + (cnt('water') / days).toFixed(1) + ' glasses of water a day']);

  if (!rows.length) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="mo-card"><div class="pl-head"><b>In a month, if you keep eating like this</b></div><ul>' +

  });
}

// one pattern from your own last 14 days, with the numbers behind it
function noticeFood() {
  const ks = []; for (let i = 0; i < 14; i++) ks.push(shiftKey(todayKey(), -i));
  const byDay = k => state.food.filter(f => key(new Date(f.at)) === k);
  const logged = ks.filter(k => byDay(k).length);
  if (logged.length < 4) return null;
  const hr = f => new Date(f.at).getHours();

  // skipping breakfast and how the afternoon feels
  const moodsOn = k => state.moods.filter(m => key(new Date(m.at)) === k && new Date(m.at).getHours() >= 12 && new Date(m.at).getHours() < 19);
  const low = m => ['tired', 'low', 'unmotivated', 'unfocused'].includes(m.mood);
  const skip = logged.filter(k => !byDay(k).some(f => !isDrink(f) && hr(f) < 11));
  const ate = logged.filter(k => byDay(k).some(f => !isDrink(f) && hr(f) < 11));
  const rate = days => { const m = days.flatMap(moodsOn); return m.length ? m.filter(low).length / m.length : null; };
  const rs = rate(skip), ra = rate(ate);
  if (skip.length >= 3 && ate.length >= 3 && rs !== null && ra !== null && rs - ra >= 0.3) {
    return { say: 'On days you skip breakfast, your afternoons feel more tired or low.',
             proof: Math.round(rs * 100) + '% of afternoon check-ins vs ' + Math.round(ra * 100) + '% on days you eat before 11.' };
  }
  // late caffeine
  const late = ks.slice(0, 7).filter(k => byDay(k).some(f => entryKinds(f).includes('caffeine') && hr(f) >= 15));
  if (late.length >= 3) return { say: 'Caffeine after 3pm on ' + late.length + ' of the last 7 days.', proof: 'It stays in your body for hours and can make sleep lighter.' };
  // water
  const glasses = ks.slice(0, 7).reduce((n, k) => n + byDay(k).filter(f => entryKinds(f).includes('water')).length, 0);
  if (logged.length >= 4 && glasses / 7 < 3) return { say: 'About ' + (glasses / 7).toFixed(1) + ' glasses of water a day this week.', proof: 'Low water often feels like tiredness or hunger.' };
  // fried food
  const fried = ks.slice(0, 7).reduce((n, k) => n + byDay(k).filter(f => entryKinds(f).includes('fried')).length, 0);
  if (fried >= 5) return { say: fried + ' fried things this week.', proof: 'They digest slowly and can leave you heavy for hours.' };
  return null;
}

  }
  const minsOf = t => { const d = new Date(t); return d.getHours() * 60 + d.getMinutes(); };
  const median = a => { const b = [...a].sort((x, y) => x - y); return b.length ? b[Math.floor(b.length / 2)] : null; };
  const byDay = {};
  for (const f of food) (byDay[key(new Date(f.at))] = byDay[key(new Date(f.at))] || []).push(f);
  const days = Object.keys(byDay);

  const tiles = [];
  const goal = myGoal();
  const meals = food.filter(f => !isDrink(f));
  const pro = meals.filter(f => has(f, 'protein')).length;
  tiles.push({ big: (meals.length ? Math.round(pro / meals.length * 100) : 0) + '<i>%</i>', name: 'Protein', cap: pro + ' of ' + meals.length + ' meals', c: '#4cb86b', mine: goal && goal.k === 'muscle' });

  if (firsts.length >= 3) {

  const water = food.filter(f => has(f, 'water')).length;

function grocerySuggestions() {
  const g = myGoal();
  if (!g) return null;
  const since = Date.now() - 30 * 86400000;
  const recent = state.food.filter(f => f.at >= since);
  const helps = GOAL_HELPS[g.k] || [];
  const pool = g.k === 'sleep' ? SLEEP_IDEAS : GROCERY_IDEAS;

  const out = [];
  for (const name of pool) {
    if (onGrocList(name)) continue;
    const ks = foodKinds(name);
    const good = g.k === 'sleep' ? true : ks.some(k => helps.includes(k));
    if (!good) continue;
    const base = name.replace(/s$/, '').split(' ').pop();
    const re = new RegExp('\\b' + base + 's?\\b', 'i');
    const times = recent.filter(f => re.test(f.what)).length;
    const k = ks.find(x => helps.includes(x));
    const why = g.k === 'sleep' ? 'calming' : KIND_WHY[k] || '';
    out.push({ name, times, why });
  }
  // things you already eat come first, then a few new ones
  out.sort((a, b) => b.times - a.times);
  const known = out.filter(x => x.times).slice(0, 4);
  const fresh = out.filter(x => !x.times).slice(0, 6 - known.length);
  return { goal: g, list: [...known, ...fresh] };
}

function prepsFor(text) { return prepsFor1(text); }

// from your food log: how much of it you get through in a week, and how you have it
function grocGuess(text) {
  const base = text.toLowerCase().replace(/[^a-z ]/g, '').trim().split(' ').pop().replace(/(es|s)$/, '');
  if (base.length < 3) return null;
  const re = new RegExp('\\b' + base + '(e?s)?\\b', 'i');
  const since = Date.now() - 14 * 86400000;
  const hits = state.food.filter(f => f.at >= since && re.test(f.what));
  if (!hits.length) return null;
  // "2 eggs", "3 bananas": the number in front, else one each time
  const each = hits.map(f => { const m = f.what.toLowerCase().match(new RegExp('(\\d+)\\s*' + base)); return m ? Number(m[1]) : 1; });
  const perWeek = each.reduce((a, b) => a + b, 0) / 2;
  const dishes = {};
  for (const f of hits) { const d = f.what.trim().toLowerCase(); if (d.replace(/\d+\s*/, '') !== base && d !== base + 's') dishes[d] = (dishes[d] || 0) + 1; }
  const usual = Object.entries(dishes).sort((a, b) => b[1] - a[1])[0];
  const meals = {};
  for (const f of hits) meals[f.meal] = (meals[f.meal] || 0) + 1;
  const meal = Object.entries(meals).sort((a, b) => b[1] - a[1])[0][0];
  const count = COUNT_WORDS.test(text);
  return {
    qty: count ? Math.max(1, Math.ceil(perWeek)) : null,
    unit: count ? 'pcs' : '',
    note: (usual ? 'usually ' + usual[0] : 'for ' + meal) + ' · about ' + Math.max(1, Math.round(perWeek)) + '× a week',
    auto: true
  };
}

    return { it, name, note, h: name.length * NAME * 1.2 + note.length * NOTE * 1.3 + 56 };
  });
  const H = Math.max(1350, 360 + laid.reduce((a, l) => a + l.h, 0) + 160);
  c.width = W; c.height = H;

  // paper
  x.fillStyle = '#fdf9f1'; x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(232, 138, 160, .6)'; x.lineWidth = 4;
  x.beginPath(); x.moveTo(PAD - 40, 0); x.lineTo(PAD - 40, H); x.stroke();

  // header: the brick logo, the title, the date
  try {
    const logo = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = 'icon-180.png'; });
    x.save(); x.beginPath(); x.roundRect(PAD, 96, 100, 100, 26); x.clip(); x.drawImage(logo, PAD, 96, 100, 100); x.restore();
  } catch {}
  const d = new Date();
  x.fillStyle = '#1d1512'; x.font = '600 84px Poppins, sans-serif'; x.textBaseline = 'alphabetic';
  x.fillText('Groceries', PAD + 128, 178);
  x.fillStyle = '#4a3b33'; x.font = '500 40px Poppins, sans-serif';
  x.fillText(cap(FULL[d.getDay()]) + ' ' + d.getDate() + ' ' + cap(MONTHS[d.getMonth()]), PAD, 276);

  // the items: a big circle to tick in pen, the name, how many, and how you'll have it
  let y = 360;
  laid.forEach((l, i) => {
    if (i) { x.strokeStyle = '#e6dccd'; x.lineWidth = 2; x.beginPath(); x.moveTo(PAD, y - 4); x.lineTo(W - PAD, y - 4); x.stroke(); }
    let ty = y + NAME + 6;
    x.strokeStyle = '#1d1512'; x.lineWidth = 4;
    x.beginPath(); x.arc(PAD + 30, ty - NAME * .34, 28, 0, Math.PI * 2); x.stroke();
    x.fillStyle = '#1d1512'; x.font = nameFont; x.textAlign = 'left';
    l.name.forEach((t, j) => x.fillText(t, textX, ty + j * NAME * 1.2));
    if (grocAmt(l.it)) {
      x.fillStyle = '#b02a52'; x.font = '700 ' + (l.it.qty2 > 0 ? 46 : NAME) + 'px Poppins, sans-serif'; x.textAlign = 'right';
      x.fillText(grocAmt(l.it), W - PAD, ty);
      x.textAlign = 'left';
    }
    ty += (l.name.length - 1) * NAME * 1.2;
    x.fillStyle = '#4a3b33'; x.font = noteFont;
    l.note.forEach((t, j) => x.fillText(t, textX, ty + 16 + (j + 1) * NOTE * 1.3));
    y += l.h;
  });
  x.fillStyle = '#8a776a'; x.font = '500 28px Poppins, sans-serif'; x.textAlign = 'center';
  x.fillText('made with brick', W / 2, H - 60);
  return new Promise(ok => c.toBlob(ok, 'image/png'));
}

// a typed item like "12 eggs, boiled for breakfast" or "rice 2kg (jollof)":
// the name, how many, the unit, and how you'll have it, split out
const UNIT_WORDS = { kg: 'kg', kgs: 'kg', kilo: 'kg', kilos: 'kg', g: 'g', grams: 'g', gram: 'g', l: 'L', litre: 'L', litres: 'L', liter: 'L', liters: 'L',
  pack: 'pack', packs: 'pack', bunch: 'bunch', bunches: 'bunch', tin: 'tin', tins: 'tin', can: 'tin', cans: 'tin', bag: 'bag', bags: 'bag',
  pcs: 'pcs', pc: 'pcs', piece: 'pcs', pieces: 'pcs', crate: 'pack', crates: 'pack', dozen: 'pcs' };
function parseGrocery(raw) {
  let t = String(raw || '').trim(), note = '';
  const paren = t.match(/\(([^)]*)\)/);
  if (paren) { note = paren[1].trim(); t = t.replace(paren[0], ' ').trim(); }
  const cut = t.match(/\s*(,|;|\s-\s|\s–\s|:|\bfor\b|\bto\b\s+(?:boil|fry|grill|bake|make|cook|blend|roast|steam)|\b(?:boiled|fried|grilled|baked|roasted|steamed|blended|mashed|raw|sliced)\b)/i);
  if (cut && cut.index > 0) {
    const rest = t.slice(cut.index).replace(/^\s*(,|;|-|–|:)\s*/, '').trim();
    note = [rest, note].filter(Boolean).join(', ');
    t = t.slice(0, cut.index).trim();
  }
  let qty = null, unit = '';
  const unitRe = '(' + Object.keys(UNIT_WORDS).join('|') + ')';
  let m = t.match(new RegExp('^(?:x\\s*)?(\\d+(?:\\.\\d+)?)\\s*(?:x\\b)?\\s*' + unitRe + '?\\b\\s*(?:of\\s+)?', 'i'));
  if (m && m[0].trim() && t.slice(m[0].length).trim()) {
    qty = Number(m[1]); unit = m[2] ? UNIT_WORDS[m[2].toLowerCase()] : ''; t = t.slice(m[0].length).trim();
    if (m[2] && /dozen/i.test(m[2])) qty *= 12;
  } else {
    m = t.match(new RegExp('\\s+(?:x\\s*)?(\\d+(?:\\.\\d+)?)\\s*' + unitRe + '?\\s*$', 'i'));
    if (m && t.slice(0, m.index).trim()) {
      qty = Number(m[1]); unit = m[2] ? UNIT_WORDS[m[2].toLowerCase()] : ''; t = t.slice(0, m.index).trim();
      if (m[2] && /dozen/i.test(m[2])) qty *= 12;
    }
  }
  if (qty !== null && !unit && COUNT_WORDS.test(t)) unit = 'pcs';
  t = t.replace(/\s+/g, ' ').trim();
  return { text: t ? cap(t) : String(raw).trim(), qty, unit, note };
}
// tidy one item in place: only fills what is empty, never loses words
function tidyGrocery(it) {
  const p = parseGrocery(it.text);
  if (p.text === it.text && p.qty === null && !p.note) return false;
  it.text = p.text;
  if (p.qty !== null && !it.qty) { it.qty = p.qty; it.unit = p.unit || it.unit || ''; }
  else if (p.qty !== null && it.qty) it.text = it.text;   // keep the amount you set by hand
  if (p.note) it.note = it.note && !it.auto ? it.note + ', ' + p.note : p.note;
  it.auto = false;
  return true;
}

async function grocSaveImage() {
  const blob = await grocImage();
  if (!blob) return null;
  const d = new Date();
  const file = new File([blob], 'groceries-' + key(d) + '.png', { type: 'image/png' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Groceries' }); return 'Saved'; }
  } catch (e) { if (e && e.name === 'AbortError') return null; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  return 'Saved';
}

function addGrocery(text) {
  text = String(text || '').trim();
  if (!text) return;
  if (!state.grocery) state.grocery = [];
  // fill in how many and how you have it from your food log, when it knows
  const typed = parseGrocery(text);
  if (state.grocery.some(x => !x.done && x.text.toLowerCase() === typed.text.toLowerCase())) return;   // already on it
  const guess = grocGuess(typed.text) || {};
  const item = { id: Date.now() + '' + Math.random().toString(36).slice(2, 6), text: typed.text, done: false, at: Date.now(),
                 qty: null, unit: '', note: '', auto: false, ...guess };
  if (typed.qty !== null) { item.qty = typed.qty; item.unit = typed.unit; item.auto = false; }
  if (typed.note) { item.note = typed.note; item.auto = false; }
  state.grocery.unshift(item);

let undoItem = null;
let undoTimer = null;

function offerUndo(label, restore) {
  undoItem = { label, restore };
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { undoItem = null; renderUndo(); }, 12000);
  renderUndo();
}

function renderUndo() {
  const slot = document.getElementById('undo');
  slot.innerHTML = '';
  if (!undoItem) return;

  const bar = document.createElement('div');
  bar.className = 'undo';

  const txt = document.createElement('span');
  txt.textContent = 'removed ' + undoItem.label;

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'undo';
  btn.addEventListener('click', () => {
    const fn = undoItem.restore;
    undoItem = null;
    clearTimeout(undoTimer);
    renderUndo();
    fn();
  });

  bar.append(txt, btn);
  slot.appendChild(bar);
}

/* ---- reading your notes ----
   "4s · 30kg×8r L, 30kg×10r L" -> 4 sets, each with weight, reps and level.
   s = sets, r = reps, L light, M medium, H hard. a time like 30s is a hold. */
const LEVELS = { L: ['light', '#7daf86'], M: ['medium', '#c9965a'], H: ['hard', '#d97a6c'] };

function parseSets(dt) {
  const segs = String(dt).split('·').map(x => x.trim()).filter(Boolean);
  const hi = segs.findIndex(x => /^\d+\s*s\b/.test(x));
  if (hi === -1) return { note: dt, sets: [] };
  const head = segs[hi].match(/^(\d+)\s*s(?:\s*[x×]\s*(\d+)\s*r)?\s*(.*)$/);
  let n = Number(head[1]);
  const baseReps = head[2] ? Number(head[2]) : null;
  const note = segs.slice(0, hi).join(' · ');
  const rest = [head[3], ...segs.slice(hi + 1)].filter(Boolean).join(' ');
  const pieces = rest ? rest.split(',').map(x => x.trim()).filter(Boolean) : [];

  const read = t => {
    const w = t.match(/(\d+\s*[x×]\s*\d+(?:\.\d+)?\s*kg|\d+(?:\.\d+)?\s*kg|\d+\s*p\b)/i);
    const tAfter = w ? t.replace(w[0], '') : t;
    const r = tAfter.match(/(\d+)\s*r\b/i);
    const hold = tAfter.match(/(\d+)\s*s\b/i);
    const lv = t.match(/\b([LMH])\b/);
    return { w: w ? w[0].replace(/\s+/g, '').replace('x', '×') : null,
             reps: r ? Number(r[1]) : (hold ? null : baseReps), hold: hold ? Number(hold[1]) : null,
             lv: lv ? lv[1] : null };
  };
  let list = pieces.map(read);
  if (!list.length) list = [{ w: null, reps: baseReps, hold: null, lv: null }];
  if (list.length === 1 && n > 1) list = Array.from({ length: n }, () => ({ ...list[0] }));
  // a level written once at the end ("15kg, 20kg M") applies to the ones before it
  for (let i = list.length - 1; i >= 0; i--) if (!list[i].lv) list[i].lv = (list.slice(i + 1).find(x => x.lv) || {}).lv || null;
  for (let i = 0; i < list.length; i++) if (!list[i].lv) list[i].lv = (list.slice(0, i).reverse().find(x => x.lv) || {}).lv || null;
  n = Math.max(n, list.length);
  while (list.length < n) list.push({ ...list[list.length - 1] });
  return { note, sets: list.slice(0, n) };
}

function kgOf(w) {
  if (!w || !/kg/i.test(w)) return 0;
  const two = w.match(/(\d+)×(\d+(?:\.\d+)?)kg/i);
  return two ? Number(two[1]) * Number(two[2]) : Number(w.replace(/kg/i, ''));
}

// rest between sets: shorter for light work, longer for hard
let restTimer = null;
function startRest(level, entry) {
  const secs = level === 'H' ? 120 : level === 'L' ? 60 : 90;
  stopRest();
  const el = document.createElement('div');
  el.id = 'restbar';
  el.innerHTML = '<div class="rb-in"><span class="rb-l">Rest</span><b class="rb-t"></b><i class="rb-bar"><u></u></i>' +
                 '<button type="button" class="rb-skip">Skip</button></div>' +
                 (entry ? '<div class="rb-feel"><span>How was that set?</span>' +
                   ['easy', 'right', 'hard'].map(f => '<button type="button" data-f="' + f + '">' + cap(f) + '</button>').join('') + '</div>' : '');
  document.body.appendChild(el);
  // how it felt is what the weight suggestions learn from
  el.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
    entry.feel = b.dataset.f; save();
    el.querySelector('.rb-feel').innerHTML = '<span>Noted: ' + b.dataset.f + '</span>';
  }));
  const end = Date.now() + secs * 1000;
  const tick = () => {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    el.querySelector('.rb-t').textContent = left ? Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : 'Go!';
    el.querySelector('.rb-bar u').style.width = (left / secs * 100) + '%';
    if (!left) {
      el.classList.add('go');
      try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch {}
      clearInterval(restTimer); restTimer = null;
      setTimeout(stopRest, 4000);
    }
  };
  tick();
  restTimer = setInterval(tick, 250);
  el.querySelector('.rb-skip').addEventListener('click', stopRest);
}
function stopRest() { clearInterval(restTimer); restTimer = null; const el = document.getElementById('restbar'); if (el) el.remove(); }

// weeks in a row (counting back from this week) with at least one session
function gymStreak() {
  const days = Object.keys(state.gym || {}).filter(k => (state.gym[k] || []).length);
  const monday = k => { const d = fromKey(k); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return key(d); };
  const weeks = new Set(days.map(monday));
  let w = monday(todayKey()), n = 0;
  if (!weeks.has(w)) w = shiftKey(w, -7);       // this week not started yet is fine
  while (weeks.has(w)) { n++; w = shiftKey(w, -7); }
  return n;
}

/* ---- weight suggestions ----
   "double progression", the usual way to get stronger safely:
   do every set in the rep range, then add reps, then add weight and start
   the reps again. how the sets felt decides how fast. your goal sets the
   rep range: strength 6 to 10, muscle 8 to 12, toning and endurance 12 to 15. */
function trainingMode() {
  const tp = state.trainProfile || {};
  if (/stronger/i.test(tp.goal || '')) return { k: 'strength', lo: 5, hi: 8, say: 'get stronger' };
  if (/muscle/i.test(tp.goal || '')) return { k: 'muscle', lo: 8, hi: 12, say: 'build muscle' };
  if (/fat|fitter|tone/i.test(tp.goal || '')) return { k: 'tone', lo: 12, hi: 15, say: tp.goal.toLowerCase() };
  const lifeIds = ((state.life || {}).health && areaGoals('health').map(g => g.m)) || [];
  if (state.goal === 'muscle' || state.goal2 === 'muscle' || lifeIds.includes('gym')) return { k: 'muscle', lo: 8, hi: 12, say: 'build muscle' };
  if (['lighter', 'energy'].includes(state.goal) || lifeIds.includes('move')) return { k: 'tone', lo: 12, hi: 15, say: 'tone and build stamina' };
  return { k: 'general', lo: 8, hi: 12, say: 'get stronger' };
}

// one step heavier: small jumps for small weights
function heavier(w) {
  if (!w) return null;
  let m = w.match(/^(\d+)×(\d+(?:\.\d+)?)kg$/i);
  if (m) { const each = Number(m[2]); return m[1] + '×' + (each + (each < 10 ? 1 : 2)) + 'kg'; }
  m = w.match(/^(\d+(?:\.\d+)?)kg$/i);
  if (m) { const kg = Number(m[1]); return (kg + (kg < 10 ? 1 : 2.5)) + 'kg'; }
  m = w.match(/^(\d+)p$/i);
  if (m) return (Number(m[1]) + 1) + 'p';
  return null;
}
function lighter(w) {
  if (!w) return null;
  const m = w.match(/^(\d+(?:\.\d+)?)kg$/i);
  if (m) { const kg = Math.max(1, Math.round(Number(m[1]) * 0.9 * 2) / 2); return kg + 'kg'; }
  const p = w.match(/^(\d+)p$/i);
  if (p) return Math.max(1, Number(p[1]) - 1) + 'p';
  return w;
}

function suggestFor(id, sets) {
  const today = todayKey();
  const past = (state.gymLog || []).filter(x => x.id === id && x.d < today);
  if (!past.length) return null;
  const last = past.reduce((a, x) => (x.d > a ? x.d : a), '');
  const done = past.filter(x => x.d === last);
  const when = cap(FULL[fromKey(last).getDay()]);
  const mode = trainingMode();
  const feels = done.map(x => x.feel).filter(Boolean);
  const easy = feels.filter(f => f === 'easy').length, hard = feels.filter(f => f === 'hard').length;
  const allDone = done.length >= sets.length;
  const holds = sets.some(st => st.hold);

  if (hard >= Math.max(1, Math.ceil(done.length / 2))) {
    const twice = past.filter(x => x.feel === 'hard').length >= done.length + 1;
    if (twice && !holds) {
      return { kind: 'down', title: 'Go a little lighter next time',
        why: 'It felt hard on ' + when + ' and the time before. A lighter weight with good form builds more than grinding.',
        sets: sets.map(st => ({ ...st, w: lighter(st.w) })) };
    }
    return { kind: 'stay', title: 'Stay at this weight',
      why: 'Most sets felt hard on ' + when + '. Own this weight first.', sets: null };
  }
  if (!allDone) {
    return { kind: 'stay', title: 'Stay at this weight',
      why: 'On ' + when + ' you did ' + done.length + ' of ' + sets.length + ' sets. Finish them all before going up.', sets: null };
  }
  if (holds) {
    return { kind: 'up', title: 'Hold 5 seconds longer',
      why: 'You did every set on ' + when + (easy ? ' and it felt easy.' : '.'), sets: sets.map(st => ({ ...st, hold: st.hold ? st.hold + 5 : st.hold })) };
  }
  const reps = Math.max(...sets.map(st => st.reps || 0));
  const canWeigh = sets.some(st => heavier(st.w));
  // easy, or already at the top of the range: add weight, reps back to the bottom
  if (canWeigh && (easy >= Math.ceil(done.length / 2) || reps >= mode.hi)) {
    const next = sets.map(st => ({ ...st, w: heavier(st.w) || st.w, reps: st.reps ? Math.max(mode.lo, Math.min(st.reps, mode.lo + 2)) : st.reps }));
    const top = next.find(st => st.w) || next[0];
    return { kind: 'up', title: 'Go up to ' + top.w + (top.reps ? ' × ' + top.reps : ''),
      why: (easy ? 'It felt easy on ' + when + '. ' : 'You hit ' + reps + ' reps on ' + when + ', the top of your range. ') +
           'To ' + mode.say + ', add weight and start the reps again at ' + top.reps + '.', sets: next };
  }
  // felt right: one more rep per set
  if (reps && reps < mode.hi) {
    return { kind: 'up', title: 'Add a rep to each set',
      why: 'Every set done on ' + when + '. To ' + mode.say + ', work up to ' + mode.hi + ' reps, then add weight.',
      sets: sets.map(st => ({ ...st, reps: st.reps ? Math.min(mode.hi, st.reps + 1) : st.reps })) };
  }
  return { kind: 'stay', title: 'Keep it as it is', why: 'Every set done on ' + when + '. Nice and steady.', sets: null };
}

function setSummary(sets) {

  const rTxt = uniq(reps).length === 1 ? ' × ' + reps[0] : '';
  return sets.length + ' sets' + rTxt + (wTxt ? ' · ' + wTxt : '');
