.qz-choose small { font-size: 13px; color: var(--muted); line-height: 1.4; }
.qz-choose .gm-link { align-self: center; }
.qz-proflink { display: block; margin: -8px 0 10px auto; font-size: 13px; }
.qz { display: flex; flex-direction: column; gap: 12px; }
.qz-step { font-size: 12px; font-weight: 600; color: var(--pink); }
.qz-q { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.3; text-transform: none; }
.qz-opts { display: flex; flex-direction: column; gap: 8px; }
.qz-opts.many { flex-direction: row; flex-wrap: wrap; }
.qz-opts button { min-height: 50px; padding: 0 16px; text-align: left; font: 500 16px "Poppins", sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--hair); border-radius: 16px; cursor: pointer; }
.qz-opts.many button { min-height: 42px; border-radius: 21px; }
.qz-opts button.on { color: #fff; background: var(--pink); border-color: var(--pink); }
.qz-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qz-fields label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.qz-fields input { width: 100%; font: 400 16px "Poppins", sans-serif; padding: 10px 12px; border-radius: 12px; }
.qz-nav { display: flex; align-items: center; gap: 16px; margin-top: 6px; }
.qz-nav .lf-btn { flex: 1; }
.qz-why { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
.qz-wk { padding: 14px 16px; background: var(--card); border: 1px solid var(--hair); border-radius: 16px; }
.qz-wk b { display: block; font-size: 16px; font-weight: 600; }
.qz-wk small { font-size: 12px; color: var(--muted); }
.qz-wk ol { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }

.qz-final { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.qz-final .gm-link { align-self: center; }
.qz-note { margin: 0; font-size: 12px; color: var(--muted); text-align: center; }
.qz-prof { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.qz-prof li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.qz-prof span { grid-column: 1; font-size: 12px; color: var(--muted); }
.qz-prof b { grid-column: 1; font-size: 15px; font-weight: 500; }
.qz-prof b i { color: var(--muted); font-weight: 400; }
.qz-prof .gm-link { grid-column: 2; grid-row: 1 / span 2; align-self: center; }

/* done early: the circle fills while you hold it */
#view-day .tick.holding { background: conic-gradient(var(--pink) 0deg, transparent 0deg); animation: holdfill .65s linear forwards; }
@keyframes holdfill { from { box-shadow: inset 0 0 0 0 var(--pink); } to { box-shadow: inset 0 0 0 14px var(--pink); } }

/* alarms sheet */
.al-list { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; }
.al-list li + li { border-top: 1px solid var(--hair); }
.al-list label { display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 16px; cursor: pointer; }
.al-list input { width: 20px; height: 20px; accent-color: var(--pink); }
.al-list b { width: 72px; font-weight: 600; font-variant-numeric: tabular-nums; }
.al-list span { color: var(--muted); overflow-wrap: anywhere; }
.al-help { margin-top: 14px; font-size: 14px; line-height: 1.5; }
.al-help summary { color: var(--pink); font-weight: 500; cursor: pointer; }
.al-help ol { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.w3-sheet .al-help ol { list-style: decimal; }
.w3-sheet .al-help li { display: list-item; }
.w3-sheet .al-help li b { display: inline; font-size: inherit; font-weight: 600; line-height: inherit; }
.w3-sheet .al-list li { display: block; }
.w3-sheet .al-list li b { display: inline-block; font-size: 16px; }

/* the focus bubble */
#focusnudge { position: fixed; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 14; animation: fnin .45s cubic-bezier(.3, 1.5, .5, 1); }
#focusnudge.out { animation: fnout .25s ease-in forwards; }
@keyframes fnin { from { transform: scale(0) translateY(20px); opacity: 0; } }
@keyframes fnout { to { transform: scale(.4); opacity: 0; } }
#focusnudge .fn-go {
  width: 76px; height: 76px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font: 600 13px "Poppins", sans-serif; color: #fff; background: #6f9f5c; border: none; border-radius: 50%; cursor: pointer;
  box-shadow: 0 10px 26px rgba(80, 120, 70, .35);
}
#focusnudge .fn-go::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 0 rgba(111, 159, 92, .5); animation: fnpulse 2.2s ease-out infinite; pointer-events: none; }
@keyframes fnpulse { 70% { box-shadow: 0 0 0 16px rgba(111, 159, 92, 0); } 100% { box-shadow: 0 0 0 0 rgba(111, 159, 92, 0); } }
#focusnudge .fn-ico { font-size: 24px; line-height: 1; }
#focusnudge .fn-x {
  position: absolute; top: -6px; left: -6px; width: 26px; height: 26px; padding: 0;
  font-size: 15px; line-height: 1; color: var(--muted); background: var(--card); border: 1px solid var(--hair); border-radius: 50%; cursor: pointer;
}

/* today's plate */
.pl-card { margin-top: 12px; padding: 16px; background: var(--card); border: 1px solid var(--hair); border-radius: 20px; }
.pl-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.pl-head b { font-size: 16px; font-weight: 600; }
.pl-head small { font-size: 12px; color: var(--muted); }
.pl-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.pl-i { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 10px; background: var(--hair); border-radius: 14px; }
.pl-i small { font-size: 12px; color: var(--muted); }
.pl-i b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pl-i i { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; display: grid; place-items: center; font-style: normal; font-size: 11px; color: transparent; border: 1.5px solid var(--dash); border-radius: 50%; }
.pl-i.ok { background: color-mix(in srgb, #7daf86 18%, var(--card)); }
.pl-i.ok i { color: #fff; background: #7daf86; border-color: #7daf86; }
.pl-tip { margin: 12px 0 0; font-size: 14px; line-height: 1.45; }
.pl-ins { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); }
.pl-ins span { font-size: 12px; font-weight: 600; color: var(--pink); }
.pl-ins p { margin: 2px 0 0; font-size: 15px; font-weight: 500; line-height: 1.4; }
.pl-ins small { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); line-height: 1.4; }

/* groceries, smarter */
.gr-name small.gr-v { display: block; margin-top: 2px; font-size: 12px; }
.gr-v.good { color: #5f9468; } .gr-v.watch { color: #c2784e; }
.gr-swap { display: block; margin-top: 4px; padding: 2px 0; text-align: left; font: 500 12px "Poppins", sans-serif; color: var(--pink); background: none; border: none; cursor: pointer; }
.gr-sug + .gr-sug { margin-top: 12px; }

/* a month ahead */
.mo-card { margin-top: 12px; padding: 16px; background: var(--card); border: 1px solid var(--hair); border-radius: 20px; }
.mo-card ul { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.mo-card li { display: flex; gap: 12px; align-items: flex-start; }
.mo-e { flex: none; width: 34px; height: 34px; display: grid; place-items: center; font-size: 17px; border-radius: 11px; background: color-mix(in srgb, #e3a27a 22%, var(--card)); }
.mo-card li.good .mo-e { background: color-mix(in srgb, #7daf86 22%, var(--card)); }
.mo-card li b { display: block; font-size: 15px; font-weight: 500; line-height: 1.35; }
.mo-card li small { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); line-height: 1.4; }
.mo-fine { margin: 12px 0 0; font-size: 12px; color: var(--muted); }

/* how do you feel, after a block */
.ma { position: fixed; z-index: 60; left: 12px; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); max-width: 26rem; margin: 0 auto;
  padding: 14px 14px 12px; background: var(--card); border: 1px solid var(--hair); border-radius: 22px; box-shadow: 0 12px 34px rgba(0,0,0,.28);
  transform: translateY(24px); opacity: 0; transition: transform .3s cubic-bezier(.22,1,.36,1), opacity .25s; }
.ma.in { transform: none; opacity: 1; }
.ma-top { display: flex; align-items: center; justify-content: space-between; }
.ma-top b { font-size: 16px; font-weight: 600; }
.ma-x { width: 36px; height: 36px; font-size: 14px; color: var(--muted); background: none; border: none; cursor: pointer; }
.ma > small { display: block; margin: -4px 0 10px; font-size: 12px; color: var(--muted); }
.ma-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ma-grid button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; padding: 6px 2px;
  font: 500 11px "Poppins", sans-serif; color: var(--ink); background: color-mix(in srgb, var(--c) 16%, var(--card)); border: none; border-radius: 14px; cursor: pointer; }
.ma-grid button span { font-size: 22px; line-height: 1.1; }
.ma-grid button:active { transform: scale(.94); }
.ma-ok { grid-column: 1 / -1; margin: 10px 0; text-align: center; font-size: 15px; font-weight: 600; }
/* grocery details and sharing */
.gr-share { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; }
.gr-share button { min-height: 36px; padding: 0 14px; font: 500 13px "Poppins", sans-serif; color: var(--ink); background: var(--hair); border: none; border-radius: 18px; cursor: pointer; }
.gr-msg { font-size: 13px; color: #5f9468; font-weight: 500; }
.gr-ghead { margin: 16px 2px 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.gr-ghead + .gr-list { margin-top: 0; }
.gr-row { flex-wrap: wrap; }
.gr-open { flex: 1; min-width: 0; padding: 4px 0; text-align: left; font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
.gr-t { display: block; font-size: 16px; }
.gr-q { margin-left: 6px; font-style: normal; font-weight: 600; color: var(--pink); }
.gr-note { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
.gr-note i { font-style: normal; color: var(--blue); }
.gr-row > .gr-swap { flex-basis: 100%; margin: -8px 0 8px; padding-left: 48px; }
.gr-ed { flex-basis: 100%; display: flex; flex-direction: column; gap: 10px; padding: 4px 6px 12px 48px; }
.gr-qrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.gr-qrow > button { width: 38px; height: 38px; font-size: 18px; color: var(--ink); background: var(--hair); border: none; border-radius: 50%; cursor: pointer; }
.gr-qin { width: 96px; text-align: center; font: 500 16px "Poppins", sans-serif; padding: 8px; border-radius: 12px; }
.gr-units { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
.gr-units button { min-height: 32px; padding: 0 12px; font: 500 13px "Poppins", sans-serif; color: var(--muted); background: var(--hair); border: none; border-radius: 16px; cursor: pointer; }
.gr-units button.on { color: #fff; background: var(--pink); }
.gr-tin { width: 100%; font: 500 16px "Poppins", sans-serif; padding: 10px 12px; border-radius: 12px; }
.gr-share { flex-wrap: wrap; }
.gr-more2 { align-self: flex-start; padding: 4px 0; font: 500 14px "Poppins", sans-serif; color: var(--pink); background: none; border: none; cursor: pointer; }
.gr-and { min-width: 38px; text-align: center; font-size: 13px; color: var(--muted); }
.gr-cut { width: 76px; text-align: center; font: 500 16px "Poppins", sans-serif; padding: 8px; border-radius: 12px; }
.gr-qin2 { width: 76px; text-align: center; font: 500 16px "Poppins", sans-serif; padding: 8px; border-radius: 12px; }
.gr-x2 { width: 38px; height: 38px; font-size: 13px; color: var(--muted); background: none; border: none; cursor: pointer; }
.gr-prepbox { display: flex; flex-direction: column; gap: 10px; }
.gr-prepbox[hidden] { display: none; }
.gr-more2[hidden] { display: none; }
.gr-hints { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.gr-hints:empty { display: none; }
.gr-hints button { display: flex; align-items: baseline; gap: 6px; min-height: 36px; padding: 0 12px; font: 500 14px "Poppins", sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--hair); border-radius: 18px; cursor: pointer; }
.gr-hints small { font-size: 11px; font-weight: 400; color: var(--muted); }
.gr-size { margin-top: -2px; }
.gr-type { color: var(--muted); }
.gr-tyin { width: 100%; font: 400 16px "Poppins", sans-serif; padding: 10px 12px; border-radius: 12px; }
.gr-findrow { margin: 12px 0 0; }
.gr-find { width: 100%; min-height: 40px; padding: 8px 14px; font: 400 16px "Poppins", sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--hair); border-radius: 20px; }
.gr-none { display: block; margin: 10px 2px 0; font-size: 13px; color: var(--muted); }
.gr-none[hidden], .gr-row[hidden], .gr-list[hidden], .gr-ghead[hidden], .gr-gothead[hidden] { display: none; }
.gr-lbl { margin: 2px 0 -4px; font-size: 13px; font-weight: 600; color: var(--ink); }
.gr-lbl span { margin-left: 6px; font-weight: 400; color: var(--muted); }
.gr-preps { display: flex; flex-wrap: wrap; gap: 6px; }
.gr-preps button { min-height: 34px; padding: 0 12px; font: 500 13px "Poppins", sans-serif; color: var(--ink); background: var(--hair); border: none; border-radius: 17px; cursor: pointer; }
.gr-preps button.on { color: #fff; background: var(--pink); }
.gr-nin { width: 100%; font: 400 16px "Poppins", sans-serif; padding: 10px 12px; border-radius: 12px; }
.gr-done { align-self: flex-start; padding: 4px 0; font: 600 14px "Poppins", sans-serif; color: var(--pink); background: none; border: none; cursor: pointer; }

/* length picker, round four */
#view-day .line .at.tapme { cursor: pointer; }
#view-day .lp4 { display: flex; flex-direction: column; gap: 10px; margin: 0 0 12px; padding: 14px; background: var(--card); border: 1px solid var(--hair); border-radius: 18px; }
.lp4-now { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.lp4-now b { font-size: 22px; font-weight: 600; }
.lp4-now span { font-size: 14px; color: var(--muted); }
.lp4-row { display: flex; flex-wrap: wrap; gap: 6px; }
.lp4-row button { flex: 1 1 auto; min-width: 52px; min-height: 40px; padding: 0 10px; font: 500 15px "Poppins", sans-serif; color: var(--ink); background: var(--hair); border: none; border-radius: 20px; cursor: pointer; }
.lp4-row.add button { background: color-mix(in srgb, var(--pink) 14%, var(--card)); color: var(--pink); font-weight: 600; }
.lp4-row button.on { color: #fff; background: var(--pink); }
.lp4-row button.usual:not(.on) { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--pink) 55%, transparent); }
.lp4-row button:disabled { opacity: .35; }
.lp4-end { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; color: var(--muted); }
.lp4-end input { width: 140px; min-height: 44px; padding: 0 14px; text-align: center; font: 500 16px "Poppins", sans-serif; color: var(--ink); background: var(--hair); border: none; border-radius: 22px; -webkit-appearance: none; appearance: none; }
.lp4-done { align-self: flex-end; padding: 4px 0; font: 600 15px "Poppins", sans-serif; color: var(--pink); background: none; border: none; cursor: pointer; }

/* one goal for the day */
.dg-card { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding: 14px 16px; background: color-mix(in srgb, var(--pink) 10%, var(--card)); border: 1px solid color-mix(in srgb, var(--pink) 30%, var(--hair)); border-radius: 18px; }
.dg-card > div { flex: 1; min-width: 0; }
.dg-card span { display: block; font-size: 12px; font-weight: 600; color: var(--pink); }
.dg-card b { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.dg-card.done b { text-decoration: line-through; color: var(--muted); }
.dg-tick { flex: none; width: 30px; height: 30px; padding: 0; font-size: 14px; color: transparent; background: var(--card); border: 1.5px solid var(--pink); border-radius: 50%; cursor: pointer; }
.dg-card.done .dg-tick { color: #fff; background: var(--pink); }
.dg-edit { flex: none; padding: 4px 0; font: 500 13px "Poppins", sans-serif; color: var(--muted); background: none; border: none; cursor: pointer; }
.dg-ask { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; padding: 16px; background: var(--card); border: 1px solid var(--hair); border-radius: 18px; animation: fadein .3s ease-out; }
.dg-ask > b { font-size: 17px; font-weight: 600; }
.dg-in { display: flex; gap: 8px; }
.dg-in input { flex: 1; min-width: 0; font: 400 16px "Poppins", sans-serif; padding: 10px 12px; border-radius: 12px; }
.dg-in .lf-btn { flex: none; min-height: 44px; padding: 0 18px; }
.dg-ideas { display: flex; flex-wrap: wrap; gap: 6px; }
.dg-ideas button { min-height: 34px; padding: 0 12px; text-align: left; font: 500 13px "Poppins", sans-serif; color: var(--ink); background: var(--hair); border: none; border-radius: 17px; cursor: pointer; }
.dg-skip { align-self: flex-start; padding: 4px 0; font: 500 13px "Poppins", sans-serif; color: var(--muted); background: none; border: none; cursor: pointer; }

/* stats cards */
#stats-body { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.st-card { padding: 18px; background: var(--card); border: 1px solid var(--hair); border-radius: 20px; }
.st-name { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
.st-name::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.st-big { display: block; margin-top: 10px; font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.st-big i { font-style: normal; font-size: 17px; font-weight: 500; color: var(--muted); }
.st-explain { margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
.st-explain b { color: var(--ink); font-weight: 600; }
.st-bars { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.st-bars div { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-size: 15px; }
.st-bars b { font-weight: 600; font-variant-numeric: tabular-nums; }
.st-bars i { display: block; height: 6px; background: var(--hair); border-radius: 3px; overflow: hidden; }
.st-bars u { display: block; height: 100%; background: var(--c); border-radius: 3px; }

/* a soft dot grid behind everything, cards sit on top of it */
body, body[data-view] {
  background-image: radial-gradient(color-mix(in srgb, var(--muted) 30%, transparent) 1px, transparent 1.4px);
  background-size: 22px 22px;
  background-position: 11px 11px;
  background-attachment: fixed;
  background-repeat: repeat !important;
}

/* plan rows: more room for the name */
#view-day .line { gap: 8px; }
#view-day .line .at { width: 58px; }
#view-day .chipslot { width: 34px; }
#view-day .line .how { width: 48px; }
#view-day .line .how.live { width: 58px; min-width: 58px; }
#view-day .line .bin { width: 24px; }
#view-day .sheet:not(:has(.addlist)) .chipslot { display: none; }   /* no chips that day: no empty column */
#view-day .line-extra, #view-day .lp3 { padding-left: 66px; }

/* mood journey */
.mjs { display: flex; align-items: flex-start; justify-content: center; gap: 0; margin-top: 10px; }
.mj { flex: none; width: 86px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.mj span { width: 54px; height: 54px; display: grid; place-items: center; font-size: 26px; border-radius: 50%;
  background: color-mix(in srgb, var(--c) 28%, var(--card)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 35%, transparent); }
.mj.now span { width: 68px; height: 68px; font-size: 34px; box-shadow: 0 0 0 4px var(--c), 0 6px 18px color-mix(in srgb, var(--c) 40%, transparent); }
.mj b { font-size: 13px; font-weight: 600; text-transform: capitalize; }
.mj small { font-size: 11px; color: var(--muted); }
.mj-line { flex: 1; height: 2px; margin-top: 27px; background: linear-gradient(90deg, var(--hair), color-mix(in srgb, var(--pink) 50%, var(--hair)), var(--hair)); border-radius: 1px; }
.mjs .mj.now + .mj-line, .mjs .mj-line:has(+ .mj.now) { margin-top: 34px; }

/* colour back in: tints that work in light and dark */
.lf-tile:not(.empty) { background: linear-gradient(155deg, color-mix(in srgb, var(--c) 38%, var(--card)), color-mix(in srgb, var(--c) 8%, var(--card)) 80%) !important; border-color: color-mix(in srgb, var(--c) 30%, var(--hair)) !important; }
.hm-now { background: linear-gradient(150deg, color-mix(in srgb, var(--pink) 34%, var(--card)), color-mix(in srgb, #f0b48c 12%, var(--card)) 85%) !important; border-color: color-mix(in srgb, var(--pink) 30%, var(--hair)) !important; }
.hq.room { background: color-mix(in srgb, #5aa832 30%, var(--card)); }
.hq { white-space: nowrap; }
.hq:not(.room):not(.due):not(.quiet) { background: color-mix(in srgb, #8b6cf6 28%, var(--card)); border-color: color-mix(in srgb, #8b6cf6 30%, var(--hair)); }
.hq.due { background: color-mix(in srgb, var(--pink) 34%, var(--card)); }
#view-day .nowcard:not(.past) { background: linear-gradient(150deg, color-mix(in srgb, var(--pink) 18%, var(--card)), var(--card) 75%) !important; }
.fh { background: linear-gradient(160deg, color-mix(in srgb, #8b6cf6 24%, var(--card)), color-mix(in srgb, var(--pink) 10%, var(--card)) 80%) !important; }
.tabs .brick:not(.flat) { background: color-mix(in srgb, var(--pink) 28%, var(--card)); }
</style>
</head>
<body>

<div class="wrap">

  <!-- ============ STATS ============ -->
  <!-- ============ LIFE ============ -->
  <section id="view-life" role="tabpanel" aria-labelledby="tab-life" hidden>
    <div id="life-body"></div>
  </section>

  <section id="view-stats" role="tabpanel" aria-labelledby="tab-stats" hidden>
    <header class="pghead"><h1>Stats</h1><span>what your numbers mean</span></header>
    <div class="daypick" id="range-pick"></div>
    <div id="stats-body"></div>
    <div class="bk">
      <b>Backup</b>
      <p>Everything lives only on this phone. Save a copy now and then, so nothing is lost.</p>
      <div class="bk-btns">
        <button type="button" class="lf-btn main" id="bk-save">Save a backup</button>
        <label class="lf-btn bk-load">Restore<input type="file" id="bk-file" accept="application/json,.json" hidden></label>
      </div>
      <p class="bk-last" id="bk-last"></p>
      <div id="bk-confirm"></div>
    </div>
  </section>

  <div id="undo"></div>

  <div class="focus" id="focus" hidden role="dialog" aria-modal="true" aria-label="focus">
    <div class="fx-top">
      <div>
        <span class="fx-label">Focus room</span>
        <h1 class="fx-name"></h1>
      </div>
      <div class="fx-topbtns">
        <button class="fx-mood" id="focus-mood" type="button">Mood</button>
        <button class="fx-close" id="focus-close" type="button" aria-label="close focus">×</button>
      </div>
    </div>

    <div class="fx-stage">
      <svg class="fx-ring" viewBox="0 0 300 300" aria-hidden="true">
        <circle cx="150" cy="150" r="140" class="fx-track"/>
        <circle cx="150" cy="150" r="140" class="fx-arc" stroke-dasharray="879.6" stroke-dashoffset="879.6"/>
      </svg>
      <div class="fx-plant"></div>
    </div>
    <p class="fx-growing"></p>

    <div class="fx-time">
      <b class="fx-left"></b>
      <span class="fx-ends"></span>
    </div>
    <p class="fx-note"></p>

    <ul class="fx-goals"></ul>
    <button class="fx-done" id="focus-done" type="button" hidden>Back to my plan</button>
    <p class="fx-quote"></p>
    <div class="fx-moodsheet" hidden></div>
  </div>

  <!-- home and the four used most sit in the bar, the rest behind "more" -->
  <div class="tabs" role="tablist">
    <button class="brick flat" id="tab-home"   role="tab" aria-selected="true"  aria-controls="view-home">home</button>
    <button class="brick flat" id="tab-day"    role="tab" aria-selected="false" aria-controls="view-day">plan</button>
    <button class="brick flat" id="tab-food"   role="tab" aria-selected="false" aria-controls="view-food">fuel</button>
    <button class="brick flat" id="tab-gym"    role="tab" aria-selected="false" aria-controls="view-gym">move</button>
    <button class="brick flat" id="tab-mood"   role="tab" aria-selected="false" aria-controls="view-mood" hidden>mood</button>
    <button class="brick flat" id="tab-more"   type="button" aria-expanded="false" aria-controls="more-panel">more</button>
  </div>

  <div class="morepanel" id="more-panel" hidden>
    <button class="brick flat" id="tab-life"   role="tab" aria-selected="false" aria-controls="view-life" hidden>life</button>
    <button class="brick flat" id="tab-ideas"  role="tab" aria-selected="false" aria-controls="view-ideas">tweets</button>
    <button class="brick flat" id="tab-habits" role="tab" aria-selected="false" aria-controls="view-habits">habits</button>
    <button class="brick flat" id="tab-stats"  role="tab" aria-selected="false" aria-controls="view-stats">stats</button>
    <button class="brick flat" id="show-toggle" type="button">Show mode</button>
    <div class="mp-theme">
      <span>Look</span>
      <div class="mp-seg" id="theme-seg">
        <button type="button" data-th="light">Light</button>
        <button type="button" data-th="dark">Dark</button>
        <button type="button" data-th="auto">Phone</button>
      </div>
    </div>
  </div>

  <div id="showbar" hidden><button type="button" id="show-exit" aria-label="Show mode is on. Tap to leave"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 10h18M6 10l1.5-5h9L18 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.5" cy="15.5" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="15.5" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.5 15.5h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>

  <!-- ============ HABITS ============ -->
  <section id="view-habits" role="tabpanel" aria-labelledby="tab-habits">
    <header class="pghead"><h1>Habits</h1><span id="habits-sub"></span></header>

    <div id="suggest-slot"></div>
    <div id="habit-list"></div>
  </section>

  <!-- ============ HOME ============ -->
  <section id="view-home" role="tabpanel" aria-labelledby="tab-home">
    <header class="pghead"><h1 id="home-hi">Hello</h1><span id="home-date"></span></header>
    <div id="home-now"></div>
    <div id="menu"></div>
    <div id="quote"></div>
  </section>

  <!-- ============ DAY ============ -->
  <section id="view-day" role="tabpanel" aria-labelledby="tab-day" hidden>

<script>
/* =========== storage =========== */

const KEY = 'paper.by.mia.v2';
const OLD = 'paper.by.mia.v1';

const blank = { habits: [], days: {}, moods: [], ideas: [], gym: {}, gymEdits: {}, food: [], order: [], compact: false, dismissed: [],
                goal: null, goal2: null, goalText: '', life: {}, grocery: [], gymSets: {}, gymPlan: {}, gymLog: [],
                penalties: [], penaltyLink: '', goalSetAt: 0, goalUnlockUntil: 0, sleep: [], routine: null, trainProfile: null, groceryLog: [] };

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      return {
        habits:    Array.isArray(d.habits)    ? d.habits    : [],
        days:      (d.days && typeof d.days === 'object') ? d.days : {},
        moods:     Array.isArray(d.moods)     ? d.moods     : [],
        ideas:     Array.isArray(d.ideas)     ? d.ideas     : [],
        gym:       (d.gym && typeof d.gym === 'object') ? d.gym : {},
        order:     Array.isArray(d.order)     ? d.order     : [],
        gymEdits:  (d.gymEdits && typeof d.gymEdits === 'object') ? d.gymEdits : {},
        food:      Array.isArray(d.food)      ? d.food      : [],
        compact:   !!d.compact,
        dismissed: Array.isArray(d.dismissed) ? d.dismissed : [],
        goal:      typeof d.goal === 'string' ? d.goal : null,
        goal2:     typeof d.goal2 === 'string' ? d.goal2 : null,
        goalText:  typeof d.goalText === 'string' ? d.goalText : '',
        goalOwn:   !!d.goalOwn,
        life:      (d.life && typeof d.life === 'object') ? d.life : {},
        grocery:   Array.isArray(d.grocery) ? d.grocery : [],
        gymSets:   (d.gymSets && typeof d.gymSets === 'object') ? d.gymSets : {},
        gymPlan:   (d.gymPlan && typeof d.gymPlan === 'object') ? d.gymPlan : {},
        gymLog:    Array.isArray(d.gymLog) ? d.gymLog : [],
        routine:   (d.routine && typeof d.routine === 'object') ? d.routine : null,
        trainProfile: (d.trainProfile && typeof d.trainProfile === 'object') ? d.trainProfile : null,
        groceryLog: Array.isArray(d.groceryLog) ? d.groceryLog : [],
        penalties: Array.isArray(d.penalties) ? d.penalties : [],
        penaltyLink: typeof d.penaltyLink === 'string' ? d.penaltyLink : '',
        goalSetAt: Number(d.goalSetAt) || 0,
        goalUnlockUntil: Number(d.goalUnlockUntil) || 0,
        sleep:     Array.isArray(d.sleep) ? d.sleep : []
      };
    }
    const old = localStorage.getItem(OLD);
    if (old) {
      const o = JSON.parse(old);
      const s = structuredClone(blank);
      if (Array.isArray(o.habits)) s.habits = o.habits;
      if (o.day && Array.isArray(o.day.blocks) && o.day.blocks.length) {
        s.days[todayKey()] = { start: o.day.start || '08:00', blocks: o.day.blocks };
      }
      return s;
    }
  } catch {}
  return structuredClone(blank);
}

function save() {
  try { recordDay(); } catch {}   // undo history for the day page
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
}

/* =========== dates =========== */

const DAYS   = ['s','m','t','w','t','f','s'];
const FULL   = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const MONTHS = ['january','february','march','april','may','june',
                'july','august','september','october','november','december'];

function key(d) {
  return d.getFullYear() + '-' +
         String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}

function todayKey() { return key(new Date()); }

function fromKey(k) { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }

function shiftKey(k, by) { const d = fromKey(k); d.setDate(d.getDate() + by); return key(d); }

let state = load();
// sleep comes from the Sleep block in your plan: bring today's saved times in line
setTimeout(() => {
  try {
    const k = todayKey(), p = planSleep(k), e = (state.sleep || []).find(x => x.k === k);
    if (p && e && (e.bed !== p.bed || e.wake !== p.wake)) { e.bed = p.bed; e.wake = p.wake; e.fromPlan = true; save(); if (typeof renderHome === 'function') renderHome(); }
  } catch {}
}, 0);
// once: split typed amounts and how you'll have it out of grocery names
// ("12 eggs, boiled" becomes Eggs, 12, boiled). a copy of the list is kept first.
try {
  if (!localStorage.getItem(KEY + '.grocTidy') && Array.isArray(state.grocery) && state.grocery.length) {
    localStorage.setItem(KEY + '.grocery-before-tidy', JSON.stringify(state.grocery));
    setTimeout(() => {
      let n = 0;
      for (const it of state.grocery) if (!it.done && tidyGrocery(it)) n++;
      if (n) { save(); if (typeof renderGroceries === 'function' && foodView === 'groc') renderGroceries(); }
      localStorage.setItem(KEY + '.grocTidy', '1');
    }, 0);
  } else localStorage.setItem(KEY + '.grocTidy', '1');
} catch {}

// once: "Meeting with X" blocks become "Meeting", with X kept as the topic
for (const k in state.days) {
  for (const b of ((state.days[k] || {}).blocks || [])) {
    const m = /^\s*meeting with\s+(.+)$/i.exec(b.label || '');
    if (m) { b.label = m[1].trim(); b.meeting = true; }
    // undo the earlier step that hid your title: "Meeting" + a topic shows the topic again
    if (/^\s*meeting\s*$/i.test(b.label || '') && b.topic) { b.label = b.topic; b.meeting = true; }
  }
}
let openHabit = null;
let monthOffset = 0;
// a new day starts when the day before it ends: if yesterday's plan is still
// running (a late night), it is still yesterday. with no plan, at midnight.
function planKey() {
  const t = todayKey(), y = shiftKey(t, -1);
  const d = typeof state !== 'undefined' && state.days ? state.days[y] : null;
  if (d && d.blocks && d.blocks.length && new Date().getHours() < 12) {
    let end = toMins(d.start);
    for (const b of d.blocks) end += Number(b.mins) || 60;
    if (Date.now() < fromKey(y).getTime() + end * 60000) return y;
  }
  return t;
}
// minutes since midnight of that plan day (so 1:30am on the night after is 1530)
function planMin(k) { return Math.floor((Date.now() - fromKey(k).getTime()) / 60000); }

let viewDay = planKey();
let noteFor = null;   // the timestamp of the check in being annotated
let sortingDay = false;
let compactDay = !!state.compact;

/* =========== colours =========== */

const PALETTE = ['#d9718e', '#86b9d9', '#e8c46a', '#93bf7f', '#a99bd4', '#e3a27a'];
const colorFor = i => PALETTE[i % PALETTE.length];

/* =========== habits =========== */

const habitList = document.getElementById('habit-list');

function streakOf(marks) {
  const set = new Set(marks);
  let n = 0;
  const d = new Date();
  if (!set.has(key(d))) d.setDate(d.getDate() - 1);
  while (set.has(key(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function lastSevenDays() {
  const out = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); out.push(d); }
  return out;
}

function renderHabits() {
  renderSuggestion();
  habitList.innerHTML = '';

  if (!state.habits.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'nothing here yet';
    habitList.appendChild(e);
    return;
  }

  const today = todayKey();

  state.habits.forEach((h, idx) => {
    const accent = h.color || colorFor(idx);
    const marks = new Set(h.marks);

    const box = document.createElement('div');
    box.className = 'box studs';
    box.style.setProperty('--accent', accent);

    const top = document.createElement('div');
    top.className = 'habit-top';

    const name = document.createElement('button');
    name.className = 'habit-name';
    name.type = 'button';
    name.textContent = h.name;
    name.addEventListener('click', () => {
      openHabit = (openHabit === h.id) ? null : h.id;
      monthOffset = 0;
      renderHabits();
    });

    const n = streakOf(h.marks);
    const streak = document.createElement('span');
    streak.className = 'streak';
    streak.textContent = n ? n + 'd' : '';

    const plus = document.createElement('button');
    plus.className = 'mark' + (marks.has(today) ? ' done' : '');
    plus.type = 'button';
    plus.textContent = marks.has(today) ? '✓' : '+';
    plus.setAttribute('aria-label', (marks.has(today) ? 'unmark ' : 'mark ') + h.name + ' today');
    plus.addEventListener('click', () => toggle(h, today));

    top.append(name, streak, plus);
    box.appendChild(top);

    const week = document.createElement('div');
    week.className = 'week';

    for (const d of lastSevenDays()) {
      const k = key(d);
      const col = document.createElement('div');
      col.className = 'day';

      const dot = document.createElement('div');
      dot.className = 'dot' + (marks.has(k) ? ' on' : '') + (k === today ? ' today' : '');

      const lbl = document.createElement('div');
      lbl.className = 'lbl';
      lbl.textContent = DAYS[d.getDay()];

      col.append(dot, lbl);
      week.appendChild(col);
    }

    box.appendChild(week);
    if (openHabit === h.id) box.appendChild(monthPanel(h));

    habitList.appendChild(box);
  });
}

function toggle(h, k) {
  const i = h.marks.indexOf(k);
  if (i === -1) h.marks.push(k); else h.marks.splice(i, 1);
  save();
  renderHabits();
  renderDay();
}

function monthPanel(h) {
  const marks = new Set(h.marks);
  const today = todayKey();

  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + monthOffset);

  const year = base.getFullYear(), month = base.getMonth();
  const first = new Date(year, month, 1).getDay();
  const days = new Date(year, month + 1, 0).getDate();

  const wrap = document.createElement('div');

  const head = document.createElement('div');
  head.className = 'month-head';

  const prev = document.createElement('button');
  prev.className = 'nav'; prev.type = 'button'; prev.textContent = '←';
  prev.addEventListener('click', () => { monthOffset--; renderHabits(); });

  const label = document.createElement('span');
  label.className = 'month-label';
  label.textContent = MONTHS[month] + ' ' + year;

  const next = document.createElement('button');
  next.className = 'nav'; next.type = 'button'; next.textContent = '→';
  next.style.opacity = monthOffset >= 0 ? '.35' : '1';
  next.addEventListener('click', () => { if (monthOffset < 0) { monthOffset++; renderHabits(); } });

  head.append(prev, label, next);
  wrap.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'grid';

  for (const d of DAYS) {
    const l = document.createElement('div');
    l.className = 'lbl'; l.textContent = d;
    grid.appendChild(l);
  }
  for (let i = 0; i < first; i++) {
    const b = document.createElement('div');
    b.className = 'cell blank';
    grid.appendChild(b);
  }

  let hits = 0;
  for (let d = 1; d <= days; d++) {
    const k = key(new Date(year, month, d));
    const on = marks.has(k);
    if (on) hits++;
    const cell = document.createElement('button');
    cell.className = 'cell' + (on ? ' on' : '') + (k === today ? ' today' : '');
    cell.type = 'button';
    cell.textContent = d;
    cell.addEventListener('click', () => toggle(h, k));
    grid.appendChild(cell);
  }

  wrap.appendChild(grid);

  const count = document.createElement('div');
  count.className = 'count';
  count.textContent = hits + ' of ' + days + ' days';
  wrap.appendChild(count);

  const del = document.createElement('button');
  del.className = 'danger'; del.type = 'button';
  del.textContent = 'delete this habit';
  del.addEventListener('click', () => {
    state.habits = state.habits.filter(x => x.id !== h.id);
    openHabit = null;
    save(); renderHabits(); renderDay();
  });
  wrap.appendChild(del);

  return wrap;
}

function addHabit(name, marks) {
  const n = (name || '').trim();
  if (!n) return;
  state.habits.push({
    id: Date.now() + '',
    name: n,
    color: colorFor(state.habits.length),
    marks: marks || []
  });
  save(); renderHabits(); renderDay();
}

/* =========== suggestion =========== */

function findSuggestions() {
  const names = new Set(state.habits.map(h => h.name.trim().toLowerCase()));
  const seen = {};

  for (let i = 0; i < 7; i++) {
    const k = shiftKey(todayKey(), -i);
    const day = state.days[k];
    if (!day) continue;
    const onThisDay = new Set();
    for (const b of day.blocks) {
      const l = (b.label || '').trim();
      if (l.length < 2) continue;
      onThisDay.add(l.toLowerCase());
    }
    for (const l of onThisDay) {
      (seen[l] = seen[l] || { days: [], label: l });
      seen[l].days.push(k);
    }
  }

  return Object.values(seen)
    .filter(x => x.days.length >= 1)
    .filter(x => !names.has(x.label))
    .filter(x => !state.dismissed.includes(x.label))
    .sort((x, y) => y.days.length - x.days.length)
    .slice(0, 5);
}

function renderSuggestion() {
  const slot = document.getElementById('suggest-slot');
  slot.innerHTML = '';

  for (const s of findSuggestions()) {
    const pretty = s.label.charAt(0).toUpperCase() + s.label.slice(1);

    const box = document.createElement('div');
    box.className = 'suggest studs';

    const p = document.createElement('p');
    p.innerHTML = s.days.length === 1
      ? 'you have <b>' + s.label + '</b> in your plan. make it a habit?'
      : 'you planned <b>' + s.label + '</b> on ' + s.days.length +
        ' of the last 7 days. make it a habit?';

    const row = document.createElement('div');
    row.className = 'row';

    const yes = document.createElement('button');
    yes.className = 'brick'; yes.type = 'button'; yes.textContent = 'track it';
    yes.addEventListener('click', () => addHabit(pretty, s.days.slice()));

    const no = document.createElement('button');
    no.className = 'brick flat'; no.type = 'button'; no.textContent = 'no thanks';
    no.addEventListener('click', () => { state.dismissed.push(s.label); save(); renderHabits(); });

    row.append(yes, no);
    box.append(p, row);
    slot.appendChild(box);
  }
}

/* =========== day =========== */

const DURATIONS = [
  { mins: 15,  label: '15m' },
  { mins: 30,  label: '30m' },
  { mins: 45,  label: '45m' },
  { mins: 60,  label: '1h' },
  { mins: 90,  label: '1h30' },
  { mins: 120, label: '2h' }
];

const PRESETS = [
  { label: 'walk',       mins: 30  },
  { label: 'deep work',  mins: 120 },
  { label: 'focus block', mins: 90 },
  { label: 'break',      mins: 15  },
  { label: 'read',       mins: 30  },
  { label: 'pray',       mins: 15  },
  { label: 'breakfast',  mins: 30  },
  { label: 'dinner',     mins: 45  },
  { label: 'movie time', mins: 120 }
];

// "FB" or "focus block" gets up to two goals
const MAX_GOALS = 2;

// meetings, dates, calls and the like get an agenda instead of goals
function isAgendaBlock(label) {
  return /\b(meeting|meet|date|1:1|1-1|one on one|interview|call|sync|stand ?up|catch ?up|review)\b/i.test(label || '');
}

// work that should have a clear outcome: what will be finished by the end
function isWorkBlock(label) {
  const t = label || '';
  return !isAgendaBlock(t) && /\b(work|deep work|study|studying|project|code|coding|write|writing|build|building|design|report|deck|research|read|reading|book)\b/i.test(t);
}
const outcomeField = label => (isFocusBlock(label) || isWorkBlock(label)) ? 'goals' : isAgendaBlock(label) ? 'agenda' : null;

function isFocusBlock(label) {
  return /^\s*(fb|focus\s*block)\b/i.test(label || '');
}

// which goal is being typed in: { b, n }. n equal to goals.length means a new one
let goalEdit = null;

// a short tickable list under a block: goals on focus blocks, an agenda on meetings and dates
const LIST_KINDS = {
  goals:  { max: MAX_GOALS, first: 'what will you finish?', next: 'second task', more: '+ second task', noun: 'task' },
  agenda: { max: 50, first: 'add a point', next: 'next point', more: '+ add a point', noun: 'agenda point' }
};

// "intro 5m", "budget 10 min", "demo 1h": the time written in an agenda point
const AG_TIME = /\s*\b(\d+(?:\.\d+)?)\s*(m|min|mins|minutes?|h|hr|hrs|hours?)\b\.?\s*$/i;
const AG_TIME_START = /^\s*(\d+(?:\.\d+)?)\s*(m|min|mins|minutes?|h|hr|hrs|hours?)\b\.?\s*/i;
function agendaTime(text) {
  const m = String(text || '').match(AG_TIME) || String(text || '').match(AG_TIME_START);
  if (!m) return null;
  const n = Number(m[1]);
  return Math.round(/^h/i.test(m[2]) ? n * 60 : n);
}

// an agenda point broken down into small to-dos. ticking them all ticks the point
let todoEdit = null;   // { g, n } while typing one
let listSheet = null;  // { b, field, from } while the goals or agenda panel is open

function openListSheet(b, field, from) {
  listSheet = { b, field, from };
  // an empty list opens straight into typing, once, when the panel opens
  if (!(b[field] || []).length) goalEdit = { b, n: 0, f: field };
  paintListSheet();
}

function paintListSheet() {
  const old = document.getElementById('listsheet');
  if (!listSheet) { if (old) old.remove(); return; }
  const { b, field, from } = listSheet;
  const keepScroll = old ? old.querySelector('.w3-sheet').scrollTop : 0;
  if (old) old.remove();
  const el = document.createElement('div');
  el.id = 'listsheet';
  el.className = 'w3' + (old ? ' still' : '');
  el.innerHTML = '<div class="w3-back"></div><div class="w3-sheet ls-sheet" role="dialog" aria-modal="true">' +
    '<span class="w3-grab"></span><div class="ls-head"><div><small>' + (field === 'agenda' ? 'Agenda' : 'Tasks') + '</small><h2></h2></div>' +
    '<button type="button" class="ls-x" aria-label="close">\u00d7</button></div><div class="ls-body"></div>' +
    '<button type="button" class="lf-btn main ls-done">Done</button></div>';
  el.querySelector('h2').textContent = b.label || 'block';
  el.querySelector('.ls-body').appendChild(goalList(b, field, from));
  const close = () => { listSheet = null; goalEdit = null; todoEdit = null; el.remove(); renderDay(); };
  el.querySelector('.w3-back').addEventListener('click', close);
  el.querySelector('.ls-done').addEventListener('click', close);
  el.querySelector('.ls-x').addEventListener('click', close);
  document.getElementById('view-day').appendChild(el);   // inside the day page so its styles apply
  el.querySelector('.w3-sheet').scrollTop = keepScroll;
}

function goalList(b, field, from) {
  field = field || 'goals';
  const K = LIST_KINDS[field];
  if (!Array.isArray(b[field])) b[field] = [];
  const L = b[field];

  const wrap = document.createElement('div');
  wrap.className = 'goals' + (field === 'agenda' ? ' agenda' : '');
  if (K.title) {
    const h = document.createElement('span');
    h.className = 'glist-title';
    h.textContent = K.title;
    wrap.appendChild(h);
  }

  const editing = n => goalEdit && goalEdit.b === b && goalEdit.n === n && (goalEdit.f || 'goals') === field;

  // a text box for writing a goal; 16px so iOS does not zoom
  const editor = (g, n) => {
    const txt = document.createElement('textarea');
    txt.className = 'gtext';
    txt.rows = 1;
    txt.maxLength = 120;
    txt.placeholder = n === 0 ? K.first : K.next;
    txt.value = g ? g.text : '';
    txt.setAttribute('aria-label', K.noun);
    const fit = () => { txt.style.height = 'auto'; txt.style.height = txt.scrollHeight + 'px'; };
    txt.addEventListener('input', fit);
    txt.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); txt.blur(); } });
    txt.addEventListener('blur', () => {
      const v = txt.value.trim();
      if (g && !v) L.splice(L.indexOf(g), 1);          // cleared, so drop it
      else if (g) g.text = v;
      else if (v && L.length < K.max) L.push({ text: v, done: false });
      goalEdit = null;
      save(); renderDay();
    });
    setTimeout(fit, 0);
    if (editing(n)) setTimeout(() => { txt.focus(); fit(); }, 30);
    return txt;
  };

  // agenda points with a time run one after another from the start of the block
  const slots = [];
  if (field === 'agenda' && typeof from === 'number') {
    let at = fromKey(viewDay).getTime() + from * 60000;
    for (const g of L) {
      const m = agendaTime(g.text);
      slots.push(m ? { start: at, end: (at += m * 60000), m } : null);
    }
  }

  L.slice(0, K.max).forEach((g, n) => {
    const row = document.createElement('div');
    row.className = 'goal' + (g.done ? ' done' : '');

    const tick = document.createElement('button');
    tick.className = 'gtick' + (g.done ? ' on' : '');
    tick.type = 'button';
    tick.textContent = field === 'agenda' && !g.done ? String(n + 1) : '✓';
    if (field === 'agenda') tick.classList.add('num');
    tick.setAttribute('aria-label', g.done ? K.noun + ' not done' : K.noun + ' done');
    tick.addEventListener('click', () => { g.done = !g.done; save(); renderDay(); });

    let body;
    if (editing(n)) {
      body = editor(g, n);
    } else {
      // reading: smaller text that wraps, tap to change it
      body = document.createElement('button');
      body.type = 'button';
      body.className = 'gview';
      const slot = slots[n];
      body.textContent = slot ? g.text.replace(AG_TIME, '').replace(AG_TIME_START, '') : g.text;
      if (slot) {
        const now = Date.now(), t = document.createElement('span');
        t.className = 'ag-t';
        if (!g.done && now >= slot.start && now < slot.end) {
          t.classList.add('live'); t.dataset.end = slot.end; t.textContent = fmtLeft(slot.end - now);
        } else if (!g.done && now >= slot.end && viewDay === todayKey()) {
          t.classList.add('over'); t.textContent = 'time up';
        } else t.textContent = minsLabel(slot.m);
        body.appendChild(t);
      }
      body.setAttribute('aria-label', K.noun + ': ' + g.text + '. tap to change');
      body.addEventListener('click', () => { goalEdit = { b, n, f: field }; renderDay(); });
    }
    row.append(tick, body);
    wrap.appendChild(row);
    if (field === 'agenda') wrap.appendChild(todoList(g));
  });

  const n = L.length;
  if (n === 0 && !editing(0)) {
    // nothing yet: no line under the block. the row gets a small + instead
    wrap.dataset.empty = field;
  } else if (n === 0 || editing(n)) {
    // no goals yet, or writing the second one
    const row = document.createElement('div');
    row.className = 'goal';
    const dot = document.createElement('span');
    dot.className = 'gtick ghost';
    row.append(dot, editor(null, n));
    wrap.appendChild(row);
  } else if (n < K.max) {
    // one goal is fine; a second is there if you want it
    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'gmore';
    more.textContent = K.more;
    more.addEventListener('click', () => { goalEdit = { b, n, f: field }; renderDay(); });
    wrap.appendChild(more);
  }

  return wrap;
}

function nowHHMM() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function dayFor(k) {
  // a day you have not planned yet starts from right now
  if (!state.days[k]) state.days[k] = { start: nowHHMM(), blocks: [] };
  return state.days[k];
}

function toMins(hhmm) { const [h,m] = (hhmm || '08:00').split(':').map(Number); return (h*60)+m; }

function clock(mins) {
  mins = ((mins % 1440) + 1440) % 1440;
  const h24 = Math.floor(mins / 60), m = mins % 60;
  return ((h24 % 12) || 12) + ':' + String(m).padStart(2, '0') + (h24 < 12 ? 'am' : 'pm');
}

// accepts 9:05, 905, 9.05, 9, 9pm, 21:05 ... returns minutes past midnight
function parseTime(txt, after) {
  let t = String(txt).trim().toLowerCase().replace(/\s+/g, '').replace(/\./g, ':');
  let pm = null;
  if (t.endsWith('pm')) { pm = true;  t = t.slice(0, -2); }
  else if (t.endsWith('am')) { pm = false; t = t.slice(0, -2); }
  if (t.endsWith('p')) { pm = true;  t = t.slice(0, -1); }
  else if (t.endsWith('a')) { pm = false; t = t.slice(0, -1); }

  let h, m;
  if (t.indexOf(':') > -1) {
    const bits = t.split(':');
    h = Number(bits[0]); m = Number(bits[1] || 0);
  } else if (/^\d{3,4}$/.test(t)) {
    h = Number(t.slice(0, t.length - 2)); m = Number(t.slice(-2));
  } else if (/^\d{1,2}$/.test(t)) {
    h = Number(t); m = 0;
  } else {
    return null;
  }

  if (isNaN(h) || isNaN(m) || m > 59 || h > 23) return null;
  if (pm === true  && h < 12)  h += 12;
  if (pm === false && h === 12) h = 0;

  let mins = (h * 60) + m;

  if (pm === null && h < 12) {
    if (after === null || after === undefined) {
      // a day starts in the morning: 5 upwards is am, 1 to 4 is the afternoon
      if (h >= 1 && h <= 4) mins += 720;
    } else if (mins <= after) {
      mins += 720;              // must land after whatever it follows
    }
  }
  return mins;
}

// how long something runs: 2, 1.5, 1h30, 1:30, 90m
function parseDur(txt) {
  const t = String(txt).trim().toLowerCase().replace(/\s+/g, '');
  if (!t) return null;
  let m;

  m = t.match(/^(\d+(?:\.\d+)?)h(\d+)?m?$/);              // 2h, 1h30, 1h30m
  if (m) return Math.round(Number(m[1]) * 60) + (m[2] ? Number(m[2]) : 0);

  m = t.match(/^(\d+)m$/);                                  // 45m
  if (m) return Number(m[1]);

  m = t.match(/^(\d+):(\d{1,2})$/);                         // 1:30
  if (m) return (Number(m[1]) * 60) + Number(m[2]);

  m = t.match(/^\d+\.\d+$/);                               // 1.5 hours
  if (m) return Math.round(Number(t) * 60);

  m = t.match(/^(\d+)$/);                                   // a bare number
  if (m) {
    const n = Number(m[1]);
    return n <= 12 ? n * 60 : n;     // small means hours, large means minutes
  }
  return null;
}

function hhmm(mins) {
  mins = ((mins % 1440) + 1440) % 1440;
  return String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
}

function dur(m) {
  m = Math.max(0, Math.round(m));
  const h = Math.floor(m / 60), r = m % 60;
  if (!h) return r + 'm';
  if (!r) return h + 'h';
  return h + 'h ' + r + 'm';
}

function minsLabel(m) {
  const h = Math.floor(m / 60), r = m % 60;
  if (!h) return r + 'm';
  if (!r) return h + 'h';
  return h + 'h' + r;
}

/* ---- motion on the day page ----
   the page is redrawn from scratch on every change, so anything that
   should animate remembers its last value and moves from there. */
// on today, scroll to the block running now (or the next one not done) and make it glow
function showUpNext() {
  if (viewDay !== planKey()) return;
  const day = state.days[viewDay];
  if (!day || !day.blocks.length) return;
  const nowM = planMin(viewDay);
  let at = toMins(day.start), pick = -1;
  day.blocks.forEach((b, i) => { const len = Number(b.mins) || 60; if (pick < 0 && !b.done && nowM < at + len) pick = i; at += len; });
  if (pick < 0) pick = day.blocks.findIndex(b => !b.done);
  if (pick < 0) return;
  const row = document.querySelector('#block-list .line[data-i="' + pick + '"]');
  if (!row) return;
  row.classList.add('upnext');
  // only scroll if it is not already comfortably on screen
  const r = row.getBoundingClientRect();
  if (r.top < 80 || r.bottom > innerHeight - 110) {
    window.scrollTo({ top: Math.max(0, scrollY + r.top - 120), behavior: 'smooth' });
  }
  setTimeout(() => row.classList.remove('upnext'), 2600);
}

// the blocks still to come today, with their start times
function upcomingStarts(day) {
  const nowM = planMin(viewDay);
  let at = toMins(day.start);
  const out = [];
  for (const b of day.blocks) {
    const len = Number(b.mins) || 60;
    if (!b.done && at > nowM) out.push({ at: at % 1440, label: b.label || 'next block' });
    at += len;
  }
  return out;
}

const REST_KINDS = [['Break', 15], ['Walk', 30], ['Nap', 20], ['Shower', 15], ['Movie time', 120], ['Music', 30], ['Pray', 15], ['Do nothing', 15]];
let pickStep = null;   // { b, step: 'rest' | 'meet' }

function usualLabels(n) {
  const tally = {}, keep = {};
  const skip = /^(work|workout|meeting|break|walk|nap|shower|movie time|music|pray|do nothing)$/i;
  for (let i = 1; i <= 30; i++) {
    for (const b of ((state.days[shiftKey(planKey(), -i)] || {}).blocks || [])) {
      const t = (b.label || '').trim(); if (!t || skip.test(t)) continue;
      const k = t.toLowerCase(); tally[k] = (tally[k] || 0) + 1; keep[k] = keep[k] || { t, mins: b.mins };
    }
  }
  return Object.keys(tally).filter(k => tally[k] >= 2).sort((a, b) => tally[b] - tally[a]).slice(0, n).map(k => keep[k]);
}

    chip('Done', go, 'go');
    setTimeout(() => inp.focus(), 30);
    return wrap;
  }
  chip('Work', () => set('Work', 60));
  chip('Rest ›', () => { pickStep = { b, step: 'rest' }; renderDay(); });
  chip('Meeting ›', () => { pickStep = { b, step: 'meet' }; renderDay(); });
  chip('Workout', () => set('Workout', 60));
  usualLabels(4).forEach(x => chip(x.t, () => set(x.t, Number(x.mins) || null), 'mine'));
  return wrap;
}

/* press and hold a block to add a new one straight after it.
   done blocks stay at the top, so holding one of those adds below them all. */
function holdToAdd(row, day, i, firstOpen) {
  let timer = null, x0 = 0, y0 = 0, held = false;
  const cancel = () => { clearTimeout(timer); timer = null; row.classList.remove('holding'); };

  row.addEventListener('pointerdown', e => {
    if (e.target.closest('input, textarea, select')) return;   // leave typing alone
    held = false; x0 = e.clientX; y0 = e.clientY;
    row.classList.add('holding');
    timer = setTimeout(() => {
      timer = null; held = true;
      row.classList.remove('holding');
      try { navigator.vibrate && navigator.vibrate(12); } catch {}
      const at = Math.max(i + 1, firstOpen);
      day.blocks.splice(at, 0, { label: '', mins: 30, done: false });
      focusNew = at; customFor = null;
      save(); renderDay(); renderHabits();
    }, 550);
  });
  row.addEventListener('pointermove', e => {
    if (timer && Math.hypot(e.clientX - x0, e.clientY - y0) > 8) cancel();   // it's a scroll
  });
  row.addEventListener('pointerup', cancel);
  row.addEventListener('pointercancel', cancel);
  row.addEventListener('pointerleave', cancel);
  row.addEventListener('contextmenu', e => e.preventDefault());
  // a hold must not also count as a tap on whatever was under the finger
  row.addEventListener('click', e => { if (held) { held = false; e.stopPropagation(); e.preventDefault(); } }, true);
}

/* ---- the "now" card ----
   what you should be doing right now: time in, time left, on a ring
   that fills as the block runs. it ticks every second by itself. */
let nowTimer = null;

function fmtLeft(ms) {
  const t = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, sec = t % 60;
  return h ? h + 'h ' + String(m).padStart(2, '0') + 'm' : m + ':' + String(sec).padStart(2, '0');
}

function fmtIn(ms) {
  const m = Math.max(0, Math.floor(ms / 60000));
  return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
}

function nowCard(day) {
  const base = fromKey(viewDay).getTime();
  let at = toMins(day.start);
  const wins = day.blocks.map((b, i) => {
    const len = Number(b.mins) || 60;
    const w = { b, i, from: at, a: base + at * 60000, z: base + (at + len) * 60000 };
    at += len;
    return w;
  });

  const R = 44, C = 2 * Math.PI * R;
  const card = document.createElement('div');
  card.className = 'nowcard';
  card.innerHTML =
    '<div class="nc-ring">' +
      '<svg viewBox="0 0 104 104" aria-hidden="true">' +
        '<defs><linearGradient id="ncg" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0" stop-color="var(--pink)"/><stop offset="1" stop-color="#f0b48c"/>' +
        '</linearGradient></defs>' +
        '<circle class="nc-track" cx="52" cy="52" r="' + R + '"/>' +
        '<circle class="nc-arc" cx="52" cy="52" r="' + R + '" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '"/>' +
      '</svg>' +
      '<div class="nc-mid"><b class="nc-left"></b><span class="nc-unit"></span></div>' +
    '</div>' +
    '<div class="nc-info">' +
      '<span class="nc-tag"><i></i><span class="nc-tagtext"></span></span>' +
      '<b class="nc-name"></b>' +
      '<span class="nc-in"></span>' +
      '<span class="nc-next"></span>' +
    '</div>';

  // when a focus block or meeting is on (or up first), its buttons sit here
  {
    const now = Date.now();
    let w = wins.find(x => now >= x.a && now < x.z) || (now < wins[0].a ? wins[0] : null);
    // the clock can be off from real life (you started late or ran over).
    // if the block you are actually on, the first one not ticked, is a focus block, use that
    const open = wins.find(x => !x.b.done);
    if (open && isFocusBlock(open.b.label) && (!w || w.b.done || !isFocusBlock(w.b.label) && !isAgendaBlock(w.b.label))) w = open;
    if (w && !w.b.done) {
      const f = w.b.meeting ? 'agenda' : outcomeField(w.b.label);
      if (f) {
        const acts = document.createElement('div');
        acts.className = 'nc-acts';
        const L = w.b[f] || [];
        const lb = document.createElement('button');
        lb.type = 'button';
        lb.className = 'nc-act';
        lb.textContent = L.length ? (f === 'agenda' ? 'Agenda ' : 'Tasks ') + L.filter(x => x.done).length + '/' + L.length
                                  : (f === 'agenda' ? '+ Add agenda' : '+ Add task');
        lb.addEventListener('click', () => openListSheet(w.b, f, w.from));
        acts.appendChild(lb);
        if (f === 'goals' && (now >= w.a || w === open)) {
          const go = document.createElement('button');
          go.type = 'button';
          go.className = 'nc-act grow';
          go.textContent = '\u{1F331} Focus';
          go.addEventListener('click', () => openFocus(w.b, w.from, Number(w.b.mins) || 60));
          acts.appendChild(go);
        }
        card.appendChild(acts);
      }
    }
  }

  const $ = c => card.querySelector(c);
  let shown = null;   // which state was drawn, so a change can redraw the page

  const paint = () => {
    const now = Date.now();
    const cur = wins.find(w => now >= w.a && now < w.z);
    const first = wins[0], last = wins[wins.length - 1];
    let key, frac;

    if (cur) {
      key = 'b' + cur.i;
      frac = (now - cur.a) / (cur.z - cur.a);
      card.className = 'nowcard live';
      $('.nc-tagtext').textContent = 'Now';
      $('.nc-name').textContent = cur.b.label || 'unnamed block';
      $('.nc-left').textContent = fmtLeft(cur.z - now);
      $('.nc-unit').textContent = 'left';
      $('.nc-in').innerHTML = '<b>' + fmtIn(now - cur.a) + '</b> in · ends ' + clock(cur.from + (Number(cur.b.mins) || 60));
      const nx = wins[cur.i + 1];
      $('.nc-next').innerHTML = nx ? 'Up next: <b>' + esc(nx.b.label || 'unnamed block') + '</b> at ' + clock(nx.from) : 'Last one today';
    } else if (now < first.a) {
      key = 'before';
      frac = 0;
      card.className = 'nowcard waiting';
      $('.nc-tagtext').textContent = 'Starts soon';
      $('.nc-name').textContent = first.b.label || 'unnamed block';
      $('.nc-left').textContent = fmtLeft(first.a - now);
      $('.nc-unit').textContent = 'to go';
      $('.nc-in').textContent = 'starts at ' + clock(first.from);
      $('.nc-next').textContent = '';
    } else {
      key = 'after';
      frac = 1;
      const done = day.blocks.filter(b => b.done).length;
      card.className = 'nowcard over';
      $('.nc-tagtext').textContent = 'Plan finished';
      $('.nc-name').textContent = done === day.blocks.length ? 'Everything done' : done + ' of ' + day.blocks.length + ' done';
      $('.nc-left').textContent = '✓';
      $('.nc-unit').textContent = '';
      $('.nc-in').textContent = 'ended at ' + clock(last.from + (Number(last.b.mins) || 60));
      $('.nc-next').textContent = '';
    }

    $('.nc-arc').style.strokeDashoffset = C * (1 - Math.min(1, Math.max(0, frac)));
    if (shown !== null && shown !== key) { renderDay(); return; }   // moved to the next block
    shown = key;
  };

  paint();
  nowTimer = setInterval(() => {
    if (!card.isConnected) { clearInterval(nowTimer); return; }
    paint();
  }, 1000);
  return card;
}

// an earlier day with blocks still to tick: what is left, and two ways to settle it
function pastCard(day) {
  const total = day.blocks.length, done = day.blocks.filter(b => b.done).length, left = total - done;
  const d = fromKey(viewDay);
  const name = viewDay === shiftKey(planKey(), -1) ? 'Yesterday' : cap(FULL[d.getDay()]);
  const card = document.createElement('div');
  card.className = 'nowcard past';
  card.innerHTML =
    '<div class="nc-row1"><span class="nc-tag"><i></i><span class="nc-tagtext">' + name + '</span></span><span class="nc-in">' + done + ' of ' + total + ' done</span></div>' +
    '<b class="nc-name">' + left + ' block' + (left > 1 ? 's' : '') + ' left to tick</b>' +
    '<i class="nc-bar"><u class="nc-fill" style="width:' + Math.round(done / total * 100) + '%"></u></i>' +
    '<div class="nc-dots">' + day.blocks.map(b => '<span class="' + (b.done ? 'd' : 'm') + '"></span>').join('') + '</div>' +
    '<div class="nc-acts"><button type="button" class="nc-act" data-a="all">Tick the rest</button>' +
    '<button type="button" class="nc-act" data-a="move">Move to today</button></div>';
  card.querySelector('[data-a=all]').addEventListener('click', () => {
    for (const b of day.blocks) {
      if (b.done) continue;
      b.done = true;
      const h = habitNamed(b.label);
      if (h && !h.marks.includes(viewDay)) h.marks.push(viewDay);
    }
    save(); renderDay(); renderHabits();
  });
  card.querySelector('[data-a=move]').addEventListener('click', () => {
    const moving = day.blocks.filter(b => !b.done);
    day.blocks = day.blocks.filter(b => b.done);
    const t = dayFor(planKey());
    t.blocks.push(...moving.map(b => ({ ...b, done: false })));
    t.touched = true;
    save(); viewDay = planKey(); renderDay(); renderHabits(); window.scrollTo(0, 0);
  });
  return card;
}

// shading shared by every drawing: gradients for petals, leaves, stem, pot
function flowerDefs(p) {
  const [lt, dk] = p.petal;
  return '<defs>' +
    '<linearGradient id="flP" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="' + dk + '"/><stop offset=".75" stop-color="' + lt + '"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>' +
    '<linearGradient id="flPd" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="' + dk + '"/><stop offset="1" stop-color="' + dk + '" stop-opacity=".75"/></linearGradient>' +
    '<radialGradient id="flM" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".35" stop-color="' + p.mid + '"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>' +
    '<linearGradient id="flL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9f2c6"/><stop offset=".35" stop-color="' + p.leaf + '"/><stop offset="1" stop-color="#1f4a24"/></linearGradient>' +
    '<linearGradient id="flS" gradientUnits="userSpaceOnUse" x1="19.2" y1="0" x2="20.8" y2="0"><stop offset="0" stop-color="#3d6e33"/><stop offset=".5" stop-color="#8cc46f"/><stop offset="1" stop-color="#3d6e33"/></linearGradient>' +
    '<linearGradient id="flPot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".35" stop-color="#fff" stop-opacity=".28"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient>' +
    '<radialGradient id="flSoil" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#6b4a32"/><stop offset="1" stop-color="#2e1d12"/></radialGradient>' +
    '<filter id="flSh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy=".8" stdDeviation=".7" flood-color="#000" flood-opacity=".45"/></filter>' +
    '</defs>';
}

// one petal pointing up from (cx, cy), then turned by angle a
function petal(cx, cy, r, a, shape, fill, sx) {
  const w = shape === 'point' ? r * .42 : r * .62;
  const d = shape === 'point'
    ? 'M' + cx + ' ' + cy + ' C' + (cx - w) + ' ' + (cy - r * .45) + ' ' + (cx - w * .5) + ' ' + (cy - r * .9) + ' ' + cx + ' ' + (cy - r) +
      ' C' + (cx + w * .5) + ' ' + (cy - r * .9) + ' ' + (cx + w) + ' ' + (cy - r * .45) + ' ' + cx + ' ' + cy + 'Z'
    : 'M' + cx + ' ' + cy + ' C' + (cx - w * 1.2) + ' ' + (cy - r * .4) + ' ' + (cx - w) + ' ' + (cy - r * 1.05) + ' ' + cx + ' ' + (cy - r) +
      ' C' + (cx + w) + ' ' + (cy - r * 1.05) + ' ' + (cx + w * 1.2) + ' ' + (cy - r * .4) + ' ' + cx + ' ' + cy + 'Z';
  return '<path d="' + d + '" fill="url(#' + fill + ')" stroke="#000" stroke-opacity=".08" stroke-width=".2" transform="rotate(' + a + ' ' + cx + ' ' + cy + ')"/>';
}

// a full flower head, tilted a little toward you so it looks round
function flowerHead(cx, cy, r, p) {
  if (p.tulip) {
    return '<g filter="url(#flSh)">' +
      '<path d="M' + (cx - r * .8) + ' ' + (cy - r * .2) + ' Q' + (cx - r * .9) + ' ' + (cy - r * 1.3) + ' ' + (cx - r * .3) + ' ' + (cy - r * 1.4) + ' Q' + cx + ' ' + (cy - r * .6) + ' ' + cx + ' ' + (cy + r * .5) + ' Z" fill="url(#flPd)"/>' +
      '<path d="M' + (cx + r * .8) + ' ' + (cy - r * .2) + ' Q' + (cx + r * .9) + ' ' + (cy - r * 1.3) + ' ' + (cx + r * .3) + ' ' + (cy - r * 1.4) + ' Q' + cx + ' ' + (cy - r * .6) + ' ' + cx + ' ' + (cy + r * .5) + ' Z" fill="url(#flPd)"/>' +
      '<path d="M' + (cx - r * .75) + ' ' + (cy - r * .5) + ' Q' + (cx - r * .5) + ' ' + (cy + r * .7) + ' ' + cx + ' ' + (cy + r * .6) + ' Q' + (cx + r * .5) + ' ' + (cy + r * .7) + ' ' + (cx + r * .75) + ' ' + (cy - r * .5) +
        ' Q' + (cx + r * .3) + ' ' + (cy - r * 1.6) + ' ' + cx + ' ' + (cy - r * 1.2) + ' Q' + (cx - r * .3) + ' ' + (cy - r * 1.6) + ' ' + (cx - r * .75) + ' ' + (cy - r * .5) + 'Z" fill="url(#flP)"/>' +
      '<path d="M' + (cx - r * .25) + ' ' + (cy - r * .9) + ' Q' + (cx - r * .4) + ' ' + cy + ' ' + (cx - r * .1) + ' ' + (cy + r * .4) + '" stroke="#fff" stroke-opacity=".35" stroke-width=".5" fill="none"/></g>';
  }
  let out = '';
  for (let L = 0; L < p.rings; L++) {
    const rr = r * (1 - L * (p.rings > 2 ? .2 : .28));
    const off = L * (180 / p.n) + (L % 2 ? 9 : 0);
    const fill = L === 0 && p.rings > 1 ? 'flPd' : 'flP';
    for (let i = 0; i < p.n; i++) out += petal(cx, cy, rr, off + i * 360 / p.n, p.shape, fill);
  }
  const midR = p.disc ? r * .42 : r * .2;
  out += '<circle cx="' + cx + '" cy="' + cy + '" r="' + midR + '" fill="url(#flM)"/>';
  if (p.disc) for (let i = 0; i < 14; i++) {
    const a = i * 2.4, d = Math.sqrt(i + .5) * midR * .24;
    out += '<circle cx="' + (cx + Math.cos(a) * d).toFixed(2) + '" cy="' + (cy + Math.sin(a) * d).toFixed(2) + '" r="' + (midR * .08).toFixed(2) + '" fill="#2a160a" opacity=".6"/>';
  }
  if (p.k === 'lily' || p.k === 'lotus') for (let i = 0; i < 5; i++) {
    const a = (-90 + (i - 2) * 22) * Math.PI / 180;
    out += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + Math.cos(a) * r * .55).toFixed(2) + '" y2="' + (cy + Math.sin(a) * r * .55).toFixed(2) + '" stroke="#7a9a3a" stroke-width=".25"/>' +
           '<circle cx="' + (cx + Math.cos(a) * r * .55).toFixed(2) + '" cy="' + (cy + Math.sin(a) * r * .55).toFixed(2) + '" r=".55" fill="' + p.mid + '"/>';
  }
  return '<g filter="url(#flSh)" transform="translate(' + cx + ' ' + cy + ') scale(1 .82) translate(' + (-cx) + ' ' + (-cy) + ')">' + out + '</g>';
}

// the top: a closed bud at stage 4, the open flower at stage 5
function plantTop(p, stage) {
  if (stage < 4) return '';
  if (stage === 4) {
    return '<g filter="url(#flSh)"><path d="M20 13 C17 11 17.5 7 20 5 C22.5 7 23 11 20 13Z" fill="url(#flP)"/>' +
           '<path d="M20 13.5 C18 12.5 17.6 10.5 18.2 9.6 L20 11 L21.8 9.6 C22.4 10.5 22 12.5 20 13.5Z" fill="url(#flL)"/></g>';
  }
  if (p.many) return [[13, 14, 3.4], [27, 13, 3.6], [20, 8, 4.2], [16, 6, 2.8], [24.5, 6.5, 2.8]].map(([x, y, r]) => flowerHead(x, y, r, p)).join('');
  return flowerHead(20, 10, p.tulip ? 5.4 : p.k === 'sunflower' ? 8 : 7, p);
}

function potSVG(pot) {

const leafPath = (x, y, dx, dy) => {
  // a leaf from (x, y) out to (x+dx, y+dy), curved, with a vein down the middle
  const mx = x + dx / 2, my = y + dy / 2, nx = -dy * .35, ny = dx * .35;
  return '<path d="M' + x + ' ' + y + ' Q' + (mx + nx) + ' ' + (my + ny) + ' ' + (x + dx) + ' ' + (y + dy) + ' Q' + (mx - nx) + ' ' + (my - ny) + ' ' + x + ' ' + y + 'Z" fill="url(#flL)"/>' +
         '<path d="M' + x + ' ' + y + ' Q' + (mx + nx * .2) + ' ' + (my + ny * .2) + ' ' + (x + dx * .9) + ' ' + (y + dy * .9) + '" stroke="#d9f2c6" stroke-opacity=".5" stroke-width=".3" fill="none"/>';
};

// 0 seed · 1 sprout · 2 leaves · 3 more leaves · 4 bud · 5 in bloom
function plantSVG(stage, was, plant, pot) {
  plant = plant || ROOM_PLANTS[0]; pot = pot || ROOM_POTS[0];
  const g = n => (n > was ? ' class="grow"' : '');
  const stem = (y1, y2) => '<path d="M20 ' + y1 + ' V' + y2 + '" stroke="url(#flS)" stroke-width="1.6" stroke-linecap="round"/>';
  const p = [];
  if (stage === 0) p.push('<ellipse cx="20" cy="35.6" rx="1.8" ry="1.2" fill="#a0784f"/><ellipse cx="19.6" cy="35.2" rx=".6" ry=".35" fill="#fff" opacity=".4"/>');
  if (stage >= 1) p.push('<g' + g(1) + '>' + stem(36, 30) + leafPath(20, 31.5, -5, -3.5) + leafPath(20, 31.5, 5, -3.5) + '</g>');
  if (stage >= 2) p.push('<g' + g(2) + '>' + stem(30.2, 23) + leafPath(20, 26.5, -8.5, -5) + '</g>');
  if (stage >= 3) p.push('<g' + g(3) + '>' + stem(23.2, 16.5) + leafPath(20, 20.5, 8, -5) + '</g>');
  if (stage >= 4) p.push('<g' + g(4) + '>' + stem(16.7, 11.5) + '</g>');
  if (stage >= 4) p.push('<g' + (stage > was ? ' class="' + (stage === 5 ? 'bloom' : 'grow') + '"' : '') + '>' + plantTop(plant, stage) + '</g>');
  // each drawing gets its own shading names, so two on one page do not mix colours
  const uid = 'fl' + (++plantSVG.n || (plantSVG.n = 1)) + '_';
  return ('<svg viewBox="0 0 40 50" aria-hidden="true">' + flowerDefs(plant) + '<g class="sway">' + p.join('') + '</g>' + potSVG(pot) + '</svg>')
    .replace(/(url\(#|id=")fl/g, '$1' + uid);
}

function tickFocus() {
  if (!focus) return;
  const now = Date.now();
  const f = (now - focus.start) / Math.max(1, focus.end - focus.start);
  const stage = stageAt(f);
  const el = document.getElementById('focus');

  if (stage !== focus.stage) {
    if (focus.stage >= 0 && focus.changes.has(stage)) {
      focus.pot = pick(ROOM_POTS.filter(p => p !== focus.pot));    // a new pot along the way
    }
    el.querySelector('.fx-plant').innerHTML = plantSVG(stage, focus.stage < 0 ? stage : focus.stage, focus.plant, focus.pot);
    focus.stage = stage;
  }

  // the black warms, slowly, as the session goes on
  const k = Math.min(1, Math.max(0, f));
  const mix = (a, b2) => Math.round(a + (b2 - a) * k);
  el.style.backgroundColor = 'rgb(' + mix(13, 34) + ',' + mix(12, 23) + ',' + mix(13, 16) + ')';

  if (now - focus.textAt >= 3 * 60000) roomText();

  const left = Math.max(0, focus.end - now);
  const m = Math.floor(left / 60000), sec = Math.floor(left / 1000) % 60;
  el.querySelector('.fx-left').textContent = stage === 5 ? 'Fully grown'
    : (m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') + ':' + String(sec).padStart(2, '0')
               : m + ':' + String(sec).padStart(2, '0'));
  el.querySelector('.fx-arc').style.strokeDashoffset = 879.6 * (1 - k);
  el.querySelector('.fx-plant').classList.toggle('done', stage === 5);

  if (stage === 5) {
    clearInterval(focus.timer);
    el.classList.add('grown');
    const n = focus.leaves || 0;
    el.querySelector('.fx-ends').textContent = n === 0 ? 'you stayed with it the whole way'
      : 'you left the room ' + (n === 1 ? 'once' : n === 2 ? 'twice' : n + ' times');
    el.querySelector('.fx-note').textContent = '';
    el.querySelector('.fx-growing').textContent = focus.plant.name + ' is fully grown';
    el.querySelector('.fx-done').hidden = false;
  }
}

/* ---- undo for the day page ----
   every save compares the viewed day with how it looked last time.
   if it changed, the old version goes on a stack. fast edits (typing)
   within a second collapse into one step. */
const UNDO_MAX = 50;
let dayHist = [];          // [{ k, day, habits }] oldest first
let daySnap = null;        // how the viewed day looked at the last save
let lastPush = 0;
let undoing = false;

function snapNow() {
  return { k: viewDay,
           day: JSON.stringify(state.days[viewDay] || null),
           habits: JSON.stringify(state.habits) };
}

function recordDay() {
  if (undoing) return;
  const cur = snapNow();
  if (!daySnap || daySnap.k !== cur.k) { daySnap = cur; return; }
  if (daySnap.day === cur.day && daySnap.habits === cur.habits) return;
  const t = Date.now();
  if (t - lastPush > 1000) {
    dayHist.push(daySnap);
    if (dayHist.length > UNDO_MAX) dayHist.shift();
    lastPush = t;
  }
  daySnap = cur;
  updateUndo();
}

function updateUndo() {
  const btn = document.getElementById('day-undo');
  if (btn) btn.disabled = !dayHist.some(h => h.k === viewDay);
}

function undoDay() {
  let i = dayHist.length - 1;
  while (i >= 0 && dayHist[i].k !== viewDay) i--;
  if (i < 0) return;
  const prev = dayHist.splice(i, 1)[0];
  const d = JSON.parse(prev.day);
  if (d) state.days[prev.k] = d; else delete state.days[prev.k];
  state.habits = JSON.parse(prev.habits);
  customFor = null;
  undoing = true;
  save();
  undoing = false;
  daySnap = snapNow();
  lastPush = 0;
  renderDay(); renderHabits();
}

// how long you usually give a block with this name, from past days
function usualLength(label) {
  const name = String(label || '').trim().toLowerCase();
  if (!name) return null;
  const count = {};
  for (const k in state.days) {
    if (k === viewDay) continue;
    for (const x of (state.days[k].blocks || [])) {
      if (String(x.label || '').trim().toLowerCase() === name) count[x.mins] = (count[x.mins] || 0) + 1;
    }
  }
  const best = Object.entries(count).sort((a, b) => b[1] - a[1])[0];
  return best && best[1] >= 2 ? Number(best[0]) : null;
}

/* change a block's length. it stays open while you adjust, so you can tap
   +5 a few times. three ways: add or take time, a quick length, or pick
   when it ends on the time wheel. the wheel only saves when you tap Done
   (iPhone reports every spin as a change, so saving on each one closed it). */
function lengthPicker(b, from, len) {
  const keep = m => { b.mins = Math.max(5, Math.min(1440, m)); save(); renderDay(); };
  const box = document.createElement('div');
  box.className = 'lenpick lp4';
  const usual = usualLength(b.label);
  const opts = [15, 30, 45, 60, 90, 120];
  if (usual && !opts.includes(usual)) opts.push(usual);
  opts.sort((x, y) => x - y);

  box.innerHTML =
    '<div class="lp4-now"><b>' + minsLabel(len) + '</b><span>' + clock(from) + ' to ' + clock(from + len) + '</span></div>' +
    '<div class="lp4-row add">' + [[-5, '−5'], [5, '+5'], [10, '+10'], [15, '+15'], [30, '+30']].map(([d, t]) =>
      '<button type="button" data-d="' + d + '"' + (len + d < 5 ? ' disabled' : '') + '>' + t + '</button>').join('') + '</div>' +
    '<div class="lp4-row">' + opts.map(m => '<button type="button" data-m="' + m + '" class="' + (m === len ? 'on' : '') + (m === usual ? ' usual' : '') + '">' + minsLabel(m) + '</button>').join('') + '</div>' +
    '<label class="lp4-end"><span>Ends at</span><input type="time" step="300"></label>' +
    '<button type="button" class="lp4-done">Done</button>';
  box.querySelectorAll('[data-d]').forEach(x => x.addEventListener('click', () => keep(len + Number(x.dataset.d))));
  box.querySelectorAll('[data-m]').forEach(x => x.addEventListener('click', () => keep(Number(x.dataset.m))));
  const t = box.querySelector('input');
  t.value = hhmm(from + len);
  let picked = null;
  const commit = () => {
    if (!picked || !/^\d{2}:\d{2}/.test(picked)) return;
    let m = toMins(picked.slice(0, 5)) - (from % 1440);
    if (m <= 0) m += 1440;                               // ends after midnight
    picked = null;
    keep(m);
  };
  t.addEventListener('input', () => { picked = t.value; });
  t.addEventListener('change', () => { picked = t.value; });
  t.addEventListener('blur', commit);                    // the wheel's Done
  t.addEventListener('keydown', e => { if (e.key === 'Enter') t.blur(); });
  box.querySelector('.lp4-done').addEventListener('click', () => { commit(); customFor = null; renderDay(); });
  return box;
}
