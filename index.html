<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="brick">
<meta name="theme-color" content="#faf4ea">
<meta name="color-scheme" content="light dark">
<script>
  // runs first: apply the look you chose, and paint the right background straight away
  (function () {
    var t = 'auto';
    try { t = localStorage.getItem('paper.by.mia.v2.theme') || 'auto'; } catch (e) {}
    var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
    document.documentElement.style.background = dark ? '#1e1814' : '#faf4ea';
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', dark ? '#1e1814' : '#faf4ea');
  })();
</script>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>brick</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap">

<style>
/* Blocks that snap together. Graph paper underneath, studs on top,
   everything square and pressed down when you touch it. */
:root {
  /* warm, like home: cream, light brown, baby pink, baby blue */
  --paper:  #faf4ea;
  --grid:   rgba(59, 45, 37, 0.06);
  --card:   #fffcf6;
  --ink:    #3b2d25;
  --muted:  #8a7768;

  --shade:  #e6d8c6;
  --slot:   #f3e9dc;
  --hair:   #eee2d3;
  --dash:   #dbc9b4;
  --hover:  #f7eee2;

  --pink:   #d9718e;
  --pink-d: #b9566f;
  --pink-s: #fbe4ea;

  --blue:   #86b9d9;
  --blue-s: #e3f0f8;
  --brown:  #c9965a;
  --brown-s:#f3e6d4;

  --cyan:   #86b9d9;
  --yellow: #e8c46a;
  --lime:   #93bf7f;
  --violet: #a99bd4;
  --orange: #e3a27a;

  --display: "Poppins", system-ui, -apple-system, sans-serif;
  --mono:    "Poppins", system-ui, -apple-system, sans-serif;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    /* the same home, at night: cocoa and warm lamplight */
    --paper:  #1e1814;
    --grid:   rgba(244, 233, 222, 0.05);
    --card:   #2a221c;
    --ink:    #f4e9de;
    --muted:  #b3a08f;

    --shade:  #120e0b;
    --slot:   #342a23;
    --hair:   #3b3029;
    --dash:   #55463b;
    --hover:  #31281f;

    --pink:   #eea3b6;
    --pink-d: #c27a8d;
    --pink-s: #43292f;

    --blue:   #9cc7e3;
    --blue-s: #22303a;
    --brown:  #d9ab73;
    --brown-s:#3a2e22;

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    /* the same home, at night: cocoa and warm lamplight */
    --paper:  #1e1814;
    --grid:   rgba(244, 233, 222, 0.05);
    --card:   #2a221c;
    --ink:    #f4e9de;
    --muted:  #b3a08f;

    --shade:  #120e0b;
    --slot:   #342a23;
    --hair:   #3b3029;
    --dash:   #55463b;
    --hover:  #31281f;

    --pink:   #eea3b6;
    --pink-d: #c27a8d;
    --pink-s: #43292f;

    --blue:   #9cc7e3;
    --blue-s: #22303a;
    --brown:  #d9ab73;
    --brown-s:#3a2e22;

    color-scheme: dark;
  }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { min-height: 100%; }

body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.5;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 30rem;
  margin: 0 auto;
  padding-inline: 18px;
  padding-block: 24px 40px;
}

/* ---------- brick primitives ---------- */

/* a row of studs, drawn in the accent colour */
.studs::before {
  content: "";
  position: absolute;
  top: 9px; left: 15px;
  width: 54px; height: 11px;
  background-image: radial-gradient(circle 4.5px at 9px 5.5px, var(--accent, var(--pink)) 97%, transparent 100%);
  background-size: 18px 11px;
  background-repeat: repeat-x;
}

/* a button that physically depresses */
.brick {
  font-family: var(--display);
  font-weight: 700;
  color: #fff;
  background: var(--pink);
  border: 1px solid var(--hair);
  border-radius: 12px;
  cursor: pointer;
  box-shadow: none;
  transition: transform .06s, box-shadow .06s, background .12s;
}

.brick:active { opacity: .7; box-shadow: 0 0 0 var(--pink-d); }

.brick.flat {
  background: var(--card);
  color: var(--ink);
  box-shadow: none;
}

.brick.flat:active { box-shadow: 0 0 0 var(--shade); }

/* ---------- head ---------- */

/* bottom bar, thumb height */
.tabs {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 10;
  display: flex;
  gap: 7px;
  padding: 11px 14px;
  padding-bottom: calc(11px + env(safe-area-inset-bottom, 0px));
  background: var(--paper);
  border-top: 1px solid var(--hair);
}

.tabs { overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs .brick { flex: 1 0 auto; min-width: 62px; font-size: 12px; padding: 11px 6px;}

h2 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.15rem;
  margin: 0 0 5px;
  display: flex;
  align-items: center;
  gap: 9px;
}

h2::after {
  content: "";
  flex: 1;
  height: 7px;
  background:
    repeating-linear-gradient(90deg, var(--ink) 0 7px, transparent 7px 14px);
  opacity: .22;
}

.hint { font-size: 14px; color: var(--muted); margin: 0 0 20px; }

:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

/* ---------- cards ---------- */

.box {
  position: relative;
  background: var(--card);
  border: 1px solid var(--hair);
  border-radius: 12px;
  box-shadow: none;
  padding: 26px 14px 14px;
  margin-bottom: 18px;
  animation: drop .16s ease-out;
}

@keyframes drop { from { transform: translateY(-5px); opacity: 0 } to { opacity: 1 } }

.empty {
  border: 1px dashed var(--dash);
  border-radius: 12px;
  padding: 26px 16px;
  text-align: center;
  color: var(--muted);
  font-family: var(--display);
  font-weight: 600;
  font-size: .85rem;
  margin-bottom: 18px;
}

/* ---------- habits ---------- */

.habit-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }

.habit-name {
  flex: 1; min-width: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.05rem;
  text-align: left;
  background: none; border: none; padding: 0;
  color: var(--ink);
  cursor: pointer;
  word-break: break-word;
}

.streak {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  background: var(--accent, var(--pink));
  padding: 2px 7px;
  border-radius: 12px;
  white-space: nowrap;
}

.streak:empty { display: none; }

.mark {
  flex-shrink: 0;
  width: 44px; height: 44px;
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.3rem; line-height: 1;
  color: #fff;
  background: var(--accent, var(--pink));
  border: 1px solid var(--hair);
  border-radius: 12px;
  cursor: pointer;
  box-shadow: none;
  transition: transform .06s, box-shadow .06s;
}

.mark.done { background: var(--lime); }
.mark:active { opacity: .7; box-shadow: 0 0 0 var(--ink); }

.week { display: flex; gap: 5px; }
.day  { flex: 1; text-align: center; }

.dot {
  height: 30px;
  border: 1px solid var(--hair);
  border-radius: 12px;
  background: var(--slot);
  margin-bottom: 4px;
}

.dot.on {
  background: var(--accent, var(--pink));
  background-image: radial-gradient(circle 4px at 50% 50%, rgba(255,255,255,.55) 97%, transparent 100%);
}

.dot.today { outline: 1px dashed var(--accent, var(--pink)); outline-offset: 2px; }

.day .lbl {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}

.month-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin: 18px 0 11px; padding-top: 16px;
  border-top: 1px solid var(--hair);
}

.month-label {
  font-family: var(--display); font-weight: 700;
  font-size: .82rem;}

.nav {
  font-family: var(--display); font-weight: 700;
  font-size: 14px;background: var(--card); color: var(--ink);
  border: 1px solid var(--hair); border-radius: 12px;
  padding: 3px 9px; cursor: pointer;
  box-shadow: none;
}

.nav:active { opacity: .7; box-shadow: 0 0 0 var(--shade); }

.nav:disabled { opacity: .35; cursor: default; transform: none; box-shadow: none; }

.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

.grid .lbl {
  font-size: 12px; font-weight: 600;color: var(--muted); text-align: center;
}

.cell {
  aspect-ratio: 1;
  border: 1px solid var(--hair); border-radius: 12px;
  background: var(--slot);
  display: grid; place-items: center;
  font-size: 12px; font-weight: 600; color: var(--muted);
  cursor: pointer;
}

.cell.on {
  background: var(--accent, var(--pink));
  color: #fff;
  background-image: radial-gradient(circle 3px at 50% 22%, rgba(255,255,255,.5) 97%, transparent 100%);
}

.cell.blank { border: none; background: none; cursor: default; }
.cell.today { outline: 1px dashed var(--accent, var(--pink)); outline-offset: 1px; }

.count {
  font-size: 12px; font-weight: 600;color: var(--muted); margin-top: 11px;
}

.danger {
  font-family: var(--mono); font-size: 12px;color: var(--muted);
  background: none; border: none; padding: 7px 0 0; cursor: pointer;
  text-decoration: underline;
}

/* ---------- suggestion ---------- */

.suggest {
  position: relative;
  border: 1px solid var(--hair);
  border-radius: 12px;
  background: var(--pink-s);
  box-shadow: none;
  padding: 26px 14px 14px;
  margin-bottom: 20px;
  --accent: var(--pink);
}

.suggest p { font-size: .82rem; margin: 0 0 12px; }
.suggest p b { font-family: var(--display);}
.suggest .row { display: flex; flex-wrap: wrap; gap: 8px; }

.suggest .brick {
  flex: 1 1 130px;
  min-width: 0;
  font-size: 12px;
  padding: 10px 8px;
  white-space: nowrap;
}

/* ---------- day ---------- */

.datebar { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 18px; }

.datebar .big {
  font-family: var(--display); font-weight: 700;
  font-size: 1.5rem; line-height: 1.05;
}

.datebar .big small {
  display: block;
  font-family: var(--mono); font-weight: 400;
  font-size: 12px;  color: var(--muted); margin-top: 3px;
}

.daynav { display: flex; gap: 5px; flex-shrink: 0; }

.start-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }


#start {
  -webkit-appearance: none; appearance: none;
  width: 124px; min-height: 48px;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  font-size: 18px;   /* never under 16px, or iOS zooms */
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}

#start::-webkit-date-and-time-value { text-align: center; margin: 0 auto; }


.start-row label {
  font-family: var(--display); font-weight: 700;
  font-size: 14px;}

input[type="time"], input[type="text"], select {
  font-family: var(--mono);
  font-size: 16px;   /* below this, iOS zooms the page on focus */
  color: var(--ink);
  background: var(--card); border: 1px solid var(--hair); border-radius: 12px;
  padding: 8px 10px; min-width: 0;
}

input:focus, select:focus { outline: none; border-color: var(--pink); }

.sheet {
  border-top: 1px solid var(--hair);
  margin-bottom: 18px;
}

.line {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 2px;
  border-bottom: 1px solid var(--hair);
}

.line .at small.endat {
  cursor: pointer;
  text-decoration: underline dotted;
  text-underline-offset: 2px;
}

.line .at small.endat:hover { color: var(--pink); }

.line .at small {
  display: block;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
  margin-top: 1px;
}

.line .at {
  flex-shrink: 0;
  width: 58px;
  line-height: 1.25;
  font-family: var(--mono); font-size: 14px; font-weight: 600;
  color: var(--pink);
}

.tick {
  flex-shrink: 0;
  width: 21px; height: 21px;
  border: 1px solid var(--hair);
  border-radius: 12px;
  background: transparent;
  color: transparent;
  font-size: .8rem; line-height: 1;
  cursor: pointer;
  padding: 0;
}

.tick.on { background: var(--ink); color: var(--card); }

.tick:disabled {
  opacity: .25;
  cursor: default;
  border-style: dashed;
}

.line.locked .what, .line.locked .how { opacity: .55; }

.allclear {
  position: relative;
  border: 1px solid var(--hair);
  border-radius: 12px;
  background: var(--pink-s);
  box-shadow: none;
  padding: 26px 15px 15px;
  margin-top: 20px;
}

.allclear p {
  font-family: var(--display); font-weight: 700;
  font-size: 1.05rem;  margin: 0 0 12px;
  color: var(--ink);
}

.line textarea.what {
  resize: none;
  overflow: hidden;
  line-height: 1.35;
  display: block;
  /* .mid is a column flex, so flex:1 would zero the HEIGHT basis */
  flex: none;
  width: 100%;
}

.line .what {
  flex: none;
  width: 100%;
  min-width: 0;
  font-family: var(--mono);
  font-size: 16px;
  color: var(--ink);
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 2px 0;
  box-shadow: none;
}

.line .what:focus { outline: none; box-shadow: none; }

.line .how {
  flex-shrink: 0;
  font-family: var(--mono); font-size: 14px;
  color: var(--muted);
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 2px 0;
  text-align: right;
  box-shadow: none;
  cursor: pointer;
}

.line .how:focus { outline: none; color: var(--pink); }

.line .mins {
  flex-shrink: 0;
  width: 78px;
  font-family: var(--mono); font-size: 16px;
  color: var(--ink);
  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: none;
  padding: 2px 0;
  text-align: right;
}

.line .mins:focus { outline: none; }

.line .bin {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 26px; height: 26px;
  font-family: var(--mono); font-size: 1.05rem; line-height: 1;
  color: var(--muted);
  background: none; border: none; cursor: pointer;
  padding: 0;
  border-radius: 12px;
}

.line .bin:hover { color: var(--pink); background: var(--hover); }

.line.ticked .what { text-decoration: line-through; color: var(--muted); }
.line.ticked .at   { text-decoration: line-through; color: var(--muted); }

.daypick { display: flex; gap: 8px; margin-bottom: 20px; }
.daypick .brick { flex: 1; font-size: 14px; padding: 10px 4px; }

.warmup {
  border: 1px dashed var(--pink);
  border-radius: 12px;
  background: var(--pink-s);
  padding: 13px 14px;
  margin-bottom: 22px;
}

.warmup b {
  display: block;
  font-family: var(--display); font-weight: 700;
  font-size: 12px;color: var(--pink); margin-bottom: 6px;
}

.warmup p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink); }

.grp {
  font-family: var(--display); font-weight: 700;
  font-size: 14px;color: var(--muted);
  margin: 22px 0 0;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--hair);
}

.grp:first-child { margin-top: 0; }

.ex {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 13px 2px;
  border-bottom: 1px solid var(--hair);
}

.ex .mid { flex: 1; min-width: 0; }

.ex .nm, .ex .dt {
  display: block;
  width: 100%;
  font-family: var(--mono);
  font-size: 16px;            /* below this, iOS zooms when you tap in */
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 1px 0;
  box-shadow: none;
}

.ex .nm { font-weight: 600; color: var(--ink); }

.ex .dt { color: var(--muted); margin-top: 2px; }

.ex .nm:focus, .ex .dt:focus {
  outline: none;
  box-shadow: none;
}

.ex.on .nm { text-decoration: line-through; color: var(--muted); }

.gymbar {
  font-family: var(--display); font-weight: 700;
  font-size: 14px;color: var(--muted);
  margin: 20px 0 4px;
}

.gymbar b { color: var(--pink); }

.hero {
  border-top: 1px solid var(--hair);
  padding-top: 16px;
  margin-bottom: 8px;
}

.hero .big {
  font-family: var(--display); font-weight: 700;
  font-size: 2.6rem; line-height: 1;
  color: var(--pink);
  font-variant-numeric: tabular-nums;
}

.hero .cap {
  display: block;
  font-family: var(--mono); font-size: 12px;
color: var(--muted);
  margin-top: 7px;
}

.statrow { margin-bottom: 13px; }

.statrow .lbl {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  font-family: var(--mono); font-size: 14px;
  color: var(--ink);
  margin-bottom: 5px;
}

.statrow .lbl b {
  flex-shrink: 0;
  font-weight: 600;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.statrow .track {
  height: 17px;
  border: 1px solid var(--hair);
  border-radius: 12px;
  background: var(--slot);
  overflow: hidden;
}

.statrow .fill { height: 100%; background: var(--c, var(--pink)); }

.nodata {
  font-family: var(--mono); font-size: 14px;
  color: var(--muted);
  margin: 0 0 6px;
}

.meals { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }

.meal {
  flex: 1;
  min-width: 58px;
  font-family: var(--display); font-weight: 700;
  font-size: 12px;color: var(--ink); background: var(--card);
  border: 1px solid var(--hair); border-radius: 12px;
  padding: 9px 3px; cursor: pointer;
  box-shadow: none;
  transition: transform .06s, box-shadow .06s, background .14s, color .14s;
}

.meal.on { background: var(--c); color: #fff; box-shadow: none; }
.meal:active { opacity: .7; box-shadow: 0 0 0 var(--shade); }

.bite {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 13px 2px;
  border-bottom: 1px solid var(--hair);
}

.bite .t.tapme {
  cursor: pointer;
  text-decoration: underline dotted;
  text-underline-offset: 3px;
}

.bite .t.tapme:hover { color: var(--pink); }

.bite input.t {
  width: 66px;
  font-family: var(--mono); font-size: 16px;
  color: var(--ink);
  background: transparent;
  border: none; border-radius: 0;
  box-shadow: none;
  padding: 1px 0;
}

.bite input.t:focus { outline: none; }

.bite .t {
  flex-shrink: 0; width: 56px;
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  color: var(--muted);
  padding-top: 3px;
}

.bite .mid { flex: 1; min-width: 0; }

.bite .tag {
  display: inline-block;
  font-family: var(--display); font-weight: 700;
  font-size: 12px;color: #fff; background: var(--c);
  border: 1px solid var(--hair); border-radius: 12px;
  padding: 1px 6px;
  margin-bottom: 5px;
}

.bite .what {
  display: block;
  font-family: var(--mono); font-size: .86rem;
  color: var(--ink);
  word-break: break-word;
}

.bite .bin {
  flex-shrink: 0;
  display: grid; place-items: center;
  width: 28px; height: 28px;
  font-family: var(--mono); font-size: 1.05rem; line-height: 1;
  color: var(--muted); background: none; border: none;
  cursor: pointer; padding: 0; border-radius: 12px;
}

.bite .bin:hover { color: var(--pink); background: var(--hover); }

.undo {
  position: fixed;
  left: 14px; right: 14px;
  bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  z-index: 9;
  max-width: 28rem;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--ink);
  border: 1px solid var(--hair);
  border-radius: 12px;
  padding: 10px 10px 10px 13px;
  box-shadow: none;
  animation: rise .18s ease-out;
}

@keyframes rise { from { opacity: .7; opacity: 0 } to { opacity: 1 } }

.undo span {
  flex: 1;
  min-width: 0;
  font-family: var(--mono); font-size: 14px;
  color: var(--paper);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.undo button {
  flex-shrink: 0;
  font-family: var(--display); font-weight: 700;
  font-size: 12px;color: #fff; background: var(--pink);
  border: 2px solid var(--paper); border-radius: 12px;
  padding: 6px 12px; cursor: pointer;
}

.undo button:active { opacity: .7; }

.quote {
  position: relative;
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  border-bottom: 3px solid var(--pink);
  border-radius: 0;
  box-shadow: none;
  padding: 0 0 20px;
  margin-bottom: 24px;
  cursor: pointer;
}

.quote p {
  font-family: var(--display); font-weight: 700;
  font-size: 1.45rem; line-height: 1.2;
  color: var(--ink);
  margin: 0 0 11px;
  text-wrap: balance;
  white-space: pre-line;
}

.quote .who {
  display: block;
  font-family: var(--mono); font-size: 12px; font-weight: 600;
color: var(--pink);
}

.quote .again {
  display: block;
  font-family: var(--mono); font-size: 12px;
color: var(--muted);
  margin-bottom: 10px;
}

.quote:active p { color: var(--pink); }

/* ---------- arranging the menu ---------- */

.arrange {
  display: block;
  margin: 18px auto 0;
  min-height: 40px;
  padding: 11px 18px;          /* a target you can actually hit */
  font-family: var(--mono); font-size: 12px;
color: var(--muted);
  background: none; border: none; cursor: pointer;
  text-decoration: underline;
}

/* while arranging it pins above the nav, so you never scroll to find it */
.arrange.on {
  position: fixed;
  left: 14px; right: 14px;
  bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  z-index: 9;
  max-width: 28rem;
  margin: 0 auto;
  width: auto;
  font-family: var(--display); font-weight: 700;
  font-size: .85rem;  color: #fff;
  background: var(--pink);
  border: 1px solid var(--hair);
  border-radius: 12px;
  box-shadow: none;
  text-decoration: none;
  padding: 13px;
}

.arrange.on:active { opacity: .7; box-shadow: 0 0 0 var(--ink); }

.moves { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }

.move {
  width: 34px; height: 26px;
  font-family: var(--mono); font-size: .8rem; line-height: 1;
  color: var(--ink); background: var(--card);
  border: 1px solid var(--hair); border-radius: 12px;
  cursor: pointer; padding: 0;
  box-shadow: none;
}

.move:disabled { opacity: .3; cursor: default; }
.move:active:not(:disabled) { opacity: .7; box-shadow: 0 0 0 var(--shade); }

.card.sorting { cursor: default; }
.card.sorting:hover { background: var(--card); }
.card.sorting:active { transform: none; box-shadow: none; }

.menu { display: flex; flex-direction: column; gap: 14px; }

.card {
  position: relative;
  overflow: hidden;
  display: block;
  width: 100%;
  text-align: left;
  background: var(--card);
  border: 1px solid var(--hair);
  border-radius: 12px;
  box-shadow: none;
  padding: 30px 15px 14px;
  cursor: pointer;
  transition: transform .06s, box-shadow .06s, background .14s;
}

/* pink cap with studs pressed into it */
.card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 17px;
  background: var(--pink);
  border-bottom: 1px solid var(--hair);
}

.card::after {
  content: "";
  position: absolute;
  top: 4px; left: 15px;
  width: 54px; height: 9px;
  background-image: radial-gradient(circle 3.5px at 9px 4.5px, rgba(255,255,255,.75) 97%, transparent 100%);
  background-size: 18px 9px;
  background-repeat: repeat-x;
}

.card .top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 4px;
}

.card h3 {
  font-family: var(--display); font-weight: 700;
  font-size: 1.1rem;margin: 0;
  color: var(--ink);
}

.card .stat {
  flex-shrink: 0;
  font-family: var(--mono); font-size: 12px; font-weight: 600;
color: var(--pink);
  border: 2px solid var(--pink);
  border-radius: 12px;
  padding: 2px 7px;
  white-space: nowrap;
}

.card p {
  font-family: var(--mono); font-size: 14px;
  color: var(--muted);
  margin: 0;
}

.card:hover { background: var(--pink-s); }
.card:active { opacity: .7; box-shadow: 0 0 0 var(--shade); }

.line .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

.track {
  align-self: flex-start;
  font-family: var(--mono); font-size: 12px;  color: var(--pink);
  background: none; border: none; padding: 0; cursor: pointer;
  text-decoration: underline;
}

.isa {
  align-self: flex-start;
  display: flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 12px;color: var(--muted);
}

.isa i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); display: block; }

.line .how { appearance: none; -webkit-appearance: none; }

/* focus block goals */
.goals { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.goal { display: flex; align-items: center; gap: 8px; min-width: 0; }
.gtick {
  flex: none; width: 22px; height: 22px; padding: 0;
  font-size: 13px; line-height: 1; color: transparent;
  background: var(--card); border: 1px solid var(--hair); border-radius: 12px;
  cursor: pointer;
}
.gtick.on { background: var(--pink); border-color: var(--pink); color: #fff; }
.gtick:disabled { opacity: .3; cursor: default; }
.goal .gtext {
  flex: 1 1 auto; min-width: 0;
  font-family: var(--mono); font-size: 16px;   /* under 16px iOS zooms */
  color: var(--ink); background: transparent;
  border: none; border-bottom: 1px dashed var(--hair); border-radius: 0;
  padding: 3px 0;
}
.goal .gtext:focus { outline: none; border-bottom-color: var(--pink); }
.goal.done .gtext { text-decoration: line-through; color: var(--muted); }

.line .fixed {
  flex: 1;
  min-width: 0;
  font-family: var(--mono); font-size: .86rem;
  color: var(--ink);
  word-break: break-word;
}

.line.sorting {
  background: var(--hover);
  user-select: none;
  -webkit-user-select: none;
}

.line.shifting { transition: transform .13s ease; }

.line.dragging {
  position: relative;
  z-index: 5;
  cursor: grabbing;
  background: var(--pink-s);
  border-bottom-color: var(--pink);
  box-shadow: none;
}

.grip {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 34px; height: 34px;
  font-family: var(--mono); font-size: 1.1rem; line-height: 1;
  color: var(--muted);
  border: 1px solid var(--hair);
  border-radius: 12px;
  touch-action: none;        /* only this grabs, so the page still scrolls */
  cursor: grab;
}

.line.dragging .grip { color: var(--pink); border-color: var(--pink); cursor: grabbing; }

.line.dragging .grip { color: var(--pink); }

.sheet.compact .line { padding: 7px 2px; gap: 10px; }
.sheet.compact .at { width: 48px; font-size: 12px; }
.sheet.compact .at small { display: none; }
.sheet.compact .track { display: none; }
.sheet.compact .isa { display: none; }
.sheet.compact .mid { gap: 0; }
.sheet.compact .what { font-size: 15px; padding: 0; line-height: 1.3; }
.sheet.compact .tick { width: 19px; height: 19px; }
.sheet.compact .how { font-size: 12px; }

.viewtools {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  margin-top: 16px;
}

.viewtools .arrange { margin: 0; }

.nudge {
  display: block;
  width: 100%;
  text-align: left;
  font-family: var(--mono); font-size: 12px;
  color: var(--pink);
  background: none; border: none;
  padding: 14px 2px 0;
  cursor: pointer;
  text-decoration: underline;
}

.addblock {
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  font-family: var(--display);
  font-weight: 700;
  font-size: .8rem;
  color: var(--pink);
  background: transparent;
  border: 1px dashed var(--pink);
  border-radius: 12px;
  padding: 20px 12px 16px;
  cursor: pointer;
  transition: background .14s, transform .06s, box-shadow .06s, border-style .14s;
}

/* studs along the top, so it reads as an empty slot waiting for a brick */
.addblock::before {
  content: "";
  position: absolute;
  top: 7px; left: 50%; transform: translateX(-50%);
  width: 72px; height: 9px;
  background-image: radial-gradient(circle 4px at 9px 4.5px, var(--pink) 97%, transparent 100%);
  background-size: 18px 9px;
  background-repeat: repeat-x;
  opacity: .45;
  transition: opacity .14s;
}

.plusbox {
  display: grid;
  place-items: center;
  width: 24px; height: 24px;
  font-size: 1.05rem; line-height: 1;
  color: #fff;
  background: var(--pink);
  border-radius: 12px;
}

.addblock:hover {
  background: var(--pink-s);
  border-style: solid;
}

.addblock:hover::before { opacity: 1; }

.addblock:active {
  opacity: .7;
  box-shadow: 0 0 0 var(--pink-d);
}

/* ---------- check in ---------- */

.greet {
  font-family: var(--display); font-weight: 700;
  font-size: 1.5rem; line-height: 1.1;
margin: 0 0 6px;
}

.clock {
  font-family: var(--mono); font-size: 12px;color: var(--muted); margin: 0 0 22px;
}

.moods {
  display: grid;
  grid-template-columns: repeat(4, 1fr);   /* 11 moods: rows of 4, 4, 3 */
  gap: 16px 6px;
  margin-bottom: 30px;
}

.mood {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}

.mood .bubble {
  position: relative;
  width: 100%;
  max-width: 56px;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 1px solid var(--hair);
  background: var(--c);
  box-shadow: none;
  display: grid;
  place-items: center;
  font-size: 1.35rem;
  line-height: 1;
  transition: transform .07s, box-shadow .07s, filter .14s;
}

/* a soft sheen across the top, like moulded plastic */
.mood .bubble::before {
  content: "";
  position: absolute;
  top: 5px; left: 50%; transform: translateX(-50%);
  width: 62%; height: 32%;
  border-radius: 50%;
  background: rgba(255, 255, 255, .3);
}

.mood .n {
  position: absolute;
  top: -5px; right: -5px;
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  color: var(--card); background: var(--ink);
  border: 2px solid var(--card);
  border-radius: 999px;
  min-width: 17px;
  padding: 0 3px;
  line-height: 13px;
}

.mood .lab {
  font-family: var(--display); font-weight: 700;
  font-size: 12px;line-height: 1.15;
  color: var(--muted);
  text-align: center;
}

.mood:hover .bubble { filter: brightness(1.12); }

.mood:active .bubble { opacity: .7; box-shadow: 0 0 0 var(--ink); }

.mood:hover .lab { color: var(--ink); }

.notebox {
  border-top: 1px solid var(--hair);
  border-bottom: 1px solid var(--hair);
  padding: 14px 2px;
  margin-bottom: 24px;
}

.notebox .ask {
  font-family: var(--mono); font-size: 12px;
color: var(--muted);
  display: block; margin-bottom: 9px;
}

.notebox .ask b { color: var(--pink); }

.notebox input {
  width: 100%;
  font-family: var(--mono); font-size: 16px;
  color: var(--ink); background: transparent;
  border: none; border-radius: 0;
  padding: 3px 0 7px;
  box-shadow: none;
}

.notebox input:focus { outline: none; box-shadow: none; }

.notebox .row { display: flex; gap: 8px; margin-top: 12px; }
.notebox .brick { font-size: 12px; padding: 7px 13px; }

.logline { cursor: pointer; }

.logline .bin {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 30px; height: 30px;
  margin-left: 8px;
  padding: 0;
  font-family: var(--mono);
  font-size: 1.1rem;
  line-height: 1;
  color: var(--muted);
  background: none;
  border: none;
  border-radius: 12px;
}

.logline .bin:hover { color: var(--pink); background: var(--hover); }
.logline .bin:active { background: var(--pink-s); }

.logline .body { flex: 1; min-width: 0; }

.logline .note {
  display: block;
  font-family: var(--mono); font-size: 14px;
  color: var(--muted);
  margin-top: 4px;
  word-break: break-word;
}

.logline {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--hair);
  font-size: 14px;
}

.logline:last-child { border-bottom: none; }

.logline .t {
  font-family: var(--mono); font-size: 12px; font-weight: 600;
color: var(--muted);
  flex-shrink: 0; width: 58px;
}

.logline .chip {
  font-family: var(--display); font-weight: 700;
  font-size: 12px;color: #fff; background: var(--c, var(--pink));
  border: 1px solid var(--hair); border-radius: 12px;
  padding: 2px 8px;
}

/* ---------- ideas ---------- */

.idea { display: flex; align-items: flex-start; gap: 11px; }
.idea .txt { flex: 1; min-width: 0; font-size: .86rem; line-height: 1.5; word-break: break-word; }
.idea.done .txt { text-decoration: line-through; color: var(--muted); }

.idea .stamped {
  font-family: var(--mono); font-size: 12px; font-weight: 600;
color: var(--muted); display: block; margin-top: 6px;
}

.clockline {
  font-family: var(--mono); font-size: 14px;
  color: var(--muted);
  margin-top: 7px;
}

.clockline b { color: var(--pink); font-weight: 600; }


/* ---------- restored: carry over list ---------- */

.carry { display: flex; flex-direction: column; gap: 9px; margin-bottom: 14px; }

.carry label {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: 14px; line-height: 1.35;
  cursor: pointer;
}

.carry label > span:not(.dur) { min-width: 0; word-break: break-word; }

.carry input[type="checkbox"] {
  flex-shrink: 0;
  width: 18px; height: 18px; margin: 0;
  accent-color: var(--pink);
}

.carry .dur {
  margin-left: auto; flex-shrink: 0;
  font-family: var(--mono); font-size: 12px; font-weight: 600;
color: var(--muted);
}

/* ---------- restored: idea rows ---------- */

.ishabit {
  flex-shrink: 0;
  width: 32px; height: 32px;
  font-family: var(--display); font-weight: 700; font-size: .95rem; line-height: 1;
  border: 1px solid var(--hair); border-radius: 12px;
  background: var(--slot); color: var(--ink);
  cursor: pointer; padding: 0;
  box-shadow: none;
}

.ishabit.on { background: var(--lime); color: #fff; box-shadow: none; }
.ishabit:active { opacity: .7; box-shadow: 0 0 0 var(--shade); }

.x {
  flex-shrink: 0;
  display: grid; place-items: center;
  width: 28px; height: 28px;
  font-family: var(--mono); font-size: 1.05rem; line-height: 1;
  color: var(--muted); background: none; border: none;
  cursor: pointer; padding: 0; border-radius: 12px;
}

.x:hover { color: var(--pink); background: var(--hover); }

/* ---------- restored: the add row on ideas and food ---------- */

.new-habit { display: flex; gap: 8px; margin-top: 22px; }
.new-habit input { flex: 1; min-width: 0; }
.new-habit .brick { flex-shrink: 0; width: auto; padding: 11px 18px; font-size: 14px; }

/* ---------- restored: the day total ---------- */

.total {
  font-family: var(--display); font-weight: 700;
  font-size: 14px;color: var(--muted);
  margin-top: 20px; padding-top: 16px;
  border-top: 1px solid var(--hair);
}

footer {
  margin-top: 34px;
  margin-bottom: 86px;
  font-family: var(--mono); font-size: 12px;
color: var(--muted); text-align: center;
}

[hidden] { display: none !important; }

/* ================= minimal style, whole app ================= */

body { background-image: none; font-size: 16px; }
.studs::before, h2::after { display: none; }

h2 { font-size: 20px; font-weight: 600; text-transform: capitalize; margin-bottom: 8px; }
.big { text-transform: capitalize; }
.hint { font-size: 14px; }

/* buttons: soft pills, no outlines */
.brick {
  font-weight: 600; font-size: 15px;
  border: none; border-radius: 22px;
  text-transform: capitalize;
}
.brick.flat { background: var(--hair); }

.nav {
  min-height: 36px; padding: 0 14px;
  font-size: 14px; font-weight: 500; text-transform: capitalize;
  background: var(--hair); border: none; border-radius: 18px;
}

input[type="time"], input[type="text"], select, textarea {
  font-family: var(--mono);
  border: 1px solid var(--hair); border-radius: 12px;
}
input:focus, select:focus, textarea:focus { border-color: var(--pink); }

/* bottom bar: all eight fit, text only */
.tabs {
  gap: 2px; padding: 8px 8px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  background: var(--card);
  border-top: 1px solid var(--hair);
  overflow-x: visible;
}
.tabs .brick, .tabs .brick.flat {
  flex: 1 1 0; min-width: 0;
  padding: 9px 0; border-radius: 12px;
  font-size: 12px; font-weight: 500;
  background: transparent; color: var(--muted);
}
.tabs .brick:not(.flat) { background: var(--pink-s); color: var(--pink); font-weight: 600; }

/* home */
.quote { border-bottom: 1px solid var(--hair); }
.quote p { font-size: 24px; font-weight: 600; }
.card { padding: 16px; }
.card::before, .card::after { display: none; }
.card h3 { font-size: 18px; font-weight: 600; text-transform: capitalize; }
.card .stat { border-width: 1px; font-size: 12px; font-weight: 500; }
.card p { font-size: 14px; }
.card:hover { background: var(--card); }

/* mood */
.greet { font-size: 26px; font-weight: 600; }
.greet::first-letter { text-transform: uppercase; }

/* food */
.meal { flex: 1 1 auto; padding: 9px 6px; font-size: 14px; font-weight: 500; text-transform: capitalize; border-radius: 18px; }
.bite .t { font-size: 13px; font-weight: 500; background: none; border: none; text-align: left; padding-left: 0; color: var(--muted); }
.bite .t.tapme { text-decoration: none; }
.bite .tag { font-size: 12px; font-weight: 500; border: none; }
#view-food .datebar .big { font-size: 18px; font-weight: 600; }
#view-food .datebar .big small { font-size: 13px; text-transform: capitalize; }

/* food time: tap opens the time wheel */
.bite input.t {
  -webkit-appearance: none; appearance: none;
  flex-shrink: 0; width: 112px; min-height: 36px;
  padding: 0 8px;
  font-size: 16px; font-weight: 500; color: var(--ink);   /* 16px or iOS zooms */
  background: var(--hair); border: none; border-radius: 18px;
  text-align: center; cursor: pointer;
}
.bite input.t::-webkit-calendar-picker-indicator { display: none; }
.bite input.t::-webkit-date-and-time-value { text-align: center; }

/* the "more" panel above the bottom bar */
.morepanel {
  position: fixed; z-index: 11;
  right: 8px;
  bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  width: 180px;
  display: flex; flex-direction: column; gap: 2px;
  padding: 6px;
  background: var(--card);
  border: 1px solid var(--hair); border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
}
.morepanel .brick, .morepanel .brick.flat {
  min-height: 46px; padding: 0 14px;
  text-align: left;
  font-size: 16px; font-weight: 500;
  background: transparent; color: var(--ink);
  border-radius: 12px;
}
.morepanel .brick:not(.flat) { background: var(--pink-s); color: var(--pink); font-weight: 600; }

/* food smarts */
.bite .kinds { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }

.bodycard {
  margin-top: 22px; padding: 18px;
  border-radius: 22px;
  background:
    radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, #86b9d9 18%, transparent), transparent 60%),
    radial-gradient(120% 140% at 0% 100%, color-mix(in srgb, var(--pink) 16%, transparent), transparent 60%),
    var(--card);
  border: 1px solid var(--hair);
}
.bc-head { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; }
.bc-dot { width: 9px; height: 9px; border-radius: 50%; background: #86b9d9; animation: livedot 1.8s ease-in-out infinite; }
@keyframes livedot { 50% { opacity: .25; transform: scale(.7); } }
.bc-sec { margin: 16px 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.bc-now, .bc-time { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.bc-now li { display: flex; gap: 12px; align-items: flex-start; }
.bc-e { flex: none; width: 36px; height: 36px; display: grid; place-items: center; font-size: 18px;
        background: var(--hair); border-radius: 12px; }
.bc-now b, .bc-time span { font-size: 15px; font-weight: 500; line-height: 1.35; }
.bc-now small, .bc-time small { display: block; font-size: 13px; color: var(--muted); }
.bc-time li { position: relative; display: flex; gap: 14px; padding-left: 16px; }

.bc-time li:not(:last-child)::after { content: ""; position: absolute; left: 3.5px; top: 18px; bottom: -12px; width: 1px; background: var(--hair); }
.bc-time time { flex: none; width: 64px; font-size: 14px; font-weight: 600; color: var(--pink); font-variant-numeric: tabular-nums; }
.bc-note { margin: 14px 0 0; padding: 12px 14px; font-size: 14px; line-height: 1.45; background: var(--hair); border-radius: 14px; }
.bc-empty { margin: 10px 0 0; font-size: 14px; color: var(--muted); }

.pt-sub { margin: -4px 0 12px; font-size: 13px; color: var(--muted); }
.pt-list { display: flex; flex-direction: column; gap: 10px; }
.pt { display: flex; gap: 12px; align-items: flex-start; padding: 14px; background: var(--card); border: 1px solid var(--hair); border-radius: 16px; font-size: 15px; line-height: 1.4; }
.pt-e { flex: none; width: 36px; height: 36px; display: grid; place-items: center; font-size: 18px; background: var(--hair); border-radius: 12px; }
.pt b { font-weight: 600; }
.pt small { display: block; font-size: 13px; color: var(--muted); }
.pt-empty { font-size: 14px; color: var(--muted); }
.pt-fine { margin-top: 16px; font-size: 12px; color: var(--muted); }

/* health goal */
.bc-head .goalchip {
  margin-left: auto; min-height: 32px; padding: 0 12px;
  font: 500 13px "Poppins", sans-serif; color: var(--ink);
  background: var(--hair); border: none; border-radius: 16px; cursor: pointer;
}
.gp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.gp {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 14px; text-align: left; cursor: pointer;

}
.gp.on { border-color: var(--pink); background: var(--pink-s); }
.gp-e { font-size: 22px; }
.gp b { font-size: 15px; font-weight: 600; }
.gp small { font-size: 12px; color: var(--muted); line-height: 1.35; }
.gp-cancel { display: block; margin: 14px auto 0; font: 500 14px "Poppins", sans-serif; color: var(--muted); background: none; border: none; cursor: pointer; }
.bc-note.goal { background: var(--pink-s); }
.verdict { display: inline-block; margin-top: 4px; padding: 2px 9px; font-size: 12px; font-weight: 500; border-radius: 10px; }
.verdict.good  { color: #3d8a1e; background: color-mix(in srgb, #93bf7f 18%, transparent); }
.verdict.watch { color: #c0601a; background: color-mix(in srgb, #e3a27a 18%, transparent); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .verdict.good { color: #9be06e; }
  :root:not([data-theme="light"]) .verdict.watch { color: #ffad6e; }
}
:root[data-theme="dark"] .verdict.good { color: #9be06e; }
:root[data-theme="dark"] .verdict.watch { color: #ffad6e; }
.pt.mine { border-color: var(--pink); background: color-mix(in srgb, var(--pink) 8%, var(--card)); }
.pt em { display: block; font-style: normal; font-size: 12px; font-weight: 600; color: var(--pink); margin-bottom: 2px; }

/* goal in your words */
.gw-text {
  display: block; width: 100%; margin-top: 12px; padding: 12px 14px;
  font: 400 16px/1.45 "Poppins", sans-serif; color: var(--ink);   /* 16px or iOS zooms */
  background: var(--card); border: 1px solid var(--hair); border-radius: 14px; resize: vertical;
}
.gw-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.gw-btns .brick { width: 100%; min-height: 46px; text-transform: none; }
.gw-said { margin: 12px 0 6px; font-size: 20px; font-weight: 600; line-height: 1.35; }
.gw-yours { margin: 0; font-size: 14px; color: var(--muted); font-style: italic; }
.gw-watch { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.pt-goal { margin: -6px 0 12px; font-size: 15px; font-weight: 500; color: var(--pink); }

/* life: calm, few words */
#view-life h1 { margin: 0; font-size: 30px; font-weight: 600; line-height: 1.1; }
.lf-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 26px; }
.lf-head span { font-size: 14px; color: var(--muted); }
.lf-total { display: flex; align-items: baseline; gap: 2px; flex-wrap: wrap; margin-bottom: 26px; }
.lf-total b { font-size: 64px; font-weight: 600; line-height: .9; font-variant-numeric: tabular-nums; }
.lf-total i { font-style: normal; font-size: 28px; font-weight: 500; color: var(--muted); }
.lf-total span { flex-basis: 100%; margin-top: 8px; font-size: 15px; color: var(--muted); }

.lf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lf-tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  min-height: 150px; padding: 16px; text-align: left; cursor: pointer;

  background: var(--card); border: 1px solid var(--hair); border-radius: 20px;
  transition: transform .15s;
}
.lf-tile:active { transform: scale(.97); }
.lf-t-name { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
.lf-t-name::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.lf-t-num { margin-top: auto; font-size: 38px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.lf-t-num i { font-style: normal; font-size: 18px; color: var(--muted); font-weight: 500; }
.lf-t-bar { width: 100%; height: 5px; background: var(--hair); border-radius: 3px; overflow: hidden; }
.lf-t-bar u, .lf-rows u { display: block; width: 0; height: 100%; background: var(--c); border-radius: 3px; transition: width .9s cubic-bezier(.22, 1, .36, 1); }
.lf-t-trend { font-size: 12px; color: var(--muted); }
.lf-t-trend.up { color: #5f9468; } .lf-t-trend.down { color: #c2784e; }
.lf-tile.empty { justify-content: space-between; border-style: dashed; background: transparent; }
.lf-t-add { font-size: 14px; color: var(--muted); }

.lf-back { margin: 0 0 18px; padding: 8px 0; font: 500 15px "Poppins", sans-serif; color: var(--muted); background: none; border: none; cursor: pointer; }
.lf-dhead { display: flex; align-items: baseline; justify-content: space-between; }
.lf-dhead b { font-size: 44px; font-weight: 600; color: var(--c); line-height: 1; }
.lf-dhead b i { font-style: normal; font-size: 20px; }
.lf-goal { margin: 8px 0 26px; font-size: 16px; color: var(--muted); line-height: 1.45; }
.lf-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 20px; }
.lf-rows div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; font-size: 16px; }
.lf-rows b { font-size: 18px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lf-rows small { font-size: 14px; font-weight: 400; color: var(--muted); }
.lf-rows i { display: block; height: 6px; background: var(--hair); border-radius: 3px; overflow: hidden; }
.lf-next { margin: 30px 0 0; font-size: 16px; line-height: 1.45; }
.lf-next span { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.lf-edit { margin-top: 26px; padding: 8px 0; font: 500 15px "Poppins", sans-serif; color: var(--pink); background: none; border: none; cursor: pointer; }

.lf-wiz { display: flex; flex-direction: column; }
.lf-step { margin-bottom: 6px; font-size: 13px; font-weight: 500; color: var(--c); }
.lf-ask { margin: 10px 0 18px; font-size: 18px; line-height: 1.4; }
.lf-text {
  width: 100%; padding: 14px 16px;
  font: 400 16px/1.5 "Poppins", sans-serif; color: var(--ink);   /* 16px or iOS zooms */
  background: var(--card); border: 1px solid var(--hair); border-radius: 16px; resize: none;
}
.lf-text:focus { outline: none; border-color: var(--c); }
.lf-btns { display: flex; gap: 10px; margin-top: 16px; }
.lf-btn {
  flex: 1; min-height: 50px; padding: 0 12px;
  font: 600 15px "Poppins", sans-serif; color: var(--ink);
  background: var(--hair); border: none; border-radius: 25px; cursor: pointer;
}
.lf-btn.main { background: var(--ink); color: var(--paper); }
.lf-btn:active { opacity: .7; }
.lf-skip { align-self: center; margin-top: 14px; padding: 8px 16px; font: 500 15px "Poppins", sans-serif; color: var(--muted); background: none; border: none; cursor: pointer; }
.lf-said { margin: 12px 0 10px; font-size: 22px; font-weight: 600; line-height: 1.35; }
.lf-yours { margin: 0 0 22px; font-size: 15px; color: var(--muted); line-height: 1.5; }
.lf-yours mark { background: none; color: var(--c); font-weight: 600; }
.lf-why { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.lf-why li { display: flex; flex-direction: column; gap: 2px; }
.lf-why b { font-size: 16px; font-weight: 600; }
.lf-why span { font-size: 14px; color: var(--muted); }

/* how the rewrite ties to your words */
.gw-yours mark { background: color-mix(in srgb, var(--pink) 25%, transparent); color: var(--ink); font-style: normal; font-weight: 600; padding: 0 3px; border-radius: 5px; }
.gw-why { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.gw-why li { display: flex; flex-direction: column; gap: 2px; padding-left: 12px; border-left: 3px solid var(--pink); }
.gw-why b { font-size: 15px; font-weight: 600; }
.gw-why span { font-size: 14px; }
.gw-why small { font-size: 13px; color: var(--muted); }

/* ================= day page: minimal, Poppins ================= */

/* undo */
#view-day .start-row { flex-wrap: nowrap; }
#view-day .undobtn {
  margin-left: auto; min-height: 44px; padding: 0 16px;
  font-size: 15px; font-weight: 500; color: var(--ink);
  background: var(--hair); border: none; border-radius: 22px; cursor: pointer;
}
#view-day .undobtn:disabled { opacity: .35; cursor: default; }
#view-day .undobtn:not(:disabled):active { opacity: .6; }

/* the now card */
#view-day .nowcard {
  display: flex; align-items: center; gap: 18px;
  margin: 0 0 18px; padding: 18px;
  border-radius: 22px;
  background:
    radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--pink) 22%, transparent), transparent 60%),
    var(--card);
  border: 1px solid color-mix(in srgb, var(--pink) 25%, var(--hair));
}
#view-day .nowcard.waiting, #view-day .nowcard.over { background: var(--card); border-color: var(--hair); }

#view-day .nc-ring { position: relative; flex: none; width: 112px; height: 112px; }
#view-day .nc-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
#view-day .nc-track { fill: none; stroke: var(--hair); stroke-width: 9; }
#view-day .nc-arc {
  fill: none; stroke: url(#ncg); stroke-width: 9; stroke-linecap: round;
  transition: stroke-dashoffset 1s linear;
  filter: drop-shadow(0 0 6px color-mix(in srgb, var(--pink) 55%, transparent));
}
#view-day .nowcard.waiting .nc-arc { filter: none; }
#view-day .nc-mid {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#view-day .nc-left { font-size: 24px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
#view-day .nc-unit { font-size: 12px; color: var(--muted); }

#view-day .nc-info { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
#view-day .nc-tag {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px 3px 8px; margin-bottom: 2px;
  font-size: 12px; font-weight: 600; color: var(--pink);
  background: var(--pink-s); border-radius: 12px;
}
#view-day .nc-tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--pink); }
#view-day .nowcard.live .nc-tag i { animation: livedot 1.6s ease-in-out infinite; }
@keyframes livedot { 50% { opacity: .25; transform: scale(.7); } }
#view-day .nowcard.waiting .nc-tag, #view-day .nowcard.over .nc-tag { color: var(--muted); background: var(--hair); }
#view-day .nowcard.waiting .nc-tag i, #view-day .nowcard.over .nc-tag i { background: var(--muted); }
#view-day .nc-name {
  font-size: 19px; font-weight: 600; line-height: 1.25;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  overflow-wrap: anywhere;
}
#view-day .nc-in { font-size: 14px; color: var(--muted); }
#view-day .nc-in b { color: var(--ink); font-weight: 600; }
#view-day .nc-next { font-size: 13px; color: var(--muted); }
#view-day .nc-next:empty { display: none; }

/* ticking a block */
#view-day .line.justdone .tick { animation: pop .42s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
#view-day .line.justdone .what { animation: settle .5s ease-out; }
@keyframes settle { from { color: var(--pink); } }

/* the next block up: its circle breathes */
#view-day .line.next .tick:not(:disabled) { border-color: var(--pink); animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pink) 45%, transparent); }
  50%      { box-shadow: 0 0 0 6px color-mix(in srgb, var(--pink) 0%, transparent); }
}
#view-day .line.arrive { animation: arrive .5s ease-out; }
@keyframes arrive { from { background: var(--pink-s); } }

/* hold a block to add one after it */
#view-day .line { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
#view-day .line .what { -webkit-user-select: text; user-select: text; }
#view-day .line.holding { background: var(--hover); transition: background .5s ease-in; }

/* focus block button */
#view-day .growbtn {
  align-self: flex-start; margin-top: 8px;
  min-height: 40px; padding: 0 16px;
  font-size: 15px; font-weight: 600; color: #fff;
  background: #6f9f5c; border: none; border-radius: 20px; cursor: pointer;
}
#view-day .growbtn:active { opacity: .7; }

/* focus screen */
.focus {
  position: fixed; inset: 0; z-index: 30;
  display: flex; flex-direction: column; align-items: center;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
  background: var(--paper);
  font-family: "Poppins", system-ui, sans-serif;
  overflow-y: auto;
  animation: fadein .25s ease-out;
}
body.focusing { overflow: hidden; }
.focus > * { width: 100%; max-width: 26rem; }
.focus .fx-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.focus .fx-label { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #7daf86; }
.focus .fx-label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #7daf86; animation: livedot 1.8s ease-in-out infinite; }
.focus .fx-name { margin: 4px 0 0; font-size: 28px; font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; }
.focus .fx-close {
  flex: none; width: 44px; height: 44px; padding: 0;
  font-size: 24px; line-height: 1; color: var(--ink);
  background: var(--hair); border: none; border-radius: 50%; cursor: pointer;
}

.focus .fx-stage { position: relative; width: min(78vw, 300px); max-width: 300px; aspect-ratio: 1; margin: 28px auto 0; }
.focus .fx-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.focus .fx-track { fill: none; stroke: var(--hair); stroke-width: 6; }
.focus .fx-arc { fill: none; stroke: #7daf86; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.focus.grown .fx-arc { stroke: var(--pink); }
.focus .fx-plant { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: 56%; aspect-ratio: 4 / 5; }
.focus .fx-plant svg { width: 100%; height: 100%; overflow: visible; }
.focus .fx-plant .grow  { transform-box: fill-box; transform-origin: 50% 100%; animation: sprout 1.2s cubic-bezier(.3, 1.4, .5, 1) both; }
.focus .fx-plant .bloom { transform-box: fill-box; transform-origin: 50% 50%; animation: bloom 1.4s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes sprout { from { transform: scale(0); opacity: 0; } }
@keyframes bloom  { from { transform: scale(0) rotate(-90deg); opacity: 0; } }
.focus .fx-plant .sway { transform-origin: 20px 38px; animation: sway 4s ease-in-out infinite; }
.focus .fx-plant.done .sway { animation-duration: 2.4s; }
@keyframes sway { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }

.focus .fx-time { margin-top: 22px; text-align: center; }
.focus .fx-left { display: block; font-size: 56px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.focus.grown .fx-left { font-size: 34px; color: var(--pink); }
.focus .fx-ends { display: block; margin-top: 8px; font-size: 15px; color: var(--muted); }
.focus .fx-note { margin: 10px 0 0; text-align: center; font-size: 14px; color: var(--muted); }
.focus .fx-note:empty { display: none; }
.focus .fx-note.warn { color: #c2784e; }

.focus .fx-goals { list-style: none; margin: 26px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.focus .fx-goal {
  display: flex; align-items: center; gap: 12px; width: 100%;
  min-height: 56px; padding: 12px 16px; text-align: left;
  font: 500 16px/1.35 "Poppins", sans-serif; color: var(--ink);
  background: var(--card); border: 1px solid var(--hair); border-radius: 18px; cursor: pointer;
}
.focus .fx-goal i {
  flex: none; width: 24px; height: 24px; display: grid; place-items: center;
  font-style: normal; font-size: 13px; color: transparent;
  border: 1.5px solid var(--muted); border-radius: 50%;
}
.focus .fx-goal.on i { background: #7daf86; border-color: #7daf86; color: #fff; }
.focus .fx-goal.on span { text-decoration: line-through; color: var(--muted); }
.focus .fx-done {
  margin-top: 22px; min-height: 52px;
  font: 600 16px "Poppins", sans-serif; color: var(--paper);
  background: var(--ink); border: none; border-radius: 26px; cursor: pointer;
}

/* length picker */
#view-day .line .how.open { color: var(--pink); font-weight: 600; }
#view-day .line .how { background: none; border: none; cursor: pointer; }
#view-day .lenpick {
  display: flex; flex-direction: column; gap: 14px;
  margin: 0 0 12px; padding: 16px;
  background: var(--card); border: 1px solid var(--hair); border-radius: 16px;
}
#view-day .lp-quick { display: flex; flex-wrap: wrap; gap: 8px; }
#view-day .lp-chip {
  flex: 1 1 60px; min-height: 44px;
  font-size: 16px; font-weight: 500; color: var(--ink);
  background: var(--hair); border: none; border-radius: 22px; cursor: pointer;
}
#view-day .lp-chip.on { background: var(--pink); color: #fff; }
#view-day .lp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#view-day .lp-step {
  min-width: 76px; min-height: 44px;
  font-size: 16px; font-weight: 500; color: var(--ink);
  background: var(--hair); border: none; border-radius: 22px; cursor: pointer;
}
#view-day .lp-step:disabled { opacity: .35; }
#view-day .lp-now { font-size: 20px; font-weight: 600; }
#view-day .lp-ends { font-size: 16px; font-weight: 500; color: var(--muted); }
#view-day .lp-ends input {
  width: 132px; min-height: 44px; padding: 0 14px;
  font-size: 16px; font-weight: 500; color: var(--ink);
  background: var(--hair); border: none; border-radius: 22px;
}
#view-day .lp-done {
  min-height: 44px; font-size: 16px; font-weight: 600; color: #fff;
  background: var(--pink); border: none; border-radius: 22px; cursor: pointer;
}

body[data-view="day"] { background-image: none; }

#view-day { --sans: "Poppins", system-ui, -apple-system, sans-serif; }
#view-day * { font-family: var(--sans);text-transform: none; }

/* header */
#view-day .datebar { align-items: center; margin-bottom: 24px; }
#view-day .datebar .big { font-size: 28px; font-weight: 600; line-height: 1.15; text-transform: capitalize; }
#view-day .datebar .big small { font-size: 14px; font-weight: 400; margin-top: 4px; text-transform: capitalize; }
#view-day .daynav { gap: 6px; }
#view-day .daynav .nav {
  min-width: 40px; height: 40px; padding: 0 14px;
  font-size: 14px; font-weight: 500;
  background: var(--hair); color: var(--ink);
  border: none; border-radius: 20px; box-shadow: none;
}
#view-day .daynav .nav:active { transform: none; opacity: .6; }

/* start time */
#view-day .start-row { gap: 12px; margin-bottom: 20px; }
#view-day .start-row label { font-size: 15px; font-weight: 500; color: var(--muted); }
#view-day #start {
  width: 132px; min-height: 44px; padding: 0 14px;
  font-size: 17px; font-weight: 500;
  background: var(--hair); border: none; border-radius: 22px;

/* blocks */
#view-day .sheet { border-top: 1px solid var(--hair); }
#view-day .line { align-items: flex-start; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--hair); }
#view-day .line .at { width: 66px; font-size: 14px; font-weight: 500; line-height: 1.6; color: var(--ink); }
#view-day .line .at small { font-size: 12px; margin: 0; color: var(--muted); }
#view-day .line .at small.endat { text-decoration: none; }
/* start, a short line, then the end time: easy to read the whole span */
#view-day .line .at small.endat { position: relative; margin-top: 2px; padding-left: 0; font-size: 13px; font-weight: 500; line-height: 1.3; color: color-mix(in srgb, var(--ink) 62%, transparent); }
#view-day .line .at small.endat::before { content: ""; display: block; width: 2px; height: 9px; margin: 1px 0 3px 4px; border-radius: 1px; background: color-mix(in srgb, var(--pink) 55%, transparent); }
#view-day .line.ticked .at small.endat { color: var(--muted); }
#view-day .line.ticked .at small.endat::before { background: var(--hair); }
#view-day .line.ticked .at { color: var(--muted); text-decoration: none; }

#view-day .tick {
  width: 24px; height: 24px; margin-top: 1px;
  font-size: 13px;
  border: 1.5px solid var(--muted); border-radius: 50%;
}
#view-day .tick.on { background: var(--pink); border-color: var(--pink); color: #fff; }
#view-day .tick:disabled { border-style: solid; opacity: .3; }

#view-day .line .mid { gap: 4px; }
#view-day .line .what { font-size: 16px; font-weight: 500; line-height: 1.5; padding: 0; }
#view-day .line.ticked .what { font-weight: 400; }
#view-day .line .how {
  width: 50px; padding: 0;
  font-size: 16px; line-height: 1.5; color: var(--muted);   /* under 16px iOS zooms */
  text-align: right; text-align-last: right;
}
#view-day .line .mins { font-size: 16px; }
#view-day .line .bin { color: var(--muted); }

#view-day .track { display: none; }   /* habits page already offers these */
#view-day .isa   { font-size: 12px; }

/* focus block goals */
#view-day .goals { margin-top: 4px; }
#view-day .gtick { width: 20px; height: 20px; font-size: 11px; border: 1.5px solid var(--muted); border-radius: 50%; }
#view-day .gtick.on { border-color: var(--pink); }
#view-day .goal { align-items: flex-start; }
#view-day .gtick { margin-top: 1px; }
#view-day .gtick.ghost { display: inline-block; opacity: .35; }
#view-day .goal .gtext {
  flex: 1; min-width: 0;
  font-size: 16px; line-height: 1.4;          /* 16px while typing, or iOS zooms */
  resize: none; overflow: hidden;
  padding: 0 0 2px; border: none; border-bottom: 1px solid var(--pink); border-radius: 0;
  background: transparent;
}
#view-day .gview {
  flex: 1; min-width: 0;
  font: 400 14px/1.4 var(--sans); text-align: left; color: var(--ink);
  background: none; border: none; padding: 1px 0 0; cursor: text;
  overflow-wrap: anywhere;
}
#view-day .goal.done .gview { text-decoration: line-through; color: var(--muted); }
#view-day .gmore {
  align-self: flex-start;
  font: 500 13px var(--sans); color: var(--muted);
  background: none; border: none; padding: 4px 0 0 28px; cursor: pointer;
}

/* empty, add, totals */
#view-day .empty { border: none; padding: 24px 0 4px; text-align: left; font-size: 15px; font-weight: 400; }
#view-day .addblock {
  justify-content: flex-start; gap: 12px;
  font-size: 16px; font-weight: 500;
  border: none; padding: 16px 0;
}
#view-day .addblock::before { display: none; }
#view-day .addblock:hover  { background: none; }
#view-day .addblock:active { transform: none; opacity: .6; }
#view-day .plusbox { width: 26px; height: 26px; border-radius: 50%; }

#view-day .total { font-size: 14px; font-weight: 500; border-top: 1px solid var(--hair); }
#view-day .clockline { font-size: 14px; }

#view-day .arrange { font-size: 14px; text-decoration: none; }
#view-day .arrange.on { font-size: 16px; font-weight: 600; border: none; border-radius: 24px; box-shadow: none; }

/* cards: carry over, all done */
#view-day .suggest, #view-day .allclear {
  border: 1px solid var(--hair); border-radius: 16px;
  background: var(--card); box-shadow: none; padding: 18px 16px;
}
#view-day .studs::before { display: none; }
#view-day .suggest p, #view-day .allclear p { font-size: 15px; }
#view-day .carry label { font-size: 15px; }
#view-day .carry .dur { font-size: 13px; }
#view-day .brick { font-size: 15px; font-weight: 600; border: none; border-radius: 22px; box-shadow: none; padding: 11px 18px; }
#view-day .brick.flat { background: var(--hair); }
#view-day .brick:active { transform: none; opacity: .7; }

#view-day .sheet.compact .what { font-size: 16px; }
#view-day .sheet.compact .line { padding: 9px 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important }
}

/* ================= shared look (from the life page) =================
   page title on the left, small context on the right, flat cards,
   one accent dot, big numbers, dark main buttons, no glows. */
.pghead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.pghead h1 { margin: 0; font-size: 30px; font-weight: 600; line-height: 1.1; }
.pghead span { font-size: 14px; color: var(--muted); text-align: right; }

/* main buttons go dark, pink stays for accents */
.brick:not(.flat) { background: var(--ink); color: var(--paper); }
.tabs .brick:not(.flat), .morepanel .brick:not(.flat) { background: var(--pink-s); color: var(--pink); }
.meal.on { color: #fff; }

/* flat cards, no gradients or glows */
.bodycard, #view-day .nowcard { background: var(--card) !important; border: 1px solid var(--hair) !important; border-radius: 20px; }
#view-day .nc-arc { filter: none; }
.bc-dot { display: none; }
.focus { background: var(--paper); }

/* day: title matches other pages */
#view-day .datebar .big { font-size: 30px; }

/* mood: greeting as the page title, no shiny bubbles */
.greet { font-size: 30px !important; font-weight: 600; line-height: 1.15; margin-bottom: 4px; }
.mood .bubble::before, .mood .bubble::after { display: none !important; }
.mood .bubble { box-shadow: none !important; border: none !important; }

/* gym: session name is a section title now */
#view-gym h2 { font-size: 20px; }

/* home: tiles like life */
#view-home .quote { padding-bottom: 18px; margin-bottom: 20px; }
#view-home .quote p { font-size: 19px; font-weight: 500; }
#menu .menu, #menu > div:first-child { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card {
  display: flex; flex-direction: column; gap: 6px;
  min-height: 118px; padding: 16px; margin: 0;
  border-radius: 20px;
}
.card .top { flex-direction: column; align-items: flex-start; gap: 6px; flex: 1; margin: 0; }
.card h3 { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
.card h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.card .stat { margin-top: auto; padding: 0; border: none; font-size: 18px; font-weight: 600; color: var(--ink); white-space: normal; line-height: 1.25; }
.card p { display: none; }
.card.sorting .top { flex-direction: row; align-items: center; }

/* calmer leftovers */
.brick { text-transform: none; }
.brick::first-letter { text-transform: uppercase; }
.suggest { background: var(--card) !important; border: 1px solid var(--hair) !important; border-radius: 20px; }
.suggest p::first-letter { text-transform: uppercase; }
.warm, .warmup { background: var(--card) !important; border: 1px solid var(--hair) !important; border-radius: 16px; }

/* home, round two */
.hm-now {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 100%;
  margin-bottom: 14px; padding: 18px; text-align: left; cursor: pointer;
  font-family: "Poppins", sans-serif; color: var(--ink);
  background: var(--card); border: 1px solid var(--hair); border-radius: 22px;
}
.hm-now:active { transform: scale(.98); }
.hm-lbl { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.hm-now.live .hm-lbl { color: var(--pink); }
.hm-lbl::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.hm-now.live .hm-lbl::before { animation: livedot 1.6s ease-in-out infinite; }
.hm-now b { font-size: 24px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.hm-sub { font-size: 14px; color: var(--muted); }
.hm-now.empty .hm-sub { color: var(--pink); font-weight: 500; }
.hm-prog { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 12px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.hm-prog .hm-bar { flex: 1; margin: 0; }

.card .top { gap: 2px; }
.card h3 { margin-bottom: 14px; }
.hm-big { font-size: 34px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.hm-big i { font-style: normal; font-size: 16px; font-weight: 500; color: var(--muted); }
.hm-cap { font-size: 13px; color: var(--muted); }
.hm-bar { display: block; width: 100%; height: 5px; margin-top: 10px; background: var(--hair); border-radius: 3px; overflow: hidden; }
.hm-bar u { display: block; height: 100%; background: var(--c, var(--pink)); border-radius: 3px; }
.card { min-height: 0; font-family: "Poppins", system-ui, sans-serif; }

/* the quote goes quiet at the bottom */
#view-home .quote { margin: 26px 0 0; padding: 0; border: none; }
#view-home .quote p { font-size: 16px; font-weight: 400; color: var(--muted); }
#view-home .quote .again { display: none; }

/* mood page */
.md-ask { margin: -10px 0 18px; font-size: 18px; color: var(--muted); }
.md-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.md-chip {
  position: relative;
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  min-height: 84px; padding: 12px; text-align: left; cursor: pointer;
  font-family: "Poppins", sans-serif; color: var(--ink);
  background: color-mix(in srgb, var(--c) 13%, var(--card));
  border: 1px solid color-mix(in srgb, var(--c) 22%, var(--hair)); border-radius: 18px;
  transition: transform .12s;
}
.md-chip:active { transform: scale(.95); }
.md-chip.pop { animation: mdpop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes mdpop { 0% { transform: scale(.9); } 55% { transform: scale(1.06); } 100% { transform: scale(1); } }
.md-e { font-size: 26px; line-height: 1; }
.md-l { font-size: 14px; font-weight: 500; }
.md-n {
  position: absolute; top: 10px; right: 10px;
  min-width: 22px; height: 22px; padding: 0 6px; display: grid; place-items: center;
  font-size: 12px; font-weight: 600; color: #fff; background: var(--c); border-radius: 11px;
}

.md-note { margin-top: 14px; padding: 16px; background: var(--card); border: 1px solid var(--hair); border-radius: 20px; }
.md-note label { display: block; margin-bottom: 10px; font-size: 15px; }
.md-note input { width: 100%; font-size: 16px; padding: 12px 14px; border-radius: 14px; }
.md-note-b { display: flex; gap: 10px; margin-top: 12px; }

.md-seg { display: flex; gap: 4px; margin: 26px 0 14px; padding: 4px; background: var(--hair); border-radius: 22px; }
.md-seg-b {
  flex: 1; min-height: 38px; font: 500 14px "Poppins", sans-serif; color: var(--muted);
  background: none; border: none; border-radius: 18px; cursor: pointer;
}
.md-seg-b.on { background: var(--card); color: var(--ink); font-weight: 600; }

.md-sum { margin-bottom: 14px; padding: 18px; background: var(--card); border: 1px solid var(--hair); border-radius: 20px; }
.md-sum-top { display: flex; align-items: center; gap: 14px; }
.md-sum-e { font-size: 40px; line-height: 1; }
.md-sum-top b { display: block; font-size: 22px; font-weight: 600; text-transform: none; }
.md-sum-top div span { font-size: 14px; color: var(--muted); }
.md-strip { display: flex; gap: 3px; height: 10px; margin-top: 16px; }
.md-strip i { display: block; background: var(--c); border-radius: 5px; min-width: 6px; }
.md-keys { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.md-keys span { display: inline-flex; align-items: center; gap: 6px; }
.md-keys span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

.md-day { margin: 20px 0 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
.md-list { background: var(--card); border: 1px solid var(--hair); border-radius: 20px; overflow: hidden; }
.md-row { display: flex; align-items: center; gap: 14px; padding: 14px 8px 14px 16px; cursor: pointer; }
.md-row + .md-row { border-top: 1px solid var(--hair); }
.md-t { flex: none; width: 62px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.md-what { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.md-what b { font-size: 16px; font-weight: 500; }
.md-what small { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.md-what small.ghost { opacity: .6; }
.md-del { flex: none; width: 36px; height: 36px; font-size: 20px; color: var(--muted); background: none; border: none; border-radius: 50%; cursor: pointer; }
.md-empty { margin: 0; font-size: 15px; color: var(--muted); }

/* life goals: one at a time, on track or not */
.lf-goals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.lf-goals li { padding: 16px; background: var(--card); border: 1px solid var(--hair); border-radius: 20px; }
.lf-g-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.lf-g-n { font-size: 13px; font-weight: 600; color: var(--c); }
.lf-pill { padding: 3px 10px; font-size: 12px; font-weight: 600; border-radius: 12px; }
.lf-pill.on   { color: #5f9468; background: color-mix(in srgb, #7daf86 18%, transparent); }
.lf-pill.near { color: #b8860b; background: color-mix(in srgb, #c9965a 18%, transparent); }
.lf-pill.off  { color: #d0602a; background: color-mix(in srgb, #e3a27a 18%, transparent); }
.lf-pill.none { color: var(--muted); background: var(--hair); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .lf-pill.on { color: #8fe0a6; }
  :root:not([data-theme="light"]) .lf-pill.near { color: #f2cc5c; }
  :root:not([data-theme="light"]) .lf-pill.off { color: #ffad6e; }
}
:root[data-theme="dark"] .lf-pill.on { color: #8fe0a6; }
:root[data-theme="dark"] .lf-pill.near { color: #f2cc5c; }
:root[data-theme="dark"] .lf-pill.off { color: #ffad6e; }
.lf-g-text { display: block; font-size: 18px; font-weight: 600; line-height: 1.3; }
.lf-g-as { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
.lf-g-num { margin-top: 10px; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.lf-g-num small { font-size: 14px; font-weight: 400; color: var(--muted); }
.lf-g-bar { display: block; height: 6px; margin-top: 8px; background: var(--hair); border-radius: 3px; overflow: hidden; }
.lf-g-bar u { display: block; width: 0; height: 100%; background: var(--c); border-radius: 3px; transition: width .9s cubic-bezier(.22, 1, .36, 1); }
.lf-g-why, .lf-g-next { margin: 12px 0 0; font-size: 15px; line-height: 1.45; }
.lf-g-why span, .lf-g-next span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
.lf-g-del { margin-top: 10px; padding: 4px 0; font: 500 13px "Poppins", sans-serif; color: var(--muted); background: none; border: none; cursor: pointer; }
.lf-addgoal { width: 100%; margin-top: 16px; }
.w3-link { display: block; margin: 18px auto 0; padding: 8px 12px; font: 500 14px "Poppins", sans-serif; color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.w3 { position: fixed; inset: 0; z-index: 40; font-family: "Poppins", sans-serif; }
.w3-back { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); animation: fadein .2s ease-out; }
.w3-sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-width: 30rem; margin: 0 auto;
  padding: 10px 22px calc(22px + env(safe-area-inset-bottom, 0px));
  background: var(--card); border-radius: 26px 26px 0 0;
  animation: w3up .28s cubic-bezier(.22, 1, .36, 1);
}
.w3.out .w3-sheet { animation: w3down .2s ease-in forwards; }
.w3.out .w3-back { opacity: 0; transition: opacity .2s; }
@keyframes w3up { from { transform: translateY(100%); } }
@keyframes w3down { to { transform: translateY(100%); } }
.w3-grab { display: block; width: 40px; height: 5px; margin: 0 auto 16px; background: var(--hair); border-radius: 3px; }
.w3-sheet h2 { margin: 0 0 18px; font-size: 22px; font-weight: 600; text-transform: none; }
.w3-sheet ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
.w3-sheet li { display: flex; gap: 14px; align-items: flex-start; }
.w3-sheet li i { flex: none; width: 30px; height: 30px; display: grid; place-items: center; font-style: normal; font-size: 14px; font-weight: 600; color: #fff; background: var(--c); border-radius: 50%; }
.w3-sheet li b { display: block; font-size: 16px; font-weight: 500; line-height: 1.4; }
.w3-sheet li small { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
.w3-end { margin: 22px 0 16px; font-size: 16px; font-weight: 600; }
.w3-ok { width: 100%; }
.lf-limit { margin: 0 0 14px; font-size: 14px; color: var(--muted); }
.lf-sofar { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.lf-sofar li { padding: 14px 16px; background: var(--card); border: 1px solid var(--hair); border-radius: 16px; font-size: 16px; font-weight: 500; }
.lf-sofar span { display: block; font-size: 12px; font-weight: 600; color: var(--c); margin-bottom: 2px; }
.lf-btns.col { flex-direction: column; }
.lf-btns.col + .lf-limit { margin-top: 12px; text-align: center; }
.lf-opts { display: flex; flex-direction: column; gap: 10px; }
.lf-opt { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; text-align: left; cursor: pointer; font-family: "Poppins", sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--hair); border-radius: 16px; }
.lf-opt b { font-size: 16px; font-weight: 600; }
.lf-opt span { font-size: 13px; color: var(--muted); }

/* tweets: a private feed */
.tw-compose { display: flex; gap: 12px; padding: 14px 0 16px; border-bottom: 1px solid var(--hair); }
.tw-av { flex: none; width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
.tw-box { flex: 1; min-width: 0; }
#idea-input {
  display: block; width: 100%; min-height: 48px; padding: 8px 0; resize: none; overflow: hidden;
  font: 400 18px/1.4 "Poppins", sans-serif; color: var(--ink);   /* 16px or more, or iOS zooms */

}

.tw-bar { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 8px; }
.tw-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.tw-post {

.tw { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--hair); animation: fadein .25s ease-out; }

.tw-head { display: flex; gap: 6px; font-size: 15px; }

.tw-head span { color: var(--muted); }

.tw-act.del:active { color: var(--pink); }
.tw-empty { margin: 20px 0 0; font-size: 15px; line-height: 1.5; color: var(--muted); }

.lf-opt.mine { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--card)); }
.lf-or { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.lf-today {
  display: block; width: 100%; margin-top: 14px; min-height: 46px;
  font: 600 15px "Poppins", sans-serif; color: var(--ink);
  background: var(--hair); border: none; border-radius: 23px; cursor: pointer;
}
