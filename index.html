// steps that come from your own log: when you usually have it, how often, your best gap
function dataSteps(g) {
  const out = [];
  const k = planKey(), last14 = []; for (let i = 0; i < 14; i++) last14.push(shiftKey(k, -i));
  const wk = last14.slice(0, 7), prevWk = last14.slice(7);
  const d = g.dyn;
  const avoidFood = d && d.src === 'food' && d.avoid ? (f => entryKinds(f).includes(d.kind) || new RegExp('\\b' + d.label.split(' ')[0], 'i').test(f.what)) : null;
  if (avoidFood) {
    const hits = state.food.filter(avoidFood);
    const daysWith = ks => ks.filter(x => foodIn([x]).some(avoidFood)).length;
    const now = daysWith(wk), before = daysWith(prevWk);
    if (hits.length) {
      const hrs = hits.map(f => new Date(f.at).getHours() * 60 + new Date(f.at).getMinutes()).sort((a, b) => a - b);
      const usual = hrs[Math.floor(hrs.length / 2)];
      out.push('You usually have ' + d.label + ' around ' + clock(usual) + '. Tonight, wait until ' + clock(usual + 60) + '.');
      if (foodIn([k]).some(avoidFood)) out.push('You already had ' + d.label + ' today. Let that be the only one.');
      if (now > 1) out.push('You had ' + d.label + ' on ' + now + ' of the last 7 days. Aim for ' + (now - 1) + ' next week, one less is enough.');
      // longest run of days without it, in the last 30
      let run = 0, best = 0;
      const first = key(new Date(Math.min(...hits.map(f => f.at))));      // only count from when you started logging it
      for (let i = 29; i >= 0; i--) { const x = shiftKey(k, -i); if (x < first) continue; if (foodIn([x]).some(avoidFood)) run = 0; else { run++; best = Math.max(best, run); } }
      if (best >= 1 && best < 30) out.push('Your longest gap this month was ' + best + ' day' + (best > 1 ? 's' : '') + '. Try for ' + (best + 1) + '.');
      if (before > now) out.unshift('Down from ' + before + ' days the week before to ' + now + '. Keep the same pace, no need to rush.');
    } else {
      out.push('Nothing logged lately. If you do have ' + d.label + ', log it, so the steps can fit you.');
    }
  }
  if (g.m === 'gym') {
    const n = wk.filter(x => (state.gym[x] || []).length).length;
    out.push(n ? 'You trained ' + n + ' time' + (n > 1 ? 's' : '') + ' this week. One short session gets you to ' + (n + 1) + '.' : 'No gym this week yet. A 20 minute session still counts.');
  }
  if (g.m === 'sleep') {
    const caf = state.food.filter(f => has(f, 'caffeine') && last14.includes(key(new Date(f.at))));
    if (caf.length) { const lastT = Math.max(...caf.map(f => new Date(f.at).getHours() * 60 + new Date(f.at).getMinutes()));
      out.push('Your latest coffee lately was ' + clock(lastT) + '. Tomorrow, have it 30 minutes earlier.'); }
  }
  if (g.m === 'protein') {
    const meals = foodIn(wk).filter(f => !isDrink(f)), pro = meals.filter(f => has(f, 'protein'));
    if (pro.length) { const fav = Object.entries(pro.reduce((m, f) => (m[f.what.toLowerCase()] = (m[f.what.toLowerCase()] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1])[0][0];
      out.push('You often have ' + fav + '. Have it once more this week.'); }
  }
  return out;
}

function goalCoach(g) {
  const day = Math.floor(Date.now() / 86400000);
  const skip = new Set(g.skipSteps || []);
  const fromData = dataSteps(g).filter(t => !skip.has(t));
  // data steps first; if you said "not for me" to all of them, the general ones
  const pick1 = arr => { const ok = arr.filter(t => !skip.has(t)); if (fromData.length) return fromData[day % fromData.length];
                          return ok.length ? ok[day % ok.length] : 'You have seen every step I have. Write your own small step as a goal.'; };
  if (g.m === 'dyn' && g.dyn) {
    const d = g.dyn, L = d.label;
    if (d.src === 'food' && d.avoid && CUT[d.kind]) { const c = CUT[d.kind]; return { why: c.why, heads: c.heads, step: pick1(c.steps) }; }
    if (d.src === 'food' && !d.avoid) {
      const why = { water: 'Water keeps your focus sharp and headaches away.', protein: 'Protein builds muscle and keeps you full.', fibre: 'Fibre feeds your gut and steadies energy.' }[d.kind]
                  || 'More of what helps you, little by little.';
      return { why, step: pick1(['Have some ' + L + ' with your next meal.', 'Put ' + L + ' on your grocery list.', 'Keep ' + L + ' where you can see it.']) };
    }
    if (d.src === 'mood') return { why: 'Feeling less ' + L + ' frees up energy for what you care about.',
      step: pick1(['Take five slow breaths when you notice it.', 'Log it when you feel ' + L + ', patterns show up.', 'Step outside for 5 minutes.', 'Write down what set it off.']) };
    if (d.avoid) return { why: 'Doing less of what drains you leaves more room for what fills you.',
      step: pick1(['Notice when you reach for ' + L + ' today.', 'Make it a little harder to start.', 'Replace it once today with something better.']) };
    return { why: 'Doing ' + L + ' regularly turns it into a habit, and habits do the heavy lifting for you.',
      step: pick1(['Put ' + L + ' on your day plan.', 'Make it small: 10 minutes counts.', 'Do it at the same time each day.', 'Tick it as soon as it is done.']) };
  }
  if (g.m === 'custom') return { why: 'You chose this in your own words. Small daily steps add up.',
    step: pick1(['Do the smallest version of it today.', 'Pick a time today and put it on the plan.', 'Tick it the moment it is done.']) };
  const c = COACH[g.m];
  if (c) return { why: c.why, step: pick1(c.steps) };
  return { why: 'Small daily steps add up.', step: 'Do the smallest version of it today.' };
}

/* ---- the day summary ----
   opens when you tick the last block. how the day went, one thing to do
   better tomorrow, and patterns from your past 30 days. simple rules. */
function dayStats(k) {
  const d = state.days[k]; if (!d || !d.blocks.length) return null;
  const total = d.blocks.length, done = d.blocks.filter(b => b.done).length;
  const mins = d.blocks.filter(b => b.done).reduce((n, b) => n + (Number(b.mins) || 0), 0);
  return { total, done, pct: done / total, mins, start: toMins(d.start), d };
}

function daySummary(k) {
  const st = dayStats(k); if (!st) return;
  const food = foodIn([k]), moods = moodsIn([k]);
  const tasks = st.d.blocks.reduce((n, b) => n + (b.goals || []).length, 0);
  const tasksDone = st.d.blocks.reduce((n, b) => n + (b.goals || []).filter(t => t.done).length, 0);
  const agenda = st.d.blocks.reduce((n, b) => n + (b.agenda || []).length, 0);
  const agendaDone = st.d.blocks.reduce((n, b) => n + (b.agenda || []).filter(t => t.done).length, 0);
  const meals = food.filter(f => !isDrink(f)), protein = meals.filter(f => has(f, 'protein')).length;
  const lateCaf = food.some(f => has(f, 'caffeine') && new Date(f.at).getHours() >= 14);
  const tally = {}; moods.forEach(m => tally[m.mood] = (tally[m.mood] || 0) + 1);
  const topMood = Object.entries(tally).sort((a, b) => b[1] - a[1])[0];
  const md = topMood && MOODS.find(m => m.k === topMood[0]);
  const habitsDone = state.habits.filter(h => h.marks.includes(k)).length;

  // how it went
  const rows = [
    ['Blocks', st.done + ' of ' + st.total],
    ['Time on plan', dur(st.mins)],
    tasks ? ['Focus tasks', tasksDone + ' of ' + tasks] : null,
    agenda ? ['Agenda points', agendaDone + ' of ' + agenda] : null,
    md ? ['Mood', md.e + ' mostly ' + md.k] : null,
    food.length ? ['Food', food.length + ' logged' + (meals.length ? ' · protein in ' + protein + ' of ' + meals.length : '')] : null,
    sleepOn(k) ? ['Sleep', dur(sleepMins(sleepOn(k))) + ' \u00b7 ' + SLEEP_FEEL[(sleepOn(k).q || 3) - 1][1]] : null,
    state.habits.length ? ['Habits', habitsDone + ' of ' + state.habits.length] : null
  ].filter(Boolean);

  // one thing to do better tomorrow: the first that applies
  const sad = moods.find(m => ['tired', 'low', 'stressed', 'anxious', 'unmotivated', 'unfocused'].includes(m.mood));
  const better =
    st.d.blocks.some(b => isWorkBlock(b.label) && !(b.goals || []).length) ? 'Give each work block one clear outcome before it starts: what will be finished?' :
    tasks && tasksDone < tasks ? 'Give tomorrow’s focus block one smaller task, so it is easy to finish.' :
    lateCaf ? 'Have your last coffee before 2pm tomorrow. It will help tonight’s sleep.' :
    sleepOn(k) && sleepMins(sleepOn(k)) < 420 ? 'You slept ' + dur(sleepMins(sleepOn(k))) + '. Aim to be in bed 30 minutes earlier tonight.' :
    meals.length && !protein ? 'Add protein to breakfast tomorrow, eggs or beans, for steadier energy.' :
    sad ? 'You felt ' + sad.mood + ' around ' + clockOf(sad.at) + '. Plan a short break or walk near that time tomorrow.' :
    st.start > 10 * 60 && k !== planKey() ? 'Start your first block 30 minutes earlier tomorrow.' :
    st.total > 8 ? 'Plan one less block tomorrow. Fewer blocks, more finished.' :
    !food.length ? 'Log what you eat tomorrow, so brick can spot what gives you energy.' :
    'Plan tomorrow tonight. It takes two minutes and makes the morning easier.';

  // patterns from the last 30 days
  const pats = [];
  const past = []; for (let i = 0; i < 30; i++) { const kk = shiftKey(k, -i); const s2 = dayStats(kk); if (s2) past.push({ k: kk, ...s2 }); }
  const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length * 100) : null;
  if (past.length >= 5) {
    const byDow = {};
    past.forEach(p => { const w = fromKey(p.k).getDay(); (byDow[w] = byDow[w] || []).push(p.pct); });
    const best = Object.entries(byDow).filter(([, v]) => v.length >= 2).map(([w, v]) => [w, avg(v)]).sort((a, b) => b[1] - a[1])[0];
    if (best) pats.push('You finish the most on ' + cap(FULL[best[0]]) + 's, ' + best[1] + '% of blocks.');
    const early = past.filter(p => p.start < 9 * 60).map(p => p.pct), late = past.filter(p => p.start >= 9 * 60).map(p => p.pct);
    if (early.length >= 2 && late.length >= 2 && Math.abs(avg(early) - avg(late)) >= 10)
      pats.push('Days you start before 9am you finish ' + avg(early) + '% of blocks, ' + avg(late) + '% when you start later.');
    const gymDays = past.filter(p => (state.gym[p.k] || []).length).map(p => p.k);
    const goodShare = ks => { const m = moodsIn(ks); return m.length ? Math.round(m.filter(x => ['good', 'calm', 'focused'].includes(x.mood)).length / m.length * 100) : null; };
    const slept = past.map(p => p.k).filter(x => sleepOn(x));
    const sGood = goodShare(slept.filter(x => sleepMins(sleepOn(x)) >= 420)), sBad = goodShare(slept.filter(x => sleepMins(sleepOn(x)) < 420));
    if (sGood !== null && sBad !== null && Math.abs(sGood - sBad) >= 15)
      pats.push('After 7h of sleep your moods are ' + sGood + '% good, ' + sBad + '% after less.');
    const gYes = goodShare(gymDays), gNo = goodShare(past.map(p => p.k).filter(x => !gymDays.includes(x)));
    if (gymDays.length >= 2 && gYes !== null && gNo !== null && Math.abs(gYes - gNo) >= 15)
      pats.push('On gym days your moods are ' + gYes + '% good, ' + gNo + '% on other days.');
  }

  const old = document.getElementById('daysum'); if (old) old.remove();
  const el = document.createElement('div');
  el.id = 'daysum'; el.className = 'w3';
  el.innerHTML = '<div class="w3-back"></div><div class="w3-sheet ds-sheet" role="dialog" aria-modal="true"><span class="w3-grab"></span>' +
    '<div class="ds-head"><small>' + (k === planKey() ? 'Today' : cap(FULL[fromKey(k).getDay()])) + '</small><h2>' +
      (st.done === st.total ? 'Day done' : st.done + ' of ' + st.total + ' done') + '</h2><b>' + Math.round(st.pct * 100) + '%</b></div>' +
    '<ul class="ds-rows">' + rows.map(([a, b]) => '<li><span>' + a + '</span><b>' + esc(b) + '</b></li>').join('') + '</ul>' +
    '<div class="ds-box better"><span>One thing for tomorrow</span><p>' + esc(better) + '</p></div>' +
    (pats.length ? '<div class="ds-box"><span>Patterns</span>' + pats.slice(0, 2).map(p => '<p>' + esc(p) + '</p>').join('') + '</div>'
                 : '<div class="ds-box"><span>Patterns</span><p>A few more planned days and patterns show up here.</p></div>') +
    '<div class="bk-btns"><button type="button" class="lf-btn main" data-a="plan">Plan tomorrow</button><button type="button" class="lf-btn" data-a="close">Close</button></div></div>';
  document.body.appendChild(el);
  const close = () => el.remove();
  el.querySelector('.w3-back').addEventListener('click', close);
  el.querySelector('[data-a=close]').addEventListener('click', close);
  el.querySelector('[data-a=plan]').addEventListener('click', () => { close(); viewDay = shiftKey(k, 1); show('day'); window.scrollTo(0, 0); });
}

// what today brought to a goal: blocks you ticked, habits you marked, food you logged
function goalTodayLinks(g, area) {
  const k = planKey(), day = state.days[k] || { blocks: [] };
  const done = (day.blocks || []).filter(b => b.done);
  const food = foodIn([k]);
  const short = t => String(t).toLowerCase().split(' ').slice(0, 3).join(' ');
  const out = [];
  const blocksWhere = test => done.filter(b => test(b.label || '')).slice(0, 3).forEach(b => out.push({ t: short(b.label), ok: true }));
  if (g.m === 'custom') { if ((g.days || []).includes(k)) out.push({ t: 'ticked', ok: true }); return out; }
  if (g.m === 'dyn' && g.dyn) {
    const d = g.dyn;
    if (d.src === 'blocks') blocksWhere(l => new RegExp('\\b' + d.match, 'i').test(l));
    if (d.src === 'food') {
      const hits = food.filter(f => entryKinds(f).includes(d.kind) || new RegExp('\\b' + d.label.split(' ')[0], 'i').test(f.what));
      if (d.avoid) out.push(hits.length ? { t: short(hits[0].what), ok: false } : { t: 'none logged', ok: true });
      else hits.slice(0, 3).forEach(f => out.push({ t: short(f.what), ok: true }));
    }
    return out;
  }
  const foodKind = { protein: ['protein', false], gut: ['fibre', false], sugarfree: ['sugar', true] }[g.m];
  if (foodKind) {
    const hits = food.filter(f => entryKinds(f).includes(foodKind[0]));
    if (foodKind[1]) out.push(hits.length ? { t: short(hits[0].what), ok: false } : { t: 'none', ok: true });
    else hits.slice(0, 3).forEach(f => out.push({ t: short(f.what), ok: true }));
    return out;
  }
  if (g.m === 'sleep') {
    const late = food.filter(f => entryKinds(f).includes('caffeine') && new Date(f.at).getHours() >= 12);
    out.push(late.length ? { t: short(late[0].what) + ' after noon', ok: false } : { t: 'no late caffeine', ok: true });
    return out;
  }
  if (g.m === 'gym') { if ((state.gym[k] || []).length) out.push({ t: 'gym', ok: true }); blocksWhere(l => /gym|workout|training/i.test(l)); return out.slice(0, 3); }
  if (g.m === 'learn') { blocksWhere(l => /study|course|learn|golang|certif|read/i.test(l)); return out; }
  if (g.m === 'focus') { const n = done.reduce((x, b) => x + (b.goals || []).filter(t => t.done).length, 0); if (n) out.push({ t: n + ' focus task' + (n > 1 ? 's' : ''), ok: true }); return out; }
  const areaOf = MEASURES[g.m] && MEASURES[g.m].area;
  if (areaOf) blocksWhere(l => inArea(l, areaOf));
  return out;
}

// order the fixed measures by how much they share with what you wrote
function relatedOptions(text, options) {
  const words = String(text).toLowerCase().match(/[a-z]{3,}/g) || [];
  return options.map(id => {
    const M = MEASURES[id], hay = (M.words.join(' ') + ' ' + M.say + ' ' + M.unit).toLowerCase();
    return { id, score: words.filter(w => hay.includes(w)).length };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).map(x => x.id).slice(0, 3);
}

/* adding goals: one at a time, up to 3 per area.
   write it -> (help me say it -> confirm) or (keep my words) -> saved
   -> "add goal 2" or "done". */
// ask the laptop server to have Claude read a goal. null means "use word matching".
async function aiGoal(area, text, ids) {
  if (!ids.length) return null;
  const measures = ids.map(id => ({ id, say: MEASURES[id].say, unit: MEASURES[id].target + (MEASURES[id].pct ? '' : ' ') + MEASURES[id].unit + ' a week' }));
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 20000);
    const r = await fetch('/api/goal', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                         body: JSON.stringify({ area, text, measures }), signal: ctl.signal });
    clearTimeout(timer);
    if (!r.ok) return null;
    const out = await r.json();
    if (!out || typeof out.id !== 'string' || (out.id !== 'custom' && !ids.includes(out.id))) return null;
    return { id: out.id, say: String(out.say || ''), why: String(out.why || ''), words: Array.isArray(out.words) ? out.words.map(String) : [] };
  } catch { return null; }
}

function lifeWizard(box) {
  if (!lifeSetup) lifeSetup = { i: 0, text: '' };
  const st = lifeSetup, a = AREAS[st.i];
  const gs = areaGoals(a.k) || [];
  if (!state.life[a.k]) state.life[a.k] = { goals: [], ids: [] };
  const goals = state.life[a.k].goals || (state.life[a.k].goals = []);
  const n = st.replace !== undefined ? st.replace + 1 : goals.length + 1;
  const step = st.one ? '' : '<span class="lf-step">' + a.name + ' · area ' + (st.i + 1) + ' of 4</span>';

  const finishArea = () => {
    if (st.one) { lifeSetup = null; lifeOpen = st.back || a.k; renderLife(); return; }
    const j = st.i + 1;
    lifeSetup = j < AREAS.length ? { i: j, text: '' } : null;
    renderLife();
  };
  const saveGoal = (text, m, own, dyn) => {
    const g = m === 'custom' ? { text, m, own: true, target: 5, days: [] } : { text, m, own };
    if (m === 'dyn') g.dyn = dyn;
    g.setAt = Date.now();
    if (st.replace !== undefined) {
      const was = goals[st.replace] || {};
      if (m === 'custom' && was.m === 'custom') g.days = was.days || [];   // keep the days you ticked
      if (was.private) g.private = true;
      goals[st.replace] = g;
      areaGoals(a.k); save();
      lifeSetup = null; lifeOpen = a.k; renderLife();
      return;
    }
    goals.push(g);
    areaGoals(a.k); save();
    lifeSetup = { ...st, text: '', pick: null, said: null, saved: true };
    renderLife();
  };
  const used = goals.filter((g, j) => j !== st.replace).map(g => g.m).filter(m => m !== 'custom');
  const options = Object.keys(MEASURES).filter(id => MEASURES[id].area === a.k && !used.includes(id));

  // after saving: show the goals so far, add another or move on
  if (st.saved) {
    box.innerHTML = '<div class="lf-wiz" style="--c:' + a.c + '">' + step + '<h1>' + a.name + '</h1>' +
      '<ol class="lf-sofar">' + goals.map((g, i) => '<li><span>Goal ' + (i + 1) + '</span>' + esc(g.text) + '</li>').join('') + '</ol>' +
      '<div class="lf-btns col">' +
        (goals.length < MAX_LIFE_GOALS ? '<button type="button" class="lf-btn" data-a="more">Add goal ' + n + '</button>' : '') +
        '<button type="button" class="lf-btn main" data-a="done">' + (st.one || st.i === AREAS.length - 1 ? 'Done' : 'Next: ' + AREAS[st.i + 1].name) + '</button>' +
      '</div>' +
      '<p class="lf-limit">' + goals.length + ' of ' + MAX_LIFE_GOALS + ' goals</p>' +
      '<button type="button" class="w3-link">Why only 3 goals?</button></div>';
    box.querySelector('.w3-link').addEventListener('click', () => openWhy3(a.c));
    const more = box.querySelector('[data-a=more]');
    if (more) more.addEventListener('click', () => { lifeSetup = { ...st, saved: false }; renderLife(); });
    box.querySelector('[data-a=done]').addEventListener('click', finishArea);
    return;
  }

  // nothing matched, or it matched a goal you already have: pick what to measure
  if (st.pick) {
    box.innerHTML = '<div class="lf-wiz" style="--c:' + a.c + '">' + step + '<h1>Goal ' + n + '</h1>' +
      '<p class="lf-yours">“' + esc(st.text) + '”</p>' +
      '<p class="lf-ask">' + (st.pick === 'dup' ? 'That sounds like a goal you already have.' : 'I can\u2019t measure that from what you log.') + ' How should we track it?</p>' +
      (st.ai && st.ai.why ? '<p class="lf-yours" style="margin-top:-8px">' + esc(st.ai.why) + '</p>' : '') +
      '<div class="lf-opts"><button type="button" class="lf-opt mine" data-custom="1"><b>Track it my own way</b>' +
        '<span>keep your words, tick it yourself each day you do it \u00b7 5 days a week</span></button>' +
      (() => {
        const rel = st.all ? options : relatedOptions(st.text, options);
        return (rel.length ? '<p class="lf-or">' + (st.all ? 'or measure it with one of these' : 'or one of these, close to your words') + '</p>' : '') +
          rel.map(id => '<button type="button" class="lf-opt" data-m="' + id + '"><b>' + esc(cap(MEASURES[id].say)) + '</b><span>' +
            MEASURES[id].target + (MEASURES[id].pct ? '' : ' ') + MEASURES[id].unit + ' a week</span></button>').join('') +
          (!st.all && rel.length < options.length ? '<button type="button" class="lf-skip" data-a="all">Show every way to measure</button>' : '');
      })() + '</div>' +
      '<button type="button" class="lf-skip" data-a="back">Rewrite it</button></div>';
    box.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => saveGoal(st.text, b.dataset.m, true)));
    box.querySelector('[data-custom]').addEventListener('click', () => saveGoal(st.text, 'custom', true));
    box.querySelector('[data-a=back]').addEventListener('click', () => { lifeSetup = { ...st, pick: null }; renderLife(); });
    const all = box.querySelector('[data-a=all]');
    if (all) all.addEventListener('click', () => { lifeSetup = { ...st, all: true }; renderLife(); });
    return;
  }

  // say it back
  if (st.said) {
    const m = st.said, M = m === 'dyn' ? dynMeasure(st.dyn) : MEASURES[m];
    const ws = m === 'dyn' ? wordsFound(st.dyn.label.split(' '), st.text) : st.ai ? st.ai.words : wordsFound(M.words, st.text);
    const sayIt = st.ai ? cap(st.ai.say) : cap(M.say);
    const whyIt = m === 'dyn' ? 'you named ' + quoteList([st.dyn.label]) + (st.dyn.src === 'food' ? ', I will count it from your food log'
                                     : st.dyn.src === 'mood' ? ', I will count it from your moods' : ', I will count it from your day plan and habits')
                : st.ai ? st.ai.why + (ws.length ? ' You said ' + quoteList(ws) + '.' : '')
                        : (ws.length ? 'you said ' + quoteList(ws) : 'it is the closest match');
    box.innerHTML = '<div class="lf-wiz" style="--c:' + a.c + '">' + step + '<h1>Goal ' + n + '</h1>' +
      '<p class="lf-said">' + esc(sayIt) + '</p>' +
      '<p class="lf-yours">' + markWords(st.text, ws) + '</p>' +
      '<ul class="lf-why"><li><b>Why I read it this way</b><span>' + whyIt + '</span></li>' +
      '<li><b>How I will measure it</b><span>' + M.target + (M.pct ? '' : ' ') + M.unit + ' a week</span></li></ul>' +
      '<div class="lf-btns"><button type="button" class="lf-btn main" data-a="yes">That’s it</button>' +
      '<button type="button" class="lf-btn" data-a="redo">Rewrite</button></div></div>';
    if (st.offline) box.querySelector('.lf-why').insertAdjacentHTML('afterend', '<p class="lf-limit" style="margin-top:12px">Read with simple word matching. The AI reader is off.</p>');
    box.querySelector('[data-a=yes]').addEventListener('click', () => saveGoal(sayIt, m, false, st.dyn));
    box.querySelector('[data-a=redo]').addEventListener('click', () => { lifeSetup = { ...st, said: null, ai: null }; renderLife(); });
    return;
  }

  // write it
  box.innerHTML =
    '<div class="lf-wiz" style="--c:' + a.c + '">' + step + '<h1>' + a.name + ' · Goal ' + n + '</h1>' +
    '<p class="lf-ask">' + (n === 1 ? a.ask : 'What else do you want for your ' + a.name.toLowerCase() + '?') + '</p>' +
    '<p class="lf-limit">One goal at a time. Up to ' + MAX_LIFE_GOALS + '.</p>' +
    '<textarea class="lf-text" rows="3" maxlength="200" placeholder="' + esc(a.eg.replace(/^e\.g\. /, '')) + '"></textarea>' +
    '<div class="lf-btns"><button type="button" class="lf-btn main" data-a="go">Help me say it</button>' +
    '<button type="button" class="lf-btn" data-a="own">Keep my words</button></div>' +
    '<button type="button" class="lf-skip" data-a="skip">' + (goals.length ? 'Done with ' + a.name : st.one ? 'Cancel' : 'Skip ' + a.name) + '</button></div>';
  const ta = box.querySelector('.lf-text');
  ta.value = st.text || '';
  const choose = async (own) => {
    const t = ta.value.trim(); if (!t) { ta.focus(); return; }
    const btns = box.querySelectorAll('.lf-btns button');
    btns.forEach(b => { b.disabled = true; });
    const go = box.querySelector('[data-a=go]'); go.textContent = 'Thinking\u2026';

    // a goal that names a thing (quit edibles, gym 3 times a week) is read directly
    const dyn = readDynamic(t);
    if (dyn) {
      if (own) { saveGoal(t, 'dyn', true, dyn); return; }
      lifeSetup = { ...st, text: t, said: 'dyn', dyn }; renderLife(); return;
    }

    // otherwise ask Claude what you mean; if it can't be reached, fall back to word matching
    const ai = await aiGoal(a.k, t, options);
    if (ai) {
      if (ai.id === 'custom') { lifeSetup = { ...st, text: t, pick: 'none', ai }; renderLife(); return; }
      if (own) { saveGoal(t, ai.id, true); return; }
      lifeSetup = { ...st, text: t, said: ai.id, ai }; renderLife(); return;
    }
    const ids = readArea(a.k, t, true);
    const fresh = ids.filter(id => !used.includes(id));
    if (!ids.length) { lifeSetup = { ...st, text: t, pick: 'none', offline: true }; renderLife(); return; }
    if (!fresh.length) { lifeSetup = { ...st, text: t, pick: 'dup' }; renderLife(); return; }
    if (own) saveGoal(t, fresh[0], true);
    else { lifeSetup = { ...st, text: t, said: fresh[0], offline: true }; renderLife(); }
  };
  box.querySelector('[data-a=go]').addEventListener('click', () => choose(false));
  box.querySelector('[data-a=own]').addEventListener('click', () => choose(true));
  box.querySelector('[data-a=skip]').addEventListener('click', () => {
    if (st.replace !== undefined) { lifeSetup = null; lifeOpen = a.k; renderLife(); return; }
    if (goals.length || !st.one) finishArea(); else { lifeSetup = null; renderLife(); }
  });
}

/* =========== show mode ===========
   for showing the app to friends. progress and numbers stay, private
   things blur: tweets, mood notes, edibles, love goals, and any life
   goal you mark private. leaving needs your PIN.
   (Face ID needs https, so it comes once the app is hosted.)
   This keeps friends from reading over your shoulder. It is not encryption. */
const SHOW_KEY = KEY + '.show', PIN_KEY = KEY + '.pin';

function pinHash(p) {   // a simple fingerprint, so the PIN is not stored as typed
  let h = 2166136261;
  for (const c of 'brick:' + p) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
const showOn = () => { try { return localStorage.getItem(SHOW_KEY) === '1'; } catch { return false; } };

function applyShow() {
  const on = showOn();
  document.body.classList.toggle('showmode', on);
  document.getElementById('showbar').hidden = !on;
  const t = document.getElementById('show-toggle');
  if (t) t.textContent = on ? 'Show mode is on' : 'Show mode';
}

function setShow(on) {
  try { localStorage.setItem(SHOW_KEY, on ? '1' : '0'); } catch {}
  applyShow();
}

// a small sheet with a 4 digit box
function pinSheet(title, sub, onPin, extra) {
  const old = document.getElementById('pinsheet'); if (old) old.remove();
  const el = document.createElement('div');
  el.id = 'pinsheet';
  el.className = 'w3';
  el.innerHTML = '<div class="w3-back"></div><div class="w3-sheet" role="dialog" aria-modal="true">' +
    '<span class="w3-grab"></span><h2>' + title + '</h2><p class="pin-sub">' + sub + '</p>' +
    '<input class="pin-in" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="4 digit PIN">' +
    '<p class="pin-msg"></p>' + (extra || '') + '</div>';
  document.body.appendChild(el);
  const inp = el.querySelector('.pin-in');
  const close = () => el.remove();
  el.querySelector('.w3-back').addEventListener('click', close);
  inp.addEventListener('input', () => {
    inp.value = inp.value.replace(/\D/g, '').slice(0, 4);
    if (inp.value.length === 4) onPin(inp.value, el, close);
  });
  setTimeout(() => inp.focus(), 60);
  return el;
}

function startShow() {
  let pin = null;
  try { pin = localStorage.getItem(PIN_KEY); } catch {}
  if (pin) { setShow(true); setMore(false); return; }
  // first time: choose a PIN, then type it again
  pinSheet('Choose a PIN', 'You will need it to leave Show mode.', (p1, el, close) => {
    close();
    pinSheet('Type it again', 'Just to be sure.', (p2, el2, close2) => {
      if (p2 !== p1) { el2.querySelector('.pin-msg').textContent = 'Those did not match. Start again.'; setTimeout(() => { close2(); startShow(); }, 900); return; }
      try { localStorage.setItem(PIN_KEY, pinHash(p1)); } catch {}
      close2(); setShow(true); setMore(false);
    });
  });
}

function exitShow() {
  let pin = null;
  try { pin = localStorage.getItem(PIN_KEY); } catch {}
  const el = pinSheet('Leave Show mode', 'Type your PIN.', (p, el, close) => {
    if (pinHash(p) === pin) { close(); setShow(false); }
    else { el.querySelector('.pin-msg').textContent = 'Wrong PIN.'; el.querySelector('.pin-in').value = ''; }
  }, '<button type="button" class="pin-forgot">Forgot PIN?</button>');
  // forgot: wait a minute, then it opens. a friend will not sit through that
  el.querySelector('.pin-forgot').addEventListener('click', e => {
    const b = e.target; let n = 60;
    b.disabled = true;
    const tick = () => {
      if (!document.body.contains(b)) return;
      if (n <= 0) { el.remove(); try { localStorage.removeItem(PIN_KEY); } catch {} setShow(false); return; }
      b.textContent = 'Opening in ' + n + 's (and clearing the PIN)'; n--; setTimeout(tick, 1000);
    };
    tick();
  });
}

/* =========== goal lock ===========
   a goal is set for 6 months. changing or removing it before then costs
   N2,000. the app cannot take money: it shows the price, opens your payment
   link if you added one, asks you to confirm, and keeps a record. */
const LOCK_ON = false;   // the 6 month lock is off for now; set to true to bring it back
const LOCK_MS = 182 * 86400000, EARLY_FEE = 2000;
const naira = n => '₦' + n.toLocaleString('en-NG');
// the first 24 hours after setting a goal are free, for typos and second thoughts
const GRACE_MS = 24 * 3600000;
const isLocked = (setAt, unlockUntil) => LOCK_ON && !!setAt && Date.now() > setAt + GRACE_MS && Date.now() < setAt + LOCK_MS && !(unlockUntil > Date.now());
const lockDate = setAt => { const d = new Date(setAt + LOCK_MS); return d.getDate() + ' ' + cap(MONTHS[d.getMonth()].slice(0, 3)) + ' ' + d.getFullYear(); };

function payToChange(what, onPaid) {
  const old = document.getElementById('paysheet'); if (old) old.remove();
  const el = document.createElement('div');
  el.id = 'paysheet'; el.className = 'w3';
  el.innerHTML = '<div class="w3-back"></div><div class="w3-sheet" role="dialog" aria-modal="true"><span class="w3-grab"></span>' +
    '<h2>Change early</h2><p class="pin-sub">You set this goal for 6 months. Changing it now costs <b>' + naira(EARLY_FEE) + '</b>.</p>' +
    '<p class="pay-what"></p>' +
    (state.penaltyLink ? '<a class="lf-btn pay-link" target="_blank" rel="noopener" href="' + esc(state.penaltyLink) + '">Open my payment link</a>'
                       : '<label class="pay-set">Payment link (optional)<input type="url" placeholder="https://paystack.com/pay/..." inputmode="url"></label>') +
    '<div class="bk-btns"><button type="button" class="lf-btn main" data-a="paid">I paid ' + naira(EARLY_FEE) + '</button>' +
    '<button type="button" class="lf-btn" data-a="no">Keep my goal</button></div>' +
    (state.penalties.length ? '<p class="pay-count">Paid to change early ' + state.penalties.length + ' time' + (state.penalties.length > 1 ? 's' : '') + ' so far</p>' : '') +
    '</div>';
  el.querySelector('.pay-what').textContent = '“' + what + '”';
  document.body.appendChild(el);
  const close = () => el.remove();
  el.querySelector('.w3-back').addEventListener('click', close);
  el.querySelector('[data-a=no]').addEventListener('click', close);
  const set = el.querySelector('.pay-set input');
  if (set) set.addEventListener('change', () => { const v = set.value.trim(); if (/^https?:\/\//i.test(v)) { state.penaltyLink = v; save(); } });
  el.querySelector('[data-a=paid]').addEventListener('click', () => {
    state.penalties.push({ at: Date.now(), amount: EARLY_FEE, what });
    save(); close(); onPaid();
  });
}

const TABS = {
  home:   [document.getElementById('tab-home'),   document.getElementById('view-home')],
  day:    [document.getElementById('tab-day'),    document.getElementById('view-day')],
  gym:    [document.getElementById('tab-gym'),    document.getElementById('view-gym')],
  food:   [document.getElementById('tab-food'),   document.getElementById('view-food')],
  mood:   [document.getElementById('tab-mood'),   document.getElementById('view-mood')],
  ideas:  [document.getElementById('tab-ideas'),  document.getElementById('view-ideas')],
  habits: [document.getElementById('tab-habits'), document.getElementById('view-habits')],
  stats:  [document.getElementById('tab-stats'),  document.getElementById('view-stats')],
  life:   [document.getElementById('tab-life'),   document.getElementById('view-life')]
};

function show(which) {
  for (const k in TABS) {
    const [tab, view] = TABS[k];
    const on = (k === which);
    tab.setAttribute('aria-selected', on);
    tab.classList.toggle('flat', !on);
    view.hidden = !on;
  }
  document.body.dataset.view = which;
  document.getElementById('tab-more').classList.toggle('flat', !IN_MORE.includes(which));
  setMore(false);
  fillHeads();
  if (which === 'home')   renderHome();
  if (which === 'gym')    renderGym();
  if (which === 'food')   { mealPick = guessMeal(); foodDay = todayKey(); renderFood(); setFoodView(foodView); }
  if (which === 'habits') renderHabits();
  if (which === 'stats')  renderStats();
  if (which === 'mood')  renderMood();
  if (which === 'day')   { renderDay(); showUpNext(); }
  if (which === 'ideas') renderIdeas();
  if (which === 'life')  renderLife();
  try { localStorage.setItem(KEY + '.tab', which); } catch {}
}

for (const k in TABS) TABS[k][0].addEventListener('click', () => show(k));

// the small text on the right of each page title
function fillHeads() {
  const t = todayKey(), d = new Date(), set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  const h = d.getHours();
  set('home-hi', h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening');
  set('home-date', FULL[d.getDay()].replace(/^./, c => c.toUpperCase()) + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()].replace(/^./, c => c.toUpperCase()));
  set('food-sub', state.food.filter(f => key(new Date(f.at)) === t).length + ' today');
  set('ideas-sub', 'only you');
  set('habits-sub', state.habits.length + ' tracked');
  const sess = todaysSession();
  set('gym-sub', sess ? 'Session day' : 'Rest day');
}

// "more" opens a small panel above the bar
const IN_MORE = ['life', 'ideas', 'habits', 'stats'];
const moreBtn = document.getElementById('tab-more');
const morePanel = document.getElementById('more-panel');

function setMore(open) {
  morePanel.hidden = !open;
  moreBtn.setAttribute('aria-expanded', open);
}

moreBtn.addEventListener('click', e => { e.stopPropagation(); setMore(morePanel.hidden); });
document.addEventListener('click', e => {
  if (!morePanel.hidden && !morePanel.contains(e.target)) setMore(false);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMore(false); });

// light, dark, or follow the phone. kept on its own so it loads before the page paints.
const THEME_KEY = KEY + '.theme';
function applyTheme(t) {
  const root = document.documentElement;
  if (t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  root.style.background = dark ? '#1e1814' : '#faf4ea';
  const m = document.querySelector('meta[name=theme-color]');
  if (m) m.setAttribute('content', dark ? '#1e1814' : '#faf4ea');
  document.querySelectorAll('#theme-seg button').forEach(b => b.classList.toggle('on', b.dataset.th === t));
}
let theme = 'auto';
try { theme = localStorage.getItem(THEME_KEY) || 'auto'; } catch {}
applyTheme(theme);
document.querySelectorAll('#theme-seg button').forEach(b => b.addEventListener('click', e => {
  e.stopPropagation();
  theme = b.dataset.th;
  try { localStorage.setItem(THEME_KEY, theme); } catch {}
  applyTheme(theme);
}));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (theme === 'auto') applyTheme('auto'); });

/* =========== go =========== */

renderHabits();
renderDay();

// the gone/left line goes stale, so refresh it while you are looking at it
// running blocks and agenda points count down every second
setInterval(() => {
  const live = document.querySelectorAll('#view-day .how.live, #view-day .ag-t.live');
  for (const el of live) {
    const left = Number(el.dataset.end) - Date.now();
    if (el.classList.contains('over')) { el.textContent = '+' + fmtIn(-left); continue; }
    if (left <= 0) { renderDay(); return; }
    el.textContent = fmtLeft(left);
  }
}, 1000);

// inside-you lines move on every 10 minutes
let fuelTick = Math.floor(Date.now() / 600000);
setInterval(() => {
  const t = Math.floor(Date.now() / 600000);
  if (t !== fuelTick) { fuelTick = t; if (!document.getElementById('view-food').hidden && !pickingGoal) renderBodyNow(); }
  if (!document.getElementById('view-day').hidden) renderDay();
  if (!document.getElementById('view-home').hidden && !sorting) {
    const last = state.moods.slice().sort((a, b) => b.at - a.at)[0];
    const due = !last || Date.now() - last.at >= MOOD_EVERY;
    renderHome();
  }
}, 30000);

try { show(localStorage.getItem(KEY + '.tab') || 'home'); } catch { show('home'); }
applyShow();
</script>
