function rulePlan(a) {
  const kit = /gym/i.test(a.kit) ? 'gym' : /dumbbell/i.test(a.kit) ? 'db' : 'body';
  const P = EXPOOL[kit];
  const days = Number(a.days) || 3;
  const per = { 30: 4, 45: 5, 60: 6, 90: 7 }[parseInt(a.time, 10)] || 5;
  const lvl = /new/i.test(a.level) ? 0 : /experienced/i.test(a.level) ? 2 : 1;
  const goal = a.goal || 'Get stronger';
  const reps = /stronger/i.test(goal) ? 6 : /muscle/i.test(goal) ? 10 : /fat|fitter/i.test(goal) ? 12 : 12;
  const sets = /stronger/i.test(goal) && lvl ? 4 : lvl === 0 ? 2 : 3;
  const hurts = [].concat(a.hurts || []), focus = [].concat(a.focus || []);
  const plan = days <= 2 ? ['fullA', 'fullB'] : days === 3 ? ['fullA', 'fullB', 'fullC'] : days === 4 ? ['upper', 'lower', 'upper', 'lower'] :
               days === 5 ? ['upper', 'lower', 'fullA', 'upper', 'lower'] : ['upper', 'lower', 'fullA', 'upper', 'lower', 'fullB'];
  const dayMap = { 2: [1, 4], 3: [1, 3, 5], 4: [1, 2, 4, 5], 5: [1, 2, 3, 4, 5], 6: [1, 2, 3, 4, 5, 6] }[Math.min(6, Math.max(2, days))];
  const names = { fullA: 'Full body A', fullB: 'Full body B', fullC: 'Full body C', upper: 'Upper body', lower: 'Lower body' };
  // swaps for things that hurt
  const safe = slot => {
    if (hurts.includes('Knees') && ['lunge', 'squatH'].includes(slot)) return slot === 'lunge' ? 'glute2' : 'squat';
    if ((hurts.includes('Lower back') || hurts.includes('Scoliosis')) && slot === 'hinge') return 'glute';
    if (hurts.includes('Shoulders') && slot === 'pushV') return 'side';
    if (hurts.includes('Wrists') && kit === 'body' && slot === 'pushH') return 'core2';
    return slot;
  };
  const count = {};
  const workouts = plan.map((t, wi) => {
    const seen = plan.slice(0, wi).filter(x => x === t).length;   // the second upper or lower day uses a different order
    let slots = TEMPLATES[seen && TEMPLATES[t + '2'] ? t + '2' : t].map(safe);
    // focus areas move up the list so they are kept in shorter sessions
    const big2 = slots.slice(0, 2), rest = slots.slice(2);   // keep the two big lifts first, then focus areas
    rest.sort((x, y) => (focus.includes(AREA_OF[y]) ? 1 : 0) - (focus.includes(AREA_OF[x]) ? 1 : 0));
    slots = [...big2, ...rest];
    if (focus.includes('Glutes') && t !== 'upper' && !slots.slice(0, per).includes('glute')) slots.splice(1, 0, 'glute');
    if (hurts.includes('Scoliosis')) slots.splice(Math.min(per - 1, slots.length), 0, 'splank');
    slots = [...new Set(slots)].slice(0, per);
    const n = (count[t] = (count[t] || 0) + 1);
    return {
      title: names[t] + (plan.filter(x => x === t).length > 1 ? ' ' + n : ''),
      days: [dayMap[wi]].filter(d => d !== undefined),
      warmup: t === 'upper' ? '5 min easy cardio. Arm circles, band pull aparts, 10 light push ups.' :
              '5 min easy cardio. Leg swings, hip circles, 10 bodyweight squats, 10 glute bridges.',
      exercises: slots.map((sl, i) => {
        const hold = ['core2', 'side', 'splank'].includes(sl) && /plank/i.test(P[sl]) ? 30 + lvl * 10 : 0;
        const big = i < 2 && !['core', 'core2', 'side', 'splank'].includes(sl);
        return { name: P[sl], sets: big ? sets : Math.max(2, sets - (lvl === 0 ? 0 : 1)), reps: hold ? 0 : (big ? reps : reps + 2), hold,
                 level: big ? (lvl === 2 && /stronger|muscle/i.test(goal) ? 'H' : 'M') : 'L' };
      })
    };
  });
  return { why: 'Built from your answers: ' + days + ' days a week, about ' + per + ' exercises a session, ' +
                (reps <= 6 ? 'heavier sets of ' + reps + ' for strength.' : 'sets of ' + reps + ' to ' + (reps + 2) + ' reps for your goal.') +
                (hurts.length ? ' Moves that load your ' + hurts.join(' and ').toLowerCase() + ' are swapped out.' : ''),
           workouts };
}

async function makePlan(a) {
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 90000);
    const r = await fetch('/api/plan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answers: a }), signal: ctl.signal });
    clearTimeout(timer);
    if (r.ok) { const out = await r.json(); if (out && Array.isArray(out.workouts) && out.workouts.length) return { plan: out, source: 'ai' }; }
  } catch {}
  return { plan: rulePlan(a), source: 'rules' };
}

function applyPlan(plan, replace) {
  const R = routine();
  const made = plan.workouts.map((w, wi) => {
    const id = 'w' + Date.now() + wi;
    return { id, title: w.title, days: w.days || [], warmup: w.warmup || '',
             ex: w.exercises.map((e, ei) => {
               const eid = id + '-' + ei;
               state.gymPlan[eid] = Array.from({ length: e.sets }, () => ({ w: null, reps: e.hold ? null : e.reps || 10, hold: e.hold || null, lv: e.level || 'M' }));
               return { id: eid, nm: e.name, dt: '' };
             }) };
  });
  if (replace) R.workouts = made;
  else {
    // a weekday belongs to one workout: the new ones win
    const taken = new Set(made.flatMap(w => w.days));
    R.workouts.forEach(w => { w.days = (w.days || []).filter(d => !taken.has(d)); });
    R.workouts.push(...made);
  }
  gymDay = made[0] && made[0].id;
  save();
}

// one question at a time
function quizView(body) {
  const st = gymQuiz, Q = QUIZ[st.i], a = st.ans;
  const wrap = document.createElement('div');
  wrap.className = 'qz';
  let inner = '<span class="qz-step">' + (st.i + 1) + ' of ' + QUIZ.length + (Q.opt ? ' · optional' : '') + '</span><h2 class="qz-q">' + Q.q + '</h2>';
  if (Q.one) inner += '<div class="qz-opts">' + Q.one.map(o => '<button type="button" class="' + (a[Q.k] === o ? 'on' : '') + '" data-o="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
  if (Q.many) inner += '<div class="qz-opts many">' + Q.many.map(o => '<button type="button" class="' + ((a[Q.k] || []).includes(o) ? 'on' : '') + '" data-m="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
  if (Q.fields) inner += '<div class="qz-fields">' + Q.fields.map(([k, l, mode]) => '<label>' + l + '<input type="' + (mode === 'numeric' ? 'number' : 'text') + '" inputmode="' + mode + '" data-f="' + k + '"></label>').join('') + '</div>';
  const last = st.i === QUIZ.length - 1;
  inner += '<div class="qz-nav"><button type="button" class="gm-link" data-a="back">' + (st.i ? 'Back' : 'Cancel') + '</button>' +
           (Q.one ? '' : '<button type="button" class="lf-btn main" data-a="next">' + (last ? 'Make my plan' : Q.opt ? 'Next' : 'Next') + '</button>') +
           (Q.opt && !last ? '<button type="button" class="gm-link" data-a="skip">Skip</button>' : '') + '</div>';
  wrap.innerHTML = inner;
  if (Q.fields) wrap.querySelectorAll('[data-f]').forEach(i => { i.value = (a.about || {})[i.dataset.f] || ''; });
  const save2 = () => { state.trainProfile = { ...a }; save(); };
  const go = d => {
    if (Q.fields) { a.about = {}; wrap.querySelectorAll('[data-f]').forEach(i => { if (i.value.trim()) a.about[i.dataset.f] = i.value.trim(); }); }
    save2();
    if (st.back && d > 0) { gymQuiz = null; gymProfile = true; renderGym(); return; }   // editing one answer from the profile
    if (d > 0 && last) { finishQuiz(); return; }
    st.i += d;
    if (st.i < 0) { gymQuiz = null; }
    renderGym();
  };
  wrap.querySelectorAll('[data-o]').forEach(b => b.addEventListener('click', () => { a[Q.k] = b.dataset.o; go(1); }));
  wrap.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => {
    const L = new Set(a[Q.k] || []); L.has(b.dataset.m) ? L.delete(b.dataset.m) : L.add(b.dataset.m); a[Q.k] = [...L]; save2(); renderGym();
  }));
  const nx = wrap.querySelector('[data-a=next]'); if (nx) nx.addEventListener('click', () => go(1));
  wrap.querySelector('[data-a=back]').addEventListener('click', () => { if (st.back) { gymQuiz = null; gymProfile = true; renderGym(); } else go(-1); });
  const sk = wrap.querySelector('[data-a=skip]'); if (sk) sk.addEventListener('click', () => { delete a[Q.k]; go(1); });
  body.appendChild(wrap);
}

async function finishQuiz() {
  const a = { ...gymQuiz.ans };
  const flat = { goal: a.goal, experience: a.level, days_per_week: a.days, session_length: a.time, equipment: a.kit,
                 focus: a.focus, careful_with: a.hurts, ...(a.about || {}) };
  gymQuiz = null; gymPreview = { busy: true }; renderGym();
  const res = await makePlan(flat);
  // the rules read the short answers; the AI reads the full ones
  if (res.source === 'rules') res.plan = rulePlan(a);
  gymPreview = res; renderGym();
}

      '<ol>' + w.exercises.map(e => '<li>' + esc(e.name) + '<span>' + e.sets + ' × ' + (e.hold ? e.hold + 's' : e.reps) + ' ' + e.level + '</span></li>').join('') + '</ol></div>').join('') +

// your answers, editable any time
function profileView(body) {
  const a = trainProfile() || {};
  const box = document.createElement('div');
  box.className = 'qz';
  const show = Q => Q.fields ? Object.entries(a.about || {}).map(([k, v]) => (Q.fields.find(f => f[0] === k) || [k, k])[1] + ' ' + v).join(', ') :
                    Array.isArray(a[Q.k]) ? a[Q.k].join(', ') : a[Q.k];
  box.innerHTML = '<h2 class="qz-q">Your training profile</h2><ul class="qz-prof">' +
    QUIZ.map((Q, i) => '<li><span>' + Q.q + '</span><b>' + (esc(show(Q) || '') || '<i>not set</i>') + '</b><button type="button" class="gm-link" data-e="' + i + '">Edit</button></li>').join('') +
    '</ul><div class="qz-final"><button type="button" class="lf-btn main" data-a="make">Make a new plan from this</button><button type="button" class="gm-link" data-a="close">Close</button></div>';
  box.querySelectorAll('[data-e]').forEach(b => b.addEventListener('click', () => { gymQuiz = { i: Number(b.dataset.e), ans: { ...a }, back: true }; gymProfile = false; renderGym(); }));
  box.querySelector('[data-a=make]').addEventListener('click', () => { gymProfile = false; gymQuiz = { i: QUIZ.length - 1, ans: { ...a } }; finishQuiz(); });
  box.querySelector('[data-a=close]').addEventListener('click', () => { gymProfile = false; renderGym(); });
  body.appendChild(box);
}
let gymProfile = false;

function renderGym() {
  const R = routine();
  if (!workoutById(gymDay)) gymDay = todaysSession() || (R.workouts[0] && R.workouts[0].id) || null;
  const today = todayKey(), todayId = todaysSession();
  const body = document.getElementById('gym-body');
  const picks = document.getElementById('gym-days');
  picks.className = 'gm-picks';
  body.innerHTML = '';

  // workouts as chips, plus one to add a new one
  picks.innerHTML = R.workouts.map(w => '<button type="button" data-w="' + esc(w.id) + '" class="' + (w.id === gymDay ? 'on' : '') + '">' +
    esc(w.title) + (w.id === todayId ? '<i></i>' : '') + '</button>').join('') +
    '<button type="button" class="add" data-a="newwk" aria-label="add a workout">+</button>';
  picks.querySelectorAll('[data-w]').forEach(b => {
    // hold a workout to delete it; a tap opens it
    let t = null, held = false;
    b.addEventListener('pointerdown', () => { held = false; t = setTimeout(() => { held = true; gymConfirm = 'wk:' + b.dataset.w; try { navigator.vibrate && navigator.vibrate(12); } catch {} renderGym(); }, 550); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => clearTimeout(t)));
    b.addEventListener('contextmenu', e => e.preventDefault());
    b.addEventListener('click', () => {
      if (held) { held = false; return; }
      gymDay = b.dataset.w; gymOpen = null; gymWkEdit = false; gymAdding = null; gymConfirm = null; gymQuiz = null; gymPreview = null; gymProfile = false; renderGym();
    });
  });
  picks.querySelector('[data-a=newwk]').addEventListener('click', () => { gymAdding = 'choose'; gymQuiz = null; gymPreview = null; gymProfile = false; renderGym(); });

  // confirm deleting a held workout
  if (gymConfirm && gymConfirm.startsWith('wk:')) {
    const W0 = workoutById(gymConfirm.slice(3));
    if (W0) {
      const c = document.createElement('div');
      c.className = 'gm-delbar';
      c.innerHTML = '<span>Delete <b></b>? Your history stays.</span><button type="button" data-a="y">Delete</button><button type="button" data-a="n">Keep</button>';
      c.querySelector('b').textContent = W0.title;
      c.querySelector('[data-a=y]').addEventListener('click', () => { R.workouts = R.workouts.filter(x => x !== W0); if (gymDay === W0.id) gymDay = null; gymConfirm = null; save(); renderGym(); fillHeads(); });
      c.querySelector('[data-a=n]').addEventListener('click', () => { gymConfirm = null; renderGym(); });
      body.appendChild(c);
    }
  }

  // the question flow, the plan preview, and your profile take over the page while open
  if (gymQuiz) { quizView(body); return; }
  if (gymPreview) { previewView(body); return; }
  if (gymProfile) { profileView(body); return; }

  // adding: make a plan for me, or one workout myself
  if (gymAdding === 'choose') {
    const ch = document.createElement('div');
    ch.className = 'qz-choose';
    ch.innerHTML = '<button type="button" data-a="ai"><b>\u2728 Make a plan for me</b><small>A few questions about your goal, then a full week plan. Some are optional.</small></button>' +
                   '<button type="button" data-a="own"><b>Add one workout myself</b><small>Name it, then add exercises.</small></button>' +
                   '<button type="button" class="gm-link" data-a="x">Cancel</button>';
    ch.querySelector('[data-a=ai]').addEventListener('click', () => { gymAdding = null; gymQuiz = { i: 0, ans: { ...(trainProfile() || {}) } }; renderGym(); });
    ch.querySelector('[data-a=own]').addEventListener('click', () => { gymAdding = 'wk'; renderGym(); });
    ch.querySelector('[data-a=x]').addEventListener('click', () => { gymAdding = null; renderGym(); });
    body.appendChild(ch);
    return;
  }
  if (trainProfile()) {
    const pl = document.createElement('button');
    pl.type = 'button'; pl.className = 'gm-link qz-proflink'; pl.textContent = 'Training profile';
    pl.addEventListener('click', () => { gymProfile = true; renderGym(); });
    body.appendChild(pl);
  }

  // naming a new workout
  if (gymAdding === 'wk') {
    const f = document.createElement('div');
    f.className = 'gm-new';
    f.innerHTML = '<input type="text" maxlength="40" placeholder="New workout, e.g. Legs or Upper body"><button type="button" class="lf-btn main">Add</button><button type="button" class="gm-link">Cancel</button>';
    const inp = f.querySelector('input');
    const add = () => {
      const t = inp.value.trim(); if (!t) { inp.focus(); return; }
      const w = { id: 'w' + Date.now(), title: cap(t), days: [], warmup: '', ex: [] };
      R.workouts.push(w); gymDay = w.id; gymAdding = 'ex'; gymWkEdit = true; save(); renderGym();
    };
    f.querySelector('.lf-btn').addEventListener('click', add);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
    f.querySelector('.gm-link').addEventListener('click', () => { gymAdding = null; renderGym(); });
    body.appendChild(f);
    setTimeout(() => inp.focus(), 30);
    return;
  }

  const W = workoutById(gymDay);
  if (!W) {
    body.innerHTML = '<p class="gm-empty">No workouts yet. Tap + to add one.</p>';
    return;
  }

  // every exercise and how far you are with it today
  let totalSets = 0, doneSets = 0, kg = 0;
  const items = W.ex.map(ex => {
    const sets = setsFor(ex);
    const sd = setsDone(today, ex.id);
    if (gymDone(today).includes(ex.id) && sd.length < sets.length) { sd.length = 0; sets.forEach((_, i) => sd.push(i)); }
    totalSets += sets.length; doneSets += sd.length;
    sd.forEach(i => { const st = sets[i]; if (st) kg += kgOf(st.w) * (st.reps || 0); });
    return { ex, sets, sd, nm: gymValue(ex.id, 'nm', ex.nm) };
  });

  // header: the workout, its days, one progress line
  const pct = totalSets ? doneSets / totalSets : 0;
  const head = document.createElement('div');
  head.className = 'gm-head';
  head.innerHTML = '<div><b></b><button type="button" class="gm-link" data-a="wk">' + (gymWkEdit ? 'Done' : 'Edit') + '</button></div>' +
    '<span class="gm-sub">' + ((W.days || []).length ? W.days.slice().sort().map(d => WEEK[d]).join(' · ') : 'No days set') +
      (totalSets ? ' · ' + doneSets + ' of ' + totalSets + ' sets' + (kg ? ' · ' + kg.toLocaleString() + ' kg' : '') : '') + '</span>' +
    (totalSets ? '<i class="gm-bar"><u style="width:' + Math.round(pct * 100) + '%"></u></i>' : '') +
    (pct === 1 ? '<p class="gm-done">Session done. Proud of you.</p>' : '');
  head.querySelector('b').textContent = W.title;
  head.querySelector('[data-a=wk]').addEventListener('click', () => { gymWkEdit = !gymWkEdit; gymConfirm = null; renderGym(); });
  body.appendChild(head);

  // editing the workout: name, which days, warm up, remove
  if (gymWkEdit) {
    const ed = document.createElement('div');
    ed.className = 'gm-wked';
    ed.innerHTML = '<label>Name<input type="text" maxlength="40"></label>' +
      '<span class="gm-lbl">Which days</span><div class="gm-days">' +
      [1, 2, 3, 4, 5, 6, 0].map(d => '<button type="button" data-d="' + d + '" class="' + ((W.days || []).includes(d) ? 'on' : '') + '">' + WEEK[d][0] + '</button>').join('') + '</div>' +
      '<label>Warm up<textarea rows="2" maxlength="300" placeholder="optional"></textarea></label>' +
      (gymConfirm === W.id
        ? '<div class="gm-confirm">Remove ' + esc(W.title) + ' and its exercises? Your history stays.<button type="button" data-a="yes">Remove</button><button type="button" data-a="no">Keep</button></div>'
        : '<button type="button" class="gm-link danger" data-a="rmwk">Remove this workout</button>');
    const [nm] = ed.querySelectorAll('input'), wu = ed.querySelector('textarea');
    nm.value = W.title; wu.value = W.warmup || '';
    nm.addEventListener('change', () => { W.title = nm.value.trim() || W.title; save(); renderGym(); });
    wu.addEventListener('change', () => { W.warmup = wu.value.trim(); save(); });
    ed.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => {
      const d = Number(b.dataset.d);
      // a weekday belongs to one workout at a time
      for (const o of R.workouts) if (o !== W) o.days = (o.days || []).filter(x => x !== d);
      W.days = (W.days || []).includes(d) ? W.days.filter(x => x !== d) : [...(W.days || []), d];
      save(); renderGym(); fillHeads();
    }));
    const rm = ed.querySelector('[data-a=rmwk]');
    if (rm) rm.addEventListener('click', () => { gymConfirm = W.id; renderGym(); });
    const yes = ed.querySelector('[data-a=yes]');
    if (yes) {
      yes.addEventListener('click', () => {
        R.workouts = R.workouts.filter(x => x !== W); gymConfirm = null; gymWkEdit = false; gymDay = null; save(); renderGym();
      });
      ed.querySelector('[data-a=no]').addEventListener('click', () => { gymConfirm = null; renderGym(); });
    }
    body.appendChild(ed);
  } else if (W.warmup) {
    const w = document.createElement('details');
    w.className = 'gm-warm';
    w.innerHTML = '<summary>Warm up</summary><p></p>';
    w.querySelector('p').textContent = cap(W.warmup);
    body.appendChild(w);
  }

  // the exercises: one line each, tap to open its sets
  const list = document.createElement('div');
  list.className = 'gm-list';
  for (const it of items) {
    const { ex, sets, sd } = it;
    const open = gymOpen === ex.id;
    const allOn = sd.length >= sets.length;
    const keep = () => { state.gymPlan[ex.id] = sets.map(x => ({ ...x })); save(); };

    const card = document.createElement('div');
    card.className = 'gm-ex' + (allOn ? ' on' : '') + (open ? ' open' : '');
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'gm-row';
    row.innerHTML = '<span class="gm-rt"><b></b><small></small></span><span class="gm-prog">' + (allOn ? '✓' : sd.length + '/' + sets.length) + '</span>';
    row.querySelector('b').textContent = cap(it.nm.replace(/⭐/g, '').trim());
    row.querySelector('small').textContent = setSummary(sets);
    row.addEventListener('click', () => { gymOpen = open ? null : ex.id; gymConfirm = null; renderGym(); });
    card.appendChild(row);

    if (open) {
      const inner = document.createElement('div');
      inner.className = 'gm-inner';

      const name = document.createElement('input');
      name.className = 'gm-rename';
      name.type = 'text'; name.maxLength = 60;
      name.value = cap(it.nm.replace(/⭐/g, '').trim());
      name.setAttribute('aria-label', 'exercise name');
      name.addEventListener('change', () => { gymEdit(ex.id, 'nm', name.value.trim() || it.nm); renderGym(); });
      if (gymWkEdit) inner.appendChild(name);   // renaming lives in Edit mode, so the name is not shown twice

      sets.forEach((st, i) => {
        const on = sd.includes(i);
        const r = document.createElement('div');
        r.className = 'gm-set' + (on ? ' on' : '');
        r.innerHTML = '<span class="gm-n">' + (i + 1) + '</span>' +
          '<input class="gm-w" type="text" inputmode="decimal" maxlength="12" placeholder="weight" aria-label="set ' + (i + 1) + ' weight">' +
          '<span class="gm-x">×</span>' +
          '<input class="gm-r" type="number" inputmode="numeric" min="1" max="300" aria-label="set ' + (i + 1) + (st.hold ? ' seconds' : ' reps') + '">' +
          '<span class="gm-u">' + (st.hold ? 's' : '') + '</span>' +
          '<button type="button" class="gm-lv" aria-label="effort, tap to change">' + (st.lv || '·') + '</button>' +
          '<button type="button" class="gm-tick" aria-label="' + (on ? 'set done, tap to undo' : 'mark set done') + '">✓</button>';
        if (st.lv) r.querySelector('.gm-lv').style.setProperty('--c', LEVELS[st.lv][1]);
        const w = r.querySelector('.gm-w'), rp = r.querySelector('.gm-r');
        w.value = st.w || ''; rp.value = st.hold || st.reps || '';
        w.addEventListener('change', () => {
          let v = w.value.trim().replace(/\s+/g, '').replace(/x/i, '×');
          if (/^\d+(\.\d+)?$/.test(v)) v += 'kg';
          st.w = v || null; w.value = st.w || ''; keep(); renderGym();
        });
        rp.addEventListener('change', () => { const v = Number(rp.value) || null; if (st.hold) st.hold = v; else st.reps = v; keep(); renderGym(); });
        r.querySelector('.gm-lv').addEventListener('click', () => {
          st.lv = { L: 'M', M: 'H', H: null }[st.lv] || (st.lv ? null : 'L'); keep(); renderGym();
        });
        r.querySelector('.gm-tick').addEventListener('click', () => {
          const list2 = setsDone(today, ex.id), at = list2.indexOf(i);
          if (!state.gymLog) state.gymLog = [];
          if (at > -1) {
            list2.splice(at, 1);
            const li = state.gymLog.findIndex(x => x.d === today && x.id === ex.id && x.i === i);
            if (li > -1) state.gymLog.splice(li, 1);
          } else {
            list2.push(i);
            const entry = { d: today, id: ex.id, i, w: st.w, reps: st.reps, hold: st.hold, lv: st.lv, feel: null };
            state.gymLog.push(entry);
            startRest(st.lv, entry);
          }
          const all = list2.length >= sets.length, dl = gymDone(today), di = dl.indexOf(ex.id);
          if (all && di === -1) dl.push(ex.id);
          if (!all && di > -1) dl.splice(di, 1);
          save(); renderGym();
        });
        inner.appendChild(r);
      });

      const sg = suggestFor(ex.id, sets);
      if (sg && sg.kind !== 'stay') {
        const box = document.createElement('div');
        box.className = 'gm-sug ' + sg.kind;
        box.innerHTML = '<span><b></b><small></small></span>' + (sg.sets ? '<button type="button">Use</button>' : '');
        box.querySelector('b').textContent = '\u{1F4A1} ' + sg.title;
        box.querySelector('small').textContent = sg.why;
        if (sg.sets) box.querySelector('button').addEventListener('click', () => { state.gymPlan[ex.id] = sg.sets; save(); renderGym(); });
        inner.appendChild(box);
      }

      const info = infoFor(it.nm);
      const tools = document.createElement('div');
      tools.className = 'gm-tools';
      tools.innerHTML = '<button type="button" data-a="add">+ set</button>' +
        (sets.length > 1 ? '<button type="button" data-a="less">− set</button>' : '') +
        (gymConfirm === ex.id ? '<button type="button" data-a="rmyes" class="danger">Yes, remove</button><button type="button" data-a="rmno">Keep</button>'
                              : '<button type="button" data-a="rm">Remove</button>');
      tools.querySelector('[data-a=add]').addEventListener('click', () => { sets.push({ ...sets[sets.length - 1] }); keep(); renderGym(); });
      const less = tools.querySelector('[data-a=less]');
      if (less) less.addEventListener('click', () => { sets.pop(); keep(); renderGym(); });
      const rm = tools.querySelector('[data-a=rm]');
      if (rm) rm.addEventListener('click', () => { gymConfirm = ex.id; renderGym(); });
      const yes = tools.querySelector('[data-a=rmyes]');
      if (yes) {
        yes.addEventListener('click', () => { W.ex = W.ex.filter(x => x !== ex); gymOpen = null; gymConfirm = null; save(); renderGym(); });
        tools.querySelector('[data-a=rmno]').addEventListener('click', () => { gymConfirm = null; renderGym(); });
      }
      inner.appendChild(tools);

      if (info) {
        const gd = document.createElement('details');
        gd.className = 'gm-guide';
        gd.innerHTML = '<summary>How to</summary><p class="gm-works"></p><p></p><ol>' + info.how.map(() => '<li></li>').join('') + '</ol><p class="gm-avoid"></p>';
        const ps = gd.querySelectorAll('p');
        ps[0].textContent = info.works; ps[1].textContent = info.why; ps[2].textContent = 'Avoid: ' + info.avoid;
        gd.querySelectorAll('li').forEach((li, i) => { li.textContent = info.how[i]; });
        inner.appendChild(gd);
      }
      card.appendChild(inner);
    }
    list.appendChild(card);
  }
  body.appendChild(list);

  // add an exercise
  if (gymAdding === 'ex') {
    const f = document.createElement('div');
    f.className = 'gm-new';
    f.innerHTML = '<input type="text" maxlength="60" placeholder="Exercise, e.g. Leg press"><button type="button" class="lf-btn main">Add</button><button type="button" class="gm-link">Done</button>';
    const inp = f.querySelector('input');
    const add = () => {
      const t = inp.value.trim(); if (!t) { inp.focus(); return; }
      const ex = { id: 'x' + Date.now(), nm: t, dt: '' };
      W.ex.push(ex);
      state.gymPlan[ex.id] = setsFor(ex);
      save(); renderGym();
      const again = document.querySelector('.gm-new input'); if (again) again.focus();
    };
    f.querySelector('.lf-btn').addEventListener('click', add);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
    f.querySelector('.gm-link').addEventListener('click', () => { gymAdding = null; renderGym(); });
    body.appendChild(f);
  } else {
    const a = document.createElement('button');
    a.type = 'button'; a.className = 'gm-addex'; a.textContent = '+ Add exercise';
    a.addEventListener('click', () => { gymAdding = 'ex'; renderGym(); setTimeout(() => { const i = document.querySelector('.gm-new input'); if (i) i.focus(); }, 30); });
    body.appendChild(a);
  }
}

// "now", "5m", "3h", "Mon", "12 Nov", the way a feed shows time
function ago(ts) {
  const s2 = Math.floor((Date.now() - ts) / 1000);
  if (s2 < 60) return 'now';
  if (s2 < 3600) return Math.floor(s2 / 60) + 'm';
  if (s2 < 86400) return Math.floor(s2 / 3600) + 'h';
  const d = new Date(ts);
  if (s2 < 6 * 86400) return cap(FULL[d.getDay()].slice(0, 3));
  return d.getDate() + ' ' + cap(MONTHS[d.getMonth()].slice(0, 3));
}

function whenWord(ts) {
  const d = new Date(ts);
  const k = key(d);
  const t = todayKey();
  const stamp = clock(d.getHours() * 60 + d.getMinutes());
  if (k === t) return 'today ' + stamp;
  if (k === shiftKey(t, -1)) return 'yesterday ' + stamp;
  return FULL[d.getDay()].slice(0, 3) + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3) + ' ' + stamp;
}

function renderIdeas() {

            (it.done ? '✓ Acted on' : '✓ Mark acted on') + '</button>' +
          '<button type="button" class="tw-act del" data-a="del" aria-label="delete this tweet">Delete</button>' +
        '</div>' +
      '</div>';
    row.querySelector('.tw-text').textContent = it.text;
    row.querySelector('.tw-head span').title = whenWord(it.at);
    row.querySelector('[data-a=done]').addEventListener('click', () => { it.done = !it.done; save(); renderIdeas(); });

    });

  });
}

function statFor(tab) {

function menuOrder() {
  const known = MENU.map(m => m.tab);
  const kept = (state.order || []).filter(t => known.includes(t));
  for (const t of known) if (!kept.includes(t)) kept.push(t);
  return kept.map(t => MENU.find(m => m.tab === t));
}

function moveCard(tab, by) {
  const order = menuOrder().map(m => m.tab);
  const i = order.indexOf(tab);
  const j = i + by;
  if (j < 0 || j >= order.length) return;
  order.splice(j, 0, order.splice(i, 1)[0]);
  state.order = order;
  save();
  renderHome();
}

/* =========== sleep ===========
   one entry per morning: when you went to bed, when you woke, how it felt.
   kept under the date you woke up. */
const SLEEP_FEEL = [['\u{1F62B}', 'awful'], ['\u{1F615}', 'poor'], ['\u{1F610}', 'okay'], ['\u{1F642}', 'good'], ['\u{1F634}', 'great']];
// the night that ends on morning k, from your plan: a "Sleep" block in the
// day before (or early in day k). bed is when it starts, wake is when it ends.
const SLEEP_RE = /^\s*(sleep|bed|bedtime|go to bed|night sleep)\b/i;
function planSleep(k) {
  const find = (dk, early) => {
    const d = state.days && state.days[dk];
    if (!d || !Array.isArray(d.blocks)) return null;
    let at = toMins(d.start), hit = null;
    for (const b of d.blocks) {
      const len = Number(b.mins) || 60;
      if (SLEEP_RE.test(b.label || '') && len >= 120 && (!early || at < 720)) hit = { from: at, to: at + len };
      at += len;
    }
    return hit;
  };
  const h = find(shiftKey(k, -1), false) || find(k, true);
  return h ? { bed: hhmm(h.from), wake: hhmm(h.to) } : null;
}
// your sleep for morning k: times from the plan when it has a Sleep block,
// how it felt from what you logged
const sleepOn = k => {
  const m = (state.sleep || []).find(x => x.k === k) || null;
  const p = planSleep(k);
  if (!p) return m;
  return Object.assign({ k, q: 0 }, m || {}, p, { fromPlan: true });
};
function sleepMins(e) { if (!e) return null; let m = toMins(e.wake) - toMins(e.bed); if (m <= 0) m += 1440; return m; }
let sleepEditing = false;

function renderSleepCard(box) {
  if (!state.sleep) state.sleep = [];
  const k = todayKey(), e = sleepOn(k), h = new Date().getHours();
  const card = document.createElement('div');
  card.className = 'sl-card';
  if (e && !sleepEditing) {
    const m = sleepMins(e), f = SLEEP_FEEL[(e.q || 3) - 1];
    card.innerHTML = '<button type="button" class="sl-done"><span>' + f[0] + '</span><b>Slept ' + dur(m) + '</b><small>' + clock(toMins(e.bed)) + ' to ' + clock(toMins(e.wake)) + ' · ' + f[1] + '</small></button>';
    card.querySelector('button').addEventListener('click', () => { sleepEditing = true; renderHome(); });
    box.appendChild(card); return;
  }
  if (!e && (h < 4 || h >= 14) && !sleepEditing) return;     // ask in the morning, until 2pm
  const last = (state.sleep || []).slice(-1)[0];
  const bed = e ? e.bed : last ? last.bed : '23:00';
  const now = new Date(), wake = e ? e.wake : hhmm(Math.round((now.getHours() * 60 + now.getMinutes()) / 5) * 5);
  let q = e ? e.q : 0;
  const saves = e ? (e.saves || 1) : 0;
  if (saves >= 2) {      // logged, then changed once: that is it for today
    card.innerHTML = '<b class="sl-q">Sleep is set for today</b><p class="sl-warn">You logged it and changed it once. It can only be saved twice a day, so the record stays honest.</p>';
    box.appendChild(card); return;
  }
  card.innerHTML = '<b class="sl-q">How did you sleep?</b>' +
    (saves === 1 ? '<p class="sl-warn">\u26A0 This is your last change for today. After this it locks.</p>' : '') +
    '<div class="sl-times"><label>Bed<input type="time" class="sl-bed" step="300"></label><label>Woke<input type="time" class="sl-wake" step="300"></label></div>' +
    '<div class="sl-feel">' + SLEEP_FEEL.map((f, i) => '<button type="button" data-q="' + (i + 1) + '" class="' + (q === i + 1 ? 'on' : '') + '"><span>' + f[0] + '</span>' + f[1] + '</button>').join('') + '</div>';
  card.querySelector('.sl-bed').value = bed;
  card.querySelector('.sl-wake').value = wake;
  card.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => {
    const entry = { k, bed: card.querySelector('.sl-bed').value || bed, wake: card.querySelector('.sl-wake').value || wake, q: Number(b.dataset.q), saves: saves + 1 };
    state.sleep = (state.sleep || []).filter(x => x.k !== k).concat(entry);
    sleepEditing = false; save(); renderHome();
  }));
  box.appendChild(card);
}

/* ---- mood on Home ----

  const due = !last || Date.now() - last.at >= MOOD_EVERY;
  const lm = last && MOODS.find(m => m.k === last.mood);
  const row = document.createElement('div');
  row.className = 'hm-mood' + (due ? ' due' : '');
  row.innerHTML = '<div class="hmm-head"><b>' + (due ? 'How are you now?' : 'Feeling ' + last.mood + ' ' + (lm ? lm.e : '')) + '</b>' +
    '<span>' + (last ? (due ? 'last: ' + last.mood + ', ' + agoText(Date.now() - last.at) + ' ago' : 'next check-in in ' + agoText(last.at + MOOD_EVERY - Date.now())) : 'no check-ins yet') + '</span>' +
    '<button type="button" class="hmm-hist">History ›</button></div>' +
    (due ? '<div class="hmm-row">' + MOODS.map(m => '<button type="button" data-mood="' + m.k + '" style="--c:' + m.c + '" aria-label="' + m.k + '"><span>' + m.e + '</span>' + m.k + '</button>').join('') + '</div>' : '');
  row.querySelector('.hmm-hist').addEventListener('click', () => { show('mood'); window.scrollTo(0, 0); });
  row.querySelector('.hmm-head').addEventListener('click', e => { if (!due && !e.target.closest('button')) { row.classList.add('due'); renderMoodPick(row); } });

// tapping the row when it is not due still lets you log

}
function logHomeMood(k) {

/* sleep: last night, the week, edit for an hour after you log, see you tomorrow */
const SLEEP_EDIT_MS = 60 * 60000;
function sleepSheet(body, close, editing) {
  const k = todayKey(), e = sleepOn(k);
  const left = e && e.firstAt ? e.firstAt + SLEEP_EDIT_MS - Date.now() : 0;
  const canEdit = !e || left > 0;
  // the last 7 nights, newest first, as small bars against 9 hours
  const week = []; for (let i = 0; i < 7; i++) { const kk = shiftKey(k, -i); week.push({ kk, e: sleepOn(kk) }); }
  const hist = '<ol class="sp-week">' + week.map(({ kk, e: x }) => {
    const m = sleepMins(x), f = x ? SLEEP_FEEL[(x.q || 3) - 1] : null;
    return '<li><span>' + (kk === k ? 'Today' : cap(FULL[fromKey(kk).getDay()].slice(0, 3))) + '</span>' +
      '<div class="sp-bar"><div class="sp-fill' + (m && m >= 420 ? ' ok' : '') + '" style="width:' + (m ? Math.min(100, m / 540 * 100) : 0) + '%"></div></div>' +
      '<b>' + (m ? dur(m) : '–') + '</b><em>' + (f ? f[0] : '') + '</em></li>';
  }).join('') + '</ol>';

  if (e && !editing) {
    const f = SLEEP_FEEL[(e.q || 3) - 1];
    body.innerHTML = '<div class="sp-top"><span class="sp-moon">\u{1F319}</span><div><small>Last night</small><b>' + dur(sleepMins(e)) + '</b>' +
        '<span>' + clock(toMins(e.bed)) + ' → ' + clock(toMins(e.wake)) + ' · ' + f[0] + ' ' + f[1] + '</span></div></div>' +
      hist +
      (canEdit ? '<button type="button" class="sp-edit">Edit · ' + Math.max(1, Math.ceil(left / 60000)) + ' min left</button>' : '') +
      '<p class="sp-note">See you tomorrow morning \u{1F319} log tonight’s sleep when you wake.</p>';
    const ed = body.querySelector('.sp-edit'); if (ed) ed.addEventListener('click', () => sleepSheet(body, close, true));
    return;
  }
  const last = (state.sleep || []).slice(-1)[0];
  const bed = e ? e.bed : last ? last.bed : '23:00';
  const now = new Date(), wake = e ? e.wake : hhmm(Math.round((now.getHours() * 60 + now.getMinutes()) / 5) * 5);
  body.innerHTML = '<div class="sp-top"><span class="sp-moon">\u{1F319}</span><div><small>Good morning</small><b>How did you sleep?</b></div></div>' +
    '<div class="sl-times"><label>Bed<input type="time" class="sl-bed" step="300"></label><label>Woke<input type="time" class="sl-wake" step="300"></label></div>' +
    '<div class="sp-feel">' + SLEEP_FEEL.map((f, i) => '<button type="button" data-q="' + (i + 1) + '" class="' + (e && e.q === i + 1 ? 'on' : '') + '"><span>' + f[0] + '</span>' + f[1] + '</button>').join('') + '</div>' +
    (e ? '' : hist);
  body.querySelector('.sl-bed').value = bed;
  body.querySelector('.sl-wake').value = wake;
  body.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => {
    const entry = { k, bed: body.querySelector('.sl-bed').value || bed, wake: body.querySelector('.sl-wake').value || wake, q: Number(b.dataset.q),
                    firstAt: e && e.firstAt ? e.firstAt : Date.now() };
    state.sleep = (state.sleep || []).filter(x => x.k !== k).concat(entry);
    save(); sleepSheet(body, close);
  }));
}

/* mood: today's moods as a little timeline, then big round buttons */
function moodSheet(body, close, el, force) {
  const today = state.moods.filter(m => key(new Date(m.at)) === todayKey()).sort((a, b) => a.at - b.at);
  const last = state.moods.slice().sort((a, b) => b.at - a.at)[0];
  // you are only asked an hour after your last check-in
  if (!force && last && Date.now() - last.at < MOOD_EVERY) {
    const md = MOODS.find(x => x.k === last.mood);
    body.innerHTML = '<div class="sp-top"><span class="sp-moon">' + (md ? md.e : '\u2022') + '</span><div><small>Last check-in, ' + agoText(Date.now() - last.at) + ' ago</small>' +
      '<b>' + cap(last.mood) + '</b><span>next one in ' + agoText(last.at + MOOD_EVERY - Date.now()) + '</span></div></div>' +
      // every check-in today, newest first, with its time
      (today.length ? '<p class="mp-h">Today</p><ol class="mp-list">' + today.slice().reverse().map(m => { const d = MOODS.find(x => x.k === m.mood);
        return '<li><time>' + clockOf(m.at) + '</time><span>' + (d ? d.e : '\u2022') + '</span><b>' + m.mood + '</b>' + (m.note ? '<small>' + esc(m.note) + '</small>' : '') + '</li>'; }).join('') + '</ol>' : '') +
      '<button type="button" class="lf-skip mp-anyway">Something changed? Log now</button>' +
      '<button type="button" class="lf-skip qs-hist">All history \u203a</button>';
    body.querySelector('.mp-anyway').addEventListener('click', () => moodSheet(body, close, el, true));
    body.querySelector('.qs-hist').addEventListener('click', () => { el.remove(); show('mood'); window.scrollTo(0, 0); });
    return;
  }
  body.innerHTML = '<h2 class="qs-h">How are you now?</h2>' +
    (today.length ? '<div class="mp-line">' + today.slice(-8).map(m => { const md = MOODS.find(x => x.k === m.mood);
      return '<span title="' + m.mood + '">' + (md ? md.e : '•') + '<small>' + clockOf(m.at).replace(/:00/, '') + '</small></span>'; }).join('') + '</div>'
                  : '<p class="sp-note" style="margin-top:0">No check-ins yet today.</p>') +
    '<div class="mp-grid">' + MOODS.map(m => '<button type="button" data-mood="' + m.k + '" style="--c:' + m.c + '"><span>' + m.e + '</span>' + m.k + '</button>').join('') + '</div>' +
    '<button type="button" class="lf-skip qs-hist">All history ›</button>';
  body.querySelectorAll('[data-mood]').forEach(b => b.addEventListener('click', () => {
    b.classList.add('pop');
    state.moods.push({ at: Date.now(), mood: b.dataset.mood, part: partOfDay(new Date().getHours()), note: '' }); save();
    setTimeout(close, 260);
  }));
  body.querySelector('.qs-hist').addEventListener('click', () => { el.remove(); show('mood'); window.scrollTo(0, 0); });
}

function daysIn(k0, k1) { const out = []; for (let k = k0; k <= k1; k = shiftKey(k, 1)) out.push(k); return out; }

  const out = [];
  for (const k of ks) for (const b of ((state.days[k] || {}).blocks || [])) if (b.done && (!a || inArea(b.label, a))) out.push({ k, b });

  const hs = state.habits.filter(h => inArea(h.name, a));
  return new Set(ks.filter(k => hs.some(h => h.marks.includes(k))));

const AREA_DEFAULT = { health: ['gym', 'energy'], wealth: ['work', 'focus'], love: ['together', 'touch'], self: ['me', 'calm'] };

function readArea(a, text, strict) {
  const t = ' ' + String(text).toLowerCase().replace(/[^a-z\s'-]/g, ' ').replace(/\s+/g, ' ') + ' ';
  const found = [];
  for (const id in MEASURES) {
    const m = MEASURES[id];
    if (m.area !== a) continue;
    let hits = 0, first = Infinity;
    for (const w of m.words) {
      const re = new RegExp('\\b' + w.replace(/ /g, '\\s+') + '\\b', 'g');
      let x; while ((x = re.exec(t))) { hits++; first = Math.min(first, x.index); }
    }
    if (hits) found.push({ id, hits, first });
  }
  found.sort((x, y) => y.hits - x.hits || x.first - y.first);
  const ids = found.slice(0, 3).map(x => x.id);
  return ids.length || strict ? ids : AREA_DEFAULT[a];
}

// the words from your text that led to a choice, as you typed them
function wordsFound(words, text) {
  const out = [];
  for (const w of words) {
    const re = new RegExp('\\b' + w.replace(/ /g, '\\s+') + '\\b', 'i');
    const m = String(text).match(re);
    if (m && !out.some(o => o.toLowerCase() === m[0].toLowerCase())) out.push(m[0]);
  }
  return out;
}

// your text with those words highlighted
function markWords(text, found) {
  let html = esc(text);
  for (const w of [...found].sort((a, b) => b.length - a.length)) {
    html = html.replace(new RegExp('\\b(' + esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')\\b', 'i'), '<mark>$1</mark>');
  }
  return html;
}

// how far along one measure is, 0 to 100
/* goals are scored for today, or for the last 7 days if you switch to week.
   weekly targets shrink to a day: days become "did it today", hours become a
   seventh, counts a seventh rounded up to 1. percentages stay as they are. */
let lifePeriod = (() => { try { return localStorage.getItem(KEY + '.period') || 'day'; } catch { return 'day'; } })();
function setLifePeriod(p) { lifePeriod = p; try { localStorage.setItem(KEY + '.period', p); } catch {} }
const perKeys = back => lifePeriod === 'week' ? weekKeys(back) : [shiftKey(planKey(), -back)];
const perName = () => lifePeriod === 'week' ? 'This week' : 'Today';
const perPrev = () => lifePeriod === 'week' ? 'last week' : 'yesterday';
function scaleTarget(target, unit, pct, n) {
  if (pct || n >= 7) return target;
  if (/\bdays?\b/.test(unit || '')) return Math.min(target, n);
  if (/hour/.test(unit || '')) return Math.max(0.5, Math.round(target * n / 7 * 10) / 10);
  return Math.max(1, Math.round(target * n / 7));
}
// the "why" lines were written for a week; on the day view they talk about today
const perWords = t => lifePeriod === 'week' ? t : String(t).replace(/in the last 7 days|this week|all week/g, 'today');

function measureScore(id, ks) {
  const m = MEASURES[id];
  const v = m.calc(ks);
  const target = scaleTarget(m.target, m.unit, m.pct, ks.length);
  if (v === null || v === undefined) return { v: null, pct: null, target };
  return { v, target, pct: Math.max(0, Math.min(100, Math.round(v / target * 100))) };
}

// a goal you tick yourself each day: how many of these days you ticked it
function goalScore(g, ks) {
  if (g.m === 'dyn' && g.dyn) return dynScore(g.dyn, ks);
  if (g.m === 'custom') {
    const v = ks.filter(k => (g.days || []).includes(k)).length;
    const target = scaleTarget(g.target || 5, 'days', false, ks.length);
    return { v, target, pct: Math.min(100, Math.round(v / target * 100)) };
  }
  return measureScore(g.m, ks);
}

function areaScore(a, ks) {
  const g = (state.life || {})[a];
  if (!g) return null;
  const gs = areaGoals(a);
  if (!gs.length) return null;
  const parts = gs.map(x => goalScore(x, ks).pct).filter(x => x !== null);
  return parts.length ? Math.round(parts.reduce((x, y) => x + y, 0) / parts.length) : 0;
}

function weekKeys(back) { const t = shiftKey(todayKey(), -7 * back); return daysIn(shiftKey(t, -6), t); }

function lifeScores() {
  const ks = perKeys(0);
  const sc = AREAS.map(a => areaScore(a.k, ks)).filter(x => x !== null);
  return sc.length ? Math.round(sc.reduce((x, y) => x + y, 0) / sc.length) : null;
}

    g.goals = (g.ids || []).slice(0, MAX_LIFE_GOALS).map(id => ({ text: g.own ? g.text : cap(MEASURES[id].say), m: id, own: !!g.own }));

  g.ids = g.goals.map(x => x.m);   // the scoring reads this
  return g.goals;
}

let lifeSetup = null;   // { i: area index, text, pick, one } while adding a goal
let lifeOpen = null;    // area key whose details are open
let lifeExpanded = null; // "area:index" of the goal card that is opened up

const cap = t => t.replace(/^./, c => c.toUpperCase());

/* ---- big goals: up to 3 per area, for 6 months or a year ----
   the big goal is where you want to end up. each one has a weekly action:
   the one thing you will do this week to move it. you can set that action
   and change it once more, but only 8 hours after you first set it, so the
   choice is made with a clear head and then kept. */
let lifeTab = 'week';   // "week" or "big"
let bigEdit = null;     // { a: area key, i: index or -1 for new, text, months }
let bigOpen = null;     // "area:index" with its progress slider open
let bigAct = null;      // "area:index" while typing its weekly action
let bigConfirm = null;  // "area:index" waiting for "remove?"

const DAY_MS = 86400000;
const MAX_BIG = 3;
const ACTION_WAIT = 8 * 3600000;   // the second change opens 8 hours after the first

function bigState(b) {
  const now = Date.now();
  const timePct = Math.min(100, Math.max(0, Math.round((now - b.start) / (b.end - b.start) * 100)));
  const left = Math.max(0, Math.ceil((b.end - now) / DAY_MS));
  const st = b.done ? ['on', 'Done'] : left === 0 ? ['off', 'Time is up'] :
             b.pct >= timePct - 10 ? ['on', 'On pace'] : b.pct >= timePct - 25 ? ['near', 'A bit behind'] : ['off', 'Behind'];
  return { timePct, left, st };
}
const fmtDate = t => { const d = new Date(t); return d.getDate() + ' ' + cap(MONTHS[d.getMonth()].slice(0, 3)) + ' ' + d.getFullYear(); };

// older saves held one big goal per area; now a list of up to 3
function bigsOf(k) {
  const L = state.life[k];
  if (!L) return [];
  if (!Array.isArray(L.bigs)) { L.bigs = L.big ? [L.big] : []; delete L.big; }
  return L.bigs;
}

// this week's action, if it was set this week
function thisMonday() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return key(d); }
function weekAction(b) { return b.action && b.action.wk === thisMonday() ? b.action : null; }
function actionLock(b) {
  const A = weekAction(b);
  if (!A || !A.setAt.length) return { can: true };
  if (A.setAt.length >= 2) return { can: false, why: 'Set for this week. A new one on Monday.' };
  const wait = A.setAt[0] + ACTION_WAIT - Date.now();
  if (wait > 0) {
    const mins = Math.ceil(wait / 60000), h = Math.floor(mins / 60), m = mins % 60;
    return { can: false, why: 'You can change it once, in ' + (h ? h + 'h ' : '') + m + 'm.' };
  }
  return { can: true, last: true };
}

function bigLine(a) {
  const bs = bigsOf(a.k);
  if (!bs.length) return '';
  return '<div class="bg-line" style="--c:' + a.c + '"><span>Big goals</span>' + bs.map(b => {
    const { st } = bigState(b), A = weekAction(b);
    return '<div class="bg-li"><b>' + esc(b.text) + '</b><span class="lf-pill ' + st[0] + '">' + st[1] + '</span>' +
           (A ? '<small>' + (A.done ? '✓ ' : 'This week: ') + esc(A.text) + '</small>' : '') + '</div>';
  }).join('') + '</div>';
}

function renderBig(box, tabs) {
  let html = '<header class="lf-head"><h1>Life</h1><span>6 months or a year</span></header>' + tabs;
  for (const a of AREAS) {
    const bs = bigsOf(a.k);
    html += '<section class="bg-area" style="--c:' + a.c + '"><div class="bg-ahead"><span class="lf-t-name">' + a.name + '</span>' +
            '<small>' + bs.length + ' of ' + MAX_BIG + '</small></div>';
    bs.forEach((b, i) => {
      const id = a.k + ':' + i;
      const { timePct, left, st } = bigState(b);
      const A = weekAction(b), lock = actionLock(b);
      html += '<div class="bg-card">' +
        '<div class="bg-top"><b class="bg-text">' + esc(b.text) + '</b><span class="lf-pill ' + st[0] + '">' + st[1] + '</span></div>' +
        '<span class="bg-when">' + (b.done ? 'Done' : left + ' days left') + ' · by ' + fmtDate(b.end) + '</span>' +
        // one bar: how far you are, with a mark for how much time has gone
        '<div class="bg-track"><u style="width:' + b.pct + '%"></u><em style="left:' + timePct + '%"></em></div>' +
        '<div class="bg-nums"><span><b>' + b.pct + '%</b> there</span><span>' + timePct + '% of the time gone</span></div>' +
        (bigOpen === id ? '<input class="bg-range" type="range" min="0" max="100" step="5" value="' + b.pct + '" data-pct="' + id + '">' : '') +
        // the weekly action
        '<div class="bg-act">' +
          (bigAct === id
            ? '<span class="bg-act-l">This week I will</span><div class="bg-act-in"><input type="text" maxlength="100" placeholder="one small thing, e.g. apply to 2 roles"><button type="button" class="lf-btn main" data-actsave="' + id + '">Set</button></div>' +
              (lock.last ? '<small class="bg-warn">This is your last change this week.</small>' : '<small>You can change it once more, 8 hours from now.</small>')
            : A
              ? '<button type="button" class="bg-tick' + (A.done ? ' on' : '') + '" data-actdone="' + id + '" aria-label="done this week">✓</button>' +
                '<div class="bg-act-t"><span class="bg-act-l">This week</span><b>' + esc(A.text) + '</b>' +
                (lock.can ? '<button type="button" class="bg-link" data-actset="' + id + '">Change</button>' : '<small>' + lock.why + '</small>') + '</div>'
              : '<button type="button" class="bg-addact" data-actset="' + id + '">+ Set this week’s action</button>') +
        '</div>' +
        '<div class="bg-acts">' +
          (b.done ? '<button type="button" data-undone="' + id + '">Not done yet</button>'
                  : '<button type="button" data-upd="' + id + '">' + (bigOpen === id ? 'Done updating' : 'Update progress') + '</button>' +
                    '<button type="button" data-done="' + id + '">Mark done</button>') +
          '<button type="button" data-edit="' + id + '">Edit</button>' +
          (bigConfirm === id ? '<button type="button" class="danger" data-delyes="' + id + '">Yes, remove</button>'
                             : '<button type="button" data-del="' + id + '">Remove</button>') +
        '</div></div>';
    });
    if (bs.length < MAX_BIG) {
      html += '<button type="button" class="bg-add" data-new="' + a.k + '">+ ' + (bs.length ? 'Add another' : 'Set a 6 month or 1 year goal') + '</button>';
    }
    html += '</section>';
  }
  box.innerHTML = html;

  const get = id => { const [k, i] = id.split(':'); return { k, i: Number(i), b: bigsOf(k)[Number(i)] }; };
  const on = (sel, fn) => box.querySelectorAll(sel).forEach(el => el.addEventListener('click', () => fn(el)));
  on('[data-new]', el => { bigEdit = { a: el.dataset.new, i: -1, text: '', months: 6 }; renderLife(); });
  on('[data-edit]', el => { const g = get(el.dataset.edit); bigEdit = { a: g.k, i: g.i, text: g.b.text, months: g.b.months }; renderLife(); });
  on('[data-del]', el => { bigConfirm = el.dataset.del; renderLife(); });
  on('[data-delyes]', el => { const g = get(el.dataset.delyes); bigsOf(g.k).splice(g.i, 1); bigConfirm = null; save(); renderLife(); });
  on('[data-done]', el => { const g = get(el.dataset.done); g.b.done = true; g.b.pct = 100; bigOpen = null; save(); renderLife(); });
  on('[data-undone]', el => { get(el.dataset.undone).b.done = false; save(); renderLife(); });
  on('[data-upd]', el => { bigOpen = bigOpen === el.dataset.upd ? null : el.dataset.upd; renderLife(); });
  on('[data-actset]', el => { bigAct = el.dataset.actset; renderLife(); const i = box.querySelector('.bg-act-in input'); if (i) { const A = weekAction(get(bigAct).b); i.value = A ? A.text : ''; i.focus(); } });
  on('[data-actdone]', el => { const A = weekAction(get(el.dataset.actdone).b); if (A) { A.done = !A.done; save(); renderLife(); } });
  on('[data-actsave]', el => {
    const g = get(el.dataset.actsave), inp = box.querySelector('.bg-act-in input'), t = inp.value.trim();
    if (!t) { inp.focus(); return; }

/* ---- reading goals that name a thing ----
   "quit edibles", "less sugar", "drink more water", "gym 3 times a week",
   "read every day", "call mum weekly", "feel less anxious".
   the thing (X) is looked up in your food kinds, your day plan and your moods,
   and turned into something the app can count from what you already log. */
const AVOID_RE = /\b(quit|quitting|stop|stopping|no more|cut out|avoid|give up|drop|less|cut down(?: on)?|reduce|limit|fewer|without|no|never)\b\s+(?:on\s+|eating\s+|drinking\s+|taking\s+|smoking\s+|having\s+|doing\s+|using\s+|the\s+|my\s+)*(.+)$/;
const FILLER_RE = /\b(i|want|wanna|to|will|would|like|be|able|start|starting|keep|more|daily|every ?day|each day|regularly|often|consistently|my|the|a|an|at least|times?|per|week|weekly|every week|once|twice|thrice|\d+|x|please|go|going|get|do|have|eat|drink|a lot|lots of|some)\b/g;
const ACTIVITY_WORDS = ['gym', 'read', 'reading', 'pray', 'prayer', 'walk', 'run', 'journal', 'meditate', 'study', 'call', 'cook', 'yoga', 'stretch', 'swim', 'write', 'code', 'clean', 'date', 'church', 'bible', 'golang'];

function goalFreq(t) {
  if (/\b(every ?day|daily|each day)\b/.test(t)) return 7;
  if (/\b(weekly|every week|once a week)\b/.test(t)) return 1;
  const m = t.match(/\b(\d+|once|twice|thrice|three|four|five|six)\s*(?:times|x)?\s*(?:a|per)\s*week\b/);
  if (m) return { once: 1, twice: 2, thrice: 3, three: 3, four: 4, five: 5, six: 6 }[m[1]] || Math.min(7, Number(m[1]) || 3);
  return null;
}

function readDynamic(text) {
  const t = ' ' + String(text).toLowerCase().replace(/[^a-z0-9\s'-]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
  const av = t.trim().match(AVOID_RE);
  const avoid = !!av;
  const strict = av && /^(quit|quitting|stop|stopping|no more|cut out|avoid|give up|drop|no|never|without)/.test(av[1]);
  let x = (av ? av[2] : t).replace(FILLER_RE, ' ').replace(/\s+/g, ' ').trim();
  if (!x) return null;
  const label = x.split(' ').slice(0, 3).join(' ');
  const freq = goalFreq(t);

  // a mood to feel less of
  const mood = MOODS.find(m => new RegExp('\\b' + m.k + '\\b').test(x));
  if (mood && avoid) return { src: 'mood', mood: mood.k, label: mood.k, avoid: true, target: 80 };

  // a food or drink
  let kind = /\bedibles?\b|\bweed\b|\bthc\b|\bsmok/.test(x) ? 'cannabis' : (foodKinds(x)[0] || null);
  if (/\bcoffee|caffeine|tea\b/.test(x)) kind = 'caffeine';
  if (kind) return { src: 'food', kind, label, avoid, target: avoid ? (strict ? 7 : 5) : (freq || 5) };

  // something on your day plan, or something you do
  const word = x.split(' ').find(w => w.length > 2) || x;
  const planned = Object.values(state.days).some(d => (d.blocks || []).some(b => new RegExp('\\b' + word, 'i').test(b.label || '')));
  if (planned || ACTIVITY_WORDS.some(w => x.includes(w))) {
    return { src: 'blocks', match: word, label, avoid, target: avoid ? 7 : (freq || 3) };
  }
  return null;
}

function dynMeasure(d) {
  const L = d.label;
  if (d.src === 'mood') return { say: 'feel less ' + L, target: d.target, unit: '% of check-ins not ' + L, pct: true, tip: 'Log your mood when you feel ' + L + ', it shows what sets it off.' };
  if (d.src === 'food') return d.avoid
    ? { say: (d.target === 7 ? 'quit ' : 'less ') + L, target: d.target, unit: 'days without ' + L, tip: 'Skip ' + L + ' today. Log it if you have it, honesty keeps this useful.' }
    : { say: 'more ' + L, target: d.target, unit: 'days with ' + L, tip: 'Have some ' + L + ' today, and log it.' };
  return d.avoid
    ? { say: 'no ' + L, target: d.target, unit: 'days without ' + L, tip: 'Keep ' + L + ' off your plan today.' }
    : { say: L + (d.target === 7 ? ' every day' : d.target === 1 ? ' once a week' : ' ' + d.target + ' times a week'), target: d.target, unit: 'days with ' + L, tip: 'Put ' + L + ' on your day plan.' };
}

function dynHit(d, k) {
  if (d.src === 'food') {
    const re = new RegExp('\\b' + d.label.split(' ')[0], 'i');
    return foodIn([k]).some(f => (d.kind ? entryKinds(f).includes(d.kind) : false) || re.test(f.what));
  }
  if (d.src === 'blocks') {
    const re = new RegExp('\\b' + d.match, 'i');
    return ((state.days[k] || {}).blocks || []).some(b => b.done && re.test(b.label || '')) ||
           state.habits.some(h => re.test(h.name) && h.marks.includes(k));
  }
  return false;
}

function dynScore(d, ks) {
  if (d.src === 'mood') {
    const m = moodsIn(ks); if (!m.length) return { v: null, pct: null };
    const v = Math.round(m.filter(x => x.mood !== d.mood).length / m.length * 100);
    return { v, target: d.target, pct: Math.min(100, Math.round(v / d.target * 100)) };
  }
  const hit = ks.filter(k => dynHit(d, k));
  const v = d.avoid ? ks.length - hit.length : hit.length;
  const target = scaleTarget(d.target, 'days', false, ks.length);
  return { v, target, pct: Math.min(100, Math.round(v / target * 100)) };
}

function dynWhy(d, ks) {
  if (d.src === 'mood') { const m = moodsIn(ks); const n = m.filter(x => x.mood === d.mood).length;
    return m.length ? 'You felt ' + d.mood + ' in ' + n + ' of ' + m.length + ' check-ins.' : 'No moods logged this week.'; }
  const hit = ks.filter(k => dynHit(d, k));
  if (d.avoid) return hit.length ? cap(d.label) + ' on ' + listDays(hit) + '.' : 'No ' + d.label + ' logged all week.';
  return hit.length ? cap(d.label) + ' on ' + listDays(hit) + '.' : 'No ' + d.label + ' yet this week.';
}
