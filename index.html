// areas of life for budget lines, with a guess from the name
const MN_AREAS = ['Health', 'Wealth', 'Love', 'Self'];
const MN_AREA_C = { Health: '#7daf86', Wealth: '#c9965a', Love: '#d9718e', Self: '#86b9d9' };
function guessArea(name) {
  const n = String(name || '').toLowerCase();
  if (/gym|health|food|grocer|meal|pharm|drug|hospital|doctor|clinic|dental|vitamin|fruit|water/.test(n)) return 'Health';
  if (/save|saving|invest|rent|bill|light|electric|debt|loan|emergency|insurance|tax|pension|stock|house|data|fuel|subscri|estate|clean|laundry/.test(n)) return 'Wealth';
  if (/gift|family|mum|mom|dad|sis|bro|date|partner|friend|church|tithe|offering|giving|charity|wedding|baby|dog|ife\b/.test(n)) return 'Love';
  return 'Self';
}
function lineEditor(b) {
  const set = b && b.area, area = set || guessArea(b ? b.name : '');
  return '<div class="mn-ed3"><label><span>What is it</span><input name="name" type="text" maxlength="40" placeholder="e.g. Groceries" value="' + esc(b ? b.name : '') + '"></label>' +
    '<label><span>How much a month</span><div class="mn-amt"><em>₦</em><input name="amt" type="text" inputmode="numeric" placeholder="0" value="' + (b && b.amount ? b.amount : '') + '"></div></label>' +
    '<div class="mn-past"></div>' +
    '<div class="mn-lab"><span>Area of life</span>' + (set ? '' : '<small class="sug">suggested</small>') + '</div>' +
    '<div class="mn-areas">' + MN_AREAS.map(a => '<button type="button" data-ar="' + a + '" style="--c:' + MN_AREA_C[a] + '" class="' + (a === area ? 'on' : '') + '">' + a + '</button>').join('') + '</div>' +
    '<input type="hidden" name="area" value="' + area + '">' +
    '<div class="mn-edb"><button type="button" class="lf-btn main" data-a="save">Save</button><button type="button" class="gm-link" data-a="cancel">Cancel</button>' +
    (b ? '<button type="button" class="gm-link danger" data-a="remove">Remove</button>' : '') + '</div></div>';
}
function incEditor(x, i) {
  return '<div class="mn-ed3"><label><span>Where from</span><input name="name" type="text" maxlength="40" placeholder="e.g. Salary" value="' + esc(x ? x.name : '') + '"></label>' +
    '<label><span>How much a month</span><div class="mn-amt"><em>₦</em><input name="amt" type="text" inputmode="numeric" placeholder="0" value="' + (x && x.amount ? x.amount : '') + '"></div></label>' +
    '<div class="mn-edb"><button type="button" class="lf-btn main" data-a="save">Save</button><button type="button" class="gm-link" data-a="cancel">Cancel</button>' +
    (x ? '<button type="button" class="gm-link danger" data-a="remove">Remove</button>' : '') + '</div></div>';
}

function guessMeal() {
  const h = new Date().getHours();
  if (h < 4) return 'snack';
  if (h < 11) return 'breakfast';
  if (h < 16) return 'lunch';
  if (h < 22) return 'dinner';
  return 'snack';
}

// an entry's kinds: from its words, plus cannabis if you said it was infused
function entryKinds(f) {
  const ks = foodKinds(f.what);
  if (f.infused === true && !ks.includes('cannabis')) ks.push('cannabis');
  if (f.infused === false) { const i = ks.indexOf('cannabis'); if (i > -1) ks.splice(i, 1); }
  return ks;
}

// words that might be an edible, so it is worth asking
const EDIBLE_RE = /\b(edibles?|gumm(y|ies)|brownies?|space ?cakes?|cookies?|chocolates?)\b/i;
const askInfused = f => f.infused === undefined && EDIBLE_RE.test(f.what) &&
                        /\bedibles?\b|gumm|brownie/i.test(f.what) && !foodKinds(f.what).includes('cannabis');

function foodKinds(text) {
  const t = String(text || '').toLowerCase();
  const out = [];
  for (const k in KINDS) if (KIND_RE[k].some(re => re.test(t))) out.push(k);
  // herbal tea and decaf have no caffeine
  if (/\b(decaf|herbal|chamomile|peppermint|rooibos|ginger tea|lemon tea)\b/.test(t)) {
    const i = out.indexOf('caffeine');
    if (i > -1) out.splice(i, 1);
  }
  return out;
}

const isDrink = f => f.meal === 'drink';
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function agoText(ms) {
  const m = Math.round(ms / 60000);
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '');
}

// returns goal keys found in the text, strongest first (most hits, then earliest)
function readGoal(text) {
  const t = ' ' + String(text).toLowerCase().replace(/[^a-z\s'-]/g, ' ').replace(/\s+/g, ' ') + ' ';
  const found = [];
  for (const k in GOAL_WORDS) {
    let hits = 0, first = Infinity;
    for (const w of GOAL_WORDS[k]) {
      const re = new RegExp('\\b' + w.replace(/ /g, '\\s+') + '\\b', 'g');
      let m;
      while ((m = re.exec(t))) { hits++; first = Math.min(first, m.index); }
    }
    if (hits) found.push({ k, hits, first });
  }
  found.sort((a, b) => b.hits - a.hits || a.first - b.first);
  return found.slice(0, 2).map(x => x.k);
}

function sayGoal(ks) {
  const parts = ks.map(k => GOAL_SAY[k]);
  return 'You want to ' + parts.join(', and ') + '.';
}

/* ---- how you felt, feel, and will feel ----
   each food step maps to a mood. a logged mood near the moment wins. */
const STEP_MOOD = [
  [/alert|strongest/, 'focused'], [/quick lift/, 'good'], [/dip|peckish/, 'tired'], [/slow or sleepy|heavy/, 'tired'],
  [/passing|worn off/, 'okay'], [/steady|full|digesting slowly/, 'calm'], [/hungry/, 'okay'], [/water helps/, 'focused'],
  [/relaxed/, 'calm'], [/tired or flat/, 'low'], [/kicking in/, 'calm'], [/wearing off/, 'tired']
];
function foodMoodAt(recent, t) {
  let best = null;
  for (const f of recent) {
    if (f.at > t) continue;
    for (const k of entryKinds(f)) {
      let step = null;
      for (const [m, text] of KINDS[k].steps) { const at = f.at + m * 60000; if (at <= t) step = { at, text }; }
      if (!step && t - f.at < 15 * 60000) step = { at: f.at, text: 'kicking in' };
      if (!step || t - step.at > 3 * 3600000) continue;
      if (!best || step.at > best.at) best = { ...step, f, k };
    }
  }
  if (!best) return null;
  const hit = STEP_MOOD.find(([re]) => re.test(best.text));
  return { mood: hit ? hit[1] : 'okay', why: best.text + ', from ' + best.f.what };
}
// nothing logged and no food working on you: a best guess, so the circle is never empty.
// your last check-in if it was recent, else hunger and the time of day
function guessMoodAt(t, now) {
  const last = state.moods.filter(m => m.at <= now && t - m.at <= 2 * 3600000).sort((a, b) => b.at - a.at)[0];
  const meal = state.food.filter(f => !isDrink(f) && f.at <= Math.min(t, now)).sort((a, b) => b.at - a.at)[0];
  const gap = meal ? (t - meal.at) / 3600000 : 99;
  const h = new Date(t).getHours();
  if (gap >= 4 && gap < 24 && h >= 7) return { mood: 'tired', why: 'no meal for ' + Math.floor(gap) + ' hours' };
  if (h >= 23 || h < 5) return { mood: 'tired', why: 'it is late' };
  if (last) return { mood: last.mood, why: 'like your last check-in' };
  if (h >= 14 && h < 16) return { mood: 'tired', why: 'the afternoon dip' };
  return { mood: 'okay', why: 'nothing strong working on you' };
}
function moodMoments(recent, now) {
  const at = [now - 60 * 60000, now, now + 60 * 60000];
  const names = ['1h ago', 'Now', 'In 1h'];
  const rs = at.map((t, i) => {
    const logged = i < 2 ? state.moods.filter(m => Math.abs(m.at - t) <= (i === 0 ? 30 : 20) * 60000 && m.at <= now).sort((a, b) => Math.abs(a.at - t) - Math.abs(b.at - t))[0] : null;
    return logged ? { mood: logged.mood, why: 'you logged it' } : foodMoodAt(recent, t) || guessMoodAt(t, now);
  });
  const cols = rs.map((r, i) => { const md = r.mood && MOODS.find(m => m.k === r.mood);
    return '<div class="mj' + (i === 1 ? ' now' : '') + '" style="--c:' + (md ? md.c : 'var(--muted)') + '"><span>' + (md ? md.e : '\u2022') + '</span>' +
           '<b>' + (r.mood || '\u2013') + '</b><small>' + names[i] + '</small></div>'; }).join('<i class="mj-line"></i>');
  // under the circles: why you will feel that way in 1h, then the one thing
  // that would make you feel better by then
  const nx = rs[2], nm = MOODS.find(m => m.k === nx.mood);
  const tip = betterIn1h(nx.mood, recent, now, rs[1].mood), tm = MOODS.find(m => m.k === tip.mood);
  return '<div class="mjs">' + cols + '</div>' +
    '<p class="mj-why"><b>In 1h:</b> ' + (nm ? nm.e + ' ' : '') + esc(nx.mood || 'okay') + (nx.why && nx.why !== 'you logged it' ? ', ' + esc(nx.why) : '') + '</p>' +
    '<p class="mj-tip"><b>Tip:</b> ' + esc(tip.do) + (tip.mood === nx.mood ? '. You\u2019ll stay ' + (tm ? tm.e + ' ' : '') + tip.mood + '.'
                                                       : '. In 1h you\u2019ll feel ' + (tm ? tm.e + ' ' : '') + tip.mood + '.') + '</p>';
}
// the next best thing to do, and how you could feel in 1h if you do it. rules, first match wins
function betterIn1h(mood, recent, now, moodNow) {
  const h = new Date(now).getHours();
  const meal = state.food.filter(f => !isDrink(f) && f.at <= now).sort((a, b) => b.at - a.at)[0];
  const gap = meal ? (now - meal.at) / 3600000 : 99;
  const water = state.food.some(f => entryKinds(f).includes('water') && now - f.at < 3 * 3600000);
  const j = activeJourney(), jd = j && j.kind === 'cannabis' ? journeyDay(j, now) : 0;
  const low = ['tired', 'unfocused', 'bored', 'unmotivated', 'low'].includes(mood);
  const tense = ['stressed', 'anxious'].includes(mood) || ['stressed', 'anxious'].includes(moodNow);
  if (h >= 22 || h < 5) return { do: 'Phone away and dim the lights now', mood: 'calm' };
  if (gap >= 4 && gap < 24 && h >= 7 && h < 21) return { do: 'Eat ' + foodsFor('protein', ['eggs', 'beans', 'groundnuts']) + ' now', mood: 'focused' };
  if (tense && jd && jd <= 14) return { do: 'Take a 10 minute walk, it eases cravings and nerves', mood: 'calm' };
  if (tense) return { do: 'Take 5 slow breaths, then a short walk', mood: 'calm' };
  if (!water && h >= 8 && h < 21) return { do: 'Drink a big glass of water', mood: low ? 'focused' : mood || 'focused' };

}

function usualFoods(kind, n) {
  const tally = {};
  for (const f of state.food) {
    const ks = entryKinds(f);
    if (!ks.includes(kind) || ks.includes('carbs') || ks.includes('fried') || ks.includes('sugar')) continue;   // light things only
    const k = f.what.trim().toLowerCase(); tally[k] = (tally[k] || 0) + 1;
  }
  return Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, n).map(x => x[0]);
}
function foodsFor(kind, fallback) {

  const more = fallback.filter(x => !mine.includes(x));
  return mine.concat(more).slice(0, 2).join(' or ');
}

  const ed = recent.filter(f => entryKinds(f).includes('cannabis') && now - f.at < 2 * 3600000).sort((a, b) => b.at - a.at)[0];
  if (ed) notes.push('Edibles can take up to 2 hours to kick in. Wait at least that long before having more.');

  const g2 = myGoal2();
  const gn2 = g2 ? g2.note(recent, now) : null;
  if (gn2) notes.unshift(g2.e + ' ' + gn2);
  const gn = goal.note(recent, now);
  if (gn) notes.unshift(gn);
  if (ed) notes.unshift(notes.splice(notes.indexOf('Edibles can take up to 2 hours to kick in. Wait at least that long before having more.'), 1)[0]);

  // keep it to three lines: what is happening, what is next, one tip
  soon.sort((a, b) => a.at - b.at);
  const lead = nowLines.sort((a, b) => b.f.at - a.f.at)[0];
  const next = soon[0];
  // 15 minutes ago, now, in 15 minutes: your logged mood where there is one, else what your food suggests
  html += moodMoments(recent, now);
  if (notes[0] && /Edibles/.test(notes[0])) html += '<p class="fn-tip">' + esc(notes[0]) + '</p>';
  html += tail();

  card.innerHTML = html;
  card.querySelector('.goalchip').addEventListener('click', changeFoodGoal);
  box.appendChild(card);
}

  const byDay = {};

  const water = food.filter(f => has(f, 'water')).length;

  tiles.sort((x, y) => (y.mine ? 1 : 0) - (x.mine ? 1 : 0));

function grocerySuggestions() {
  const g = myGoal();
  if (!g) return null;
  const since = Date.now() - 30 * 86400000;
  const recent = state.food.filter(f => f.at >= since);
  const helps = GOAL_HELPS[g.k] || [];
  const pool = g.k === 'sleep' ? SLEEP_IDEAS : GROCERY_IDEAS;

  const out = [];
  for (const name of pool) {
    if (onGrocList(name)) continue;
    const ks = foodKinds(name);
    const good = g.k === 'sleep' ? true : ks.some(k => helps.includes(k));
    if (!good) continue;
    const base = name.replace(/s$/, '').split(' ').pop();
    const re = new RegExp('\\b' + base + 's?\\b', 'i');
    const times = recent.filter(f => re.test(f.what)).length;
    const k = ks.find(x => helps.includes(x));
    const why = g.k === 'sleep' ? 'calming' : KIND_WHY[k] || '';
    out.push({ name, times, why });

  // things you already eat come first, then a few new ones
  out.sort((a, b) => b.times - a.times);
  const known = out.filter(x => x.times).slice(0, 4);
  const fresh = out.filter(x => !x.times).slice(0, 6 - known.length);
  return { goal: g, list: [...known, ...fresh] };
}

function prepsFor(text) { return prepsFor1(text); }
function prepsFor1(text) {
  const t = String(text || '').toLowerCase();
  if (/\beggs?\b/.test(t)) return ['boiled', 'fried', 'scrambled', 'omelette'];
  if (MEAT_RE.test(t)) return ['cleaned', 'chopped', 'whole', 'grilled', 'fried', 'in stew', 'peppersoup'];

const prepRe = w => new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + (w === 'chopped' ? '( into \\d+ pieces?)?' : '') + '\\b,?\\s*', 'i');

function grocGroup(text) {

// from your food log: how much of it you get through in a week, and how you have it
function grocGuess(text) {
  const base = text.toLowerCase().replace(/[^a-z ]/g, '').trim().split(' ').pop().replace(/(es|s)$/, '');
  if (base.length < 3) return null;
  const re = new RegExp('\\b' + base + '(e?s)?\\b', 'i');
  const since = Date.now() - 14 * 86400000;
  const hits = state.food.filter(f => f.at >= since && re.test(f.what));
  if (!hits.length) return null;
  // "2 eggs", "3 bananas": the number in front, else one each time
  const each = hits.map(f => { const m = f.what.toLowerCase().match(new RegExp('(\\d+)\\s*' + base)); return m ? Number(m[1]) : 1; });
  const perWeek = each.reduce((a, b) => a + b, 0) / 2;
  const dishes = {};
  for (const f of hits) { const d = f.what.trim().toLowerCase(); if (d.replace(/\d+\s*/, '') !== base && d !== base + 's') dishes[d] = (dishes[d] || 0) + 1; }
  const usual = Object.entries(dishes).sort((a, b) => b[1] - a[1])[0];
  const meals = {};
  for (const f of hits) meals[f.meal] = (meals[f.meal] || 0) + 1;
  const meal = Object.entries(meals).sort((a, b) => b[1] - a[1])[0][0];
  const count = COUNT_WORDS.test(text);
  return {
    qty: count ? Math.max(1, Math.ceil(perWeek)) : null,
    unit: count ? 'pcs' : '',
    note: (usual ? 'usually ' + usual[0] : 'for ' + meal) + ' · about ' + Math.max(1, Math.round(perWeek)) + '× a week',
    auto: true

}

async function grocImage() {

  const W = 1080, PAD = 110, NAME = 64, NOTE = 42;
  const c = document.createElement('canvas');

      const tryL = line ? line + ' ' + w : w;
      if (x.measureText(tryL).width > max && line) { out.push(line); line = w; } else line = tryL;
    }
    if (line) out.push(line);

  const qtyW = 230, textX = PAD + 100, textMax = W - textX - PAD - qtyW;

    x.save(); x.beginPath(); x.roundRect(PAD, 96, 100, 100, 26); x.clip(); x.drawImage(logo, PAD, 96, 100, 100); x.restore();
  } catch {}
  const d = new Date();
  x.fillStyle = '#1d1512'; x.font = '600 84px Poppins, sans-serif'; x.textBaseline = 'alphabetic';
  x.fillText('Groceries', PAD + 128, 178);
  x.fillStyle = '#4a3b33'; x.font = '500 40px Poppins, sans-serif';
  x.fillText(cap(FULL[d.getDay()]) + ' ' + d.getDate() + ' ' + cap(MONTHS[d.getMonth()]), PAD, 276);

  // the items: a big circle to tick in pen, the name, how many, and how you'll have it
  let y = 360;
  laid.forEach((l, i) => {
    if (i) { x.strokeStyle = '#e6dccd'; x.lineWidth = 2; x.beginPath(); x.moveTo(PAD, y - 4); x.lineTo(W - PAD, y - 4); x.stroke(); }
    let ty = y + NAME + 6;
    x.strokeStyle = '#1d1512'; x.lineWidth = 4;
    x.beginPath(); x.arc(PAD + 30, ty - NAME * .34, 28, 0, Math.PI * 2); x.stroke();
    x.fillStyle = '#1d1512'; x.font = nameFont; x.textAlign = 'left';
    l.name.forEach((t, j) => x.fillText(t, textX, ty + j * NAME * 1.2));
    if (grocAmt(l.it)) {
      x.fillStyle = '#b02a52'; x.font = '700 ' + (l.it.qty2 > 0 ? 46 : NAME) + 'px Poppins, sans-serif'; x.textAlign = 'right';
      x.fillText(grocAmt(l.it), W - PAD, ty);
      x.textAlign = 'left';
    }
    ty += (l.name.length - 1) * NAME * 1.2;
    x.fillStyle = '#4a3b33'; x.font = noteFont;
    l.note.forEach((t, j) => x.fillText(t, textX, ty + 16 + (j + 1) * NOTE * 1.3));
    y += l.h;
  });
  x.fillStyle = '#8a776a'; x.font = '500 28px Poppins, sans-serif'; x.textAlign = 'center';

}

// a typed item like "12 eggs, boiled for breakfast" or "rice 2kg (jollof)":
// the name, how many, the unit, and how you'll have it, split out
const UNIT_WORDS = { kg: 'kg', kgs: 'kg', kilo: 'kg', kilos: 'kg', g: 'g', grams: 'g', gram: 'g', l: 'L', litre: 'L', litres: 'L', liter: 'L', liters: 'L',
  pack: 'pack', packs: 'pack', bunch: 'bunch', bunches: 'bunch', tin: 'tin', tins: 'tin', can: 'tin', cans: 'tin', bag: 'bag', bags: 'bag',
  pcs: 'pcs', pc: 'pcs', piece: 'pcs', pieces: 'pcs', crate: 'pack', crates: 'pack', dozen: 'pcs' };
function parseGrocery(raw) {
  let t = String(raw || '').trim(), note = '';
  const paren = t.match(/\(([^)]*)\)/);
  if (paren) { note = paren[1].trim(); t = t.replace(paren[0], ' ').trim(); }
  const cut = t.match(/\s*(,|;|\s-\s|\s–\s|:|\bfor\b|\bto\b\s+(?:boil|fry|grill|bake|make|cook|blend|roast|steam)|\b(?:boiled|fried|grilled|baked|roasted|steamed|blended|mashed|raw|sliced)\b)/i);
  if (cut && cut.index > 0) {
    const rest = t.slice(cut.index).replace(/^\s*(,|;|-|–|:)\s*/, '').trim();
    note = [rest, note].filter(Boolean).join(', ');
    t = t.slice(0, cut.index).trim();
  }
  let qty = null, unit = '';
  const unitRe = '(' + Object.keys(UNIT_WORDS).join('|') + ')';
  let m = t.match(new RegExp('^(?:x\\s*)?(\\d+(?:\\.\\d+)?)\\s*(?:x\\b)?\\s*' + unitRe + '?\\b\\s*(?:of\\s+)?', 'i'));
  if (m && m[0].trim() && t.slice(m[0].length).trim()) {
    qty = Number(m[1]); unit = m[2] ? UNIT_WORDS[m[2].toLowerCase()] : ''; t = t.slice(m[0].length).trim();
    if (m[2] && /dozen/i.test(m[2])) qty *= 12;
  } else {
    m = t.match(new RegExp('\\s+(?:x\\s*)?(\\d+(?:\\.\\d+)?)\\s*' + unitRe + '?\\s*$', 'i'));
    if (m && t.slice(0, m.index).trim()) {
      qty = Number(m[1]); unit = m[2] ? UNIT_WORDS[m[2].toLowerCase()] : ''; t = t.slice(0, m.index).trim();
      if (m[2] && /dozen/i.test(m[2])) qty *= 12;
    }
  }
  if (qty !== null && !unit && COUNT_WORDS.test(t)) unit = 'pcs';
  t = t.replace(/\s+/g, ' ').trim();
  return { text: t ? cap(t) : String(raw).trim(), qty, unit, note };
}
// tidy one item in place: only fills what is empty, never loses words
function tidyGrocery(it) {
  const p = parseGrocery(it.text);
  if (p.text === it.text && p.qty === null && !p.note) return false;
  it.text = p.text;
  if (p.qty !== null && !it.qty) { it.qty = p.qty; it.unit = p.unit || it.unit || ''; }
  else if (p.qty !== null && it.qty) it.text = it.text;   // keep the amount you set by hand
  if (p.note) it.note = it.note && !it.auto ? it.note + ', ' + p.note : p.note;
  it.auto = false;
  return true;
}

  [/\bpeppers?\b|\btatashe\b|\bshombo\b|\bata\b/, 1000, 'each'], [/\bonions?\b/, 1000, 'each'], [/\bsugar\b/, 1500, 'pack'],
  [/\bsalt\b/, 500, 'pack'], [/\boil\b/, 3500, 'L'], [/\bbananas?\b/, 1500, 'bunch'], [/\bapples?\b/, 600, 'each'],
  [/\btangerines?\b|\boranges?\b/, 300, 'each'], [/\balmonds?\b/, 6000, 'pack'], [/\bcashews?\b/, 5500, 'pack'],
  [/\bcoconut flakes?\b/, 3000, 'pack'], [/\btea\b/, 1500, 'pack'], [/\bcoffee\b/, 5000, 'pack'], [/\bgarri\b/, 1500, 'kg'],
  [/\bbeans\b/, 2500, 'kg'], [/\bmaggi\b|\bknorr\b|\bseasoning\b|\bbouillon\b/, 1500, 'pack'], [/\bcurry\b|\bthyme\b|\bspice\b/, 800, 'pack'],

const naira0 = n => '\u20a6' + Math.round(n).toLocaleString('en-NG');
const priceKey = t => String(t || '').toLowerCase().replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
const round50 = n => Math.max(50, Math.round(n / 50) * 50);
// times the base price by how many, when the amount and the price talk about the same thing
function scalePrice(p, per, it) {
  const q = Number(it.qty) || 0, u = it.unit || '';
  if (!q) return p;
  if (per === 'crate') return u === 'pcs' ? p / 30 * q : u === '' && q >= 6 ? p / 30 * q : p * q;
  if (per === 'kg') return u === 'kg' ? p * q : u === 'g' ? p * q / 1000 : p;
  if (per === 'each') return (u === 'pcs' || u === '') ? p * q : p;
  return u === per || u === '' ? p * q : p;
}
// { p, src: 'you' | 'lagos' } or null
function suggestPrice(it) {
  if (it.unit === 'naira' && it.qty) return { p: it.qty, src: 'you' };
  if (it.unit === 'knaira' && it.qty) return { p: it.qty * 1000, src: 'you' };
  const mine = (state.prices || {})[priceKey(it.text)];
  if (mine) return { p: round50(it.qty && mine.unit === (it.unit || '') ? mine.per * it.qty : mine.per * (mine.unit === '' ? (Number(it.qty) || 1) : 1)), src: 'you' };
  const t = it.text.toLowerCase();
  const hit = LAGOS_PRICES.find(([re]) => re.test(t));
  return hit ? { p: round50(scalePrice(hit[1], hit[2], it)), src: 'lagos' } : null;
}
const itemPrice = it => it.price > 0 ? it.price : (suggestPrice(it) || {}).p || 0;
// remember what you paid, per one of whatever the amount counts
function learnPrice(it, price) {
  if (!(price > 0)) return;
  if (!state.prices) state.prices = {};
  const q = Number(it.qty) || 0, u = it.unit === 'naira' || it.unit === 'knaira' ? '' : (it.unit || '');
  state.prices[priceKey(it.text)] = { per: q && u ? price / q : (q && !u ? price / q : price), unit: q ? u : '', at: Date.now() };
}
const monthOf = at => { const d = new Date(at); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };

  if (!state.grocery.length) html = '<p class="gr-empty">Your list is empty. Add what you need, or tap a suggestion below.</p>';
  if (todo.length) {
    html += '<div class="gr-share"><button type="button" data-a="image">Save as image</button><button type="button" data-a="copy">Copy as text</button><button type="button" data-a="share">Notes</button><span class="gr-msg"></span></div>';
    html += order.map(k => (order.length > 1 ? '<div class="gr-ghead">' + k + '</div>' : '') + '<ul class="gr-list">' + groups[k].map(row).join('') + '</ul>').join('');
  }
  if (got.length) {
    html += '<div class="gr-gothead"><span>In the basket · ' + got.length + '</span>' +
            '<button type="button" class="gr-clear">Clear</button></div>' +

  }
  if (state.grocery.length > 3) html = '<div class="gr-findrow"><input type="search" class="gr-find" placeholder="Search your list" aria-label="search your list" autocomplete="off"><span class="gr-none" hidden>Nothing on your list matches</span></div>' + html;
  html = grocMonthHtml() + html;
  list.innerHTML = html;
  list.querySelectorAll('[data-gm]').forEach(b => b.addEventListener('click', () => {
    const mk = monthOf(Date.now());
    if (b.dataset.gm === 'new') {
      // start fresh: what you bought is already in your spending; the old list is kept, with undo
      const before = state.grocery.slice();
      if (!state.grocLists) state.grocLists = [];
      state.grocLists.push({ at: Date.now(), items: before });
      state.grocLists = state.grocLists.slice(-24);
      state.grocery = []; grOpen = null; save(); renderGroceries();
      offerUndo('old list', () => { state.grocery = before; state.grocLists.pop(); save(); renderGroceries(); });
      return;
    }
    if (b.dataset.gm === 'edit') { grBudgetEdit = true; renderGroceries(); const i = list.querySelector('.gm-bin'); if (i) { i.value = (state.grocBudget || {})[mk] || ''; i.focus(); } return; }
    const v = Number(list.querySelector('.gm-bin').value) || 0;
    if (!state.grocBudget) state.grocBudget = {};
    if (v > 0) state.grocBudget[mk] = v; else delete state.grocBudget[mk];
    grBudgetEdit = false; save(); renderGroceries();
  }));
  // search: hides what does not match, as you type
  const find = list.querySelector('.gr-find');
  if (find) {
    find.value = grFind;
    const apply = () => {
      const q = grNorm(find.value);
      let any = false;
      list.querySelectorAll('.gr-row').forEach(li => {
        const it = state.grocery.find(x => x.id === li.dataset.id);
        const hay = grNorm([it.text, it.type, it.note].filter(Boolean).join(' '));
        const ok = !q || hay.split(' ').some(w => w.startsWith(q.split(' ')[0])) && q.split(' ').every(p => hay.includes(p));
        li.hidden = !ok; if (ok) any = true;
      });
      list.querySelectorAll('.gr-list').forEach(ul => {
        const shown = [...ul.children].some(li => !li.hidden);
        ul.hidden = !shown;
        const head = ul.previousElementSibling;
        if (head && (head.classList.contains('gr-ghead') || head.classList.contains('gr-gothead'))) head.hidden = !shown;
      });
      list.querySelector('.gr-none').hidden = !q || any;
    };
    find.addEventListener('input', () => { grFind = find.value; apply(); });
    apply();
  }

  list.querySelectorAll('.gr-share [data-a]').forEach(b => b.addEventListener('click', async () => {
    const said = b.dataset.a === 'image' ? await grocSaveImage() : await grocShare(b.dataset.a);
    const m = list.querySelector('.gr-msg'); if (m && said) { m.textContent = said; setTimeout(() => { m.textContent = ''; }, 2000); }
  }));

  list.querySelectorAll('.gr-row').forEach(li => {
    const it = state.grocery.find(x => x.id === li.dataset.id);
    li.querySelector('[data-a=tick]').addEventListener('click', () => {
      it.done = !it.done;
      if (!state.groceryLog) state.groceryLog = [];
      if (it.done) { const p = itemPrice(it); it.paid = p || 0; state.groceryLog.push({ text: it.text, at: Date.now(), price: p || 0 }); if (it.price > 0) learnPrice(it, it.price); }
      else { it.paid = 0; const j = state.groceryLog.map(x => x.text).lastIndexOf(it.text); if (j > -1) state.groceryLog.splice(j, 1); }
      if (grOpen === it.id) grOpen = null;
      save(); renderGroceries();
    });
    li.querySelector('[data-a=open]').addEventListener('click', e => {
      if (e.target.closest('[data-a=swap]')) return;
      if (it.done) return;
      grOpen = grOpen === it.id ? null : it.id; renderGroceries();
      const n = list.querySelector('.gr-row.open .gr-qin'); if (n && !it.qty) n.focus();
    });
    const sw = li.querySelector('[data-a=swap]');
    if (sw) sw.addEventListener('click', () => { it.text = cap(sw.dataset.to.split(/,| or /)[0].trim()); Object.assign(it, grocGuess(it.text) || { qty: null, unit: '', note: '', auto: false }); save(); renderGroceries(); });
    li.querySelector('[data-a=del]').addEventListener('click', () => {
      const i = state.grocery.indexOf(it);
      state.grocery.splice(i, 1); save(); renderGroceries();
      offerUndo('"' + it.text + '"', () => { state.grocery.splice(i, 0, it); save(); renderGroceries(); });
    });
    // the details editor
    const q = li.querySelector('.gr-qin');
    if (q) {
      q.value = it.qty || '';
      const setQ = v => { it.qty = v > 0 ? v : null; it.auto = false; q.value = it.qty || ''; save(); };
      q.addEventListener('change', () => setQ(Number(q.value) || 0));
      li.querySelector('[data-a=minus]').addEventListener('click', () => { setQ((it.qty || 0) - 1); renderGroceries(); });
      li.querySelector('[data-a=plus]').addEventListener('click', () => { if (!it.unit && COUNT_WORDS.test(it.text)) it.unit = 'pcs'; setQ((it.qty || 0) + 1); renderGroceries(); });
      li.querySelectorAll('[data-u]').forEach(b => b.addEventListener('click', () => { it.unit = it.unit === b.dataset.u ? '' : b.dataset.u; it.auto = false; save(); renderGroceries(); }));
      li.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => { it.size = it.size === b.dataset.size ? '' : b.dataset.size; save(); renderGroceries(); }));
      // a second amount, like 2 packs and 12 pieces
      const m2 = li.querySelector('[data-a=more2]');
      if (m2) m2.addEventListener('click', () => { grSecond = it.id; renderGroceries(); const n = list.querySelector('.gr-row.open .gr-qin2'); if (n) n.focus(); });
      const q2 = li.querySelector('.gr-qin2');
      if (q2) {
        q2.value = it.qty2 || '';
        q2.addEventListener('change', () => { const v = Number(q2.value) || 0; it.qty2 = v > 0 ? v : null; if (it.qty2 && !it.unit2) it.unit2 = 'pcs'; it.auto = false; save(); renderGroceries(); });
        li.querySelectorAll('[data-u2]').forEach(b => b.addEventListener('click', () => { it.unit2 = it.unit2 === b.dataset.u2 ? '' : b.dataset.u2; save(); renderGroceries(); }));
        li.querySelector('[data-a=x2]').addEventListener('click', () => { it.qty2 = null; it.unit2 = ''; grSecond = null; save(); renderGroceries(); });
      }
      const pin = li.querySelector('.gr-pin');
      pin.value = it.price > 0 ? it.price : '';
      pin.addEventListener('change', () => { const v = Number(pin.value) || 0; it.price = v > 0 ? v : null; if (v > 0) learnPrice(it, v); save(); renderGroceries(); });
      pin.addEventListener('keydown', e => { if (e.key === 'Enter') pin.blur(); });
      const tn = li.querySelector('.gr-tin');
      tn.value = it.text;
      const setT = () => { const v = tn.value.trim(); if (v && v !== it.text) { it.text = v; save(); } else tn.value = it.text; };
      tn.addEventListener('change', setT);
      tn.addEventListener('keydown', e => { if (e.key === 'Enter') { setT(); grOpen = null; renderGroceries(); } });
      const nt = li.querySelector('.gr-nin');
      nt.value = it.note || '';
      li.querySelector('[data-a=prep]').addEventListener('click', () => { grPrep = it.id; renderGroceries(); });
      li.querySelector('[data-a=type]').addEventListener('click', () => { grType = it.id; renderGroceries(); });
      li.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => { it.type = it.type === b.dataset.type ? '' : b.dataset.type; save(); renderGroceries(); }));
      const ty = li.querySelector('.gr-tyin');
      ty.value = it.type && !typesFor(it.text).includes(it.type) ? it.type : '';
      ty.addEventListener('change', () => { it.type = ty.value.trim(); save(); renderGroceries(); });
      ty.addEventListener('keydown', e => { if (e.key === 'Enter') ty.blur(); });
      nt.addEventListener('change', () => { it.note = nt.value.trim(); it.auto = false; save(); });
      nt.addEventListener('keydown', e => { if (e.key === 'Enter') { nt.blur(); grOpen = null; renderGroceries(); } });
      // tap ways to have it: each one on or off, the rest of your note stays
      li.querySelectorAll('[data-prep]').forEach(b => b.addEventListener('click', () => {
        const w = b.dataset.prep, on = b.classList.contains('on');
        const tidy = t => t.replace(/,\s*,/g, ',').replace(/^[\s,]+|[\s,]+$/g, '').trim();
        const ws = prepsFor(it.text);
        let note = tidy(nt.value.replace(prepRe(w), ''));
        // big and small cannot both be on
        if (!on && (w === 'big' || w === 'small')) note = tidy(note.replace(prepRe(w === 'big' ? 'small' : 'big'), ''));
        if (!on) {
          // keep them in the order shown: cleaned, chopped, ...
          const have = ws.filter(x => x === w || prepRe(x).test(note));
          let rest = note; for (const x of have) rest = tidy(rest.replace(prepRe(x), ''));
          const keep = have.map(x => x === w ? w : (nt.value.match(prepRe(x)) || [x])[0].replace(/,?\s*$/, ''));
          note = [keep.join(', '), rest].filter(Boolean).join(', ');
        }
        it.note = note; it.auto = false; save(); renderGroceries();
        if (!on && w === 'chopped' && MEAT_RE.test(it.text)) { const c = list.querySelector('.gr-row.open .gr-cut'); if (c) c.focus(); }
      }));
      const cut = li.querySelector('.gr-cut');
      if (cut) {
        cut.value = cutPieces(it) || '';
        cut.addEventListener('change', () => {
          const n = Math.max(0, Math.round(Number(cut.value) || 0));
          it.note = String(it.note || '').replace(/\bchopped( into \d+ pieces?)?/i, n ? 'chopped into ' + n + (n === 1 ? ' piece' : ' pieces') : 'chopped');
          save(); renderGroceries();
        });
      }
      li.querySelector('[data-a=close]').addEventListener('click', () => { setT(); it.note = nt.value.trim(); grOpen = null; save(); renderGroceries(); });
    }
  });
  const clr = list.querySelector('.gr-clear');
  if (clr) clr.addEventListener('click', () => {
    const before = state.grocery.slice();
    state.grocery = state.grocery.filter(x => !x.done); save(); renderGroceries();
    offerUndo('basket', () => { state.grocery = before; save(); renderGroceries(); });
  });

  // suggestions
  const box = document.getElementById('groc-suggest');
  const onList = { has: onGrocList };
  // once something for a gap is on your list, that gap is covered and goes
  const gaps = foodGaps().filter(gp => !gp.items.some(onGrocList)), rs = restockSoon().filter(x => !onGrocList(x.name));
  let top = '';
  if (gaps.length || rs.length) {
    top = '<div class="gr-sug"><div class="gr-sug-head"><b>From what you eat</b><span>last 2 weeks</span></div><ul>' +
      gaps.map(gp => { const pickIt = gp.items.find(n => !onList.has(n)) || gp.items[0];
        return '<li><div><b>' + esc(cap(pickIt)) + '</b><small>' + esc(gp.say) + '</small></div><button type="button" class="gr-plus" data-add="' + esc(pickIt) + '" aria-label="add ' + esc(pickIt) + '">+</button></li>'; }).join('') +
      rs.map(x => '<li><div><b>' + esc(cap(x.name)) + '</b><small>you buy it about every ' + x.days + ' days, last ' + x.since + ' days ago</small></div><button type="button" class="gr-plus" data-add="' + esc(x.name) + '" aria-label="add ' + esc(x.name) + '">+</button></li>').join('') +
      '</ul></div>';
  }
  const sg = grocerySuggestions();
  if (sg) {   // nothing twice: what is already suggested above stays out of the goal list
    const shown = new Set([...gaps.map(gp => gp.items.find(n => !onList.has(n)) || gp.items[0]), ...rs.map(x => x.name)]);
    sg.list = sg.list.filter(x => !shown.has(x.name));
  }
  if (!sg) {
    box.innerHTML = top + '<div class="gr-sug"><b>Suggestions</b><p class="gr-empty">Set a health goal on the Log tab and I will suggest foods that help.</p></div>';
    box.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => addGrocery(cap(b.dataset.add))));
    return;
  }
  if (!sg.list.length) { box.innerHTML = top; box.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => addGrocery(cap(b.dataset.add)))); return; }
  box.innerHTML = top + '<div class="gr-sug"><div class="gr-sug-head"><b>For your goal</b><span>' + sg.goal.e + ' ' + sg.goal.name + '</span></div>' +
    '<p class="gr-hint">' + esc(GOAL_HINT[sg.goal.k] || '') + '</p>' +
    '<ul>' + sg.list.map(x => '<li><div><b>' + esc(cap(x.name)) + '</b><small>' +
      (x.times ? 'you eat this · ' + x.times + '× this month' : 'new for you') + ' · ' + esc(x.why) +
      '</small></div><button type="button" class="gr-plus" data-add="' + esc(x.name) + '" aria-label="add ' + esc(x.name) + '">+</button></li>').join('') +
    '</ul></div>';
  box.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => addGrocery(cap(b.dataset.add))));
}

function addGrocery(text) {
  text = String(text || '').trim();
  if (!text) return;
  if (!state.grocery) state.grocery = [];
  // fill in how many and how you have it from your food log, when it knows
  const typed = parseGrocery(text);
  if (state.grocery.some(x => !x.done && x.text.toLowerCase() === typed.text.toLowerCase())) return;   // already on it
  const guess = grocGuess(typed.text) || {};
  const item = { id: Date.now() + '' + Math.random().toString(36).slice(2, 6), text: typed.text, done: false, at: Date.now(),
                 qty: null, unit: '', note: '', auto: false, ...guess };
  if (typed.qty !== null) { item.qty = typed.qty; item.unit = typed.unit; item.auto = false; }
  if (typed.note) { item.note = typed.note; item.auto = false; }
  state.grocery.push(item);
  save(); renderGroceries();
}

/* =========== meals: your week of breakfast, lunch and dinner ===========
   tap a meal to change it. it stays on this device. */
const MEAL_DAYS = [1, 2, 3, 4, 5, 6, 0];   // Monday first
const MEAL_SLOTS = [['b', 'Breakfast', '\u{1F305}'], ['l', 'Lunch', '\u2600\uFE0F'], ['d', 'Dinner', '\u{1F319}']];
let mealEdit = null;     // "day:slot" being typed in

function mealsFor(day) { if (!state.meals) state.meals = {}; return state.meals[day] || (state.meals[day] = { b: '', l: '', d: '' }); }
const tidyMeal = t => String(t || '').replace(/\s+/g, ' ').replace(/\s*\+\s*/g, ' + ').trim();

function renderMeals() {
  const box = document.getElementById('food-meals');
  const today = new Date().getDay();
  // a timetable: days down the side, breakfast, lunch and dinner across
  let html = '<div class="mt"><div class="mt-row mt-head"><span></span>' +
    MEAL_SLOTS.map(([k, name, e]) => '<span class="mt-h ' + k + '">' + e + '<i>' + name + '</i></span>').join('') + '</div>';
  for (const d of MEAL_DAYS) {
    const m = mealsFor(d);
    html += '<div class="mt-row' + (d === today ? ' today' : '') + '"><b class="mt-day">' + cap(FULL[d]).slice(0, 3) + '</b>' +
      MEAL_SLOTS.map(([k, name]) => '<button type="button" class="mt-cell ' + k + (mealEdit === d + ':' + k ? ' on' : '') + (m[k] ? '' : ' empty') + '" data-meal="' + d + ':' + k + '" aria-label="' + name + ' on ' + FULL[d] + ': ' + esc(m[k] || 'empty') + '">' +
        (m[k] ? esc(m[k]) : '+') + '</button>').join('') + '</div>';
    if (mealEdit && mealEdit.split(':')[0] === String(d)) {
      const k = mealEdit.split(':')[1], slot = MEAL_SLOTS.find(x => x[0] === k);
      html += '<div class="mt-edit"><label for="mt-in">' + cap(FULL[d]) + ' \u00b7 ' + slot[1] + '</label>' +
        '<input id="mt-in" type="text" class="ml-in" maxlength="80" placeholder="e.g. Oats + banana">' +
        '<div class="jr-acts"><button type="button" class="lf-btn main" data-mt="save">Save</button><button type="button" class="lf-btn" data-mt="cancel">Cancel</button></div></div>';
    }
  }
  box.innerHTML = html + '</div>';

  box.querySelectorAll('[data-meal]').forEach(b => b.addEventListener('click', () => { mealEdit = mealEdit === b.dataset.meal ? null : b.dataset.meal; renderMeals(); }));
  const inp = box.querySelector('#mt-in');
  if (inp) {
    const [d, k] = mealEdit.split(':');
    inp.value = mealsFor(d)[k] || '';
    const done = () => { mealsFor(d)[k] = tidyMeal(inp.value); mealEdit = null; save(); renderMeals(); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(); if (e.key === 'Escape') { mealEdit = null; renderMeals(); } });
    box.querySelector('[data-mt=save]').addEventListener('click', done);
    box.querySelector('[data-mt=cancel]').addEventListener('click', () => { mealEdit = null; renderMeals(); });
    setTimeout(() => inp.focus(), 20);
  }
}

function setFoodView(v) {
  foodView = v;
  document.querySelectorAll('[data-fv]').forEach(b => b.classList.toggle('on', b.dataset.fv === v));
  document.getElementById('food-groc').hidden = v !== 'groc';
  document.getElementById('food-logview').hidden = v !== 'log';
  document.getElementById('food-patview').hidden = v !== 'pat';
  document.getElementById('food-mealview').hidden = v !== 'meals';
  if (v === 'meals') renderMeals();
  if (v === 'groc') renderGroceries();
  if (v === 'pat') renderPatterns();
}

function renderFood() {
  const pick = document.getElementById('meal-pick');
  if (!pick.options.length) {
    for (const m of MEALS) pick.add(new Option(cap(m.k), m.k));
    pick.addEventListener('change', () => { mealPick = pick.value; mealChosen = true; paintMeal(); });
  }
  pick.value = mealPick;
  paintMeal();

  renderFoodLog();
  renderBodyNow();
  renderPlate();
  renderMonth();
  renderPatterns();
  renderQuick();
  renderPreview();
  fillHeads();
}

// how cannabis sits with your goal, where it matters
function cannabisVerdict(g, ks) {
  if (!ks.includes('cannabis')) return null;
  const say = { sleep: 'can make deep sleep lighter', focus: 'can slow your focus for hours',
                energy: 'may leave you drowsy later', muscle: 'can slow recovery if it cuts your sleep' };
  return say[g.k] ? ['watch', say[g.k]] : null;
}

function paintMeal() {
  const m = MEALS.find(x => x.k === mealPick) || MEALS[0];
  document.getElementById('meal-dot').style.background = m.c;
}

function addFood() {
  const input = document.getElementById('food-input');
  const what = input.value.trim();
  if (!what) return;
  // looking at an earlier day logs it on that day, at the current clock time
  const at = new Date();
  const fd = fromKey(foodDay);
  at.setFullYear(fd.getFullYear(), fd.getMonth(), fd.getDate());
  const id = Date.now() + '';
  state.food.unshift({ id, at: at.getTime(), what, meal: mealChosen ? mealPick : mealFor(what) });
  state.food.sort((a, b) => b.at - a.at);
  input.value = '';
  justLoggedId = id; mealChosen = false; mealPick = guessMeal();
  save();
  renderFood();
}

// one tap: the things you log most, plus water
function quickLog(what) {
  const at = new Date(); const fd = fromKey(foodDay);
  at.setFullYear(fd.getFullYear(), fd.getMonth(), fd.getDate());
  const id = Date.now() + '';
  state.food.unshift({ id, at: at.getTime(), what, meal: mealFor(what) });
  state.food.sort((a, b) => b.at - a.at);
  justLoggedId = id;
  save(); renderFood();
}

function renderQuick() {
  const box = document.getElementById('food-quick');
  const since = Date.now() - 30 * 86400000, tally = {}, shown = {};
  for (const f of state.food) {
    if (f.at < since) continue;
    const k = f.what.trim().toLowerCase();
    tally[k] = (tally[k] || 0) + 1; shown[k] = shown[k] || f.what.trim();
  }
  const top = Object.keys(tally).filter(k => k !== 'water').sort((a, b) => tally[b] - tally[a]).slice(0, 5);
  const items = ['water', ...top];
  box.innerHTML = items.map(k => {
    const ks = foodKinds(k);
    const e = ks.length ? KINDS[ks[0]].e + ' ' : '';
    return '<button type="button" data-q="' + esc(k) + '">' + e + esc(k === 'water' ? 'Water' : shown[k]) + '</button>';
  }).join('');
  box.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => {
    b.classList.add('pop');
    quickLog(b.dataset.q === 'water' ? 'water' : shown[b.dataset.q]);
  }));
}

// as you type: what it is, and what it means for your goal, before you add it
function renderPreview() {
  const box = document.getElementById('food-preview');
  const t = document.getElementById('food-input').value.trim();
  if (!t) { box.innerHTML = ''; box.classList.remove('on'); return; }
  const ks = foodKinds(t);
  if (!mealChosen) { mealPick = mealFor(t); const pk = document.getElementById('meal-pick'); pk.value = mealPick; paintMeal(); }
  const g = myGoal(), g2 = myGoal2(), f = { what: t, at: Date.now(), meal: mealPick };
  const v = g && ks.length ? (g.verdict(f, ks) || (g2 ? g2.verdict(f, ks) : null)) : null;
  box.innerHTML = (ks.length ? ks.map(k => '<span>' + KINDS[k].e + ' ' + KINDS[k].name + '</span>').join('') : '<span class="dim">Not sure what that is yet</span>') +
    (v ? '<span class="fd-v ' + v[0] + '">' + (v[0] === 'good' ? '\u2713 ' : '\u26A0 ') + esc(v[1]) + '</span>' : '');
  box.classList.add('on');
}

function renderFoodLog() {
  const log = document.getElementById('food-log');
  log.innerHTML = '';

  const t = todayKey();
  if (foodDay > t) foodDay = t;
  const isToday = foodDay === t;
  const fd = fromKey(foodDay);
  const yest = foodDay === shiftKey(t, -1);

  document.getElementById('food-title').innerHTML =
    (isToday ? 'Logged today' : yest ? 'Yesterday' : cap(FULL[fd.getDay()]) + ' ' + fd.getDate() + ' ' + cap(MONTHS[fd.getMonth()]));
  document.getElementById('food-next').disabled = isToday;
  document.getElementById('food-today').hidden = isToday;

  const mine = state.food.filter(f => key(new Date(f.at)) === foodDay);

  if (!mine.length) {
    log.innerHTML = '<p class="md-empty">Nothing logged ' +
      (isToday ? 'today yet.' : yest ? 'yesterday.' : 'this day.') + '</p>';
    return;
  }

let undoItem = null;
let undoTimer = null;

function offerUndo(label, restore) {
  undoItem = { label, restore };
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { undoItem = null; renderUndo(); }, 12000);
  renderUndo();
}

function renderUndo() {
  const slot = document.getElementById('undo');
  slot.innerHTML = '';
  if (!undoItem) return;

  const bar = document.createElement('div');
  bar.className = 'undo';

  const txt = document.createElement('span');
  txt.textContent = 'removed ' + undoItem.label;

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'undo';
  btn.addEventListener('click', () => {
    const fn = undoItem.restore;
    undoItem = null;
    clearTimeout(undoTimer);
    renderUndo();
    fn();
  });

  bar.append(txt, btn);
  slot.appendChild(bar);
}

/* ---- reading your notes ----
   "4s · 30kg×8r L, 30kg×10r L" -> 4 sets, each with weight, reps and level.
   s = sets, r = reps, L light, M medium, H hard. a time like 30s is a hold. */
const LEVELS = { L: ['light', '#7daf86'], M: ['medium', '#c9965a'], H: ['hard', '#d97a6c'] };

function parseSets(dt) {
  const segs = String(dt).split('·').map(x => x.trim()).filter(Boolean);
  const hi = segs.findIndex(x => /^\d+\s*s\b/.test(x));
  if (hi === -1) return { note: dt, sets: [] };
  const head = segs[hi].match(/^(\d+)\s*s(?:\s*[x×]\s*(\d+)\s*r)?\s*(.*)$/);
  let n = Number(head[1]);
  const baseReps = head[2] ? Number(head[2]) : null;
  const note = segs.slice(0, hi).join(' · ');
  const rest = [head[3], ...segs.slice(hi + 1)].filter(Boolean).join(' ');
  const pieces = rest ? rest.split(',').map(x => x.trim()).filter(Boolean) : [];

  const read = t => {
    const w = t.match(/(\d+\s*[x×]\s*\d+(?:\.\d+)?\s*kg|\d+(?:\.\d+)?\s*kg|\d+\s*p\b)/i);
    const tAfter = w ? t.replace(w[0], '') : t;
    const r = tAfter.match(/(\d+)\s*r\b/i);
    const hold = tAfter.match(/(\d+)\s*s\b/i);
    const lv = t.match(/\b([LMH])\b/);
    return { w: w ? w[0].replace(/\s+/g, '').replace('x', '×') : null,
             reps: r ? Number(r[1]) : (hold ? null : baseReps), hold: hold ? Number(hold[1]) : null,
             lv: lv ? lv[1] : null };
  };
  let list = pieces.map(read);
  if (!list.length) list = [{ w: null, reps: baseReps, hold: null, lv: null }];
  if (list.length === 1 && n > 1) list = Array.from({ length: n }, () => ({ ...list[0] }));
  // a level written once at the end ("15kg, 20kg M") applies to the ones before it
  for (let i = list.length - 1; i >= 0; i--) if (!list[i].lv) list[i].lv = (list.slice(i + 1).find(x => x.lv) || {}).lv || null;
  for (let i = 0; i < list.length; i++) if (!list[i].lv) list[i].lv = (list.slice(0, i).reverse().find(x => x.lv) || {}).lv || null;
  n = Math.max(n, list.length);
  while (list.length < n) list.push({ ...list[list.length - 1] });
  return { note, sets: list.slice(0, n) };
}

function kgOf(w) {
  if (!w || !/kg/i.test(w)) return 0;
  const two = w.match(/(\d+)×(\d+(?:\.\d+)?)kg/i);
  return two ? Number(two[1]) * Number(two[2]) : Number(w.replace(/kg/i, ''));
}

let restTimer = null;
function startRest(level, entry) {
  const secs = level === 'H' ? 120 : level === 'L' ? 60 : 90;
  stopRest();
  const el = document.createElement('div');
  el.id = 'restbar';
  el.innerHTML = '<div class="rb-in"><span class="rb-l">Rest</span><b class="rb-t"></b><i class="rb-bar"><u></u></i>' +
                 '<button type="button" class="rb-skip">Skip</button></div>' +
                 (entry ? '<div class="rb-feel"><span>How was that set?</span>' +
                   ['easy', 'right', 'hard'].map(f => '<button type="button" data-f="' + f + '">' + cap(f) + '</button>').join('') + '</div>' : '');
  document.body.appendChild(el);
  // how it felt is what the weight suggestions learn from
  el.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
    entry.feel = b.dataset.f; save();
    el.querySelector('.rb-feel').innerHTML = '<span>Noted: ' + b.dataset.f + '</span>';
  }));
  const end = Date.now() + secs * 1000;
  const tick = () => {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    el.querySelector('.rb-t').textContent = left ? Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : 'Go!';
    el.querySelector('.rb-bar u').style.width = (left / secs * 100) + '%';
    if (!left) {
      el.classList.add('go');
      try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch {}
      clearInterval(restTimer); restTimer = null;
      setTimeout(stopRest, 4000);
    }
  };
  tick();
  restTimer = setInterval(tick, 250);
  el.querySelector('.rb-skip').addEventListener('click', stopRest);
}

// weeks in a row (counting back from this week) with at least one session
function gymStreak() {
  const days = Object.keys(state.gym || {}).filter(k => (state.gym[k] || []).length);
  const monday = k => { const d = fromKey(k); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return key(d); };
  const weeks = new Set(days.map(monday));
  let w = monday(todayKey()), n = 0;
  if (!weeks.has(w)) w = shiftKey(w, -7);       // this week not started yet is fine
  while (weeks.has(w)) { n++; w = shiftKey(w, -7); }
  return n;
}

        st.w = v || null;
      });
      r.addEventListener('input', () => { const n = Number(r.value) || null; if (st.hold) st.hold = n; else st.reps = n; });
      row.querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', () => { st.lv = b.dataset.l; draw(); }));
      row.querySelector('.gy-er-x').addEventListener('click', () => { if (sets.length > 1) { sets.splice(i, 1); draw(); } });
      box.appendChild(row);
    });
    const foot = document.createElement('div');
    foot.className = 'gy-er-foot';
    foot.innerHTML = '<button type="button" class="lf-btn" data-a="add">+ Add a set</button><button type="button" class="lf-btn main" data-a="save">Save</button>';
    foot.querySelector('[data-a=add]').addEventListener('click', () => { sets.push({ ...sets[sets.length - 1] }); draw(); });
    foot.querySelector('[data-a=save]').addEventListener('click', () => {
      for (const st of sets) if (st.w && /^\d+(\.\d+)?$/.test(st.w)) st.w += 'kg';
      state.gymPlan[ex.id] = sets; setEdit = null; save(); renderGym();
    });
    box.appendChild(foot);
    const cancel = document.createElement('button');
    cancel.type = 'button'; cancel.className = 'gy-setedit'; cancel.textContent = 'Cancel';
    cancel.addEventListener('click', () => { setEdit = null; renderGym(); });
    box.appendChild(cancel);
  };
  draw();
  return box;
}

/* ---- weight suggestions ----
   "double progression", the usual way to get stronger safely:
   do every set in the rep range, then add reps, then add weight and start
   the reps again. how the sets felt decides how fast. your goal sets the
   rep range: strength 6 to 10, muscle 8 to 12, toning and endurance 12 to 15. */
function trainingMode() {
  const tp = state.trainProfile || {};
  if (/stronger/i.test(tp.goal || '')) return { k: 'strength', lo: 5, hi: 8, say: 'get stronger' };
  if (/muscle/i.test(tp.goal || '')) return { k: 'muscle', lo: 8, hi: 12, say: 'build muscle' };
  if (/fat|fitter|tone/i.test(tp.goal || '')) return { k: 'tone', lo: 12, hi: 15, say: tp.goal.toLowerCase() };
  const lifeIds = ((state.life || {}).health && areaGoals('health').map(g => g.m)) || [];
  if (state.goal === 'muscle' || state.goal2 === 'muscle' || lifeIds.includes('gym')) return { k: 'muscle', lo: 8, hi: 12, say: 'build muscle' };
  if (['lighter', 'energy'].includes(state.goal) || lifeIds.includes('move')) return { k: 'tone', lo: 12, hi: 15, say: 'tone and build stamina' };
  return { k: 'general', lo: 8, hi: 12, say: 'get stronger' };
}

// one step heavier: small jumps for small weights
function heavier(w) {
  if (!w) return null;
  let m = w.match(/^(\d+)×(\d+(?:\.\d+)?)kg$/i);
  if (m) { const each = Number(m[2]); return m[1] + '×' + (each + (each < 10 ? 1 : 2)) + 'kg'; }
  m = w.match(/^(\d+(?:\.\d+)?)kg$/i);
  if (m) { const kg = Number(m[1]); return (kg + (kg < 10 ? 1 : 2.5)) + 'kg'; }
  m = w.match(/^(\d+)p$/i);
  if (m) return (Number(m[1]) + 1) + 'p';
  return null;
}
function lighter(w) {
  if (!w) return null;
  const m = w.match(/^(\d+(?:\.\d+)?)kg$/i);
  if (m) { const kg = Math.max(1, Math.round(Number(m[1]) * 0.9 * 2) / 2); return kg + 'kg'; }
  const p = w.match(/^(\d+)p$/i);
  if (p) return Math.max(1, Number(p[1]) - 1) + 'p';
  return w;
}

function suggestFor(id, sets) {
  const today = todayKey();
  const past = (state.gymLog || []).filter(x => x.id === id && x.d < today);
  if (!past.length) return null;
  const last = past.reduce((a, x) => (x.d > a ? x.d : a), '');
  const done = past.filter(x => x.d === last);
  const when = cap(FULL[fromKey(last).getDay()]);
  const mode = trainingMode();
  const feels = done.map(x => x.feel).filter(Boolean);
  const easy = feels.filter(f => f === 'easy').length, hard = feels.filter(f => f === 'hard').length;
  const allDone = done.length >= sets.length;
  const holds = sets.some(st => st.hold);

  if (hard >= Math.max(1, Math.ceil(done.length / 2))) {
    const twice = past.filter(x => x.feel === 'hard').length >= done.length + 1;
    if (twice && !holds) {
      return { kind: 'down', title: 'Go a little lighter next time',
        why: 'It felt hard on ' + when + ' and the time before. A lighter weight with good form builds more than grinding.',
        sets: sets.map(st => ({ ...st, w: lighter(st.w) })) };
    }
    return { kind: 'stay', title: 'Stay at this weight',
      why: 'Most sets felt hard on ' + when + '. Own this weight first.', sets: null };
  }
  if (!allDone) {
    return { kind: 'stay', title: 'Stay at this weight',
      why: 'On ' + when + ' you did ' + done.length + ' of ' + sets.length + ' sets. Finish them all before going up.', sets: null };
  }
  if (holds) {
    return { kind: 'up', title: 'Hold 5 seconds longer',
      why: 'You did every set on ' + when + (easy ? ' and it felt easy.' : '.'), sets: sets.map(st => ({ ...st, hold: st.hold ? st.hold + 5 : st.hold })) };
  }
  const reps = Math.max(...sets.map(st => st.reps || 0));
  const canWeigh = sets.some(st => heavier(st.w));
  // easy, or already at the top of the range: add weight, reps back to the bottom
  if (canWeigh && (easy >= Math.ceil(done.length / 2) || reps >= mode.hi)) {
    const next = sets.map(st => ({ ...st, w: heavier(st.w) || st.w, reps: st.reps ? Math.max(mode.lo, Math.min(st.reps, mode.lo + 2)) : st.reps }));
    const top = next.find(st => st.w) || next[0];
    return { kind: 'up', title: 'Go up to ' + top.w + (top.reps ? ' × ' + top.reps : ''),
      why: (easy ? 'It felt easy on ' + when + '. ' : 'You hit ' + reps + ' reps on ' + when + ', the top of your range. ') +
           'To ' + mode.say + ', add weight and start the reps again at ' + top.reps + '.', sets: next };
  }
  // felt right: one more rep per set
  if (reps && reps < mode.hi) {
    return { kind: 'up', title: 'Add a rep to each set',
      why: 'Every set done on ' + when + '. To ' + mode.say + ', work up to ' + mode.hi + ' reps, then add weight.',
      sets: sets.map(st => ({ ...st, reps: st.reps ? Math.min(mode.hi, st.reps + 1) : st.reps })) };
  }
  return { kind: 'stay', title: 'Keep it as it is', why: 'Every set done on ' + when + '. Nice and steady.', sets: null };
}

/* ---- your routine, as data you can change ----
   workouts (like "Glutes + quads") hold exercises. each workout can be set
   to weekdays, so the app knows which one is today. the first time, it is
   built from the routine that used to be hard coded, keeping the same ids,
   so your ticks, edits and history all carry over. */
const WEEK = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function routine() {
  if (state.routine && Array.isArray(state.routine.workouts)) return state.routine;
  const dayNum = { mon: 1, wed: 3, fri: 5 };
  state.routine = { workouts: Object.keys(GYM).map(k => ({
    id: k, title: cap(GYM[k].title), days: [dayNum[k]], warmup: GYM[k].warmup || '',
    ex: GYM[k].groups.flatMap(g => g.items.map(it => ({ group: cap(g.name), nm: it.nm, dt: it.dt })))
                     .map((x, i) => ({ id: k + '-' + i, ...x }))
  })) };
  save();
  return state.routine;
}
const workoutById = id => routine().workouts.find(w => w.id === id) || null;

function todaysSession() {
  const d = new Date().getDay();
  const w = routine().workouts.find(x => (x.days || []).includes(d));
  return w ? w.id : null;
}

// the sets for an exercise: your edited plan, else your old notes, else 3 × 10
function setsFor(ex) {
  if (state.gymPlan && Array.isArray(state.gymPlan[ex.id]) && state.gymPlan[ex.id].length) return state.gymPlan[ex.id].map(x => ({ ...x }));
  const p = parseSets(gymValue(ex.id, 'dt', ex.dt || ''));
  return p.sets.length ? p.sets : [{ w: null, reps: 10, hold: null, lv: 'M' }, { w: null, reps: 10, hold: null, lv: 'M' }, { w: null, reps: 10, hold: null, lv: 'M' }];
}

function setSummary(sets) {
  const ws = sets.map(s => s.w).filter(Boolean);
  const reps = sets.map(s => s.hold ? s.hold + 's' : s.reps).filter(Boolean);
  const uniq = a => [...new Set(a)];
  const wTxt = !ws.length ? '' : uniq(ws).length === 1 ? ws[0] : ws[0] + ' to ' + ws[ws.length - 1];
  const rTxt = uniq(reps).length === 1 ? ' × ' + reps[0] : '';
  return sets.length + ' sets' + rTxt + (wTxt ? ' · ' + wTxt : '');
}

let gymWkEdit = false;      // editing the workout itself (name, days, remove)
let gymAdding = null;       // 'ex' or 'wk' while typing a new one

/* ---- make a plan for me ----
   standard questions a coach would ask. some are optional. the answers are
   saved as your training profile, which you can change any time and make a
   new plan from. Claude builds the plan when the laptop has a key; if not,
   built-in rules do, following the same guidance. */
const QUIZ = [
  { k: 'goal', q: 'What do you want most from the gym?', one: ['Build muscle', 'Get stronger', 'Lose fat', 'Fitter, more energy', 'Tone up'] },
  { k: 'level', q: 'How long have you been training?', one: ['New, under 6 months', 'Some, 6 months to 2 years', 'Experienced, over 2 years'] },
  { k: 'days', q: 'How many days a week can you train?', one: ['2', '3', '4', '5', '6'] },
  { k: 'time', q: 'How long is each session?', one: ['30 min', '45 min', '60 min', '90 min'] },
  { k: 'kit', q: 'What can you use?', one: ['A full gym', 'Dumbbells at home', 'Just my body'] },
  { k: 'focus', q: 'Any areas you want to focus on?', many: ['Glutes', 'Legs', 'Back', 'Chest', 'Shoulders', 'Arms', 'Core'], opt: true },
  { k: 'hurts', q: 'Anything that hurts or to be careful with?', many: ['Knees', 'Lower back', 'Shoulders', 'Wrists', 'Scoliosis'], opt: true },
  { k: 'about', q: 'About you', fields: [['age', 'Age', 'numeric'], ['sex', 'Sex', 'text'], ['height', 'Height (cm)', 'numeric'], ['weight', 'Weight (kg)', 'numeric']], opt: true }
];
let gymQuiz = null;      // { i: question index, ans, back: return to profile }
let gymPreview = null;   // { plan, source, busy }

function trainProfile() { return state.trainProfile || null; }

// the built-in coach: same rules a coach would use, no AI needed
const EXPOOL = {
  gym: { squat: 'Leg press', squatH: 'Back squat', hinge: 'Romanian deadlift', lunge: 'Walking lunge', glute: 'Hip thrust', glute2: 'Cable kickback',
         pushH: 'Dumbbell bench press', pushV: 'Seated dumbbell shoulder press', pullH: 'Seated cable row', pullV: 'Lat pulldown',
         biceps: 'Bicep curl', triceps: 'Tricep pushdown', side: 'Lateral raise', core: 'Dead bug', core2: 'Plank', calves: 'Calf raise', splank: 'Side plank' },
  db:  { squat: 'Goblet squat', squatH: 'Goblet squat', hinge: 'Dumbbell Romanian deadlift', lunge: 'Reverse lunge', glute: 'Dumbbell hip thrust', glute2: 'Single leg glute bridge',
         pushH: 'Dumbbell floor press', pushV: 'Dumbbell shoulder press', pullH: 'One arm dumbbell row', pullV: 'Dumbbell pullover',
         biceps: 'Dumbbell curl', triceps: 'Overhead tricep extension', side: 'Lateral raise', core: 'Dead bug', core2: 'Plank', calves: 'Calf raise', splank: 'Side plank' },
  body:{ squat: 'Bodyweight squat', squatH: 'Split squat', hinge: 'Single leg hip hinge', lunge: 'Reverse lunge', glute: 'Glute bridge', glute2: 'Donkey kick',
         pushH: 'Push up', pushV: 'Pike push up', pullH: 'Table row', pullV: 'Superman',
         biceps: 'Towel curl', triceps: 'Bench dip', side: 'Side plank', core: 'Dead bug', core2: 'Plank', calves: 'Calf raise', splank: 'Side plank' }
};
const TEMPLATES = {
  fullA: ['squatH', 'pushH', 'pullV', 'hinge', 'glute', 'core', 'side'],
  fullB: ['hinge', 'pushV', 'pullH', 'lunge', 'core2', 'biceps', 'triceps'],
  fullC: ['glute', 'pushH', 'pullH', 'squat', 'core', 'glute2', 'calves'],
  upper: ['pushH', 'pullH', 'pushV', 'pullV', 'side', 'biceps', 'triceps'],
  lower: ['squatH', 'hinge', 'glute', 'lunge', 'core', 'calves', 'glute2'],
  upper2: ['pushV', 'pullV', 'pushH', 'pullH', 'triceps', 'biceps', 'side'],
  lower2: ['hinge', 'squat', 'glute2', 'lunge', 'core2', 'glute', 'calves']
};
const AREA_OF = { squat: 'Legs', squatH: 'Legs', lunge: 'Legs', calves: 'Legs', hinge: 'Back', glute: 'Glutes', glute2: 'Glutes', pushH: 'Chest', pushV: 'Shoulders',
                  side: 'Shoulders', pullH: 'Back', pullV: 'Back', biceps: 'Arms', triceps: 'Arms', core: 'Core', core2: 'Core' };

function rulePlan(a) {
  const kit = /gym/i.test(a.kit) ? 'gym' : /dumbbell/i.test(a.kit) ? 'db' : 'body';
  const P = EXPOOL[kit];
  const days = Number(a.days) || 3;
  const per = { 30: 4, 45: 5, 60: 6, 90: 7 }[parseInt(a.time, 10)] || 5;
  const lvl = /new/i.test(a.level) ? 0 : /experienced/i.test(a.level) ? 2 : 1;
  const goal = a.goal || 'Get stronger';
  const reps = /stronger/i.test(goal) ? 6 : /muscle/i.test(goal) ? 10 : /fat|fitter/i.test(goal) ? 12 : 12;
  const sets = /stronger/i.test(goal) && lvl ? 4 : lvl === 0 ? 2 : 3;
  const hurts = [].concat(a.hurts || []), focus = [].concat(a.focus || []);
  const plan = days <= 2 ? ['fullA', 'fullB'] : days === 3 ? ['fullA', 'fullB', 'fullC'] : days === 4 ? ['upper', 'lower', 'upper', 'lower'] :
               days === 5 ? ['upper', 'lower', 'fullA', 'upper', 'lower'] : ['upper', 'lower', 'fullA', 'upper', 'lower', 'fullB'];
  const dayMap = { 2: [1, 4], 3: [1, 3, 5], 4: [1, 2, 4, 5], 5: [1, 2, 3, 4, 5], 6: [1, 2, 3, 4, 5, 6] }[Math.min(6, Math.max(2, days))];
  const names = { fullA: 'Full body A', fullB: 'Full body B', fullC: 'Full body C', upper: 'Upper body', lower: 'Lower body' };
  // swaps for things that hurt
  const safe = slot => {
    if (hurts.includes('Knees') && ['lunge', 'squatH'].includes(slot)) return slot === 'lunge' ? 'glute2' : 'squat';
    if ((hurts.includes('Lower back') || hurts.includes('Scoliosis')) && slot === 'hinge') return 'glute';
    if (hurts.includes('Shoulders') && slot === 'pushV') return 'side';
    if (hurts.includes('Wrists') && kit === 'body' && slot === 'pushH') return 'core2';
    return slot;
  };
  const count = {};
  const workouts = plan.map((t, wi) => {
    const seen = plan.slice(0, wi).filter(x => x === t).length;   // the second upper or lower day uses a different order
    let slots = TEMPLATES[seen && TEMPLATES[t + '2'] ? t + '2' : t].map(safe);
    // focus areas move up the list so they are kept in shorter sessions
    const big2 = slots.slice(0, 2), rest = slots.slice(2);   // keep the two big lifts first, then focus areas
    rest.sort((x, y) => (focus.includes(AREA_OF[y]) ? 1 : 0) - (focus.includes(AREA_OF[x]) ? 1 : 0));
    slots = [...big2, ...rest];
    if (focus.includes('Glutes') && t !== 'upper' && !slots.slice(0, per).includes('glute')) slots.splice(1, 0, 'glute');
    if (hurts.includes('Scoliosis')) slots.splice(Math.min(per - 1, slots.length), 0, 'splank');
    slots = [...new Set(slots)].slice(0, per);
    const n = (count[t] = (count[t] || 0) + 1);
    return {
      title: names[t] + (plan.filter(x => x === t).length > 1 ? ' ' + n : ''),
      days: [dayMap[wi]].filter(d => d !== undefined),
      warmup: t === 'upper' ? '5 min easy cardio. Arm circles, band pull aparts, 10 light push ups.' :
              '5 min easy cardio. Leg swings, hip circles, 10 bodyweight squats, 10 glute bridges.',
      exercises: slots.map((sl, i) => {
        const hold = ['core2', 'side', 'splank'].includes(sl) && /plank/i.test(P[sl]) ? 30 + lvl * 10 : 0;
        const big = i < 2 && !['core', 'core2', 'side', 'splank'].includes(sl);
        return { name: P[sl], sets: big ? sets : Math.max(2, sets - (lvl === 0 ? 0 : 1)), reps: hold ? 0 : (big ? reps : reps + 2), hold,
                 level: big ? (lvl === 2 && /stronger|muscle/i.test(goal) ? 'H' : 'M') : 'L' };
      })
    };
  });
  return { why: 'Built from your answers: ' + days + ' days a week, about ' + per + ' exercises a session, ' +
                (reps <= 6 ? 'heavier sets of ' + reps + ' for strength.' : 'sets of ' + reps + ' to ' + (reps + 2) + ' reps for your goal.') +
                (hurts.length ? ' Moves that load your ' + hurts.join(' and ').toLowerCase() + ' are swapped out.' : ''),
           workouts };
}

async function makePlan(a) {
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 90000);
    const r = await aiFetch('/api/plan', { answers: a }, ctl.signal);
    clearTimeout(timer);
    if (r.ok) { const out = await r.json(); if (out && Array.isArray(out.workouts) && out.workouts.length) return { plan: out, source: 'ai' }; }
  } catch {}
  return { plan: rulePlan(a), source: 'rules' };
}

function applyPlan(plan, replace) {
  const R = routine();
  const made = plan.workouts.map((w, wi) => {
    const id = 'w' + Date.now() + wi;
    return { id, title: w.title, days: w.days || [], warmup: w.warmup || '',
             ex: w.exercises.map((e, ei) => {
               const eid = id + '-' + ei;
               state.gymPlan[eid] = Array.from({ length: e.sets }, () => ({ w: null, reps: e.hold ? null : e.reps || 10, hold: e.hold || null, lv: e.level || 'M' }));
               return { id: eid, nm: e.name, dt: '' };
             }) };
  });
  if (replace) R.workouts = made;
  else {
    // a weekday belongs to one workout: the new ones win
    const taken = new Set(made.flatMap(w => w.days));
    R.workouts.forEach(w => { w.days = (w.days || []).filter(d => !taken.has(d)); });
    R.workouts.push(...made);
  }
  gymDay = made[0] && made[0].id;
  save();
}

// one question at a time
function quizView(body) {
  const st = gymQuiz, Q = QUIZ[st.i], a = st.ans;
  const wrap = document.createElement('div');
  wrap.className = 'qz';
  let inner = '<span class="qz-step">' + (st.i + 1) + ' of ' + QUIZ.length + (Q.opt ? ' · optional' : '') + '</span><h2 class="qz-q">' + Q.q + '</h2>';
  if (Q.one) inner += '<div class="qz-opts">' + Q.one.map(o => '<button type="button" class="' + (a[Q.k] === o ? 'on' : '') + '" data-o="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
  if (Q.many) inner += '<div class="qz-opts many">' + Q.many.map(o => '<button type="button" class="' + ((a[Q.k] || []).includes(o) ? 'on' : '') + '" data-m="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
  if (Q.fields) inner += '<div class="qz-fields">' + Q.fields.map(([k, l, mode]) => '<label>' + l + '<input type="' + (mode === 'numeric' ? 'number' : 'text') + '" inputmode="' + mode + '" data-f="' + k + '"></label>').join('') + '</div>';
  const last = st.i === QUIZ.length - 1;
  inner += '<div class="qz-nav"><button type="button" class="gm-link" data-a="back">' + (st.i ? 'Back' : 'Cancel') + '</button>' +
           (Q.one ? '' : '<button type="button" class="lf-btn main" data-a="next">' + (last ? 'Make my plan' : Q.opt ? 'Next' : 'Next') + '</button>') +
           (Q.opt && !last ? '<button type="button" class="gm-link" data-a="skip">Skip</button>' : '') + '</div>';
  wrap.innerHTML = inner;
  if (Q.fields) wrap.querySelectorAll('[data-f]').forEach(i => { i.value = (a.about || {})[i.dataset.f] || ''; });
  const save2 = () => { state.trainProfile = { ...a }; save(); };
  const go = d => {
    if (Q.fields) { a.about = {}; wrap.querySelectorAll('[data-f]').forEach(i => { if (i.value.trim()) a.about[i.dataset.f] = i.value.trim(); }); }
    save2();
    if (st.back && d > 0) { gymQuiz = null; gymProfile = true; renderGym(); return; }   // editing one answer from the profile
    if (d > 0 && last) { finishQuiz(); return; }
    st.i += d;
    if (st.i < 0) { gymQuiz = null; }
    renderGym();
  };
  wrap.querySelectorAll('[data-o]').forEach(b => b.addEventListener('click', () => { a[Q.k] = b.dataset.o; go(1); }));
  wrap.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => {
    const L = new Set(a[Q.k] || []); L.has(b.dataset.m) ? L.delete(b.dataset.m) : L.add(b.dataset.m); a[Q.k] = [...L]; save2(); renderGym();
  }));
  const nx = wrap.querySelector('[data-a=next]'); if (nx) nx.addEventListener('click', () => go(1));
  wrap.querySelector('[data-a=back]').addEventListener('click', () => { if (st.back) { gymQuiz = null; gymProfile = true; renderGym(); } else go(-1); });
  const sk = wrap.querySelector('[data-a=skip]'); if (sk) sk.addEventListener('click', () => { delete a[Q.k]; go(1); });
  body.appendChild(wrap);
}

async function finishQuiz() {
  const a = { ...gymQuiz.ans };
  const flat = { goal: a.goal, experience: a.level, days_per_week: a.days, session_length: a.time, equipment: a.kit,
                 focus: a.focus, careful_with: a.hurts, ...(a.about || {}) };
