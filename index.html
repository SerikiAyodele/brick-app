#view-home .hm-nudge { border: none; box-shadow: 0 1px 0 var(--hair), 0 6px 16px -12px rgba(59, 45, 37, .35); }
.hm-sec { margin: 24px 4px 10px; font-size: 13px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
#view-home .hm-goals { margin-top: 10px; padding: 18px 20px; border: none; border-radius: 24px; background: var(--card); box-shadow: 0 1px 0 var(--hair), 0 10px 24px -16px rgba(59, 45, 37, .35); }
.hm-gt { flex: 1; display: flex; flex-direction: column; }
.hm-gbars { display: flex; align-items: flex-end; gap: 5px; height: 34px; }
.hm-gbars i { position: relative; width: 8px; height: 100%; border-radius: 4px; background: color-mix(in srgb, var(--c) 22%, var(--card)); overflow: hidden; }
.hm-gbars u { position: absolute; left: 0; right: 0; bottom: 0; background: var(--c); border-radius: 4px; }
#view-home .hm-areas { gap: 12px; margin-top: 0; }
#view-home .hm-area { position: relative; overflow: hidden; gap: 0; min-height: 150px; padding: 16px; border-radius: 26px;
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 26%, var(--card)), color-mix(in srgb, var(--c) 8%, var(--card))); transition: transform .15s; }
#view-home .hm-area:active { transform: scale(.97); }
.hm-ae { display: grid; place-items: center; width: 40px; height: 40px; margin-bottom: auto; font-size: 20px; background: color-mix(in srgb, #fff 70%, transparent); border-radius: 14px; }
.hm-an { margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
#view-home .hm-area em { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: normal; font-size: 24px; font-weight: 600; letter-spacing: -.4px; line-height: 1.2; color: var(--ink); }
#view-home .hm-area em i { font-style: normal; font-size: 14px; font-weight: 500; color: var(--muted); }
#view-home .hm-area small { font-size: 12px; color: var(--muted); }

/* goals */
.hm-goals { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 22px; padding: 16px 18px; text-align: left; font-family: "Poppins", sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--hair); border-radius: 22px; cursor: pointer; }
.hm-goals > span:first-child { flex: 1; display: flex; flex-direction: column; }
.hm-goals b { font-size: 17px; font-weight: 600; }
.hm-goals small { font-size: 13px; color: var(--muted); }
.hm-gdots { display: flex; gap: 5px; }
.hm-gdots i { width: 10px; height: 10px; border-radius: 50%; background: color-mix(in srgb, var(--c) 25%, var(--card)); }
.hm-gdots i.on { background: var(--c); }
.hm-goals s { text-decoration: none; font-size: 20px; color: var(--muted); }
.hm-areas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.hm-area { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 104px; padding: 14px; text-align: left; font-family: "Poppins", sans-serif; color: var(--ink); background: color-mix(in srgb, var(--c) 13%, var(--card)); border: none; border-radius: 22px; cursor: pointer; }
.hm-area i { font-style: normal; font-size: 22px; margin-bottom: 6px; }
.hm-area b { font-size: 16px; font-weight: 600; }
.hm-area small { font-size: 11px; color: var(--muted); line-height: 1.35; }
.gl-tabs { margin: 4px 0 14px; }
.gl-tabs .md-seg-b { font-size: 13px; }
.gl-list { display: flex; flex-direction: column; gap: 10px; }
.gl-area { padding: 14px; background: var(--card); border: 1px solid var(--hair); border-left: 4px solid var(--c); border-radius: 18px; }
.gl-ah { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.gl-ah i { font-style: normal; font-size: 16px; }
.gl-ah b { font-size: 14px; font-weight: 600; }
.gl-row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 4px 0; text-align: left; font-family: "Poppins", sans-serif; color: var(--ink); background: none; border: none; cursor: pointer; }
.gl-row small { flex: none; font-size: 12px; color: var(--muted); }
.gl-t { flex: 1; min-width: 0; font: 400 15px "Poppins", sans-serif; color: var(--ink); text-align: left; background: none; border: none; padding: 0; cursor: pointer; }
.gl-t.done { color: var(--muted); text-decoration: line-through; }
.gl-tick { flex: none; width: 34px; height: 34px; font-size: 15px; color: transparent; background: none; border: 2px solid var(--c); border-radius: 50%; cursor: pointer; }
.gl-tick.on { color: #fff; background: var(--c); }
.gl-add { width: 100%; min-height: 40px; padding: 0; text-align: left; font: 500 14px "Poppins", sans-serif; color: var(--muted); background: none; border: none; cursor: pointer; }
.gl-in { width: 100%; font: 400 16px "Poppins", sans-serif; padding: 10px 12px; border-radius: 12px; }
.gl-big { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; width: 100%; padding: 0; text-align: left; font-family: "Poppins", sans-serif; color: var(--ink); background: none; border: none; cursor: pointer; }
.gl-big small { width: 100%; font-size: 12px; color: var(--muted); }
.gl-bar { display: block; width: 100%; height: 6px; background: var(--hair); border-radius: 3px; overflow: hidden; }
.gl-bar u { display: block; height: 100%; background: var(--c); border-radius: 3px; }
.gl-why { margin: 14px 4px 0; font-size: 12px; color: var(--muted); line-height: 1.45; }

/* people */
.pp-hero { display: flex; flex-direction: column; gap: 2px; padding: 18px; background: color-mix(in srgb, #e38fa8 18%, var(--card)); border: 1px solid var(--hair); border-radius: 22px; }
.pp-hero span { font-size: 13px; font-weight: 600; color: var(--muted); }
.pp-hero b { font-size: 30px; font-weight: 600; line-height: 1.15; }
.pp-hero small { font-size: 13px; color: var(--muted); line-height: 1.4; }
.pp-hero.ok { background: color-mix(in srgb, #7daf86 16%, var(--card)); }
.pp-list { list-style: none; margin: 14px 0 0; padding: 0; background: var(--card); border: 1px solid var(--hair); border-radius: 20px; overflow: hidden; }
.pp-list:empty { display: none; }
.pp-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; }
.pp-list li + li { border-top: 1px solid var(--hair); }
.pp-who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0; text-align: left; font-family: "Poppins", sans-serif; color: var(--ink); background: none; border: none; cursor: pointer; }
.pp-who i { flex: none; display: grid; place-items: center; width: 40px; height: 40px; font-style: normal; font-weight: 600; color: #fff; background: #e38fa8; border-radius: 50%; }
.pp-list li:not(.due) .pp-who i { background: color-mix(in srgb, #e38fa8 40%, var(--card)); }
.pp-who span { min-width: 0; display: flex; flex-direction: column; }
.pp-who b { font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pp-who small { font-size: 12px; color: var(--muted); }
.pp-list li.due .pp-who small { color: #c25a7c; }
.pp-hi { flex: none; min-width: 74px; min-height: 40px; padding: 0 14px; font: 500 13px "Poppins", sans-serif; color: var(--ink); background: var(--hair); border: none; border-radius: 20px; cursor: pointer; }
.pp-list li.due .pp-hi { color: #fff; background: #e38fa8; }
.pp-ed { flex-direction: column; align-items: stretch !important; gap: 10px !important; padding: 14px !important; background: color-mix(in srgb, var(--pink) 6%, var(--card)); }
.pp-ed input, .pp-add input { width: 100%; font: 400 16px "Poppins", sans-serif; padding: 11px 12px; border-radius: 12px; }
.pp-every { display: flex; gap: 6px; }
.pp-every button { flex: 1; min-height: 40px; font: 500 12px "Poppins", sans-serif; color: var(--ink); background: var(--hair); border: none; border-radius: 12px; cursor: pointer; }
.pp-every button.on { color: #fff; background: #e38fa8; }
.pp-add { margin-top: 12px; }
/* home: one next step */
.hm-nudge { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 10px; padding: 12px 14px; text-align: left; font-family: "Poppins", sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--hair); border-radius: 18px; cursor: pointer; }
.hm-nudge i { flex: none; display: grid; place-items: center; width: 38px; height: 38px; font-style: normal; font-size: 19px; background: var(--hair); border-radius: 12px; }
.hm-nudge span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hm-nudge b { font-size: 15px; font-weight: 600; }
.hm-nudge small { font-size: 12px; color: var(--muted); }
.hm-nudge s { text-decoration: none; font-size: 20px; color: var(--muted); }

/* stats cards */
#stats-body { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.st-card { padding: 18px; background: var(--card); border: 1px solid var(--hair); border-radius: 20px; }
.st-name { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
.st-name::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.st-big { display: block; margin-top: 10px; font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.st-big i { font-style: normal; font-size: 17px; font-weight: 500; color: var(--muted); }
.st-explain { margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
.st-explain b { color: var(--ink); font-weight: 600; }
.st-bars { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.st-bars div { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-size: 15px; }
.st-bars b { font-weight: 600; font-variant-numeric: tabular-nums; }
.st-bars i { display: block; height: 6px; background: var(--hair); border-radius: 3px; overflow: hidden; }
.st-bars u { display: block; height: 100%; background: var(--c); border-radius: 3px; }

/* a soft dot grid behind everything, cards sit on top of it */
body, body[data-view] {
  background-image: radial-gradient(color-mix(in srgb, var(--muted) 30%, transparent) 1px, transparent 1.4px);
  background-size: 22px 22px;
  background-position: 11px 11px;
  background-attachment: fixed;
  background-repeat: repeat !important;
}

/* plan rows: more room for the name */
#view-day .line { gap: 8px; }
#view-day .line .at { width: 58px; }
#view-day .chipslot { width: 34px; }
#view-day .line .how { width: 48px; }
#view-day .line .how.live { width: 58px; min-width: 58px; }
#view-day .line .bin { width: 24px; }
#view-day .sheet:not(:has(.addlist)) .chipslot { display: none; }   /* no chips that day: no empty column */
#view-day .line-extra, #view-day .lp3 { padding-left: 66px; }

/* mood journey */
.mjs { display: flex; align-items: flex-start; justify-content: center; gap: 0; margin-top: 10px; }
.mj { flex: none; width: 86px; display: flex; flex-direction: column; align-items: center; gap: 4px; }

.mj-line { flex: 1; height: 2px; margin-top: 27px; background: linear-gradient(90deg, var(--hair), color-mix(in srgb, var(--pink) 50%, var(--hair)), var(--hair)); border-radius: 1px; }
.mjs .mj.now + .mj-line, .mjs .mj-line:has(+ .mj.now) { margin-top: 34px; }

/* colour back in: tints that work in light and dark */
.lf-tile:not(.empty) { background: linear-gradient(155deg, color-mix(in srgb, var(--c) 38%, var(--card)), color-mix(in srgb, var(--c) 8%, var(--card)) 80%) !important; border-color: color-mix(in srgb, var(--c) 30%, var(--hair)) !important; }
.hm-now { background: linear-gradient(150deg, color-mix(in srgb, var(--pink) 34%, var(--card)), color-mix(in srgb, #f0b48c 12%, var(--card)) 85%) !important; border-color: color-mix(in srgb, var(--pink) 30%, var(--hair)) !important; }
.hq.room { background: color-mix(in srgb, #5aa832 30%, var(--card)); }
.hq { white-space: nowrap; }
.hq:not(.room):not(.due):not(.quiet) { background: color-mix(in srgb, #8b6cf6 28%, var(--card)); border-color: color-mix(in srgb, #8b6cf6 30%, var(--hair)); }
.hq.due { background: color-mix(in srgb, var(--pink) 34%, var(--card)); }
#view-day .nowcard:not(.past) { background: linear-gradient(150deg, color-mix(in srgb, var(--pink) 18%, var(--card)), var(--card) 75%) !important; }
.fh { background: linear-gradient(160deg, color-mix(in srgb, #8b6cf6 24%, var(--card)), color-mix(in srgb, var(--pink) 10%, var(--card)) 80%) !important; }
.tabs .brick:not(.flat) { background: color-mix(in srgb, var(--pink) 28%, var(--card)); }

/* wallet: one Notion style table, in pink */
.nt { margin: 14px 0 8px; }
.nt-title { display: flex; align-items: baseline; gap: 8px; font: 600 20px var(--display); margin: 0 2px 8px; }
.nt-title small { font: 500 13px var(--display); color: var(--pink-d); background: var(--pink-s); padding: 1px 8px; border-radius: 10px; }
.nt-ic { color: var(--pink); font-size: 18px; }
.nt-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid color-mix(in srgb, var(--pink) 30%, var(--hair)); border-radius: 12px; background: var(--card); }
.mn-lines2.nt-t { list-style: none; margin: 0; padding: 0; min-width: 330px; display: block; }
.nt-t > li { display: grid; grid-template-columns: minmax(96px, 1.25fr) repeat(3, minmax(74px, 1fr)); align-items: center; min-height: 42px;
  border-bottom: 1px solid color-mix(in srgb, var(--pink) 16%, var(--hair)); padding: 0; margin: 0; background: none; border-radius: 0; box-shadow: none; }
.nt-t > li > span { padding: 8px 7px; border-right: 1px solid color-mix(in srgb, var(--pink) 16%, var(--hair)); min-width: 0; }
.nt-t > li > span:last-child { border-right: 0; }
.nt-t > li.nt-h { min-height: 36px; background: var(--pink-s); color: var(--pink-d); font: 500 13px var(--display); }
.nt-t > li.nt-r { cursor: pointer; font-size: 15px; }
.nt-t > li.nt-r:active { background: color-mix(in srgb, var(--pink) 10%, var(--card)); }
.nt-n { display: flex; flex-direction: column; overflow: hidden; }
.nt-n .nm { overflow-wrap: anywhere; line-height: 1.3; font-weight: 500; }
.nt-n em { font-style: normal; font-size: 11px; color: var(--pink-d); }
.nt-num { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
.nt-t > li.over .nt-num:nth-child(3) { color: var(--pink-d); font-weight: 600; }
.nt-t > li.nt-new { display: block; padding: 0 12px; line-height: 42px; color: var(--muted); font-size: 14px; cursor: pointer; }
.nt-t > li.nt-f { background: color-mix(in srgb, var(--pink-s) 60%, var(--card)); font-weight: 600; border-bottom: 0; }
.nt-t > li.nt-f > span:first-child { font: 500 13px var(--display); color: var(--pink-d); }
.mn-lines2.nt-t > li.ed { display: block; padding: 12px; }
:root[data-theme="dark"] .nt-t > li.nt-h, :root[data-theme="dark"] .nt-title small { color: var(--pink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nt-t > li.nt-h, :root:not([data-theme="light"]) .nt-title small { color: var(--pink); } }

/* chat with Claude */
.ch-log { display: flex; flex-direction: column; gap: 10px; margin: 8px 0 14px; }
.ch-empty { color: var(--muted); font-size: 15px; line-height: 1.5; padding: 18px 16px; background: var(--card); border: 1px solid var(--hair); border-radius: 16px; }
.ch-msg { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 16px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.ch-msg.me { align-self: flex-end; background: var(--pink-s); color: var(--ink); border-bottom-right-radius: 6px; }
.ch-msg.ai { align-self: flex-start; background: var(--card); border: 1px solid var(--hair); border-bottom-left-radius: 6px; }
.ch-msg.wait { color: var(--muted); }
.ch-msg.err { align-self: flex-start; color: var(--muted); font-size: 14px; background: none; padding: 2px 4px; }
.ch-form { position: sticky; bottom: 84px; display: flex; gap: 8px; align-items: flex-end; padding: 8px; background: var(--card); border: 1px solid var(--hair); border-radius: 22px; }
.ch-form textarea { flex: 1; min-height: 40px; max-height: 140px; resize: none; border: 0; background: transparent; color: var(--ink); font: 16px/1.4 var(--display); padding: 9px 8px; outline: none; }
.ch-form button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 18px; background: var(--pink); color: #fff; font: 600 15px var(--display); cursor: pointer; }

.ch-clear { display: block; margin: 14px auto 0; min-height: 40px; padding: 0 14px; border: 0; background: none; color: var(--muted); font: 14px var(--display); text-decoration: underline; cursor: pointer; }

/* home, more colour (still minimal): berry Now card, a colour per quick
   button, a soft rainbow on Goals, bolder area tiles */
#view-home .hm-now { background: linear-gradient(145deg, #c0607c 0%, #9a4f74 52%, #634a7a 100%) !important;

/* plan: day or week */
.pl-seg { margin: 6px 0 14px; }
#view-day.wk > :not(.pl-seg):not(#week-body):not(.hubback) { display: none !important; }
.wk-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 12px; }
.wk-head b { font-size: 20px; font-weight: 600; }
.wk-head small { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; }
.wk-head > div:first-child { min-width: 0; }
.wk-nav { display: flex; gap: 6px; }
.wk-nav button { min-width: 40px; min-height: 40px; padding: 0 10px; font: 500 14px var(--display); color: var(--ink); background: var(--card); border: 1px solid var(--hair); border-radius: 20px; cursor: pointer; }

.wk-scroll::-webkit-scrollbar { display: none; }
.wk-cal { position: relative; display: grid; grid-template-columns: 44px repeat(7, var(--dw, 112px)); gap: 0 6px; width: max-content; padding: 10px 12px 12px 0; background: var(--card); border: 1px solid var(--hair); border-radius: 20px; }

/* room at the bottom so the last cards can scroll clear of the tab bar and the Now pill */
.wrap { padding-bottom: calc(160px + env(safe-area-inset-bottom, 0px)) !important; }

.ns-grow { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--hair); }
.ns-grow .ns-row { flex: 1; min-width: 0; border-bottom: 0 !important; }
.ns-gedit { flex: none; min-width: 56px; min-height: 40px; padding: 0 12px; font: 500 14px var(--display); color: var(--muted); background: var(--paper); border: 1px solid var(--hair); border-radius: 20px; cursor: pointer; }
.ns-gtype { width: 100%; padding: 8px 0; }

/* ============ MONO: minimal and professional, black and white ============
   this block wins over everything above it. no stickers, no pastels, no tilts. */
:root, :root[data-theme="light"] {
  --paper: #ffffff; --card: #ffffff; --ink: #111111; --muted: #6e6e6e; --shade: #e9e9e9; --slot: #f4f4f4;
  --hair: #e6e6e6; --dash: #d4d4d4; --hover: #f5f5f5; --grid: transparent;
  --pink: #e0789a; --pink-d: #c2557a; --pink-s: #fde8ef;
}
:root[data-theme="dark"] {
  --paper: #000000; --card: #111111; --ink: #f5f5f5; --muted: #9a9a9a; --shade: #222222; --slot: #1a1a1a;
  --hair: #262626; --dash: #333333; --hover: #1a1a1a;
  --pink: #f08fab; --pink-d: #f5a3bb; --pink-s: #2a1820;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #000000; --card: #111111; --ink: #f5f5f5; --muted: #9a9a9a; --shade: #222222; --slot: #1a1a1a;
  --hair: #262626; --dash: #333333; --hover: #1a1a1a;
  --pink: #f08fab; --pink-d: #f5a3bb; --pink-s: #2a1820;
} }
/* plain page, no dots, no glow */
html body, html body[data-view], html body[data-view="day"] { background: var(--paper) !important; background-image: none !important; }
/* cards: flat, thin line, no shadow, no tilt */
#view-home#view-home :is(.hm-now, .hm-goals, .hm-area, .hm-quick .hq, .hm-nudge),
#view-goals#view-goals .gl-area {
  background: var(--card) !important; color: var(--ink) !important; border: 1px solid var(--hair) !important; box-shadow: none !important; transform: none !important; }
#view-home#view-home .hm-now { border-radius: 20px !important; padding: 20px !important; }
#view-home#view-home .hm-now::before, #view-home#view-home .hm-now::after, #view-home#view-home .hm-area::before, #view-home#view-home .hm-area::after { display: none !important; content: none !important; }
#view-home#view-home .hm-now b, #view-home#view-home .hm-area em, #view-home#view-home .hm-area .hm-an, #view-home#view-home .hm-gt b { color: var(--ink) !important; }
#view-home#view-home :is(.hm-now .hm-lbl, .hm-now .hm-sub, .hm-now .hm-prog, .hm-area small, .hm-goals small) { color: var(--muted) !important; }
#view-home#view-home .hm-now.empty .hm-sub, #view-home#view-home .hm-now.live .hm-lbl { color: var(--ink) !important; font-weight: 600; }
#view-home#view-home .hm-now .hm-bar { background: var(--hair) !important; }
#view-home#view-home .hm-now .hm-bar u, #view-home#view-home .hm-gbars u { background: var(--ink) !important; }
#view-home#view-home .hm-gbars i { background: var(--hair) !important; }
#view-home#view-home .hm-quick .hq { border-radius: 14px !important; font-weight: 500 !important; }
#view-home#view-home .hm-quick .hq span { filter: grayscale(1); }
#view-home#view-home .hq.due::after { background: var(--ink) !important; }
#view-home#view-home .hm-area { border-radius: 18px !important; padding: 16px !important; min-height: 120px !important; }
#view-home#view-home .hm-ae, #view-goals#view-goals .gl-ah i { display: none !important; }
#view-home#view-home .hm-sec { font-size: 13px !important; font-weight: 600 !important; letter-spacing: .4px !important; text-transform: uppercase !important; color: var(--muted) !important; }
#view-home#view-home .hm-goals { border-radius: 18px !important; }
/* goals page */
#view-goals#view-goals .gl-list { gap: 12px !important; margin-top: 14px !important; }
#view-goals#view-goals .gl-area { padding: 16px 16px 8px !important; border-radius: 18px !important; }
#view-goals#view-goals .gl-ah b { font-size: 13px !important; font-weight: 600 !important; letter-spacing: .4px; text-transform: uppercase; color: var(--muted) !important; }
#view-goals#view-goals .gl-t { color: var(--ink) !important; }
#view-goals#view-goals .gl-chk { background: transparent !important; border: 1.5px solid var(--dash) !important; color: var(--paper) !important; }
#view-goals#view-goals .gl-chk.on { background: var(--ink) !important; border-color: var(--ink) !important; color: var(--paper) !important; }
#view-goals#view-goals :is(.gl-steps, .gl-steps.none, .gl-add) { color: var(--muted) !important; }
/* tabs and buttons */
.tabs, .morepanel { background: var(--paper) !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; border-color: var(--hair) !important; }
.tabs .brick:not(.flat), .brick:not(.flat) { background: var(--ink) !important; color: var(--paper) !important; }
.md-seg { background: var(--slot) !important; }
.md-seg-b.on { background: var(--card) !important; color: var(--ink) !important; box-shadow: 0 0 0 1px var(--hair); }
:is(.wka-go, .cy-all, .wk-copy button, .ch-form button, .tw-post) { background: var(--ink) !important; color: var(--paper) !important; }
:is(.wka-row button.on, .wka-days button.on, .ls-row.on, .cy-row.got) { background: var(--ink) !important; color: var(--paper) !important; border-color: var(--ink) !important; }
.cy-row.got b, .cy-row.got small { color: var(--paper) !important; }
.cy-row.got .cy-plus { background: var(--paper) !important; color: var(--ink) !important; }
.cy-plus, .ls-row i { background: var(--slot) !important; color: var(--ink) !important; }
.ch-msg.me { background: var(--ink) !important; color: var(--paper) !important; }
#bugtoast { background: #111 !important; }
/* the week calendar: grey blocks */
.wk-blk { --q: var(--muted) !important; background: var(--slot) !important; border-left-color: var(--ink) !important; }
.wk-day.today, .wk-dcol.today .wk-ch { background: var(--ink) !important; color: var(--paper) !important; }
.wk-day.today b, .wk-dcol.today .wk-ch b { color: var(--paper) !important; }
.wk-day.has i { background: var(--ink) !important; }
.wk-day.today.has i { background: var(--paper) !important; }
.wk-col.today { background-color: transparent !important; }
.wk-now { background: var(--ink) !important; }

/* pink: the one accent */
.tabs .brick:not(.flat) { background: var(--pink) !important; color: #fff !important; }
#view-home#view-home .hm-now.live .hm-lbl, #view-home#view-home .hm-now.empty .hm-sub { color: var(--pink-d) !important; }
#view-home#view-home .hm-now .hm-lbl::before { background: var(--pink) !important; }
#view-home#view-home .hm-now .hm-bar u, #view-home#view-home .hm-gbars u { background: var(--pink) !important; }
#view-home#view-home .hq.due::after { background: var(--pink) !important; }
#view-goals#view-goals .gl-chk.on { background: var(--pink) !important; border-color: var(--pink) !important; color: #fff !important; }
#view-goals#view-goals .gl-steps.none { color: var(--pink-d) !important; }
.md-seg-b.on { color: var(--pink-d) !important; }
.wk-day.today, .wk-dcol.today .wk-ch { background: var(--pink) !important; color: #fff !important; }
.wk-day.today b, .wk-dcol.today .wk-ch b { color: #fff !important; }
.wk-day.has i { background: var(--pink) !important; }
.wk-day.today.has i { background: #fff !important; }
.wk-now { background: var(--pink) !important; }
.wk-blk { border-left-color: var(--pink) !important; }
.wk-add, .wk-add .plusbox { color: var(--pink-d) !important; }
:is(.wka-row button.on, .wka-days button.on, .ls-row.on, .cy-row.got) { background: var(--pink-s) !important; color: var(--ink) !important; border-color: var(--pink) !important; }
.cy-row.got b, .cy-row.got small { color: var(--ink) !important; }
.cy-row.got .cy-plus { background: var(--pink) !important; color: #fff !important; }
.cy-plus, .ls-row i { background: var(--pink-s) !important; color: var(--pink-d) !important; }
.ch-msg.me { background: var(--pink) !important; color: #fff !important; }

/* colour only where it means something: area markers and goal status */
#view-home#view-home .hm-area .hm-an::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--c); vertical-align: middle; }
#view-goals#view-goals .gl-ah b::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--c); vertical-align: middle; }
#view-goals#view-goals .gl-area { border-left: 4px solid var(--c) !important; }
#view-home#view-home .hm-gbars i { background: color-mix(in srgb, var(--c) 25%, var(--card)) !important; }
#view-home#view-home .hm-gbars u { background: var(--c) !important; }

/* more colour, still minimal: tints that carry meaning */
#view-home#view-home .hm-now.hm-now { background: color-mix(in srgb, var(--pink) 9%, var(--card)) !important; border-color: color-mix(in srgb, var(--pink) 30%, var(--hair)) !important; }
#view-home#view-home .hm-area.hm-area { background: color-mix(in srgb, var(--c) 11%, var(--card)) !important; border-color: color-mix(in srgb, var(--c) 32%, var(--hair)) !important; }
#view-home#view-home .hm-area .hm-an { color: color-mix(in srgb, var(--c) 70%, var(--ink)) !important; }
#view-home#view-home .hm-area .hm-an::before { width: 10px; height: 10px; }
#view-home#view-home .hm-area em { color: color-mix(in srgb, var(--c) 45%, var(--ink)) !important; }
#view-home#view-home .hm-quick .hq span { filter: none !important; }
#view-home#view-home .hm-quick .hq { --q: var(--pink); background: color-mix(in srgb, var(--q) 12%, var(--card)) !important; border-color: color-mix(in srgb, var(--q) 35%, var(--hair)) !important; }
#view-home#view-home .hm-quick .hq:nth-child(1) { --q: #5aa86b; }
#view-home#view-home .hm-quick .hq:nth-child(2) { --q: #5fa8dc; }
#view-home#view-home .hm-quick .hq:nth-child(3) { --q: #e5b53d; }
#view-home#view-home .hm-goals.hm-goals { background: linear-gradient(110deg, color-mix(in srgb, #5fa8dc 8%, var(--card)), color-mix(in srgb, #9b87d9 8%, var(--card))) !important; }
#view-goals#view-goals .gl-area { background: color-mix(in srgb, var(--c) 7%, var(--card)) !important; }
#view-goals#view-goals .gl-ah b { color: color-mix(in srgb, var(--c) 70%, var(--ink)) !important; }
.wk-blk { --q: var(--pink) !important; }
.wk-blk:nth-child(4n+1) { background: color-mix(in srgb, #5fa8dc 22%, var(--card)) !important; border-left-color: #5fa8dc !important; }
.wk-blk:nth-child(4n+2) { background: color-mix(in srgb, #e57a9c 22%, var(--card)) !important; border-left-color: #e57a9c !important; }
.wk-blk:nth-child(4n+3) { background: color-mix(in srgb, #d9a948 22%, var(--card)) !important; border-left-color: #d9a948 !important; }
.wk-blk:nth-child(4n)   { background: color-mix(in srgb, #9b87d9 22%, var(--card)) !important; border-left-color: #9b87d9 !important; }

/* week as a list: days down the page */
.wk-look { margin: 0 0 12px; }
.wl { display: flex; flex-direction: column; gap: 10px; }
.wl-day { padding: 6px 16px 10px; background: var(--card); border: 1px solid var(--hair); border-radius: 20px; }
.wl-day.today { border: 2px solid var(--pink); }
.wl-day.past { opacity: .7; }
.wl-h { display: flex; align-items: baseline; gap: 8px; width: 100%; min-height: 44px; padding: 6px 0; text-align: left; font-family: var(--display); color: var(--ink); background: none; border: none; cursor: pointer; }
.wl-h b { font-size: 19px; font-weight: 700; }
.wl-h span { font-size: 15px; color: var(--muted); }
.wl-h small { margin-left: auto; font-size: 14px; color: var(--muted); }
.wl-day ul { list-style: none; margin: 0; padding: 0; }
.wl-day li { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 10px; min-height: 46px; padding: 6px 0 6px 10px; border-top: 1px solid var(--hair); border-left: 4px solid var(--c, var(--hair)); margin-left: -4px; cursor: pointer; }
.wl-day li time { font-size: 15px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.wl-day li span { min-width: 0; font-size: 17px; color: var(--ink); overflow-wrap: break-word; }
.wl-day li span i { font-style: normal; margin-right: 6px; }

/* focus room: a calm night sky that drifts slowly (indigo, plum, rose, teal). always dark, in light mode too */
.focus { --ink: #f6f3f8; --muted: rgba(246, 243, 248, .62); --hair: rgba(255, 255, 255, .12); --card: rgba(255, 255, 255, .06); --slot: rgba(255, 255, 255, .08);
  --pink: #f29ab5; --pink-d: #f6b1c6; --pink-s: rgba(242, 154, 181, .18); color: var(--ink) !important; }
.focus::before { content: ""; position: fixed; inset: -25%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(38% 32% at 22% 24%, rgba(124, 96, 230, .55), transparent 70%),
    radial-gradient(34% 30% at 80% 28%, rgba(232, 120, 160, .46), transparent 70%),
    radial-gradient(44% 38% at 52% 86%, rgba(56, 150, 176, .40), transparent 70%),
    radial-gradient(30% 26% at 12% 78%, rgba(240, 168, 120, .28), transparent 70%);
  filter: blur(24px); animation: fxsky 48s ease-in-out infinite alternate; }
@keyframes fxsky { 0% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(5%, -4%) rotate(9deg); } 100% { transform: translate(-5%, 4%) rotate(-7deg); } }
@media (prefers-reduced-motion: reduce) { .focus::before { animation: none; } }

.focus .fx-close, .focus .fx-mood { color: var(--ink) !important; background: rgba(255, 255, 255, .10) !important; border: 1px solid rgba(255, 255, 255, .14) !important; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.focus .fx-goal { color: var(--ink) !important; background: rgba(255, 255, 255, .07) !important; border: 1px solid rgba(255, 255, 255, .13) !important; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.focus .fx-goal i { border-color: rgba(255, 255, 255, .45) !important; }

.focus .fx-done { color: #fff !important; background: var(--pink) !important; border: none !important; }

/* home: the four areas as 2 by 2 squares again, with the rose gold edges */
#view-home#view-home#view-home#view-home#view-home .hm-areas { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 12px !important; }
#view-home#view-home#view-home#view-home#view-home .hm-areas .hm-area.hm-area { display: flex !important; flex-direction: column !important; align-items: flex-start !important; justify-content: space-between !important;
  min-height: 128px !important; padding: 16px !important; }

/* plan week: a summary on top, mini timelines in the list, hour lines in the calendar */
.ws { margin: 4px 0 16px; padding: 16px 18px; border: 1px solid transparent; border-radius: 22px;
  background: linear-gradient(color-mix(in srgb, var(--pink) 7%, var(--card)), color-mix(in srgb, var(--pink) 7%, var(--card))) padding-box, var(--gold, linear-gradient(135deg, #f7d3dc, #b97488)) border-box; }

.ws-nums span { display: flex; flex-direction: column; }

.ws-nums b i { font-style: normal; font-size: 15px; font-weight: 500; color: var(--muted); }
.ws-nums small { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.ws-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 14px; }
.ws-bar { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; background: none; border: none; cursor: pointer; }
.ws-bar i { display: flex; flex-direction: column; justify-content: flex-end; width: 100%; max-width: 30px; height: 52px; background: var(--slot); border-radius: 8px; overflow: hidden; }
.ws-bar s { display: flex; flex-direction: column; justify-content: flex-end; width: 100%; background: color-mix(in srgb, var(--pink) 30%, var(--card)); text-decoration: none; }
.ws-bar u { display: block; width: 100%; background: var(--pink); }
.ws-bar small { font-size: 12px; font-weight: 600; color: var(--muted); }
.ws-bar.today small { color: var(--pink-d); }
.wl-tl { padding: 0 18px 12px; }
.wl-tl span { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
.wl-bar { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; }
.wl-bar i { display: block; min-width: 3px; background: color-mix(in srgb, var(--q) 60%, var(--card)); }
.wl-bar i.done { filter: saturate(1.6) brightness(.92); }
.wl-bar i.done { background: var(--q); }
.wl-day.today { border: 1px solid transparent !important; background: linear-gradient(var(--card), var(--card)) padding-box, var(--gold, linear-gradient(135deg, #f7d3dc, #b97488)) border-box !important; }
.wg-d em { display: block; font-style: normal; font-size: 11px; font-weight: 500; color: var(--muted); }
.wg-d.today em, .wg-d.sel em { color: var(--pink-d); }
.wg-body { background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 21.6px, color-mix(in srgb, var(--hair) 60%, transparent) 21.6px, color-mix(in srgb, var(--hair) 60%, transparent) 22.6px); }
.wg-col i:not(.done) { opacity: .45; }

.ab-note { margin: -6px 0 12px; font-size: 14px; color: var(--muted); }
.ab-goal { display: block; width: 100%; min-height: 50px; margin: 0 0 10px; padding: 0 14px; font: 16px var(--display); color: var(--ink); background: var(--paper); border: 1px solid var(--hair); border-radius: 14px; }

/* week add: an elegant goals picker that opens a list */
.wk2-gbtn { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 56px; margin-top: 22px; padding: 0 18px; font: 600 16px var(--display); color: var(--ink); cursor: pointer;
  border: 1px solid transparent; border-radius: 18px; background: linear-gradient(color-mix(in srgb, var(--pink) 8%, var(--card)), color-mix(in srgb, var(--pink) 8%, var(--card))) padding-box, var(--gold, linear-gradient(135deg, #f7d3dc, #b97488)) border-box; }
.wk2-gbtn span { display: flex; align-items: center; gap: 10px; }
.wk2-gbtn i { font-style: normal; font-size: 20px; }
.wk2-gbtn s { text-decoration: none; font-size: 14px; font-weight: 500; color: var(--pink-d); }
.wk2-gbtn s b { display: inline-block; transition: transform .2s; }
.wk2-gbtn.open s b { transform: rotate(180deg); }
.wk2-glist { margin-top: 8px; padding: 6px 0; background: var(--card); border: 1px solid var(--hair); border-radius: 18px; }
.wk2-gg + .wk2-gg { border-top: 1px solid var(--hair); }
.wk2-gg small { display: block; padding: 10px 18px 4px; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: color-mix(in srgb, var(--c) 70%, var(--ink)); }
.wk2-gg button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 0 18px; text-align: left; font: 500 16px var(--display); color: var(--ink); background: none; border: none; cursor: pointer; }
.wk2-gg button:active { background: var(--pink-s); }
.wk2-gg button i { font-style: normal; font-size: 18px; }
.wk2-gg button span { flex: 1; }
.wk2-gg button s { text-decoration: none; font-size: 20px; color: var(--muted); }
/* plan day: the start time is always there, as a calm row */
#view-day.calm .start-row { display: flex !important; }
#view-day .start-row { align-items: center; padding: 6px 6px 6px 16px; background: var(--card); border: 1px solid var(--hair); border-radius: 18px; }
#view-day .start-row input { min-height: 44px; }

#view-home#view-home#view-home .hm-nudge { margin-bottom: 12px !important; }

/* how long: type a number, pick min or hours */
.df { display: flex; gap: 10px; align-items: stretch; }
.df input { flex: 1; min-width: 0; min-height: 60px; padding: 0 18px; font: 600 26px var(--display); color: var(--ink); background: var(--card); border: 1px solid var(--hair); border-radius: 18px; }
.df input:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 3px var(--pink-s); }
.df-u { display: flex; padding: 4px; background: var(--slot); border-radius: 18px; }
.df-u button { min-width: 74px; padding: 0 14px; font: 600 15px var(--display); color: var(--muted); background: none; border: none; border-radius: 14px; cursor: pointer; }
.df-u button.on { color: var(--ink); background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.wk2-ends { margin: 10px 2px 0; font-size: 15px; color: var(--muted); }
.wk2-ends b { color: var(--ink); font-weight: 600; }
.ab .ab-dur { margin-top: 6px; }
.ab .ab-add { margin-top: 14px; }
.ab .ab-sub { margin-top: 22px; }
.ab h2 { margin-bottom: 14px; }

/* home ends at the bottom of the screen: no extra space below, gaps scale with the screen */
body[data-view="home"] .wrap { padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px)) !important; }
body[data-view="home"] footer { margin: 0; padding: 2px 0 0; font-size: 11px; }
#view-home#view-home#view-home .pghead { margin-top: 0 !important; margin-bottom: 2.4vh !important; padding-bottom: 1.8vh !important; }
#view-home#view-home#view-home .hm-quick { margin-top: 1.8vh !important; margin-bottom: 2.4vh !important; }
#view-home#view-home#view-home .hm-nudge { margin-bottom: 1.4vh !important; }
#view-home#view-home#view-home .hm-sec { margin: 2.6vh 2px 1.4vh !important; }
#view-home#view-home#view-home#view-home#view-home .hm-areas { gap: 1.3vh 12px !important; }
#view-home#view-home#view-home#view-home#view-home .hm-areas .hm-area.hm-area { min-height: 11vh !important; }
#view-home#view-home#view-home #quote { display: none; }

/* home is exactly one screen tall (the phone's clock bar and the tab bar taken out).
   the four squares stretch or shrink to fill what is left, so the page ends at the bottom on any phone */
body[data-view="home"] { padding-bottom: 0 !important; }
body[data-view="home"] .wrap { padding-top: 16px !important; padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px)) !important; }
body[data-view="home"] footer { position: relative; margin: 0 !important; padding: 0 !important; height: 16px; line-height: 16px; font-size: 11px; }
#view-home:not([hidden]) { display: flex; flex-direction: column;
  min-height: calc(100svh - env(safe-area-inset-top, 0px) - 16px - 70px - env(safe-area-inset-bottom, 0px) - 16px); }
#view-home > .pghead, #view-home > #home-now { flex: none; }
#view-home > #menu { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#view-home > #menu > :not(.hm-areas) { flex: none; }
#view-home#view-home#view-home#view-home#view-home .hm-areas { flex: 1; min-height: 0; grid-template-rows: 1fr 1fr; margin-bottom: 4px !important; }
#view-home#view-home#view-home#view-home#view-home .hm-areas .hm-area.hm-area { min-height: 80px !important; height: auto; padding: 12px 16px !important; }
#view-home#view-home#view-home#view-home#view-home .hm-area em { padding-top: 4px; font-size: 25px !important; }

.ls-add { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 0 0 14px; }
.ls-add button { min-height: 52px; font: 600 17px var(--display); color: var(--ink); background: color-mix(in srgb, var(--pink) 16%, var(--card)); border: 1px solid color-mix(in srgb, var(--pink) 40%, var(--hair)); border-radius: 16px; cursor: pointer; }
.ls-add button:active { transform: scale(.96); }
/* plan: just enough room at the bottom to clear the tab bar (no now pill on this page) */
body[data-view="day"] .wrap { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)) !important; }

/* brain dump */
.bd { margin: 0 0 18px; padding: 14px 16px 12px; background: var(--card); border: 1px solid var(--hair); border-radius: 22px; }
.bd-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.bd-h b { font-size: 17px; font-weight: 600; }
.bd-h small { font-size: 13px; color: var(--muted); }
.bd-add { display: flex; gap: 8px; }
.bd-add input { flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; font: 16px var(--display); color: var(--ink); background: var(--paper); border: 1px solid var(--hair); border-radius: 14px; }
.bd-add button { flex: none; width: 48px; min-height: 48px; font: 500 24px var(--display); color: #fff; background: var(--pink); border: none; border-radius: 14px; cursor: pointer; }
.bd-list { list-style: none; margin: 8px 0 0; padding: 0; }
.bd-list li { display: flex; align-items: center; gap: 12px; min-height: 50px; border-bottom: 1px solid var(--hair); }
.bd-list li:last-child { border-bottom: 0; }
.bd-list li span { flex: 1; min-width: 0; font-size: 17px; line-height: 1.35; overflow-wrap: break-word; }
.bd-list.done li span { color: var(--muted); }
.bd-tick { flex: none; width: 28px; height: 28px; padding: 0; font-size: 14px; color: #fff; background: none; border: 2px solid color-mix(in srgb, var(--pink) 60%, var(--hair)); border-radius: 50%; cursor: pointer; }
.bd-tick.on { background: var(--pink); border-color: var(--pink); }
.bd-plan { flex: none; min-height: 36px; padding: 0 12px; font: 500 14px var(--display); color: var(--pink-d); background: none; border: 1px solid color-mix(in srgb, var(--pink) 40%, var(--hair)); border-radius: 18px; cursor: pointer; }
.bd-done { display: block; min-height: 40px; margin: 6px 0 0; padding: 0; font: 500 14px var(--display); color: var(--muted); background: none; border: none; text-decoration: underline; cursor: pointer; }

/* what's this block: a clear way out */
.ns-sheet { position: relative; }
.ns-x { position: absolute; top: 14px; right: 14px; z-index: 2; width: 44px; height: 44px; font-size: 26px; line-height: 1; color: var(--ink); background: var(--slot); border: none; border-radius: 50%; cursor: pointer; }
.ns-sheet .ns-h, .ns-sheet .ns-head { padding-right: 56px; }
.ns-cancel { display: block; width: 100%; min-height: 50px; margin-top: 14px; font: 600 16px var(--display); color: var(--ink); background: var(--slot); border: none; border-radius: 25px; cursor: pointer; }

#lensheet .ls-df { margin: 6px 0 4px; }
#lensheet .ls-save { margin: 6px 0 16px; }

#lensheet .ls-list, #lensheet .ls-add + .ab-sub { display: none !important; }

/* holding a block must not select its text (the blue on iPhone) */
#view-day .line, #view-day .line * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#view-day .line input, #view-day .line textarea { -webkit-user-select: text; user-select: text; }
#view-day .line.holding { background: color-mix(in srgb, var(--pink) 10%, transparent); border-radius: 14px; }

/* quit journey: days clean, craving help, slips */
.jr-clean { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 0; }
.jr-clean span { display: flex; flex-direction: column; padding: 10px 12px; background: var(--card); border: 1px solid var(--hair); border-radius: 16px; }
.jr-clean b { font-size: 24px; font-weight: 700; color: var(--ink); line-height: 1.1; }
.jr-clean small { font-size: 12px; color: var(--muted); }
.jr-sos { display: flex; gap: 8px; margin-top: 10px; }
.jr-sos button { flex: 1; min-height: 50px; font: 600 16px var(--display); border-radius: 25px; cursor: pointer; }
.jr-crave { color: #fff; background: var(--pink); border: none; }
.jr-slip { color: var(--ink); background: var(--card); border: 1px solid var(--dash); }
.cr { position: relative; max-height: 92vh; overflow-y: auto; }
.cr h2 { margin: 2px 56px 6px 0; font-family: var(--serif, inherit); font-size: 26px; font-weight: 600; }
.cr-sub { margin: 0 0 16px; font-size: 15px; line-height: 1.45; color: var(--muted); }
.cr-time { padding: 16px; text-align: center; background: var(--pink-s); border-radius: 20px; }
.cr-time b { display: block; font-size: 42px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
.cr-time i { display: block; height: 6px; margin-top: 10px; background: var(--card); border-radius: 3px; overflow: hidden; }
.cr-time u { display: block; width: 0; height: 100%; background: var(--pink); transition: width 1s linear; }
.cr-do { display: flex; flex-direction: column; gap: 8px; }
.cr-do button { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; text-align: left; font: 500 16px var(--display); color: var(--ink); background: var(--card); border: 1px solid var(--hair); border-radius: 16px; cursor: pointer; }
.cr-do button span { font-size: 20px; }
.cr-do button.on { background: var(--pink-s); border-color: var(--pink); text-decoration: line-through; }
.cr-cue { display: flex; flex-wrap: wrap; gap: 8px; }
.cr-cue button { min-height: 42px; padding: 0 16px; font: 500 15px var(--display); color: var(--ink); background: var(--card); border: 1px solid var(--hair); border-radius: 21px; cursor: pointer; }
.cr-cue button.on { background: var(--pink-s); border-color: var(--pink); }
.cr .cr-done { margin-top: 18px; }
/* goals page: habits with their streaks */
.gl-hab { margin-top: 12px; padding: 14px 16px; background: var(--card); border: 1px solid var(--hair); border-radius: 18px; }
.gl-hh { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
.gl-hh b { font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--pink-d); }
.gl-hh small { font-size: 13px; color: var(--muted); }
.gl-hrow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0; text-align: left; font: 500 16px var(--display); color: var(--ink); background: none; border: none; border-top: 1px solid var(--hair); cursor: pointer; }
.gl-hab .gl-hrow:first-of-type { border-top: none; }
.gl-hrow span { flex: 1; min-width: 0; }
.gl-hrow em { flex: none; display: flex; align-items: baseline; gap: 4px; font-style: normal; font-size: 22px; font-weight: 700; color: var(--pink-d); }
.gl-hrow em small { font-size: 12px; font-weight: 500; color: var(--muted); }
.gl-htick { flex: none; display: grid; place-items: center; width: 30px; height: 30px; padding: 0; font-size: 15px; font-weight: 700; color: #fff; background: transparent; border: 1.5px solid var(--dash); border-radius: 50%; cursor: pointer; }
.gl-htick.on { background: var(--pink); border-color: var(--pink); }
.gl-hj i { flex: none; width: 30px; text-align: center; font-style: normal; font-size: 20px; }

/* Finish plan stays in view while you reorder */
#view-day .pl-finish { position: sticky; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 6; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .5); }
#view-day .viewtools .arrange:first-child { color: var(--pink-d); font-weight: 600; }
</style>

        <button type="button" data-th="light">Light</button>

<script>
/* =========== something broke =========== */
/* if anything crashes, a small note says what, so a screenshot shows the cause */
function bugToast(e) {
  try {
    const msg = (e && (e.message || e.reason && e.reason.message || e.reason)) || String(e);
    const where = e && e.lineno ? ' (line ' + e.lineno + ')' : (e && e.stack ? ' (' + String(e.stack).split('\n').slice(0, 2).join(' ').replace(/\s+/g, ' ').slice(0, 120) + ')' : '');
    let t = document.getElementById('bugtoast');
    if (!t) { t = document.createElement('div'); t.id = 'bugtoast'; t.addEventListener('click', () => t.remove()); document.body.appendChild(t); }
    t.textContent = 'Something broke: ' + msg + where + ' · build ' + ((document.querySelector('footer') || {}).textContent || '').split(':').slice(1).join(':') + '. Tap to close.';
  } catch {}
}
window.addEventListener('error', e => bugToast(e));
window.addEventListener('unhandledrejection', e => bugToast(e));

/* =========== AI =========== */
/* on the laptop (serve.py) the AI is same address. anywhere else (the online
   app) it goes to brick's Cloudflare worker, which holds the key. the worker
   needs a passcode, typed once on this device. */
const AI_URL = 'https://brick-ai.brick-ai.workers.dev';   // brick's Cloudflare worker (worker/ in this repo)
const AI_PASS_KEY = 'paper.by.mia.v2.aipass';
const aiLocal = () => !AI_URL || /^(localhost|127\.|192\.168\.|10\.)/.test(location.hostname);
async function aiFetch(path, body, signal) {
  const headers = { 'Content-Type': 'application/json' };
  let url = path;
  if (!aiLocal()) {
    url = AI_URL + path;
    let pass = ''; try { pass = localStorage.getItem(AI_PASS_KEY) || ''; } catch {}
    if (!pass) { aiPassSheet(); return new Response('{"error":"passcode"}', { status: 401 }); }
    headers['X-Brick-Pass'] = pass;
  }
  const r = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body), signal });
  if (r.status === 401 && !aiLocal()) { try { localStorage.removeItem(AI_PASS_KEY); } catch {} aiPassSheet(true); }
  return r;
}
function aiPassSheet(wrong) {
  if (document.getElementById('aipass')) return;
  const el = document.createElement('div');
  el.id = 'aipass'; el.className = 'w3';
  el.innerHTML = '<div class="w3-back"></div><div class="w3-sheet" role="dialog" aria-modal="true" aria-label="AI passcode"><span class="w3-grab"></span>' +
    '<h2 class="gs-h">AI passcode</h2><p class="gs-ask">' + (wrong ? 'That passcode did not work. Try again.' : 'Type your AI passcode once. It stays on this phone.') + '</p>' +
    '<div class="gs-add"><input type="password" autocomplete="current-password" aria-label="AI passcode"><button type="button">Save</button></div></div>';
  document.body.appendChild(el);
  const inp = el.querySelector('input');
  const ok = () => { const v = inp.value.trim(); if (!v) return; try { localStorage.setItem(AI_PASS_KEY, v); } catch {} el.remove(); };
  el.querySelector('.w3-back').addEventListener('click', () => el.remove());
  el.querySelector('.gs-add button').addEventListener('click', ok);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
  setTimeout(() => inp.focus(), 50);
}

/* =========== storage =========== */

const KEY = 'paper.by.mia.v2';
const OLD = 'paper.by.mia.v1';

const blank = { habits: [], days: {}, moods: [], ideas: [], gym: {}, gymEdits: {}, food: [], order: [], compact: false, dismissed: [],
                goal: null, goal2: null, goalText: '', life: {}, grocery: [], gymSets: {}, gymPlan: {}, gymLog: [],
                penalties: [], penaltyLink: '', goalSetAt: 0, goalUnlockUntil: 0, sleep: [], routine: null, trainProfile: null, groceryLog: [], journeys: [], money: [], meals: {}, grocBudget: {}, prices: {}, moneyPlan: null, imported: [], grocLists: [], people: [], monthGoals: {}, habitsCleared: 1, habitsOld: [], dump: [] };

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      return {
        habits:    Array.isArray(d.habits)    ? d.habits    : [],
        days:      (d.days && typeof d.days === 'object') ? d.days : {},
        moods:     Array.isArray(d.moods)     ? d.moods     : [],
        ideas:     Array.isArray(d.ideas)     ? d.ideas     : [],
        gym:       (d.gym && typeof d.gym === 'object') ? d.gym : {},
        order:     Array.isArray(d.order)     ? d.order     : [],
        gymEdits:  (d.gymEdits && typeof d.gymEdits === 'object') ? d.gymEdits : {},
        food:      Array.isArray(d.food)      ? d.food      : [],
        compact:   !!d.compact,
        dismissed: Array.isArray(d.dismissed) ? d.dismissed : [],
        goal:      typeof d.goal === 'string' ? d.goal : null,
        goal2:     typeof d.goal2 === 'string' ? d.goal2 : null,
        goalText:  typeof d.goalText === 'string' ? d.goalText : '',
        goalOwn:   !!d.goalOwn,
        life:      (d.life && typeof d.life === 'object') ? d.life : {},
        grocery:   Array.isArray(d.grocery) ? d.grocery : [],
        gymSets:   (d.gymSets && typeof d.gymSets === 'object') ? d.gymSets : {},
        gymPlan:   (d.gymPlan && typeof d.gymPlan === 'object') ? d.gymPlan : {},
        gymLog:    Array.isArray(d.gymLog) ? d.gymLog : [],
        routine:   (d.routine && typeof d.routine === 'object') ? d.routine : null,
        trainProfile: (d.trainProfile && typeof d.trainProfile === 'object') ? d.trainProfile : null,
        groceryLog: Array.isArray(d.groceryLog) ? d.groceryLog : [],
        money:     Array.isArray(d.money) ? d.money : [],
        moneyPlan: (d.moneyPlan && typeof d.moneyPlan === 'object') ? d.moneyPlan : null,
        penalties: Array.isArray(d.penalties) ? d.penalties : [],
        penaltyLink: typeof d.penaltyLink === 'string' ? d.penaltyLink : '',
        goalSetAt: Number(d.goalSetAt) || 0,
        goalUnlockUntil: Number(d.goalUnlockUntil) || 0,
        sleep:     Array.isArray(d.sleep) ? d.sleep : [],
        journeys:  Array.isArray(d.journeys) ? d.journeys : [],
        meals:     (d.meals && typeof d.meals === 'object') ? d.meals : {},
        grocBudget: (d.grocBudget && typeof d.grocBudget === 'object') ? d.grocBudget : {},
        prices:    (d.prices && typeof d.prices === 'object') ? d.prices : {},
        imported:  Array.isArray(d.imported) ? d.imported : [],
        grocLists: Array.isArray(d.grocLists) ? d.grocLists : [],
        people:    Array.isArray(d.people) ? d.people : [],
        monthGoals: d.monthGoals && typeof d.monthGoals === 'object' ? d.monthGoals : {},
        habitsCleared: d.habitsCleared || 0,
        habitsOld: Array.isArray(d.habitsOld) ? d.habitsOld : [],
        dump: Array.isArray(d.dump) ? d.dump : []
      };
    }
    const old = localStorage.getItem(OLD);
    if (old) {
      const o = JSON.parse(old);
      const s = structuredClone(blank);
      if (Array.isArray(o.habits)) s.habits = o.habits;
      if (o.day && Array.isArray(o.day.blocks) && o.day.blocks.length) {
        s.days[todayKey()] = { start: o.day.start || '08:00', blocks: o.day.blocks };
      }
      return s;
    }
  } catch {}
  return structuredClone(blank);
}

function save() {
  try { recordDay(); } catch {}   // undo history for the day page
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
}

/* =========== dates =========== */

const DAYS   = ['s','m','t','w','t','f','s'];
const FULL   = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const MONTHS = ['january','february','march','april','may','june',
                'july','august','september','october','november','december'];

function key(d) {
  return d.getFullYear() + '-' +
         String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}

function todayKey() { return key(new Date()); }

function fromKey(k) { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }

function shiftKey(k, by) { const d = fromKey(k); d.setDate(d.getDate() + by); return key(d); }

let state = load();
// sleep comes from the Sleep block in your plan: bring today's saved times in line
setTimeout(() => {
  try {
    const k = todayKey(), p = planSleep(k), e = (state.sleep || []).find(x => x.k === k);
    if (p && e && (e.bed !== p.bed || e.wake !== p.wake)) { e.bed = p.bed; e.wake = p.wake; e.fromPlan = true; save(); if (typeof renderHome === 'function') renderHome(); }
  } catch {}
}, 0);
// once: split typed amounts and how you'll have it out of grocery names
// ("12 eggs, boiled" becomes Eggs, 12, boiled). a copy of the list is kept first.
try {
  if (!localStorage.getItem(KEY + '.grocTidy') && Array.isArray(state.grocery) && state.grocery.length) {
    localStorage.setItem(KEY + '.grocery-before-tidy', JSON.stringify(state.grocery));
    setTimeout(() => {
      let n = 0;
      for (const it of state.grocery) if (!it.done && tidyGrocery(it)) n++;
      if (n) { save(); if (typeof renderGroceries === 'function' && foodView === 'groc') renderGroceries(); }
      localStorage.setItem(KEY + '.grocTidy', '1');
    }, 0);
  } else localStorage.setItem(KEY + '.grocTidy', '1');
} catch {}

// once: "Meeting with X" blocks become "Meeting", with X kept as the topic
for (const k in state.days) {
  for (const b of ((state.days[k] || {}).blocks || [])) {
    const m = /^\s*meeting with\s+(.+)$/i.exec(b.label || '');
    if (m) { b.label = m[1].trim(); b.meeting = true; }
    // undo the earlier step that hid your title: "Meeting" + a topic shows the topic again
    if (/^\s*meeting\s*$/i.test(b.label || '') && b.topic) { b.label = b.topic; b.meeting = true; }
  }
}
let openHabit = null;
let monthOffset = 0;
// a new day starts when the day before it ends: if yesterday's plan is still
// running (a late night), it is still yesterday. with no plan, at midnight.
function planKey() {
  const t = todayKey(), y = shiftKey(t, -1);
  const d = typeof state !== 'undefined' && state.days ? state.days[y] : null;
  if (d && d.blocks && d.blocks.length && new Date().getHours() < 12) {
    let end = toMins(d.start);
    for (const b of d.blocks) end += Number(b.mins) || 60;
    if (Date.now() < fromKey(y).getTime() + end * 60000) return y;
  }
  return t;
}
// minutes since midnight of that plan day (so 1:30am on the night after is 1530)
function planMin(k) { return Math.floor((Date.now() - fromKey(k).getTime()) / 60000); }

let viewDay = planKey();
let noteFor = null;   // the timestamp of the check in being annotated
let dayShowDone = false;  // finished blocks fold into one line unless opened
let sortingDay = false;   // planning mode: number, drag, set lengths, then Finish plan
let sortingKey = null;
let compactDay = !!state.compact;

/* =========== colours =========== */

const PALETTE = ['#d9718e', '#86b9d9', '#e8c46a', '#93bf7f', '#a99bd4', '#e3a27a'];
const colorFor = i => PALETTE[i % PALETTE.length];

/* =========== habits =========== */

const habitList = document.getElementById('habit-list');

function streakOf(marks) {
  const set = new Set(marks);
  let n = 0;
  const d = new Date();
  if (!set.has(key(d))) d.setDate(d.getDate() - 1);
  while (set.has(key(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function lastSevenDays() {
  const out = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); out.push(d); }
  return out;
}

// Nov 2026: Mia asked to start habits fresh and add them herself. done once; the old ones are kept aside
if (!state.habitsCleared) { state.habitsOld = state.habits; state.habits = []; state.habitsCleared = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }

/* habits as streaks. a habit takes about 66 days of doing it to become
   automatic (UCL study, Lally 2009). so: build 1 or 2 at once, 3 at most,
   and a habit that reaches 66 days moves to "locked in" and frees a slot. */
const HABIT_DAYS = 66, HABIT_MAX = 3;
function bestStreak(marks) {
  const ks = [...new Set(marks)].sort();
  let best = 0, run = 0, prev = null;
  for (const k of ks) { run = prev && shiftKey(prev, 1) === k ? run + 1 : 1; best = Math.max(best, run); prev = k; }
  return best;
}
function renderHabits() {
  renderSuggestion();
  const today = todayKey();
  const building = state.habits.filter(h => h.marks.length < HABIT_DAYS), locked = state.habits.filter(h => h.marks.length >= HABIT_DAYS);
  const card = h => {
    const marks = new Set(h.marks), n = streakOf(h.marks), done = marks.has(today), lockedIn = h.marks.length >= HABIT_DAYS;
    const week = lastSevenDays().map(d => { const k = key(d); return '<span class="hb-d' + (marks.has(k) ? ' on' : '') + (k === today ? ' now' : '') + '"><i></i>' + DAYS[d.getDay()][0] + '</span>'; }).join('');
    return '<div class="hb-card' + (done ? ' done' : '') + '" data-h="' + h.id + '" style="--c:' + (h.color || '#d9718e') + '">' +
      '<div class="hb-top"><div class="hb-fire"><b>' + n + '</b><span>' + (n ? '\u{1F525}' : '\u{1F331}') + '</span></div>' +
        '<button type="button" class="hb-name"><b></b><em class="hb-link"></em><small>' + (lockedIn ? 'locked in \u00b7 best ' + bestStreak(h.marks) : Math.min(h.marks.length, HABIT_DAYS) + ' of ' + HABIT_DAYS + ' days to automatic' + (bestStreak(h.marks) > n ? ' \u00b7 best ' + bestStreak(h.marks) : '')) + '</small></button>' +
        '<button type="button" class="hb-tick" aria-label="' + (done ? 'undo today' : 'done today') + '">\u2713</button></div>' +
      (lockedIn ? '' : '<i class="hb-bar"><u style="width:' + Math.round(Math.min(1, h.marks.length / HABIT_DAYS) * 100) + '%"></u></i>') +
      '<div class="hb-week">' + week + '</div></div>';
  };
  let html = '';
  if (building.length < HABIT_MAX) html += '<div class="hb-add"><input type="text" maxlength="40" placeholder="+ a habit you want to build" aria-label="new habit"></div>';
  else html += '<p class="hb-full">You\u2019re building ' + HABIT_MAX + '. That\u2019s the most that works: one more spreads you too thin. Each one frees up at ' + HABIT_DAYS + ' days.</p>';
  html += building.map(card).join('');
  if (!state.habits.length) html += '<p class="hb-empty">Start with one small thing you can do every day, even on a bad day. If it is also in your plan, brick ticks it for you when you finish that block.</p>';
  if (locked.length) html += '<div class="hm-sec">Locked in</div>' + locked.map(card).join('');
  habitList.innerHTML = html;
  habitList.querySelectorAll('.hb-card').forEach(el => {
    const h = state.habits.find(x => x.id === el.dataset.h);
    el.querySelector('.hb-name b').textContent = h.name;
    const blk = habitBlock(h);
    el.querySelector('.hb-link').textContent = blk ? '\u{1F517} ticks itself from your ' + blk + ' block' : 'not in your plan, tick it here';
    if (blk) el.querySelector('.hb-link').classList.add('on');
    el.querySelector('.hb-tick').addEventListener('click', () => {
      const was = h.marks.includes(today);
      toggle(h, today);
      if (!was) { const c = habitList.querySelector('[data-h="' + h.id + '"]'); if (c) c.classList.add('pop'); }
    });
    el.querySelector('.hb-name').addEventListener('click', () => { openHabit = openHabit === h.id ? null : h.id; monthOffset = 0; renderHabits(); });
    if (openHabit === h.id) el.appendChild(monthPanel(h));
  });
  const add = habitList.querySelector('.hb-add input');
  if (add) add.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !add.value.trim()) return;
    addHabit(cap(add.value.trim()));
  });
  const sub = document.getElementById('habits-sub'); if (sub) sub.textContent = building.length + ' of ' + HABIT_MAX + ' building';
}

function toggle(h, k) {
  const i = h.marks.indexOf(k);
  if (i === -1) h.marks.push(k); else h.marks.splice(i, 1);
  save();
  renderHabits();
  renderDay();
}

function monthPanel(h) {
  const marks = new Set(h.marks);
  const today = todayKey();

  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + monthOffset);

  const year = base.getFullYear(), month = base.getMonth();
  const first = new Date(year, month, 1).getDay();
  const days = new Date(year, month + 1, 0).getDate();

  const wrap = document.createElement('div');

  const head = document.createElement('div');
  head.className = 'month-head';

  const prev = document.createElement('button');
  prev.className = 'nav'; prev.type = 'button'; prev.textContent = '←';
  prev.addEventListener('click', () => { monthOffset--; renderHabits(); });

  const label = document.createElement('span');
  label.className = 'month-label';
  label.textContent = MONTHS[month] + ' ' + year;

  const next = document.createElement('button');
  next.className = 'nav'; next.type = 'button'; next.textContent = '→';
  next.style.opacity = monthOffset >= 0 ? '.35' : '1';
  next.addEventListener('click', () => { if (monthOffset < 0) { monthOffset++; renderHabits(); } });

  head.append(prev, label, next);
  wrap.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'grid';

  for (const d of DAYS) {
    const l = document.createElement('div');
    l.className = 'lbl'; l.textContent = d;

  }
  for (let i = 0; i < first; i++) {
    const b = document.createElement('div');
    b.className = 'cell blank';
    grid.appendChild(b);
  }

  let hits = 0;
  for (let d = 1; d <= days; d++) {
    const k = key(new Date(year, month, d));
    const on = marks.has(k);
    if (on) hits++;
    const cell = document.createElement('button');
    cell.className = 'cell' + (on ? ' on' : '') + (k === today ? ' today' : '');
    cell.type = 'button';
    cell.textContent = d;
    cell.addEventListener('click', () => toggle(h, k));
    grid.appendChild(cell);
  }

  wrap.appendChild(grid);

  const count = document.createElement('div');
  count.className = 'count';
  count.textContent = hits + ' of ' + days + ' days';

  const del = document.createElement('button');
  del.className = 'danger'; del.type = 'button';
  del.textContent = 'delete this habit';
  del.addEventListener('click', () => {
    state.habits = state.habits.filter(x => x.id !== h.id);
    openHabit = null;
    save(); renderHabits(); renderDay();
  });
  wrap.appendChild(del);

  return wrap;
}

function addHabit(name, marks) {
  const n = (name || '').trim();
  if (!n) return;
  state.habits.push({
    id: Date.now() + '',
    name: n,
    color: colorFor(state.habits.length),
    marks: marks || []
  });
  save(); renderHabits(); renderDay();
}

/* =========== suggestion =========== */

function findSuggestions() {
  const names = new Set(state.habits.map(h => h.name.trim().toLowerCase()));
  const seen = {};

  for (let i = 0; i < 7; i++) {
    const k = shiftKey(todayKey(), -i);
    const day = state.days[k];
    if (!day) continue;
    const onThisDay = new Set();
    for (const b of day.blocks) {
      const l = (b.label || '').trim();
      if (l.length < 2) continue;
      onThisDay.add(l.toLowerCase());
    }
    for (const l of onThisDay) {
      (seen[l] = seen[l] || { days: [], label: l });
      seen[l].days.push(k);
    }
  }

  return Object.values(seen)
    .filter(x => x.days.length >= 1)
    .filter(x => !names.has(x.label))
    .filter(x => !state.dismissed.includes(x.label))
    .sort((x, y) => y.days.length - x.days.length)
    .slice(0, 5);
}

function renderSuggestion() {
  const slot = document.getElementById('suggest-slot');
  slot.innerHTML = '';

  return;   // habits are added by hand now; brick links them to the plan itself
  for (const s of findSuggestions().slice(0, 1)) {
    const pretty = s.label.charAt(0).toUpperCase() + s.label.slice(1);

    const box = document.createElement('div');
    box.className = 'suggest studs';

    const p = document.createElement('p');
    p.innerHTML = s.days.length === 1
      ? 'you have <b>' + s.label + '</b> in your plan. make it a habit?'
      : 'you planned <b>' + s.label + '</b> on ' + s.days.length +
        ' of the last 7 days. make it a habit?';

    const row = document.createElement('div');
    row.className = 'row';

    const yes = document.createElement('button');
    yes.className = 'brick'; yes.type = 'button'; yes.textContent = 'track it';
    yes.addEventListener('click', () => addHabit(pretty, s.days.slice()));

    const no = document.createElement('button');
    no.className = 'brick flat'; no.type = 'button'; no.textContent = 'no thanks';
    no.addEventListener('click', () => { state.dismissed.push(s.label); save(); renderHabits(); });

    row.append(yes, no);
    box.append(p, row);
    slot.appendChild(box);
  }
}

// meetings, dates, calls and the like get an agenda instead of goals
function isAgendaBlock(label) {
  return /\b(meeting|meet|date|1:1|1-1|one on one|interview|call|sync|stand ?up|catch ?up|review)\b/i.test(label || '');
}

// work that should have a clear outcome: what will be finished by the end
function isWorkBlock(label) {
  const t = label || '';
  return !isAgendaBlock(t) && /\b(work|deep work|study|studying|project|code|coding|write|writing|build|building|design|report|deck|research|read|reading|book)\b/i.test(t);
}
const outcomeField = label => (isFocusBlock(label) || isWorkBlock(label)) ? 'goals' : isAgendaBlock(label) ? 'agenda' : null;

function isFocusBlock(label) {

// which goal is being typed in: { b, n }. n equal to goals.length means a new one
let goalEdit = null;

// a short tickable list under a block: goals on focus blocks, an agenda on meetings and dates
const LIST_KINDS = {
  goals:  { max: MAX_GOALS, first: 'what will you finish?', next: 'second task', more: '+ second task', noun: 'task' },
  agenda: { max: 50, first: 'add a point', next: 'next point', more: '+ add a point', noun: 'agenda point' }

// "intro 5m", "budget 10 min", "demo 1h": the time written in an agenda point
const AG_TIME = /\s*\b(\d+(?:\.\d+)?)\s*(m|min|mins|minutes?|h|hr|hrs|hours?)\b\.?\s*$/i;
const AG_TIME_START = /^\s*(\d+(?:\.\d+)?)\s*(m|min|mins|minutes?|h|hr|hrs|hours?)\b\.?\s*/i;
function agendaTime(text) {
  const m = String(text || '').match(AG_TIME) || String(text || '').match(AG_TIME_START);
  if (!m) return null;
  const n = Number(m[1]);
  return Math.round(/^h/i.test(m[2]) ? n * 60 : n);
}

// an agenda point broken down into small to-dos. ticking them all ticks the point

function todoList(g) {
  if (!Array.isArray(g.todos)) g.todos = [];

    txt.addEventListener('blur', () => {

function goalList(b, field, from) {
  field = field || 'goals';
  const K = LIST_KINDS[field];
  if (!Array.isArray(b[field])) b[field] = [];
  const L = b[field];

  const wrap = document.createElement('div');
  wrap.className = 'goals' + (field === 'agenda' ? ' agenda' : '');
  if (K.title) {
    const h = document.createElement('span');
    h.className = 'glist-title';
    h.textContent = K.title;
    wrap.appendChild(h);
  }

  const editing = n => goalEdit && goalEdit.b === b && goalEdit.n === n && (goalEdit.f || 'goals') === field;

  // a text box for writing a goal; 16px so iOS does not zoom
  const editor = (g, n) => {
    const txt = document.createElement('textarea');
    txt.className = 'gtext';
    txt.rows = 1;
    txt.maxLength = 120;
    txt.placeholder = n === 0 ? K.first : K.next;
    txt.value = g ? g.text : '';
    txt.setAttribute('aria-label', K.noun);
    const fit = () => { txt.style.height = 'auto'; txt.style.height = txt.scrollHeight + 'px'; };
    txt.addEventListener('input', fit);
    txt.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); txt.blur(); } });
    txt.addEventListener('blur', () => {
      const v = txt.value.trim();
      if (g && !v) L.splice(L.indexOf(g), 1);          // cleared, so drop it
      else if (g) g.text = v;
      else if (v && L.length < K.max) L.push({ text: v, done: false });
      goalEdit = null;
      save(); renderDay();
    });
    setTimeout(fit, 0);
    if (editing(n)) setTimeout(() => { txt.focus(); fit(); }, 30);
    return txt;
  };

  // agenda points with a time run one after another from the start of the block
  const slots = [];
  if (field === 'agenda' && typeof from === 'number') {
    let at = fromKey(viewDay).getTime() + from * 60000;
    for (const g of L) {
      const m = agendaTime(g.text);
      slots.push(m ? { start: at, end: (at += m * 60000), m } : null);
    }
  }

  L.slice(0, K.max).forEach((g, n) => {
    const row = document.createElement('div');
    row.className = 'goal' + (g.done ? ' done' : '');

    const tick = document.createElement('button');
    tick.className = 'gtick' + (g.done ? ' on' : '');
    tick.type = 'button';
    tick.textContent = field === 'agenda' && !g.done ? String(n + 1) : '✓';
    if (field === 'agenda') tick.classList.add('num');
    tick.setAttribute('aria-label', g.done ? K.noun + ' not done' : K.noun + ' done');
    tick.addEventListener('click', () => { g.done = !g.done; save(); renderDay(); });

    let body;
    if (editing(n)) {
      body = editor(g, n);
    } else {
      // reading: smaller text that wraps, tap to change it
      body = document.createElement('button');
      body.type = 'button';
      body.className = 'gview';
      const slot = slots[n];
      body.textContent = slot ? g.text.replace(AG_TIME, '').replace(AG_TIME_START, '') : g.text;
      if (slot) {
        const now = Date.now(), t = document.createElement('span');
        t.className = 'ag-t';
        if (!g.done && now >= slot.start && now < slot.end) {
          t.classList.add('live'); t.dataset.end = slot.end; t.textContent = fmtLeft(slot.end - now);
        } else if (!g.done && now >= slot.end && viewDay === todayKey()) {
          t.classList.add('over'); t.textContent = 'time up';
        } else t.textContent = minsLabel(slot.m);
        body.appendChild(t);
      }
      body.setAttribute('aria-label', K.noun + ': ' + g.text + '. tap to change');
      body.addEventListener('click', () => { goalEdit = { b, n, f: field }; renderDay(); });
    }
    row.append(tick, body);
    wrap.appendChild(row);
    if (field === 'agenda') wrap.appendChild(todoList(g));
  });

  const n = L.length;
  if (n === 0 && !editing(0)) {
    // nothing yet: no line under the block. the row gets a small + instead
    wrap.dataset.empty = field;
  } else if (n === 0 || editing(n)) {
    // no goals yet, or writing the second one
    const row = document.createElement('div');
    row.className = 'goal';
    const dot = document.createElement('span');
    dot.className = 'gtick ghost';
    row.append(dot, editor(null, n));
    wrap.appendChild(row);
  } else if (n < K.max) {
    // one goal is fine; a second is there if you want it
    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'gmore';
    more.textContent = K.more;
    more.addEventListener('click', () => { goalEdit = { b, n, f: field }; renderDay(); });
    wrap.appendChild(more);
  }

  return wrap;
}

const blockList = document.getElementById('block-list');
const startInput = document.getElementById('start');

function nowHHMM() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function dayFor(k) {
  // a day you have not planned yet starts from right now
  if (!state.days[k]) state.days[k] = { start: nowHHMM(), blocks: [] };
  return state.days[k];
}

function toMins(hhmm) { const [h,m] = (hhmm || '08:00').split(':').map(Number); return (h*60)+m; }

function clock(mins) {
  mins = ((mins % 1440) + 1440) % 1440;
  const h24 = Math.floor(mins / 60), m = mins % 60;
  return ((h24 % 12) || 12) + ':' + String(m).padStart(2, '0') + (h24 < 12 ? 'am' : 'pm');
}

// accepts 9:05, 905, 9.05, 9, 9pm, 21:05 ... returns minutes past midnight
function parseTime(txt, after) {
  let t = String(txt).trim().toLowerCase().replace(/\s+/g, '').replace(/\./g, ':');
  let pm = null;
  if (t.endsWith('pm')) { pm = true;  t = t.slice(0, -2); }
  else if (t.endsWith('am')) { pm = false; t = t.slice(0, -2); }
  if (t.endsWith('p')) { pm = true;  t = t.slice(0, -1); }
  else if (t.endsWith('a')) { pm = false; t = t.slice(0, -1); }

  let h, m;
  if (t.indexOf(':') > -1) {
    const bits = t.split(':');
    h = Number(bits[0]); m = Number(bits[1] || 0);
  } else if (/^\d{3,4}$/.test(t)) {
    h = Number(t.slice(0, t.length - 2)); m = Number(t.slice(-2));
  } else if (/^\d{1,2}$/.test(t)) {
    h = Number(t); m = 0;
  } else {
    return null;
  }

  if (isNaN(h) || isNaN(m) || m > 59 || h > 23) return null;
  if (pm === true  && h < 12)  h += 12;
  if (pm === false && h === 12) h = 0;

  let mins = (h * 60) + m;

  if (pm === null && h < 12) {
    if (after === null || after === undefined) {
      // a day starts in the morning: 5 upwards is am, 1 to 4 is the afternoon
      if (h >= 1 && h <= 4) mins += 720;
    } else if (mins <= after) {
      mins += 720;              // must land after whatever it follows
    }
  }
  return mins;
}

// how long something runs: 2, 1.5, 1h30, 1:30, 90m
function parseDur(txt) {
  const t = String(txt).trim().toLowerCase().replace(/\s+/g, '');
  if (!t) return null;
  let m;

  m = t.match(/^(\d+(?:\.\d+)?)h(\d+)?m?$/);              // 2h, 1h30, 1h30m
  if (m) return Math.round(Number(m[1]) * 60) + (m[2] ? Number(m[2]) : 0);

  m = t.match(/^(\d+)m$/);                                  // 45m
  if (m) return Number(m[1]);

  m = t.match(/^(\d+):(\d{1,2})$/);                         // 1:30
  if (m) return (Number(m[1]) * 60) + Number(m[2]);

  m = t.match(/^\d+\.\d+$/);                               // 1.5 hours
  if (m) return Math.round(Number(t) * 60);

  m = t.match(/^(\d+)$/);                                   // a bare number
  if (m) {
    const n = Number(m[1]);
    return n <= 12 ? n * 60 : n;     // small means hours, large means minutes
  }
  return null;
}

function hhmm(mins) {
  mins = ((mins % 1440) + 1440) % 1440;
  return String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
}

function dur(m) {
  m = Math.max(0, Math.round(m));
  const h = Math.floor(m / 60), r = m % 60;
  if (!h) return r + 'm';
  if (!r) return h + 'h';
  return h + 'h ' + r + 'm';
}

function minsLabel(m) {
  const h = Math.floor(m / 60), r = m % 60;
  if (!h) return r + 'm';
  if (!r) return h + 'h';
  return h + 'h' + r;
}

let customFor = null;   // index of the block whose length picker is open

/* ---- motion on the day page ----
   the page is redrawn from scratch on every change, so anything that
   should animate remembers its last value and moves from there. */
// on today, scroll to the block running now (or the next one not done) and make it glow
function showUpNext() {
  if (viewDay !== planKey()) return;
  const day = state.days[viewDay];
  if (!day || !day.blocks.length) return;
  const nowM = planMin(viewDay);
  let at = toMins(day.start), pick = -1;
  day.blocks.forEach((b, i) => { const len = Number(b.mins) || 60; if (pick < 0 && !b.done && nowM < at + len) pick = i; at += len; });
  if (pick < 0) pick = day.blocks.findIndex(b => !b.done);
  if (pick < 0) return;
  const row = document.querySelector('#block-list .line[data-i="' + pick + '"]');
  if (!row) return;
  row.classList.add('upnext');
  // only scroll if it is not already comfortably on screen
  const r = row.getBoundingClientRect();
  if (r.top < 80 || r.bottom > innerHeight - 110) {
    window.scrollTo({ top: Math.max(0, scrollY + r.top - 120), behavior: 'smooth' });
  }
  setTimeout(() => row.classList.remove('upnext'), 2600);
}

// the blocks still to come today, with their start times
function upcomingStarts(day) {
  const nowM = planMin(viewDay);
  let at = toMins(day.start);
  const out = [];
  for (const b of day.blocks) {
    const len = Number(b.mins) || 60;
    if (!b.done && at > nowM) out.push({ at: at % 1440, label: b.label || 'next block' });
    at += len;
  }
  return out;
}
